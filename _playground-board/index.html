<body>
<main>
  <div id="board" class="jxgbox" role="img" aria-label=""></div>
  <!-- Balance, try mode: change x and watch the scale -->
  <div id="controls" hidden>
    <label for="xval" id="xlabel">x</label>
    <button type="button" id="minus" aria-label="Make x one less">−</button>
    <input type="range" id="xval" aria-describedby="status">
    <button type="button" id="plus" aria-label="Make x one more">+</button>
    <output id="xshow" for="xval"></output>
  </div>
  <!-- Balance, solve mode: do the same to both sides -->
  <div id="ops" hidden>
    <div class="oprow">
      <span>Take away</span>
      <input type="number" id="takeN" min="1" step="1" value="1" aria-label="How many to take away">
      <select id="takeWhat" aria-label="Take away what"><option value="b">blocks</option><option value="a">bags of x</option></select>
      <button type="button" id="take">from both sides</button>
    </div>
    <div class="oprow">
      <span>Share both sides into</span>
      <input type="number" id="splitN" min="2" step="1" value="2" aria-label="How many equal groups">
      <button type="button" id="split">equal groups</button>
      <button type="button" id="restart" class="quiet">Start again</button>
    </div>
    <ol id="history" aria-label="Your steps"></ol>
  </div>
  <!-- Function machine: undo each step in reverse order -->
  <div id="machine" hidden>
    <div id="mrow" aria-label="The machine"></div>
    <div class="oprow">
      <span>Undo with</span>
      <select id="undoOp" aria-label="Operation"><option value="+">+</option><option value="-">−</option><option value="*">×</option><option value="/">÷</option></select>
      <input type="number" id="undoN" step="1" value="1" aria-label="Number">
      <button type="button" id="undo">Undo a step</button>
      <button type="button" id="mrestart" class="quiet">Start again</button>
    </div>
    <ol id="mhistory" aria-label="Your steps"></ol>
  </div>
  <!-- Graph: sliders, the relations with their values, a table of values -->
  <div id="gpanel" hidden></div>
  <p id="status" aria-live="polite"></p>
  <p id="error" hidden></p>
</main>
