<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL playground</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pg">
  <section class="pane editor-pane" aria-label="Query">
    <div class="bar">
      <span class="title">SQL</span>
      <button id="run" class="btn primary" type="button" title="Run the query (Ctrl+Enter)">Run ▶</button>
      <button id="reset" class="btn ghost" type="button" title="Put back the starting query and the starting data">Reset</button>
    </div>
    <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="SQL query" wrap="off"></textarea>
    <div id="status" role="status" data-state="loading">Loading the database…</div>
  </section>
  <section class="pane result-pane" aria-label="Results">
    <details id="tables" class="tables"><summary>Tables in this database</summary><div id="schema"></div></details>
    <div id="problem" role="alert" hidden></div>
    <div id="result" aria-live="polite"></div>
  </section>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
