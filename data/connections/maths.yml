  # ---------------------------------------------------------------- Year 8 Algebra

  AC9M8A01 n1:
    move: "Expand brackets and collect like terms."
    purpose:
      hood: "Why mental shortcuts work: 3 × 42 is 3 × 40 + 3 × 2, which is expanding."
      step: "The tidy-up step inside solving equations with brackets and inside every later algebra topic."
      assessed: "Tests reward every term inside the bracket getting multiplied, and like terms collected."
    entries:
      - id: group-booking-expand
        kind: hood
        steps: [1, 2]
        domain: consumer
        picture: spatial
        situation: "Three friends each pay a ticket plus a $5 fee. Is the total 3(t + 5) or 3t + 15, and why are both right?"
        maths: "Expanding turns per-person cost into total tickets plus total fees: 3(t + 5) = 3t + 15."
        given: "The ticket price as t and the fee."
        hidden: "Discounts."
        check: "Put in a real ticket price and work it out both ways."
        figures: []

  AC9M8A01 n2:
    move: "Factorise a linear expression by taking out the highest common factor."
    purpose:
      hood: "Reading an expression the other way: 3t + 15 as three lots of (t + 5) says what each person pays."
      next: "Factorising quadratics (Year 9), which is how equations with x² get solved."
      assessed: "Tests reward the biggest factor outside and nothing left to take out inside."
    entries:
      - id: equal-rows
        kind: hood
        steps: [1, 2]
        domain: design
        picture: spatial
        situation: "You have 6 long tiles and 9 small ones. What is the most equal rows you can lay them in with none left over?"
        maths: "6x + 9 = 3(2x + 3): three rows, each 2x + 3."
