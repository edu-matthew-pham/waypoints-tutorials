  AC9M8A02 n2:
    move: "Solve ax + b = cx + d, including with brackets, and check by substituting."
    purpose:
      world: "When do two deals cost the same? Two phone plans, two hire companies, two routes."
      assessed: "Tests reward working on both sides shown line by line, and the check at the end."
    entries:
      - id: plans-cross
        kind: world
        steps: [2, 3]
        domain: consumer
        picture: data
        situation: "One phone plan is $7 a month plus $3 a gigabyte; another is $5 a gigabyte with a $9 credit. At how many gigabytes do they cost the same?"
        maths: "3x + 7 = 5x − 9: x terms to one side, numbers to the other; x = 8."
