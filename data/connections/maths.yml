      - see: stacked-discount

  AC9M8N05 n2:
    move: "Model a financial situation, such as income tax in brackets, and report the answer with its assumptions."
    purpose:
      world: "What a first job really pays after tax, and why moving into a higher bracket doesn't lower your take-home pay."
