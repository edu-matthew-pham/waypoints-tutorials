  # ---------------------------------------------------------------- Year 8 Probability

  AC9M8P01 n1:
    move: "See that an event and its complement cover everything, so P(A) + P(not A) = 1."
    purpose:
      world: "A 30% chance of rain is a 70% chance of none; a 1-in-8 bonus spin is a 7-in-8 ordinary spin."
    entries:
      - see: chance-of-rain

  AC9M8P01 n2:
    move: "Use P(not A) = 1 − P(A) when the complement is easier to count."
    purpose:
      world: "'At least one' questions: the chance of at least one rainy day on a three-day camp is easier from the chance of none."
      next: "Compound events (P02)."
    entries:
      - id: camp-rain
        kind: world
        steps: [2, 3]
        domain: environment
        picture: structure
        situation: "A three-day camp, and each day has a 30% chance of rain. What is the chance of at least one wet day?"
        maths: "1 − P(no rain on all three days) = 1 − 0.7³ ≈ 0.66."
        given: "The forecast chances."
        hidden: "That the days aren't independent: rain tends to come in runs."
        check: "Keep a term's forecasts and outcomes."
        figures: []

  AC9M8P02 n1:
    move: "Show all the combinations of two events with a two-way table, tree or Venn diagram."
    purpose:
      world: "Two choices on a menu, two coins, two questions in a survey: the table lists every case so none is missed."
      step: "The picture behind every compound probability."
    entries:
      - id: survey-two-way
        kind: world
        steps: [2, 3]
        domain: school
        picture: structure
        situation: "A survey asks every Year 8 student two things: do you walk to school, and do you play a sport? How many do both, either, or neither?"
        maths: "A two-way table sorts everyone into four cells; 'or' and 'and' read straight off it."
        given: "The survey counts."
        hidden: "Students who didn't answer."
        check: "The four cells add to the number surveyed."
        figures: []

  AC9M8P02 n2:
    move: "Find probabilities of 'and', 'or' and 'at least' events from the representation."
    purpose:
      world: "What are the odds a random student both walks and plays sport? Insurance, medical screening and games all ask 'and' and 'or' questions."
    entries:
      - see: survey-two-way
      - see: camp-rain

  AC9M8P03 n1:
    move: "Set up and run a simulation of a two-event situation and record the results."
    purpose:
      world: "When the real experiment is slow or impossible (a season of matches, a year of weather), you simulate it."
      step: "The same move a scientist or engineer makes before building the real thing."
    entries:
      - id: penalty-shootout
        kind: world
        steps: [2, 4]
        domain: sport
        picture: data
        situation: "A striker scores 4 penalties in 5. In a five-kick shootout, how often does she score all five?"
        maths: "Simulate five kicks at 0.8 many times; compare the run's frequency with 0.8⁵ ≈ 0.33."
        given: "The scoring rate."
        hidden: "Pressure, and the goalkeeper learning her habits."
        check: "The theoretical value, and a season's real shootout records."
        figures: []

  AC9M8P03 n2:
    move: "Compare simulated frequencies with theoretical probabilities and say what the results show."
    purpose:
      world: "Is the model any good? The simulation shows how much a real season can vary from the 'expected' result."
    entries:
      - see: penalty-shootout

  # ---------------------------------------------------------------- Year 8 Space

  AC9M8SP01 n1:
    move: "Use SSS, SAS, AAS and RHS to decide whether two triangles are congruent, and say why each is enough."
    purpose:
      world: "A roof truss or a bike frame is built from identical triangles; the maker needs to know three measurements fix the whole shape."
      hood: "Why three measurements can fix a triangle but not a quadrilateral: this is why structures are triangulated."
    entries:
      - id: truss-triangles
        kind: world
        steps: [1, 2]
        domain: building
        picture: spatial
        situation: "Every truss in a roof has to be identical. Which measurements does the factory have to match to be sure?"
        maths: "Three sides (SSS) fix a triangle completely; the rest follows."
        given: "A truss drawing."
        hidden: "Timber tolerances."
        check: "Cut three sticks to length: only one triangle fits."
        figures: []

  AC9M8SP01 n2:
    move: "Use AA, SAS and SSS to decide whether two triangles are similar: the same shape, scaled."
    purpose:
      world: "A photo or a shadow is a scaled triangle: measure the small one and scale up to the tree."
      next: "Trigonometry (Year 9) is similar right-angled triangles with the ratios tabulated."
    entries:
      - id: shadow-height
        kind: world
        steps: [2, 4]
        domain: environment
        picture: spatial
        situation: "How tall is the gum tree in the playground? Its shadow and your shadow make similar triangles at the same moment."
        maths: "Two right-angled triangles with the same sun angle are similar (AA); the heights are in the same ratio as the shadows."
        given: "Your height and the two shadow lengths."
        hidden: "Sloping ground and a tree that leans."
        check: "Compare with a known building's height the same way."
        figures: []

  AC9M8SP01 n3:
    move: "Explain congruence and similarity for other shapes, and link congruence to transformations."
    purpose:
      world: "Scale models and plans: a 1:100 plan is the room, similar; tiles are congruent copies moved and turned."
    entries:
      - see: floor-plan

  AC9M8SP02 n1:
    move: "Prove a quadrilateral's properties by cutting it along a diagonal into congruent triangles."
    purpose:
      hood: "Why the properties on the quadrilateral chart are true, not just names: a parallelogram's opposite sides are equal because its two halves are congruent."
      next: "Geometric proof (Years 9 and 10)."
    entries: []

  AC9M8SP02 n2:
    move: "Find unknown angles and lengths from quadrilateral properties, with reasons."
    purpose:
      world: "Setting out a parallelogram-shaped garden bed or a kite: knowing which sides and angles must match."
      assessed: "Tests mark the reason beside each step."
    entries:
      - see: parallelogram-linkage

  AC9M8SP03 n1:
    move: "Add a third axis and read or plot points in 3D."
    purpose:
      world: "Every 3D game and 3D printer places things with three numbers."
      hood: "What a 3D printer's file is: a list of (x, y, z) positions."
    entries:
      - id: print-head
        kind: world
        steps: [1, 2]
        domain: design
        picture: spatial
        situation: "A 3D printer's head is at (40, 25, 10) in millimetres. Where is that in the box, and where does it go for the next layer up?"
        maths: "Three coordinates: across, back and up; the next layer adds to z only."
        given: "The printer's axes."
        hidden: "The print bed moving instead of the head on some printers."
        check: "Watch a print and read the coordinates on screen."
        figures: []

  AC9M8SP03 n2:
    move: "Describe positions in real 3D systems: latitude, longitude and altitude; floor and room numbers."
    purpose:
      world: "A plane's position, a seat in a stadium, a room in a hospital: three numbers each."
    entries:
      - id: flight-position
        kind: world
        steps: [1, 2]
        domain: transport
        picture: spatial
        situation: "A flight tracker shows a plane at a latitude, a longitude and 11 000 m. Where is it, and what does each number fix?"
        maths: "Latitude and longitude place it on the map; altitude is the third coordinate."
        given: "A live flight tracker."
        hidden: "That the Earth is round, so latitude and longitude are angles, not distances."
        check: "Look up and compare with the tracker."
        figures: []

  AC9M8SP04 n1:
    move: "Design a step-by-step algorithm that sorts two triangles as congruent, similar or neither."
    purpose:
      world: "Quality control in a factory: a checklist that decides whether a part matches the drawing."
      step: "The same decision-tree idea as the Year 7 bird key, with the congruence conditions as the questions."
    entries:
      - see: truss-triangles

  AC9M8SP04 n2:
    move: "Trace an algorithm with test cases, find where it fails, and describe how it works in plain words."
    purpose:
      step: "Testing with awkward cases is how every checklist and program is checked."
    entries:
      - see: field-guide-key

  # ---------------------------------------------------------------- Year 8 Statistics

  AC9M8ST01 n1:
    move: "Tell a census from a sample, and choose a collection method."
    purpose:
      world: "The national Census counts everyone; a poll asks a thousand people. When is each worth it?"
    entries:
      - id: canteen-sample
        kind: world
        steps: [3, 4]
        domain: school
        picture: structure
        situation: "The canteen wants to know which new item to stock. Ask everyone, or a sample? And whom?"
        maths: "A census of 900 students costs time; a fair sample of 60 can answer it if chosen well."
        given: "The school's roll."
        hidden: "Students who never use the canteen."
        check: "Compare a sample's answer with a later whole-school vote."
        figures: []

  AC9M8ST01 n2:
    move: "Spot bias in how data is collected and say what it does to the conclusion."
    purpose:
      world: "An online poll on a fan site, a survey handed out at the gym: who answers decides the answer."
    entries:
      - id: fan-poll
        kind: world
        steps: [3, 5]
        domain: sport
        picture: structure
        situation: "A football club's website poll finds 92% want a bigger stadium. Does the city?"
        maths: "The people who answered chose themselves, and they're fans: the sample is biased before any counting."
        given: "The poll and who could see it."
        hidden: "Nothing: the bias is the point."
        check: "Compare with a random survey of the suburb."
        figures: []

  AC9M8ST02 n1:
    move: "Compare random, systematic, stratified and convenience sampling, and say how reliable each is."
    purpose:
      world: "Polling, product testing and school surveys all choose a method; convenience is cheapest and worst."
    entries:
      - see: canteen-sample

  AC9M8ST02 n2:
    move: "Take or find a sample, describe its distribution, and report what it shows."
    purpose:
      world: "The report that goes to the canteen manager: what was asked, of whom, and what came back."
      assessed: "Investigations are marked on whether the report answers the question with evidence and says its limits."
    entries:
      - see: canteen-sample

  AC9M8ST03 n1:
    move: "See that different samples from the same population differ, and describe how much."
    purpose:
      world: "Two polls a week apart disagree by a few percent and nothing has changed: that's sampling variation."
      hood: "Why a poll comes with a margin: the next sample would come out a little different."
    entries:
      - id: poll-margin
        kind: world
        steps: [3, 5]
        domain: school
        picture: data
        situation: "Two class surveys of 30 students each find 40% and 53% walk to school. Has anything changed?"
        maths: "Take many samples of 30 from the same year group and watch the percentages spread."
        given: "The year group's real answers, sampled on a board."
        hidden: "Nothing: the spread is the lesson."
        check: "Simulate it."
        figures: []

  AC9M8ST03 n2:
    move: "Show that bigger samples vary less, and use that when drawing conclusions."
    purpose:
      world: "Why 5 reviews are weaker than 500, and why national polls ask about a thousand people and not ten."
    entries:
      - see: few-reviews
      - see: poll-margin

  AC9M8ST04 n1:
    move: "Plan an investigation with a fair, ethical sample, and foresee where the answer will be uncertain."
    purpose:
      world: "Any survey of real people: consent, anonymity, and a sample that isn't just your friends."
      step: "The planning habit behind every survey, in maths, science and humanities."
    entries:
      - see: canteen-sample

  AC9M8ST04 n2:
    move: "Run it, infer from the sample to the population, and report with the uncertainty stated."
    purpose:
      world: "'About 45% of students, give or take': the honest report that a decision can be made on."
      assessed: "Investigations are marked on the inference and its stated uncertainty, not on a single number."
    entries:
      - see: canteen-sample
      - see: poll-margin

  # ---------------------------------------------------------------- Year 9 Algebra

  AC9M9A01 n1:
    move: "Evaluate a negative power and explain why it is a reciprocal."
    purpose:
      hood: "Why 10⁻³ is a thousandth: keep dividing by 10 down the pattern 10², 10¹, 10⁰, and the powers go negative."
      step: "Every very small measurement in science is written this way: a millimetre is 10⁻³ m, a micrometre 10⁻⁶ m."
      next: "Scientific notation (M02), exponential decay (Year 10)."
    entries:
      - id: metric-small
        kind: step
        steps: [1, 2]
        domain: science
        picture: data
        situation: "A human hair is about 0.07 mm wide and a red blood cell about 0.008 mm. How many cells fit across one hair?"
        maths: "Write both with powers of 10 (7 × 10⁻⁵ m and 8 × 10⁻⁶ m), then divide."
        given: "Rough sizes from a microscope or a textbook."
        hidden: "That hair widths vary a lot between people."
        check: "Look at both under the school microscope with a scale."
        figures: []

  AC9M9A01 n2:
    move: "Use all the index laws, including zero and negative powers, on numbers."
    purpose:
      step: "The machinery inside scientific notation and growth calculations; rarely a task on its own."
      assessed: "Tests reward one law at a time, with the bases checked first."
    entries:
      - see: kilo-mega-giga
      - see: metric-small

  AC9M9A01 n3:
    move: "Use the index laws on letters."
    purpose:
      step: "Inside every formula with powers: area scales with length², volume with length³."
      next: "Exponential functions (Year 10)."
    entries:
      - see: scale-up-monster

  AC9M9A02 n1:
    move: "Expand a product of two binomials."
    purpose:
      hood: "Mental shortcuts explained: 47 × 53 = (50 − 3)(50 + 3) = 2500 − 9."
      world: "Extending a square garden bed by x metres each way: the new area is the old bed, two strips and a corner."
    entries:
      - id: garden-extend
        kind: world
        steps: [1, 2]
        domain: environment
        picture: spatial
        situation: "A 4 m by 3 m garden bed is extended by x metres on both sides. What is the new area?"
        maths: "(4 + x)(3 + x): the four pieces of the area model are the four terms."
        given: "The bed's size."
        hidden: "Nothing."
        check: "Draw it to scale and count squares for x = 1."
        figures: []
      - id: mental-shortcut
        kind: hood
        steps: [1]
        domain: school
        picture: spatial
        situation: "How can someone work out 47 × 53 in their head in two seconds?"
        maths: "(50 − 3)(50 + 3) = 2500 − 9 = 2491."
        given: "Nothing but the numbers."
        hidden: "Nothing."
        check: "A calculator."
        figures: []

  AC9M9A02 n2:
    move: "See the pattern (x + a)(x + b) = x² + (a + b)x + ab and use it."
    purpose:
      hood: "Reading the expanded form: the middle number is a sum and the last a product, which is what factorising will run backwards."
      next: "Factorising monic quadratics (n3)."
    entries:
      - see: mental-shortcut

  AC9M9A02 n3:
    move: "Factorise x² + bx + c by finding two integers with product c and sum b."
    purpose:
      step: "The step that solves the quadratic in 'when does the ball land?' (A04)."
      next: "Solving quadratic equations, and graphs that cross the x-axis."
      assessed: "Tests reward checking a factorisation by expanding it back."
    entries: []

  AC9M9A02 n4:
    move: "Move between expanded and factorised forms, and say what each form shows."
    purpose:
      step: "Choosing the form that answers the question: factorised shows where a curve meets zero; expanded shows its starting value."
      hood: "Expanding and factorising undo each other, like multiplying and dividing."
    entries:
      - see: ball-arc

  AC9M9A03 n1:
    move: "Find the gradient between two points as rise over run."
    purpose:
      world: "Roof pitch, ramp gradients and road signs are all rise over run."
      next: "Parallel and perpendicular lines (n2)."
    entries:
      - see: road-gradient
      - see: ramp-1-in-14

  AC9M9A03 n2:
    move: "Use gradients to tell whether two lines are parallel or perpendicular."
    purpose:
      world: "Car-park lines and floor tiles have to be parallel or at right angles, checked by gradient on the plan."
      next: "Coordinate geometry proofs (Year 10)."
    entries:
      - id: car-park-lines
        kind: world
        steps: [1, 2]
        domain: building
        picture: spatial
        situation: "A car-park plan has kerb lines and bay lines. Are the bay lines square to the kerb?"
        maths: "Parallel: equal gradients. Perpendicular: gradients multiply to −1."
        given: "The coordinates of the ends of each line on the plan."
        hidden: "Real plans are scaled and may have curved kerbs."
        check: "Measure the angle between a bay line and the kerb in a school car park."
        figures: []

  AC9M9A03 n3:
    move: "Find the distance between two points with Pythagoras."
    purpose:
      world: "Straight-line distance on a map grid: how far an emergency helicopter flies, as the crow flies."
    entries:
      - id: crow-flies
        kind: world
        steps: [2]
        domain: transport
        picture: spatial
        situation: "A rescue helicopter flies straight from base to a farm. On the map grid the farm is 12 km east and 5 km north. How far is the flight?"
        maths: "Distance = √(12² + 5²) = 13 km."
        given: "A map grid with kilometre squares."
        hidden: "Wind and the curve of the Earth (tiny at this distance)."
        check: "A mapping app's straight-line measuring tool."
        figures: []

  AC9M9A03 n4:
    move: "Find the midpoint of an interval."
    purpose:
      world: "Meeting halfway between two towns; where to put a bus stop between two schools."
    entries:
      - id: meet-halfway
        kind: world
        steps: [2]
        domain: transport
        picture: spatial
        situation: "Two friends live at opposite ends of town and want to meet halfway. On the map grid, where?"
        maths: "Average the x-coordinates and the y-coordinates."
        given: "Both homes on a grid map."
        hidden: "Roads: halfway by road isn't halfway in a straight line."
        check: "Measure both distances from the midpoint."
        figures: []

  AC9M9A03 n5:
    move: "Use gradient, midpoint and distance together in a real problem."
    purpose:
      world: "Planning a walking route or a sprinkler position on a scaled plan."
      step: "The judging step: straight-line answers against real paths."
    entries:
      - see: crow-flies
      - see: meet-halfway

  AC9M9A04 n1:
    move: "Recognise a quadratic from a table (constant second differences) or its equation."
    purpose:
      world: "Stopping distance grows faster than speed: the differences in the table aren't constant, but their differences are."
      next: "Graphing (n2), modelling change (A05)."
    entries:
      - id: handshakes
        kind: world
        steps: [1, 2]
        domain: social
        picture: spatial
        situation: "Everyone in a group shakes hands with everyone else once. How many handshakes for 6 people? For 30?"
        maths: "The counts 0, 1, 3, 6, 10 have first differences 1, 2, 3, 4 and constant second differences of 1: a quadratic."
        given: "The number of people."
        hidden: "That the count is n(n − 1)/2: each person shakes n − 1 hands, but every handshake is counted twice."
        check: "Act it out with a small group and count."
        figures: []
      - see: stopping-distance

  AC9M9A04 n2:
    move: "Graph a quadratic and read its turning point, axis of symmetry and intercepts."
    purpose:
      world: "A thrown ball, a water fountain's arc, a suspension cable: the turning point is the highest point."
    entries:
      - id: ball-arc
        kind: world
        steps: [2, 3, 5]
        domain: sport
        picture: data
        situation: "A ball is thrown in the air. How high does it go, and when does it land?"
        maths: "The turning point gives the highest point; the x-intercepts give when it is on the ground."
        given: "A height formula, or points from a filmed throw."
        hidden: "Air resistance, which the parabola leaves out (stated)."
        check: "Film a throw and mark the ball's height frame by frame."
        figures: []

  AC9M9A04 n3:
    move: "Solve a monic quadratic equation by factorising and the null factor law."
    purpose:
      step: "The step that answers 'when does it land?': set the height to zero and factorise."
      assessed: "Tests reward both solutions, and saying which makes sense in context."
    entries:
      - id: garden-area
        kind: world
        steps: [1, 2, 4]
        domain: building
        picture: spatial
        situation: "A rectangular garden bed is x m wide and 3 m longer than it is wide. It must cover 40 square metres. How wide is it?"
        maths: "x(x + 3) = 40, so x² + 3x − 40 = 0 and (x + 8)(x − 5) = 0: x = 5 or x = −8. Only x = 5 can be a width."
        given: "The area and how the length compares with the width."
        hidden: "That a negative solution is a correct answer to the equation but not to the situation."
        check: "Mark out a rectangle of 5 m by 8 m and count the area."
        figures: []
      - see: ball-arc

  AC9M9A04 n4:
    move: "Solve a quadratic three ways (algebra, graph, table) and connect them."
    purpose:
      hood: "The x-intercepts, the factors and the zeros in the table are the same two numbers seen three ways."
