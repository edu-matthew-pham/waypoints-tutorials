        situation: "A trailer is rated for 750 kg and already carries a 90 kg mower. Each box of pavers is 40 kg. How many boxes can go on?"
        maths: "90 + 40n ≤ 750, shown on a number line: n ≤ 16.5, so 16 boxes."
