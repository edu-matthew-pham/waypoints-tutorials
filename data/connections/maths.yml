      hood: "Why 2³ × 2⁴ = 2⁷: three 2s and four more 2s, written out. The law is a shortcut for counting."
      next: "Scientific notation (Year 9), exponential growth (Year 10)."
    entries:
      - id: kilo-mega-giga
        kind: step
        steps: [1, 2]
        domain: digital
        picture: data
        situation: "A kilobyte is about 10³ bytes and a megabyte about 10⁶. Why is a gigabyte 10⁹ and not 10¹⁸?"
        maths: "kilo × mega = 10³ × 10⁶ = 10⁹: add the powers, don't multiply them."
        given: "The prefixes."
        hidden: "That computers really use 2¹⁰ = 1024, not 1000."
        check: "A storage label."
        figures: []

  AC9M8N02 n2:
    move: "Use the index laws together, checking the bases match first."
    purpose:
      step: "The machinery inside scientific notation and growth calculations; rarely a task on its own."
      assessed: "Tests reward checking the bases are the same before adding powers."
    entries:
