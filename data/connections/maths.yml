  AC9M8N04 n1:
    move: "Multiply and divide integers using the sign rules."
    purpose:
      world: "Temperature falling by the same amount for several hours; money going out at a steady rate; reversing a reversal."
      hood: "Why negative × negative is positive: continue the pattern 3 × −2, 2 × −2, 1 × −2, 0 × −2, and keep going."
      next: "Algebra with negatives, gradient of a falling line."
    entries:
      - id: temperature-drop
        kind: world
        steps: [1, 2]
        domain: environment
        picture: data
        situation: "On a clear winter night the temperature drops about 2 °C every hour from 6 pm. Where is it at 10 pm, and where was it at 4 pm?"
        maths: "4 × (−2) = −8 for four hours ahead; −2 × (−2) = +4 for two hours back."
        given: "A steady rate, from a Bureau overnight trace."
        hidden: "That real cooling slows down later in the night."
        check: "The Bureau's hourly observations for a clear night."
        figures: []

  AC9M8N04 n2:
    move: "Use all four operations on negative fractions and decimals, choosing an efficient strategy."
    purpose:
