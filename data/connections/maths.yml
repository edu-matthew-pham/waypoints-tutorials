  AC9M7P01 n1:
    move: "List all the outcomes of a single chance event."
    purpose:
      world: "Game designers list every outcome of a spinner or card draw before they set the rules."
      next: "Assigning probabilities (n2)."
    entries:
      - see: game-spinner

  AC9M7P01 n2:
    move: "Assign probabilities with P = favourable ÷ total, as a fraction, decimal or percentage."
    purpose:
      world: "Designing a fair game, or one where a rare item turns up about one time in eight."
    entries:
      - id: game-spinner
        picture: data
        kind: world
        steps: [2, 4]
        domain: design
        situation: "You are designing a board game spinner. You want the 'bonus' to come up about one spin in eight. How do you split the spinner?"
        maths: "List the outcomes; one equal section of eight gives P = 1/8."
        given: "A circle to divide."
        hidden: "Spinners that are not quite fair (tested in P02)."
        check: "Spin it 40 times and count."
        figures: []

  AC9M7P01 n3:
    move: "Use a probability to predict how often an outcome will happen in a number of trials."
    purpose:
      world: "A 30% chance of rain: on days like this, about 3 in 10 get at least a little rain."
    entries:
      - id: chance-of-rain
        picture: data
        kind: world
        steps: [1, 2, 3]
        domain: environment
        situation: "The forecast says a 30% chance of rain tomorrow. What does that mean, and should the outdoor sport go ahead?"
        maths: "Out of 10 days with this forecast, expect rain on about 3."
        given: "The forecast's chance of rain."
        hidden: "How much rain: the chance is for any rain at all (at least 0.2 mm)."
        check: "Record the forecast chance and whether it rained, over a term."
        figures:
          - claim: "Chance of rain is the likelihood of more than the minimum measurable rainfall (0.2 mm)."
            source: { title: "Interpreting BOM forecasts (FarmPoint, Tasmanian Government)", url: "https://farmpoint.tas.gov.au/news/interpreting-bom-forecasts", checked: 2026-10-22 }

  AC9M7P02 n1:
    move: "Run a chance experiment many times and record the results."
    purpose:
      world: "Testing whether something is fair: a spinner, a coin flip used to decide who kicks off."
      step: "The experiment habit science uses too."
    entries:
      - id: fair-spinner
        picture: data
        kind: world
        steps: [2, 4]
        domain: design
        situation: "Is the spinner you made for your game actually fair?"
        maths: "Spin it many times, record frequencies and compare with the probabilities it should have."
        given: "The spinner from P01."
        hidden: "Wobble and wear that change it over time."
        check: "Pool the whole class's spins."
        figures: []

  AC9M7P02 n2:
    move: "See that relative frequencies get closer to the theoretical probability over many trials, and why short runs vary."
    purpose:
      world: "Five 5-star reviews are weaker evidence than five hundred at 4.6: small samples swing a lot."
      next: "Sampling and variation (Year 8)."
    entries:
      - id: few-reviews
        picture: data
        kind: world
        steps: [3, 5]
        domain: consumer
        situation: "One product has 5 reviews, all 5 stars. Another has 500, averaging 4.6. Which is more likely to be good?"
        maths: "Small samples vary a lot; large ones settle near the true value."
        given: "Two real product pages."
        hidden: "Fake reviews (a different problem)."
        check: "Simulate: take random groups of 5 from a set of 500 ratings and watch the averages swing."
        figures: []

  # ---------------------------------------------------------------- Year 8 (pilot entries only)

  AC9M8M06 n1:
    move: "State Pythagoras' theorem and find the hypotenuse by adding the squares."
    purpose:
      world: "A length you cannot measure directly, when the two sides at the right angle are known: the shortcut across the grass, the diagonal of a screen."
      next: "Finding any side (n2), testing for a right angle (n3), distance between points (Year 9)."
    entries:
      - id: grass-shortcut
        picture: spatial
        kind: world
        steps: [1, 2, 4]
        domain: environment
        situation: "People wear a path straight across the corner of a lawn instead of following the footpath round it. How much shorter is it?"
        maths: "The worn path is the hypotenuse of the two footpath sides: add the squares."
        given: "The two footpath lengths, paced out."
        hidden: "The path is not perfectly straight."
        check: "Pace out both routes on the oval."
        figures: []
      - see: screen-diagonal

  AC9M8M06 n2:
    move: "Find any side: add the squares for the hypotenuse, subtract for a shorter side."
    purpose:
      world: "Ladders, ramps and screens all hide a right-angled triangle with one side you need."
      assessed: "Tests reward choosing add or subtract correctly and a sense check that the hypotenuse is longest."
    entries:
      - id: ladder-1-in-4
        picture: spatial
        kind: world
        steps: [2, 4]
        domain: building
        situation: "I'm setting up a ladder to clean the gutters. Safety guidance says the foot goes 1 m out for every 4 m up. Set up that way, will my ladder reach?"
        maths: "The ladder is the hypotenuse; the height it reaches is a shorter side: subtract the squares."
        given: "The 1-in-4 rule; the ladder's length; the gutter's height."
        hidden: "Ground slope, the ladder's feet and how far it must overlap the gutter edge."
        check: "Lean a real ladder (or a metre ruler on a desk) at 1 in 4 and measure how high it reaches."
        figures:
          - claim: "Extension ladders: the base 1 m out from the structure for every 4 m of height (1:4)."
            source: { title: "Ladder safety (WorkSafe ACT)", url: "https://www.worksafe.act.gov.au/health-and-safety-portal/safety-alerts/ladder-safety", checked: 2026-10-22 }
          - claim: "Same 1:4 rule."
            source: { title: "Ladders (SafeWork NSW)", url: "https://www.safework.nsw.gov.au/hazards-a-z/ladders", checked: 2026-10-22 }
      - id: ramp-1-in-14
        picture: spatial
        kind: world
        steps: [2, 3, 5]
        domain: building
        situation: "A ramp to a front door must be gentle enough for a wheelchair. How long does it need to be?"
        maths: "Rise and run are the shorter sides, the sloping surface the hypotenuse (Year 8); the angle comes from trig (Year 9, AC9M9M03 n2)."
        given: "The 1 in 14 limit for ramps up to 9 m long."
        hidden: "Landings, handrails and other gradients for longer or shorter ramps."
        check: "Measure the rise and length of a ramp at school."
        figures:
          - claim: "Maximum gradient 1:14 for ramps up to 9 m long (AS 1428.1)."
            source: { title: "Ramps to the house and slopes in the garden (Queensland Health, MASS)", url: "https://www.health.qld.gov.au/__data/assets/pdf_file/0029/1477208/Ramps-to-the-house-and-slopes-in-the-garden-slides.pdf", checked: 2026-10-22 }
      - id: screen-diagonal
        picture: spatial
        kind: world
        steps: [1, 2]
        domain: consumer
        situation: "Will this TV fit the gap in the cabinet? Its size is measured along the diagonal."
        maths: "The diagonal is the hypotenuse; width or height is a shorter side."
        given: "The screen's diagonal and one side."
        hidden: "The bezel (frame) around the screen."
        check: "Measure a classroom screen's width, height and diagonal."
        figures: []

  AC9M8M06 n3:
    move: "Run the theorem backwards: if a² + b² = c², the triangle is right-angled."
    purpose:
      world: "Checking a corner is square with string: builders have done it for thousands of years and still do."
    entries:
      - id: set-out-3-4-5
        picture: spatial
        kind: world
        steps: [1, 2]
        domain: building
        situation: "Is the corner of this garden bed or slab square? Builders check with a 3-4-5 triangle of string."
        maths: "A triangle whose sides fit a² + b² = c² has a right angle; 3-4-5 is the easiest one to peg out."
        given: "Tape measure and string."
        hidden: "Stretch in the string."
        check: "Peg out a 3-4-5 triangle on the oval and check the corner with a set square."
        figures: []

  AC9M8A01 n3:
    move: "Rearrange a formula to make a different letter the subject."
    purpose:
      step: "The step inside any 'what do I need?' question where a formula gives the wrong thing: the mark on the last test, the pace for a target time, the time from a speed."
      hood: "What a calculator or spreadsheet does when it solves for a cell."
      next: "Rearranging with the subject in more than one term (Years 9 and 10), formulas in science."
    entries:
      - id: target-average
        picture: data
        kind: step
        steps: [2]
        domain: school
        situation: "My marks so far are 62, 70 and 74. What do I need on the last test to average 70?"
        maths: "The mean formula A = (S + x) ÷ n gives the average; rearranged for x, x = nA − S, it gives the mark needed."
        given: "The marks so far and the target average; every test counts equally."
        hidden: "Weighted tests and different marks out of."
        check: "Put the answer back in: (62 + 70 + 74 + 74) ÷ 4 = 70."
        figures: []
      - id: running-pace
        picture: none
        kind: step
        steps: [2]
        domain: sport
        situation: "I want to finish a run in a target time. What pace, in minutes per kilometre, do I need?"
        maths: "time = pace × distance, rearranged for pace."
        given: "The distance and the target time."
        hidden: "Hills, and slowing down towards the end."
        check: "A running watch or a pace calculator."
        figures: []
      - id: science-formula-subject
        picture: none
        kind: step
        steps: [2]
        domain: science
        situation: "Science gives speed = distance ÷ time, but the question asks how long a trip takes."
        maths: "Rearranging the formula for the quantity you need."
        given: "The formula from science."
        hidden: "Changing speed (the formula assumes it is steady)."
        check: "Put the answer back into the original formula."
        figures: []
      - see: forecast-fahrenheit
