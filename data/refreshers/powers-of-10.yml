page: |
  **Each place is ten times the one to its right.** Ones, tens, hundreds, thousands: every step left is × 10.
  So the places are powers of 10, and the power counts the zeros.
  - 10² = 100 (two zeros)
  - 10³ = 1000 (a thousand)
  - 10⁶ = 1 000 000 (a million)
  - 10⁹ = 1 000 000 000 (a billion)

  **Why it helps.** Science works with numbers far too big or small to say comfortably: the age of the Earth
  (about 4 500 000 000 years) or the width of a cell (about 0.00001 m). Counting the places in powers of 10
  stops the zeros getting lost.

  **Scientific notation** (taught in Year 9 maths) writes such a number as a number from 1 to 10 times a power of
  10. The power says how far the decimal point moves.
  - A positive power moves it right: 4.5 × 10³ = 4500.
  - A negative power moves it left: 4.5 × 10⁻³ = 0.0045.

  **Comparing two numbers.** Look at the powers first; the bigger power is the bigger number. 2 × 10⁵ beats
  9 × 10³.
