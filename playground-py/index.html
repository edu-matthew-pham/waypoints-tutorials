<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Python playground</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="snippets.css">
</head>
<body>
<div class="pg">
  <section class="pane editor-pane" aria-label="Code">
    <div class="bar">
      <button id="run" class="btn primary" type="button" disabled>Run</button>
      <button id="stop" class="btn" type="button" disabled>Stop</button>
      <button id="reset" class="btn ghost" type="button">Reset</button>
    </div>
    <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Python code" wrap="off"></textarea>
    <div id="status" role="status" data-state="loading">Loading Python…</div>
  </section>
  <section class="pane side-pane" aria-label="Console">
    <div class="views" role="tablist" aria-label="View">
      <button type="button" role="tab" class="view" id="view-console" aria-selected="true" aria-controls="output">Console</button>
      <button type="button" role="tab" class="view" id="view-app" aria-selected="false" aria-controls="app" hidden>App</button>
      <button type="button" role="tab" class="view" id="view-files" aria-selected="false" aria-controls="files">Files <span id="file-count"></span></button>
    </div>
    <pre id="output" aria-label="Console" aria-live="polite"></pre>
    <div id="app" class="app" hidden>
      <form id="address" class="address" hidden><span class="addr-host">app</span><input id="addr" aria-label="Address in your app" autocomplete="off" spellcheck="false"><button class="btn" type="submit">Go</button></form>
      <div id="app-body" class="app-body"></div>
    </div>
    <div id="files" class="files" hidden>
      <p class="files-note">Files your programs read and write with <code>open()</code>. They are kept in this browser, for this course.</p>
      <ul id="file-list"></ul>
      <div class="file-tools"><button type="button" class="btn" id="file-restore" hidden>Get this lesson's files again</button><label class="btn" id="file-add-label">Add a file from this computer<input type="file" id="file-add" accept=".csv,.txt,.json,.py,text/*" hidden></label></div>
      <pre id="file-view" hidden></pre>
    </div>
  </section>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
