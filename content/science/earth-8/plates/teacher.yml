summary: Students explain that the lithosphere is divided into moving plates and describe mantle convection, driven by Earth's inner heat (from the core and from radioactive decay in the mantle), as the mechanism (AC9S8U03, node 2, a hinge node).
time: 25
timing: "Engage and Explore 9 min · Explain 10 min · Evaluate 3 min · Typical adds 4 min, Wider about 5 min"
goals:
  - I can explain that the lithosphere is divided into plates that move.
  - I can describe mantle convection as the mechanism that moves the plates.
  - I can state that plates move a few centimetres a year.
before: |
  A concept tutorial for introducing or revising the idea; it does not replace a convection demonstration. Set the width with `?width=minimum`, `typical` (default) or `wider`.

  The hinge risk is plate movement with no mechanism: without convection, boundary features (nodes 3 to 5) look arbitrary.

  Assumed: convection, and density from Year 7 (less dense rises). These tutorials teach convection in Year 9 (Heat transfer), so Explore opens with a one-question recap (warm fluid rises because it is less dense). If the class has not met convection, demonstrate it first (see In class, below).

  Model notes, worth saying aloud: the board draws the mantle as moving particles, but the real mantle is solid rock that flows over millions of years. In the model hot particles are pushed up directly; real hot rock rises because it is less dense. The plates on top move with the surface flow.
running:
  - "Engage: a quick hands-up for each option; 'earthquakes' is common and gets fixed in Explain."
  - "Explore: ask students to describe the ringed particle's whole path in four words (heated, rises, cools, sinks)."
  - "Explain: the 'why rock rises' question targets 'heat rises'. The number check gives the scale."
  - "In your own words: the six-word paragraph is the node's checkpoint."
struggle: "Giving a mechanism: mantle convection carries the plates. When a student says heat rises, ask what is actually moving up on the board."
stuck:
  - see: "A student says the plates float on liquid magma."
    ask: "Is the mantle liquid?"
    fix: "No: it is solid rock that flows extremely slowly. Magma forms only in small pockets."
  - see: "A student says heat rises."
    ask: "What is actually moving up on the board?"
    fix: "Hot rock moves up, because it is less dense. Heat travels with it."
  - see: "A student says earthquakes move the plates."
    ask: "Which comes first: the plates moving or the earthquake?"
    fix: "Plates move and stick; when they slip, we feel an earthquake. Convection moves the plates."
stretch: "The Australian continent's centre has some of the oldest, most stable rock on Earth. Use the board to suggest why the middle of a plate is quieter than its edges."
support: "Give a four-box cycle diagram (heated, rises, cools, sinks) to fill in while watching the board."
leads: |
  Next: what happens where plates meet: divergent (node 3), convergent (node 4) and transform (node 5) boundaries.

  In class: a beaker of water heated from one side with a few potassium permanganate crystals or food colouring, and a raft of paper on top.
exit:
  q: "What drives the movement of tectonic plates?"
  a: "Convection currents in the mantle: heated rock rises, spreads, cools and sinks, carrying the plates. The heat comes from the core and from radioactive elements in the mantle."
explain: |
  The **lithosphere** is broken into rigid **plates** that move a few centimetres a year.

  Earth's inner heat, from the **core** below and from radioactive elements in the mantle rock, drives **convection currents** in the **mantle**: hot rock is less dense and rises, spreads under the plates, cools and sinks. The currents carry the plates along.
