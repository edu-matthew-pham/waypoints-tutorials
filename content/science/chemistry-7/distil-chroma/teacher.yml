summary: Students describe the principles of distillation and chromatography, identify a mixture for each, and explain when distillation is chosen over evaporation (AC9S7U06, node 4).
time: 25
timing: "Engage and Explore 10 min · Explain 8 min · Evaluate 3 min · Typical adds 4 min, Wider about 15 min"
goals:
  - I can describe the principle of distillation and of chromatography.
  - I can name a mixture each technique suits.
  - I can explain when distillation is used instead of evaporation.
before: |
  A concept tutorial for introducing or revising the techniques. Set the width with `?width=minimum`, `typical` (default) or `wider`.

  The node's response mode is structured reasoning: students confuse distillation with evaporation because both heat a liquid. The Explain sort scaffolds the comparison row by row.

  First Nations content: the node file lists steam distilling among First Nations techniques. This tutorial does not claim that. It presents documented traditional tea tree use (crushing and soaking leaves) and makes clear that steam distillation is the modern extraction method. Check with local community knowledge and protocols, and adapt to the Country your school is on.

  For First Nations educator review: moved from student text, 1 Nov 2026

  ACARA elaboration (AC9S7U06): "investigating separation techniques used by First Nations Australians, such as hand-picking, sieving, winnowing, yandying, filtering, cold-pressing and steam distilling"

  Moved from step heading (Wider step removed):

