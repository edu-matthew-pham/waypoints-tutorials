running:
  - "Engage: most students predict salty water. Watch the board together to see only water particles cross."
  - "Explore: chromatography is quick to run for real with felt-tip pens, filter paper and water; do it if you can."
  - "Explain: read the sort aloud as a comparison table: same property, different outcome, different equipment."
struggle: "Explaining each technique by the property it uses. When a student says distillation is just evaporation, ask what happens to the steam in each."
stuck:
  - see: "A student says distillation and evaporation are the same."
    ask: "What happens to the steam in each?"
    fix: "Evaporation lets it escape; distillation cools it and collects it as liquid."
  - see: "A student says the heavier dyes stay lower."
    ask: "Which direction does the water carry the dyes?"
    fix: "Up, against gravity. Each dye is carried a different distance because it dissolves and sticks differently."
  - see: "A student thinks black ink is a single substance."
    ask: "How many spots came from one black dot?"
    fix: "Several dyes: black ink is a mixture."
stretch: "Why does salt not travel through the condenser with the water? Use particle motion and boiling points."
support: "Give the comparison as a table with two columns, evaporation and distillation, to fill in before the sort."
leads: |
  Next in class: AC9S7U06 node 5, choosing and justifying a technique for a new mixture, works best as a class task.

  Practical: paper chromatography of felt-tip pens or food colourings; a demonstration distillation of coloured water.
exit:
  q: "Why would a ship use distillation, not evaporation, to get drinking water from seawater?"
  a: "Distillation collects the water vapour as liquid; evaporation lets it escape and keeps only the salt."
explain: |
  - **Distillation:** boil the liquid, cool the vapour in a condenser, collect the liquid somewhere else. The dissolved solid stays behind.
  - **Evaporation** uses the same property (boiling point) but lets the vapour escape: you only keep the solid.
  - **Chromatography:** a solvent soaks up paper and carries each dissolved substance a different distance, so a mixture like ink splits into separate spots.
