summary: Students apply F = ma to find force, mass or acceleration with units, use the net force, and explain how changing force or mass changes acceleration (AC9S10U05, node 4, a hinge node).
time: 30
timing: "Engage and Explore 8 min · Explain 9 min · Practise 4 min · Evaluate 3 min · Typical adds 4 min, Wider about 2 min"
goals:
  - I can use F = ma to find force, mass or acceleration, with correct units.
  - I can explain that F in F = ma is the net force.
  - I can explain what doubling the force or the mass does to the acceleration.
before: |
  A concept tutorial for introducing or revising the idea; it does not replace a trolley and hanging-mass practical. Set the width with `?width=minimum`, `typical` (default) or `wider`.

  The hinge risks are using the applied force instead of the net force, and dropping units or direction. The net-force question in Explain targets the first.

  Board notes: the acceleration reading (under the board) is the net force divided by the mass, and shows before Play, so students can tune the push without running it. No friction on this board.
running:
  - "Engage: put the four predictions on the board; come back after Explore."
  - "Explore: ask what push hit target 1 (8 N) and target 2 (16 N). Write F, m, a in a table."
  - "Explain: students should say the rearrangement aloud for each number check."
  - "In your own words: the doubling paragraph is the evidence of the qualitative relationship."
struggle: "Using the net force, not the push, in F = ma. When a student uses the push, ask whether anything is pushing back."
stuck:
  - see: "A student uses the push instead of the net force."
    ask: "Is anything pushing back?"
    fix: "Subtract opposing forces first: F in F = ma is the net force."
  - see: "A student confuses mass and weight in F = ma."
    ask: "Which is in kilograms?"
    fix: "Mass (kg) goes in F = ma. Weight is a force (N)."
  - see: "A student thinks doubling mass halves the force needed."
    ask: "For the same acceleration, what did you need for 8 kg compared with 4 kg?"
    fix: "Twice the force. Same force on double the mass gives half the acceleration."
stretch: "Rockets lose mass as they burn fuel. With the same thrust, what happens to their acceleration during the launch?"
support: "Give the formula triangle (F at the top, m and a below) with one worked example of each rearrangement."
leads: |
  Next: Newton's third law (node 5), then free body diagrams with several forces (node 6) and quantitative problems (node 7).

  In class: a trolley pulled by hanging masses (move masses from the trolley to the hanger to keep total mass constant), with light gates or a motion sensor.
exit:
  q: "What acceleration does a net force of 30 N give a 6 kg trolley?"
  a: "a = F ÷ m = 30 ÷ 6 = 5 m/s², in the direction of the net force."
explain: |
  **Newton's second law: F = ma.** F is the **net** force (N), m the mass (kg), a the acceleration (m/s²), in the direction of the net force.

  Double the net force, double the acceleration; double the mass, half the acceleration.
