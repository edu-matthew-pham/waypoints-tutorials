summary: Students compare sexual and asexual reproduction and explain why sexual reproduction produces varied offspring (AC9S9U02, node 3, a hinge node).
time: 20
timing: "Engage and Explore 7 min · Explain 8 min · Evaluate 3 min · Typical adds 2 min, Wider about 2 min"
goals:
  - I can explain why offspring of sexual reproduction vary.
  - I can explain why asexual reproduction makes clones.
  - I can give an advantage of each.
before: |
  A concept tutorial for introducing or revising the idea. Set the width with `?width=minimum`, `typical` (default) or `wider`.

  The hinge misconceptions are that siblings should look the same, and that offspring are an even blend.

  Board notes: three genes, each with two alleles and a simple dominant/recessive effect (fur colour, ear shape, tail length); genotypes are shown under each creature. Real traits are often controlled by many genes and affected by the environment. Year 10 explains the inheritance with Punnett squares.
running:
  - "Engage: count how many chose 'all look the same' or 'a blend'."
  - "Explore: ask how many different-looking offspring they got from the same two parents."
  - "Explain: 'why do they vary' is the checkpoint."
struggle: "Seeing that each offspring gets a random half of each parent's genes. When a student expects identical siblings or an even blend, ask which copy of a gene this offspring got from each parent."
stuck:
  - see: "A student says the offspring should look like both parents equally."
    ask: "Which copy of each gene did this offspring get from each parent?"
    fix: "A random one: different offspring get different combinations."
  - see: "A student thinks asexual reproduction is only for bacteria."
    ask: "How do strawberry runners or potato tubers make new plants?"
    fix: "Asexually: the new plants are clones."
stretch: "Clones of a parent are identical, but mutations happen. How could a clone population still slowly change?"
support: "Give a two-column table with rows for parents, gametes, offspring, advantage."
leads: |
  Year 10: genes and DNA (10U01 node 1), meiosis (node 3) and Punnett squares (node 4).

  In class: cuttings from a spider plant or a coleus; compare seedlings grown from one seed packet.
exit:
  q: "Why do two offspring of the same parents look different?"
  a: "Each gets a random one of each parent's two copies of each gene, so each gets a different combination."
explain: |
  **Sexual reproduction:** two parents; each offspring gets a random half of each parent's genes, so offspring vary. **Asexual reproduction:** one parent makes clones. Variation helps a population survive change; asexual reproduction is fast and needs no partner.
