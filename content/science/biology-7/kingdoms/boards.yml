# Boards for "Plant, animal or something else?".

# region: kingdoms
widget: key
step A: Is it made of just one cell? | D | B
step B: Does it make its own food using sunlight? | Plant | C
step C: Does it absorb its food from dead or decaying material? | Fungus | Animal
step D: Does its cell have a nucleus? | Protist | Bacteria
specimen: Plant | Large, made of many cells, with green leaves; makes its own food using sunlight; stays in one place. | Gum tree
specimen: Fungus | Grows on rotting logs, made of many cells; not green; absorbs food from the dead wood; has a cap and gills. | Mushroom
specimen: Animal | Made of many cells; moves slowly over rocks; eats mussels; cannot make its own food. | Sea star
specimen: Protist | Only visible with a microscope; one cell with a nucleus; flows around its food. | Amoeba
specimen: Bacteria | Only visible with a microscope; one tiny cell with no nucleus; turns milk into yoghurt. | Yoghurt bacteria
specimen: Fungus | Fuzzy white and black patches on old bread, made of many cells; absorbs food from the bread. | Bread mould
specimen: Plant | Small, soft and green, made of many cells; makes its own food from sunlight; grows on damp rocks. | Moss
need: 5
