summary: Students place organisms into kingdoms using observable features, justify each placement, and recognise a hard-to-classify case (AC9S7U01, node 2, a hinge node).
time: 25
timing: "Engage and Explore 8 min · Explain 10 min · Evaluate 3 min · Typical adds 2 min, Wider about 3 min"
goals:
  - I can name the five kingdoms.
  - I can place an organism in its kingdom and give the observable feature that decides it.
  - I can explain why some organisms are hard to classify.
before: |
  A concept tutorial for introducing or revising the idea; it does not replace specimens, photos or a microscope. Set the width with `?width=minimum`, `typical` (default) or `wider`.

  The hinge is feature-based justification: students who sort by first impressions ("it doesn't move, so it's a plant") can't choose discriminating features when they build keys in node 4.

  Model notes: the lesson uses a five-kingdom scheme, common in Year 7. Algae such as kelp are grouped with protists here; many textbooks differ, and modern biology uses domains. Yeast is a single-celled fungus, so "can you see one without a microscope?" doesn't place it: it is in the sort, not the key, on purpose.
running:
  - "Engage: ask the 'plant' voters which feature they used. Keep the list."
  - "Explore: specimen names appear only after the key places them; students should read descriptions, not guess."
  - "Explain: the sort has two deliberate boundary items (kelp, coral) with explanations."
  - "In your own words: the five-organism list with features is the node's evidence."
stuck:
  - see: "A student says fungi are plants."
    ask: "Can a mushroom make its own food from sunlight?"
    fix: "No: it isn't green, and it absorbs food. That puts it with the fungi."
  - see: "A student puts coral with plants."
    ask: "How does coral get its food?"
    fix: "Its polyps catch food: animals."
  - see: "A student says bacteria aren't alive."
    ask: "Do they grow, use food and reproduce?"
    fix: "Yes: single-celled living things."
stretch: "Viruses can reproduce only inside living cells. Should they be in a kingdom? Argue both sides."
support: "Give the kingdom table from the primer as a card during the sort."
leads: |
  Next: using dichotomous keys (node 3), the same feature-by-feature reasoning, one choice at a time.

  In class: a tray of specimens or photos (moss, mushroom, bread mould, insect, shell), and a microscope slide of pond water.
exit:
  q: "A slime grows on a dead log. It isn't green and it absorbs food from the wood. Which kingdom? Why?"
  a: "Fungi: it can't make food from sunlight and it absorbs food from dead material."
explain: |
  Living things are grouped into **kingdoms** by observable features: **animals** (eat other living things), **plants** (make food from sunlight), **fungi** (absorb food from other material), **protists** (mostly one cell with a nucleus) and **bacteria** (one tiny cell, no nucleus).
