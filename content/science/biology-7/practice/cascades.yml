# Practice for "What if the dingo disappeared?". Choices: trace what happens to another population when one changes; biotic or abiotic.
templates:
  - q: "{w} {c} What happens to {x}?"
    cases:
      - { w: "In a bush web, dingoes eat kangaroos, rabbits and foxes, and foxes eat rabbits and bandicoots.", c: "All the dingoes are removed.", x: "the foxes", k: "They increase", w1: "They decrease", f1: "Dingoes ate foxes. With fewer predators, the foxes increase.", w2: "No change", f2: "Dingoes were a direct predator of foxes, so removing them changes the number of foxes." }
      - { w: "In a bush web, dingoes eat kangaroos, rabbits and foxes, and foxes eat rabbits and bandicoots.", c: "All the dingoes are removed.", x: "the bandicoots", k: "They decrease", w1: "They increase", f1: "Dingoes never ate bandicoots, but without dingoes foxes increase, and foxes eat bandicoots.", w2: "No change", f2: "The effect travels along the web: fewer dingoes, more foxes, fewer bandicoots." }
      - { w: "In a bush web, dingoes eat kangaroos, rabbits and foxes, and foxes eat rabbits and bandicoots.", c: "All the dingoes are removed.", x: "the kangaroos", k: "They increase", w1: "They decrease", f1: "Dingoes ate kangaroos. With fewer predators, the kangaroos increase.", w2: "No change", f2: "Dingoes are a direct predator of kangaroos." }
      - { w: "In a bush web, dingoes eat kangaroos, rabbits and foxes, and foxes eat rabbits and bandicoots.", c: "All the dingoes are removed.", x: "the rabbits", k: "It could go either way", w1: "They increase", f1: "Fewer dingoes means fewer rabbits eaten, but more foxes means more rabbits eaten. Two effects pull opposite ways.", w2: "They decrease", f2: "Fewer dingoes means fewer rabbits eaten, but more foxes means more rabbits eaten. Two effects pull opposite ways." }
      - { w: "In a kelp forest, sea otters eat sea urchins, and sea urchins eat kelp.", c: "The sea otters are removed.", x: "the kelp", k: "It decreases", w1: "It increases", f1: "Without otters, urchins increase, and urchins eat kelp. So there is less kelp.", w2: "No change", f2: "The effect travels along the web: fewer otters, more urchins, less kelp." }
      - { w: "In a kelp forest, sea otters eat sea urchins, and sea urchins eat kelp.", c: "The sea otters are removed.", x: "the sea urchins", k: "They increase", w1: "They decrease", f1: "Otters ate urchins. With fewer predators, the urchins increase.", w2: "No change", f2: "Otters were a direct predator of urchins." }
      - { w: "Wolves eat elk, elk eat young willow trees, and beavers use willow for food and dams.", c: "The wolves are removed.", x: "the beavers", k: "They decrease", w1: "They increase", f1: "Without wolves, elk increase and eat more willow, so beavers have less to use.", w2: "No change", f2: "Beavers never met the wolves, but the effect reaches them: more elk, less willow, fewer beavers." }
      - { w: "Wolves eat elk, elk eat young willow trees, and beavers use willow for food and dams.", c: "The wolves are removed.", x: "the willow trees", k: "They decrease", w1: "They increase", f1: "Without wolves, elk increase, and elk eat willow.", w2: "No change", f2: "The effect travels along the web: fewer wolves, more elk, fewer willow trees." }
      - { w: "Snakes eat frogs, frogs eat insects, and insects eat leaves.", c: "The snakes are removed.", x: "the insects", k: "They decrease", w1: "They increase", f1: "Without snakes, frogs increase, and frogs eat insects.", w2: "No change", f2: "The effect travels along the web: fewer snakes, more frogs, fewer insects." }
      - { w: "Snakes eat frogs, frogs eat insects, and insects eat leaves.", c: "The snakes are removed.", x: "the leaves", k: "They increase", w1: "They decrease", f1: "Fewer snakes means more frogs, fewer insects, and so fewer leaves eaten.", w2: "No change", f2: "The effect travels three links: more frogs, fewer insects, more leaves." }
      - { w: "Hawks eat snakes and mice, and snakes eat mice.", c: "The hawks are removed.", x: "the mice", k: "It could go either way", w1: "They increase", f1: "Fewer hawks means fewer mice eaten, but more snakes means more mice eaten. Two effects pull opposite ways.", w2: "They decrease", f2: "Fewer hawks means fewer mice eaten, but more snakes means more mice eaten. Two effects pull opposite ways." }
    choices: ["{k}", ["{w1}", "{f1}"], ["{w2}", "{f2}"]]
    explain: "Trace one link at a time along the web. Answer: {k}."
  - q: "Is this a biotic or an abiotic factor? {o}"
    cases:
      - { o: "A new predator arrives in the area.", k: "Biotic (living)", w: "Abiotic (non-living)", fb: "A predator is a living thing.", e: "A predator is a living part of the ecosystem." }
      - { o: "A disease spreads through the rabbits.", k: "Biotic (living)", w: "Abiotic (non-living)", fb: "Disease is caused by living things such as bacteria or viruses, and it affects living populations.", e: "Disease is a living factor." }
      - { o: "A drought dries up the waterholes.", k: "Abiotic (non-living)", w: "Biotic (living)", fb: "Rain and water are non-living parts of an ecosystem.", e: "Weather and water are non-living." }
      - { o: "Kangaroos and rabbits compete for the same grass.", k: "Biotic (living)", w: "Abiotic (non-living)", fb: "Competition is between living things.", e: "Competition is a living factor." }
      - { o: "The temperature drops below freezing.", k: "Abiotic (non-living)", w: "Biotic (living)", fb: "Temperature is a non-living part of the environment.", e: "Temperature is non-living." }
      - { o: "A plant species dies out.", k: "Biotic (living)", w: "Abiotic (non-living)", fb: "A plant is a living thing.", e: "A species is a living part of the ecosystem." }
      - { o: "A bushfire sweeps through the forest.", k: "Abiotic (non-living)", w: "Biotic (living)", fb: "Fire is not a living thing, even though it affects living things.", e: "Fire is a non-living factor." }
      - { o: "A flood washes soil from the riverbank.", k: "Abiotic (non-living)", w: "Biotic (living)", fb: "Flooding and soil are non-living.", e: "Floods and soil are non-living." }
      - { o: "An introduced weed spreads across the paddock.", k: "Biotic (living)", w: "Abiotic (non-living)", fb: "A weed is a living plant.", e: "A weed is a living factor." }
      - { o: "Less sunlight reaches the forest floor in winter.", k: "Abiotic (non-living)", w: "Biotic (living)", fb: "Sunlight is a non-living factor.", e: "Sunlight is non-living." }
    choices: ["{k}", ["{w}", "{fb}"]]
    explain: "{e}"
  - q: "{w} The {r} are removed, and the {m} then increase. Which is the best explanation of why?"
    cases:
      - { w: "Dingoes eat kangaroos, and kangaroos eat grass.", r: "dingoes", m: "kangaroos", k: "There are fewer predators eating them", w1: "Kangaroos eat more grass", f1: "That is a result of more kangaroos, not the reason they increased.", w2: "The grass has disappeared", f2: "If the grass had disappeared the kangaroos would have decreased." }
      - { w: "Sea otters eat sea urchins, and urchins eat kelp.", r: "sea otters", m: "sea urchins", k: "There are fewer predators eating them", w1: "There is less kelp for them to eat", f1: "Less kelp would make urchins decrease, not increase.", w2: "The kelp has become more nutritious", f2: "Nothing in the web changed the kelp first. The urchins increased because fewer were eaten." }
      - { w: "Foxes eat rabbits, and rabbits eat grass.", r: "foxes", m: "rabbits", k: "There are fewer predators eating them", w1: "The grass grew thinner", f1: "Thinner grass would make rabbits decrease, not increase.", w2: "The rabbits chose to have more babies", f2: "Rabbits do not decide that. They increased because fewer were eaten." }
      - { w: "Hawks eat snakes, and snakes eat frogs.", r: "hawks", m: "snakes", k: "There are fewer predators eating them", w1: "There are more frogs for the hawks", f1: "The hawks are gone. The snakes increased because fewer were eaten.", w2: "The frogs are eating the snakes", f2: "Snakes eat frogs, not the other way round. The arrow points from food to eater." }
      - { w: "Wolves eat elk, and elk eat willow.", r: "wolves", m: "elk", k: "There are fewer predators eating them", w1: "There is more willow for the wolves", f1: "The wolves are gone. The elk increased because fewer were eaten.", w2: "Elk eat the wolves", f2: "Wolves eat elk. The arrow points from food to eater." }
      - { w: "Dingoes eat foxes, and foxes eat bandicoots.", r: "dingoes", m: "foxes", k: "There are fewer predators eating them", w1: "Foxes eat more bandicoots", f1: "That is a result of more foxes, not the reason they increased.", w2: "Bandicoots eat the foxes", f2: "Foxes eat bandicoots. The arrow points from food to eater." }
    choices: ["{k}", ["{w1}", "{f1}"], ["{w2}", "{f2}"]]
    explain: "Removing a predator means fewer of its prey are eaten, so the prey increase. Then the effect passes on along the web."
  - q: "Putting two ideas together: {q}"
    cases:
      - { q: "Why are there far fewer dingoes than kangaroos in the same bush?", k: "Only about a tenth of the energy passes up each level, so the dingoes have much less energy available than the kangaroos", w1: "Dingoes are smaller than kangaroos", f1: "Size does not set how many there can be. The energy passed up the food chain does.", w2: "Dingoes use up all the kangaroos' energy", f2: "Most of the energy is already lost as heat at each level, so less is left for the next level." }
      - { q: "Why do food chains rarely have more than four or five links?", k: "About 90% of the energy is lost at each link, so there is too little left to support another level", w1: "Animals at the top eat too much", f1: "It is not about how much they eat. So little energy is left at the top that it cannot support another predator.", w2: "Decomposers stop the chain growing", f2: "Decomposers recycle matter. The limit is the energy lost as heat at each step." }
      - { q: "Foxes and dingoes both eat rabbits. Why does removing the dingoes mean the foxes have more food after a while?", k: "Fewer dingoes means more foxes and more rabbits, because rabbits are eaten by fewer predators", w1: "Foxes begin to eat dingoes", f1: "Foxes do not eat dingoes. The effect travels along the web through the rabbits and the foxes' own numbers.", w2: "Rabbits stop eating grass", f2: "Rabbits keep eating grass. With fewer dingoes eating rabbits, there are more rabbits for the foxes." }
    choices: ["{k}", ["{w1}", "{f1}"], ["{w2}", "{f2}"]]
    explain: "Join the two ideas: energy flows up the web (about a tenth passes on), and the numbers of each population rise and fall along the arrows."
