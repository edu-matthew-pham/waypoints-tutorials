summary: Students represent forces as arrows with the right size and direction, and name them (AC9S7U04, node 1, a hinge node).
time: 25
timing: "Engage and Explore 6 min · Explain 7 min · Practise 6 min · Evaluate 3 min · Typical adds 3 min, Wider about 3 min"
goals:
  - I can draw a force as an arrow with the right direction and relative size.
  - I can name the forces acting on an object.
  - I can draw a force diagram that fits a situation.
before: |
  A concept tutorial for introducing or revising the idea; it does not replace force meters and real pushes. Set the width with `?width=minimum`, `typical` (default) or `wider`.

  The hinge risk is imprecise diagrams: wrong direction, missing forces (especially support), sizes that don't match. Every later node uses diagrams to reason, so the Practise step matters.

  Board notes: arrows start at the object's centre, the usual convention for a force diagram. The boards use g = 10 N/kg so the numbers stay simple; the weight lesson uses 9.8.
running:
  - "Engage: ask what else an arrow could show; 'which way it moves' is the misconception the trolley exposes (friction points backwards)."
  - "Explore: ask students to make the push smaller than 10 N and notice friction shrinking with it."
  - "Practise: the book task is the commonest omission (the table's push). Stop and discuss it."
  - "In your own words: collect the trolley diagram."
stuck:
  - see: "A student leaves out the support force."
    ask: "The book isn't falling through the table. What stops it?"
    fix: "The table pushes up: support (normal force), equal to the weight when the book is at rest."
  - see: "A student draws friction in the direction of motion."
    ask: "What does friction try to do to sliding?"
    fix: "Stop it: friction acts against the sliding (or the push)."
  - see: "Arrows all the same length."
    ask: "Which force is bigger? How would someone see that from your drawing?"
    fix: "Make the bigger force's arrow longer, in proportion."
stretch: "Draw the force diagram for a ball at the very top of its flight, just after you throw it straight up."
support: "Give a template: a box with dotted guide arrows (up, down, left, right) to trace over and label."
leads: |
  Next: node 2, balanced and unbalanced forces: what the diagram tells you about the motion.

  In class: force meters pulling a block along the bench; tug of war with two force meters.
exit:
  q: "A box sits on the floor. Name the two forces on it and describe their arrows."
  a: "Weight, pointing down, and support from the floor, pointing up; the same length because they are equal."
explain: |
  A force has a **size** (N) and a **direction**, drawn as an **arrow**: longer for bigger, pointing the way the force acts.

  A **force diagram** shows every force on one object, each named: weight, support, friction, air resistance, pushes and pulls.
