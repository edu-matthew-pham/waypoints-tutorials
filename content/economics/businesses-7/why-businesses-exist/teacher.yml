summary: "Students distinguish goods from services and learn that businesses exist for several reasons — providing goods and services, making a profit, creating employment and meeting community needs. This is the hinge lesson for AC9HE7K02: if students think profit is the only reason a business exists, cooperatives and not-for-profits in lesson 2 will not make sense."
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 8 min · Practise 6 min · Make 6 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can explain the difference between a good and a service, with an example of each.
  - I can give at least two reasons why businesses exist beyond making a profit.
  - I can explain why a community organisation that sells goods or services counts as a business.
struggle: "Students often treat 'business' as a word for 'making money for an owner'. Keep pointing back to what the organisation actually does every day: does it provide goods or services, employ people, and pay its costs?"
before: |
  This is a hinge lesson. Lesson 2 introduces cooperatives and not-for-profit organisations alongside sole proprietorships and corporations. Students who hold onto the idea that every business exists only for owner profit will misclassify those structures.

  All businesses in the lesson (Corner Bakery, Pedal Fix Workshop, Riverbend Pantry) are made up so nothing dates and no real brand is advertised. When students write their own examples in the Make step, either real local types (a chemist, a hairdresser) or made-up ones are fine.
running:
  - "Predict: take a quick vote before locking in. Many students will pick the profit-only option."
  - "Try: pause on the bike workshop and the cafe. Ask what you can touch and take home (the good) and what is done for you (the service)."
  - "Worked example: let students read the three town businesses before looking at Nib's lines. Use the Build up to it check if anyone says Riverbend Pantry isn't a real business."
  - "Vary: ask pairs to name one business in town that has at least three reasons for existing."
  - "Make: students write in their own book and check with a partner."
stuck:
  - see: "A student says a hairdresser or vet is not a business because nothing is made in a factory."
    ask: "What are you paying for when you go there?"
    fix: "You are paying for their skill and time — a service. Businesses provide goods, services, or both."
  - see: "A student says a not-for-profit or cooperative cannot pay wages."
    ask: "Is paying a worker for their work the same thing as handing profit to an owner?"
    fix: "No. Wages are a cost of running the business. 'Not-for-profit' means any surplus left after costs is put back into the mission, not paid out to private owners."
  - see: "A student lists 'making money' and 'making a profit' as two different reasons."
    ask: "Besides money for the owner, what does the business do for customers or workers?"
    fix: "Prompt for providing goods and services, creating jobs (employment), or meeting a community need."
stretch: "Think of a business that provides both a good and a service (such as a bike shop or an optometrist). Which half — the good or the service — would be harder for an online-only store to replace, and why?"
support: "Two prompt questions on the board: '1. Can I touch it and take it home (good), or is someone doing work for me (service)? 2. Who benefits from this business existing — owners, workers, customers, or the wider community?'"
leads: |
  Next in Types of businesses: Ways a business can be set up (sole proprietorship, partnership, cooperative, corporation, franchise, not-for-profit).

  Wider (teacher choice, not part of the student steps): ACARA's elaborations for AC9HE7K02 include "investigating a business owned by First Nations Australians, exploring the types of goods and services offered and why this business was started" (all four elaborations are on this standard's curriculum page). If you include a First Nations-owned business here, start from ACARA's elaboration and use local, community-approved material or a business's own published words about its purpose and goods or services, rather than writing an explanation from outside.
exit:
  q: "Give two reasons why businesses exist other than making a profit, and name one business that provides a service."
  a: "Reasons include providing goods and services, creating employment (jobs), and meeting a community need. Service examples include a hairdresser, vet clinic, bike repairer or bus service."
explain: |
  A **good** is a physical item you can touch and take home. A **service** is work someone does for you. Many businesses provide both.

  Businesses exist for several reasons: to **provide goods and services**, to **make a profit**, to **provide employment**, and to **meet community needs**.
