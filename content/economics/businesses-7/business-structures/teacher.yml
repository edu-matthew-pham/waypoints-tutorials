summary: "Students learn the distinguishing features of six business types — sole proprietorship, partnership, cooperative, corporation, franchise and not-for-profit — and match local examples to each."
learning: "distinguish six business structures by who owns them, who decides, and where any surplus goes"
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 8 min · Practise 6 min · Make 6 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can name at least three business structures and state the feature that sets each apart.
  - I can match a realistic local business to its ownership structure.
  - I can explain why the number of staff in a shop does not tell you its ownership structure.
struggle: "Students often guess a business's structure from how big the shop looks or how many staff are on shift. Bring them back to three questions: Who owns it? Who decides? Where does any surplus go?"
before: |
  This lesson builds on Lesson 1 (businesses exist for several reasons, not only profit). Check that students remember why a community pantry counts as a business before meeting cooperatives and not-for-profits as formal structures.

  All examples (Rosa's Car Yard, Priya & Tom Vets, Valley Growers' Shed, Made-Up Grocers Corp, Burger Barn) are made up, mirroring the examples in ACARA's elaborations for AC9HE7K02 (a sole proprietor operating a car yard, a partnership providing legal services, a corporation selling groceries through a chain of supermarkets).
running:
  - "Predict: ask who owns the bakery versus who works there. Ownership is the test."
  - "Try: have pairs test each match against 'Who owns it? Who decides?'"
  - "Worked example: let students spot why Nib's headcount rule fails on both Rosa's car yard and the growers' shed."
  - "Vary: pause on Amir's Burger Barn franchise — he owns his local business, so it feels like a sole proprietorship or corporation, but the brand contract makes it a franchise."
  - "Make: students build their three-structure table in their own book and swap with a partner."
stuck:
  - see: "A student calls any small shop with two workers a partnership."
    ask: "Do both workers own the business and share the profits, or does one own it and pay the other a wage?"
    fix: "It is only a partnership if two or more people share ownership. One owner paying an employee is still a sole proprietorship."
  - see: "A student mixes up a cooperative and a corporation because the words sound similar."
    ask: "Who are the owners of a cooperative, and why did they join?"
    fix: "Co-op = co-operate: the members (growers, workers or shoppers) own it to use it together, usually with one vote per member. A corporation is a separate legal body owned by shareholders."
  - see: "A student thinks every store in a big chain is owned by head office."
    ask: "What if a local person paid to run that branch under the chain's name?"
    fix: "That is a franchise: local ownership under a shared brand and rulebook."
stretch: "If a sole proprietor's bakery becomes very popular and wants to open ten shops across the state, why might staying a sole proprietor become risky or difficult? Which structure could they move to, and what would they give up?"
support: "Give students a three-question card: '1. One owner, a few partners, members, or shareholders? 2. Own brand or rented brand (franchise)? 3. Profit to owners or surplus back to the mission?'"
leads: |
  Next in Types of businesses: Matching the structure to the job (connecting business purpose and structure to how goods and services reach consumers).

  Wider (teacher choice, not part of the student steps): ACARA's elaborations for AC9HE7K02 include "identifying the features of different types of businesses, including sole proprietorship, partnership, cooperative, corporation, franchise and not-for-profit organisation" and "investigating a business owned by First Nations Australians". Where your class studies a First Nations community-run corporation or cooperative, use the organisation's own published statements and local community guidance to show how its structure supports both commercial activity and community governance.
exit:
  q: "Name three different business structures and give one feature that sets each apart."
  a: "For example: sole proprietorship (one owner controls it), partnership (two or more owners share decisions and profits), cooperative (owned by its members with one vote each), corporation (owned by shareholders as a separate legal body), franchise (local owner pays to use an established brand and system), not-for-profit (surplus goes back into its community purpose)."
explain: |
  A business's **structure** is how it is owned and controlled:

  - **Sole proprietorship:** one owner.
  - **Partnership:** two or more co-owners.
  - **Cooperative:** owned by its members for their shared benefit.
  - **Corporation:** a separate legal body owned by shareholders.
  - **Franchise:** a local owner paying to use a larger brand's name and system.
  - **Not-for-profit:** surplus is reinvested into a community purpose, not paid to owners.
