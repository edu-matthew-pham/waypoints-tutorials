summary: "Students learn the test for a need (you cannot stay safe and well without it) and a want (you would like it but could live without it), and see through Mia's story that meeting a want tends to bring another. This is the first of two hinge lessons: if students think wants could all be met with enough stuff, scarcity in the next lesson will look like a supply problem someone could fix."
learning: "tell needs from wants and explain why economists treat wants as having no limit"
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 8 min · Practise 6 min · Make 6 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can say whether something is a need or a want and give a reason.
  - I can explain why wants keep growing, with an example.
  - I can write two needs and two wants from my own life.
struggle: "Students often say a want is a need because it feels like one. Ask 'Could you stay safe and well without it?' and let them argue it out before telling them. Resist settling it for them: the argument is the learning."
before: |
  This is a hinge lesson. The next lesson (scarcity) only makes sense if students see why economists treat wants as unlimited: a normal part of life, not a shortage someone could fix by making more things. It is a starting assumption of the model, not a law of nature, and the lesson says so. Some people disagree (for example, sufficiency and degrowth thinkers argue wants are shaped by advertising and culture and can be enough); a short discussion of that is welcome once the idea is clear. If this lesson goes thinly, scarcity will look to students like 'not enough stock'. Spend the time here.

  Everything is made up (Mia, Dev, Sam, the town). Do not ask students what their families have, spend or lack. The Make step uses 'my own life' but only what they choose to write, in their own book.

  The first of the wider steps invites students to look at an advert. Choose a suitable one in advance, from a school-appropriate source.
running:
  - "Predict: ask for votes before the answer. 'Water' is easy, and the others spark good talk about wants that feel like needs."
  - "Try: stop at the trainers. A need can be inside a want."
  - "Worked example: let Nib's mistake sit before explaining it. Ask students to say what Mia's story shows."
  - "Vary: ask them to give the reason, not only the answer."
  - "Make: read one or two out if students are happy to, without names."
stuck:
  - see: "A student says wants will stop once you have enough."
    ask: "Think about Mia. Did she stop wanting once she had the bike?"
    fix: "Go back to the story. Each want she met was followed by a new one. More stuff does not end wanting."
  - see: "A student calls something a need because it is expensive or everyone has it."
    ask: "Could you stay safe and well without it?"
    fix: "That is the test. Price and popularity do not decide it."
  - see: "A student says wanting more is greedy."
    ask: "Do you think Mia is greedy, or is she just like everyone?"
    fix: "Wanting more is normal for everyone. It is how wants work, not a fault in some people."
stretch: "Is a mobile phone a need? Argue both ways, then say what you would want to know before deciding. This is the same idea at greater width. It does not go on to the next lesson."
support: "A card with the question 'Could I stay safe and well without it?'. Students ask it of each thing before sorting."
leads: |
  Next in Scarcity and opportunity cost: Scarcity, where wants that keep growing meet resources that are limited.

  Wider (teacher choice, not part of the student steps): start from ACARA's own elaboration for AC9HE7K01, which suggests "investigating how First Nations communities use exchange systems (barter) or networks (partnerships) to decide about the use of limited resources in sustainable ways" (all five elaborations are on this standard's curriculum page), then add material from the local community or the school's First Nations contact, not a generalisation from outside.
exit:
  q: "Mia gets her new bike. What usually happens to her wants, and why does that matter?"
  a: "A new want turns up, such as a helmet. Wants keep growing (economists treat them as unlimited), so more stuff alone does not end wanting."
explain: |
  A **need** is something you must have to stay safe and well. A **want** is something you would like but could live without.

  Meeting one want tends to bring another, so wants keep growing. Economists start from the idea that wants have no limit, and the next lesson builds on it.
