summary: "Students distinguish rights (what you can claim) from responsibilities (what you must do), and see that both customers and businesses have both, often in pairs. This is the hinge lesson for AC9HE7K05: the next three lessons assign rights and responsibilities to each side, and students who think customers only have rights will assign them wrongly."
learning: "distinguish rights from responsibilities and list both for a customer and a business in a sale"
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 8 min · Practise 6 min · Make 6 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can explain the difference between a right and a responsibility.
  - I can list rights and responsibilities for both a customer and a business.
  - I can show how a right on one side pairs with a responsibility on the other.
struggle: "Students treat 'rights' as the customer's and 'responsibilities' as the business's. Keep asking: is this something you can claim, or something you must do? And whose is it?"
before: |
  This is a hinge lesson. The Worked example's bug task, with its Build up to it question, is the check before moving on.

  **Facts used (checked 1 Nov 2026):** businesses don't have to refund a change of mind, though many choose to (WA Consumer Protection, "Are you covered for change of mind?"); services must be provided with due care and skill (ACCC, Consumer rights and guarantees). The lesson keeps the law general here; lesson 2 covers the consumer guarantees.

  **Privacy.** No step asks about students' own spending. Riverbend people and shops are made up.

  The wider step on change-of-mind refunds has no single right answer; both views are reasonable.
running:
  - "Predict: take a vote. Most will pick 'Mia has rights, the shop has responsibilities'."
  - "Try: the four-group sort is slow for some; do the first two together."
  - "Worked example: put Nib's lines up. Ask 'Does Mia have to do anything?' before revealing the mistake. This is the hinge check."
  - "Vary: the bank account shows the same idea with a financial product."
  - "Make: students pick a made-up purchase and write both sides' lists in their own book."
stuck:
  - see: "A student says customers have rights and shops have responsibilities."
    ask: "Does the shop get anything it can claim? Does Mia have to do anything?"
    fix: "Both sides have both. The shop can claim payment; Mia must pay and use the product properly."
  - see: "A student mixes up the two words."
    ask: "Can you claim it, or must you do it?"
    fix: "A right is something you can claim. A responsibility is something you must do."
  - see: "A student says asking for a discount is a right."
    ask: "Can you insist on it, or can the shop say no?"
    fix: "If the shop can say no, it isn't a right. A shop may choose to give a discount."
stretch: "Find a right of Mia's that doesn't pair with any responsibility of the shop's, or explain why you think every right pairs with one. It does not go on to the next lesson."
support: "A four-box grid on the board: Mia can claim / Mia must / The shop can claim / The shop must. Fill one box each before the sort."
leads: |
  Next in Consumer rights and responsibilities: Your rights when you buy.

  Wider (teacher choice, not part of the student steps): the node's wider items include how consumer rights work for remote communities buying through community stores. If you take this up, use the store's own published words and local, community-approved material. The lesson writes nothing about it.
exit:
  q: "Give one right and one responsibility for a customer, and one of each for a business."
  a: "Customer: right to a safe product that matches its description; responsibility to pay and use it properly. Business: right to be paid; responsibility to sell safe products and not mislead."
explain: |
  A **right** is something you can claim. A **responsibility** is something you must do.

  In a sale, the customer and the business both have rights and responsibilities. They often pair up: the customer's right to a safe product is the business's responsibility to sell one.
