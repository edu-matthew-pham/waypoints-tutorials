summary: "Students identify and describe types of work (full-time, part-time, casual, at home, paid, unpaid and volunteer) and learn that much unpaid work is unrecognised. This is the hinge lesson for AC9HE7K04: if students think only paid jobs are work, the next two lessons on income and why people work become narrow."
learning: "identify and describe types of work, paid and unpaid, with an example of each"
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 8 min · Practise 6 min · Make 6 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can name and describe at least four types of work, with an example of each.
  - I can tell casual work from part-time work.
  - I can explain why unpaid work is still work.
struggle: "Students treat 'work' as 'a paid job'. Keep asking: is it useful effort for someone, and would someone else have to do it otherwise?"
before: |
  This is a hinge lesson. The Worked example's bug task, with its Build up to it question, is the check before moving on.

  **Ana's caring role (please check for your class).** Ana cares full-time for her father. It is in the lesson on purpose: caring is real unpaid work that many families do, and showing it is better than avoiding it (Matthew, 1 Nov 2026). Some of your students may be young carers, or live with someone who is cared for. Check the example suits your class. If it doesn't, swap in another unpaid role (running a household, coaching a team) when you teach it. Never ask students whether they or their family care for someone.

  **Privacy.** No step asks about students' own families' work. The Make step asks for work they can see in the community. Some students' families are unemployed, on government payments, caring full-time or in insecure work, and none of that is a judgement.

  Facts used: a full-time week in Australia is usually around 38 hours (the National Employment Standards' maximum ordinary hours for a full-time employee). Pay rates and casual loading are left out on purpose because they change. Casual is simplified to "no promise of ongoing hours": Fair Work defines a casual employee by no firm advance commitment to ongoing work, and a regular pattern of shifts on its own doesn't change that ("Casual employees", checked 1 Nov 2026). Many casuals work regular rosters, so don't accept "casuals have no regular hours". Ana's carer payment in Earning an income is income support from the government, not pay for the caring, so the hook's "only four get paid" still holds; say so if a student spots it. The Try sort asks for each person's main arrangement; accept a reasoned second answer where they overlap (Rosa owns her car yard and works full-time; Jo is self-employed at home).

  All Riverbend people are made up.
running:
  - "Predict: take a vote on Ana. Let the 'only if paid' and 'yes, it's work' sides each give one reason."
  - "Try: after the sort, ask what all six people have in common."
  - "Worked example: let the class find Nib's line, then use the Build up to it question if anyone still says unpaid work isn't work."
  - "Vary: ask students to think of a volunteer they or someone they know has seen at work (a club, a fundraiser). No one has to say who."
  - "Make: students list work they can see in the community, not their family's."
stuck:
  - see: "A student says caring for family or housework isn't work."
    ask: "If no one did it, what would happen? Would someone have to be paid to do it?"
    fix: "It is unpaid work. Pay tells you the type of work, not whether it is work."
  - see: "A student mixes up casual and part-time."
    ask: "Does this person have set days every week?"
    fix: "Part-time has regular set hours. Casual has no promise of ongoing hours."
  - see: "A student says volunteers are people who couldn't get a job."
    ask: "Could the netball coach have a paid job as well?"
    fix: "People volunteer for many reasons, often alongside paid work."
stretch: "Think of a kind of work that is paid in some places and unpaid in others (coaching, caring, cooking). What decides which it is? It does not go on to the next lesson."
support: "A card with the four paid types down one side (full-time, part-time, casual, at home) and two unpaid types (volunteer, unpaid at home or for family). Students add one Riverbend person to each."
leads: |
  Next in Work, income and identity: How people earn an income.

  Wider (teacher choice, not part of the student steps): ACARA's elaborations for AC9HE7K04 include "describing examples of how continuity of cultural practices and management of Country/Place contributes to and sustains First Nations communities; for example, regional tourism ventures, coaching and mentoring initiatives, and fostering entrepreneurial and start-up cultures in regional and remote communities". The node's wider items suggest that caring for Country is work that formal measures may not capture. If you take this up, start from ACARA's wording and use First Nations-led sources and local, community-approved material. The lesson writes nothing about it.
exit:
  q: "Name four types of work with an example of each. Include one unpaid kind."
  a: "For example: full-time (Rosa at her car yard), part-time (Mai, three set days), casual (Sam, when the bakery rings), at home (Jo, websites), volunteer (the netball coach), unpaid caring (Ana)."
explain: |
  **Work** is effort that does something useful for someone, paid or not.

  Paid work can be **full-time**, **part-time** (regular set hours), **casual** (no promise of ongoing hours) or **at home**. **Unpaid** work includes **volunteering** and caring or housework for family. Much unpaid work is **unrecognised**: no one pays for it or counts it.
