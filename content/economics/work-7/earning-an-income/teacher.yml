summary: "Students identify and explain the ways people derive an income: wages, salaries, business profit, dividends, rent and social security. The planted mistake is that income only comes from going out to work. Leo's month also separates a business owner's income (profit) from all the money customers pay."
learning: "identify ways people earn or receive an income and explain the difference between two of them"
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 8 min · Practise 6 min · Make 6 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can name at least three ways people get an income, with an example of each.
  - I can explain the difference between a wage and a salary.
  - I can explain why a business owner's income is the profit, not all the money customers pay.
struggle: "Students think income only comes from a job, and that a business owner keeps everything customers pay. Ask 'where does the money come from?' and 'what has to be paid out first?'"
before: |
  **Privacy.** Never ask students how their own family gets its income. Some families rely on social security, some on several sources, some on insecure work. The lesson uses made-up Riverbend people only, and the Make step asks about them.

  **Social security** is described plainly as a government payment for people who need support (older people, carers, people living with a disability, people looking for work), with no suggestion that it is a lesser kind of income. If students make negative comments, the stuck notes have a reply.

  Ana appears again as a carer who receives a government payment. If you swapped her in lesson 1, swap her here too.

  Amounts ($28 an hour, $78 000 a year, Leo's $5000 and $3000) are made up for the examples, not real pay rates. Kai's delivery app is not a real company. On gig work: delivery riders on apps are usually independent contractors, not employees, which is why Kai's income is "neither" (employees paid per piece still earn a wage). Since 17 August 2026 a Fair Work Commission order has set a minimum earnings floor for app delivery workers ("employee-like workers"), counted per hour of engaged time; this is pay from the platform, not social security (Fair Work Ombudsman, "Minimum standards for on-demand delivery workers", checked 1 Nov 2026). These rules are new and may change, so check before teaching.

  All Riverbend people are made up.
running:
  - "Predict: ask for every way money could come in to Mrs Ng. Write them up before the lesson names them."
  - "Try: after the match, ask which of the six have to go to work for their income."
  - "Worked example: do Leo's month on the board. Many will say $5000."
  - "Vary: wage or salary is the common slip; ask what happens to each if someone works fewer hours."
  - "Make: books out; students choose two Riverbend people."
stuck:
  - see: "A student says rent or dividends aren't real income because no work is done."
    ask: "Does money come in to that person regularly?"
    fix: "Income is money received. It can come from owning things, not only from working."
  - see: "A student says a business owner earns everything customers pay."
    ask: "What does Leo have to pay before he keeps anything?"
    fix: "The owner's income is the profit: what is left after costs."
  - see: "A student makes a negative remark about people on government payments."
    ask: "Who in Riverbend gets one, and why?"
    fix: "Social security supports people who are older, caring, living with a disability or looking for work. It is one of the ways people receive an income."
stretch: "Which kinds of income need you to own something first, and which need your time? What does that mean for someone who is just starting out? It does not go on to the next lesson."
support: "A two-column card: 'You work for it' (wage, salary) and 'You own something' (business profit, dividends, rent), plus a third row for government support (social security)."
leads: |
  Next in Work, income and identity: Why people work.

  Wider (teacher choice, not part of the student steps): ACARA's elaborations for AC9HE7K04 include "describing examples of how continuity of cultural practices and management of Country/Place contributes to and sustains First Nations communities; for example, regional tourism ventures, coaching and mentoring initiatives, and fostering entrepreneurial and start-up cultures in regional and remote communities". The node's wider items suggest how a First Nations community enterprise brings in income for its members. If you take this up, start from ACARA's wording and use the enterprise's own published words and local, community-approved material. The lesson writes nothing about it.
exit:
  q: "Name three ways people get an income, with an example of each, and say how a wage differs from a salary."
  a: "For example: a wage (Sam, per hour), a salary (the principal, a set yearly amount), profit (Leo, after costs), dividends (Theo), rent (Mrs Ng), social security (Ana). A wage depends on hours worked; a salary is a set amount for the year."
explain: |
  **Income** is money a person receives. It can be a **wage** (paid by the hour) or **salary** (a set yearly amount), **profit** from owning a business, **dividends** from owning shares, **rent** from letting property, or **social security**, a government payment for people who need support.

  A business owner's income is the profit: what is left after the business pays its costs.
