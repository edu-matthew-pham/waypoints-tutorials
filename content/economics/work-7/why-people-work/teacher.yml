summary: "Students explain reasons people work beyond earning an income: identity, self-esteem, a part in the community, and material and non-material living standards. The planted mistake is that people only work for money. The lesson says 'for many people' on purpose: work doesn't do all of this for everyone."
learning: "explain two reasons people work beyond earning an income, using material and non-material living standards"
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 8 min · Practise 6 min · Make 6 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can explain two reasons people work besides earning an income.
  - I can tell material from non-material living standards.
  - I can back a reason with evidence from what someone says or does.
struggle: "Students default to money as the only reason. Ask: what does this person get from the work that money alone couldn't give them?"
before: |
  **What the idea leaves out.** ACARA frames work as contributing to identity, self-esteem and happiness. That is true for many people, and the lesson says "for many people" where students meet it. It leaves out that some work is tiring, unsafe, dull or badly paid, that many people work mainly because they have to, and that people who can't work or can't find work are not worth less. If a student says "my mum hates her job", that fits: work brings different things to different people. Don't ask students about their family's work.

  A discussion prompt if the class is ready: "If everyone had enough money without working, would people still work? What would they do?"

  **Living standards.** Material: goods and services money buys (food, housing, a phone, a holiday). Non-material: things money can't buy directly (friendships, health, safety, free time, a sense of purpose). Some things sit across both (health is helped by money but not bought outright); accept a reasoned answer.

  The wider match is "strongest for them right now". A student who argues Rosa's strongest reason is income has a point; ask for their evidence.

  All Riverbend people are made up.
running:
  - "Predict: take a vote on Mai. Ask the 'she should take the money' side what Mai would give up."
  - "Try: after the match, ask which of the five reasons the coach gets nothing from (income)."
  - "Worked example: let the class find Nib's line, then do the material/non-material question together."
  - "Vary: Dev's view is a good moment to say work doesn't do all this for everyone."
  - "Make: books out; students choose one Riverbend person."
stuck:
  - see: "A student says people only work for money."
    ask: "Why does the coach turn up every Thursday?"
    fix: "Income is one reason. Identity, self-esteem, community and non-material living standards are others."
  - see: "A student calls friendships or pride material."
    ask: "Could you buy that in a shop?"
    fix: "Material living standards are goods and services money buys. Non-material ones can't be bought."
  - see: "A student says everyone should love their job."
    ask: "Does everyone get the same things from work?"
    fix: "For many people work brings more than money, but not for everyone, and that's not anyone's fault."
stretch: "Think of a job that pays well but that some people would never want, and one that pays little but people line up to do. What does that say about why people work? It does not go on to another lesson."
support: "A two-column card: 'Money can buy it' (material) and 'Money can't buy it' (non-material), with one Riverbend example in each."
leads: |
  This is the last lesson in Work, income and identity. Mai's trade-off (typical step) links back to opportunity cost in Scarcity and opportunity cost.

  Wider (teacher choice, not part of the student steps): ACARA's elaborations for AC9HE7K04 include "describing examples of how continuity of cultural practices and management of Country/Place contributes to and sustains First Nations communities; for example, regional tourism ventures, coaching and mentoring initiatives, and fostering entrepreneurial and start-up cultures in regional and remote communities". The node's wider items suggest how this work contributes to identity and wellbeing. If you take this up, start from ACARA's wording and use First Nations-led sources and local, community-approved material. The lesson writes nothing about it.
exit:
  q: "Give two reasons someone might work besides earning an income, and say whether each is material or non-material."
  a: "For example: friendships at work (non-material), pride in doing a job well (self-esteem, non-material), being part of a club or community (non-material). Money for a holiday or a car is material."
explain: |
  **Earning an income** is one reason people work. For many people, work also adds to their **identity**, **self-esteem** and **part in the community**.

  **Material** living standards are goods and services money buys. **Non-material** living standards are things money can't buy directly, such as friendships, health and a sense of purpose. Work doesn't bring all of these to everyone.
