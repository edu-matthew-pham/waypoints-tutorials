summary: "Students combine entrepreneurial knowledge, skills and values with evidence from a business's story to explain what helped it succeed, including recognising an opportunity, initiative and innovation. The planted mistake is circular reasoning: explaining success with the result ('it made lots of money'). The lesson presents this as one way to explain success and names luck, timing and starting money as part of the story."
learning: "explain how at least two entrepreneurial characteristics contributed to a business's success, using evidence and naming what was outside its control"
time: 45
timing: "Predict and Try 8 min · Worked example 14 min · Vary 8 min · Practise 6 min · Make 9 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can explain how two characteristics helped a business succeed, with evidence.
  - I can tell an explanation from a description of the result.
  - I can tell initiative from innovation.
struggle: "Students describe success instead of explaining it ('it was popular', 'it made money'). Ask: what did the business do that came before that?"
before: |
  ACARA frames this standard as characteristics of entrepreneurs influencing business success. That is one way to explain success, and the lesson says so where students meet it. What it leaves out: luck and timing (the bike lanes opening, road works), money and connections to start with, and survivorship (we hear about the businesses that lasted, not the many that did the same things and closed). Researchers disagree about how much personal characteristics explain business outcomes. A discussion prompt: "If two people do exactly the same things and only one succeeds, what else is going on?"

  The wider step uses a business that closed despite doing things well, on purpose: the node's wider item "evaluate a failed business venture" can slide into blaming the owner's character. Keep both causes in view.

  Success is measured against a business's aim (the practise and typical steps), which links back to Types of businesses.

  All Riverbend businesses and people are made up. The Make step uses a real business the class has looked at; use its own published words.
running:
  - "Predict: take a vote. Ask anyone who chose 'it made more money' what came first, the money or something the business did."
  - "Try: after the match, ask which of the four could Dan's Deliveries have done too."
  - "Worked example: let the class find Nib's line, then do the sort together. Ask what is wrong with 'lots of people like it'."
  - "Vary: the loaf question separates initiative and innovation; take a quick show of hands on each part."
  - "Make: books out. Insist on one thing outside the business's control in every answer."
stuck:
  - see: "A student says the business succeeded because it was successful, popular or made money."
    ask: "What did it do before it got popular?"
    fix: "That describes the result. An explanation names an action and the evidence for it."
  - see: "A student mixes up initiative and innovation."
    ask: "Is this about acting without being told, or about a new or better way of doing it?"
    fix: "Initiative is acting on your own. Innovation is a new or better way that adds value."
  - see: "A student says a business that closed must have had a bad owner."
    ask: "What happened to the juice bar's street?"
    fix: "Characteristics help, but luck, timing and money matter too."
stretch: "Find two businesses that did similar things, where one succeeded and one didn't. What else explains the difference? It does not go on to another lesson."
support: "A sentence frame on the board: 'One reason ___ succeeded was ___ (characteristic). The evidence is ___. Something outside its control was ___.'"
leads: |
  This is the last lesson in Entrepreneurs and business success. Next in Economics and Business: Work, income and identity, or Consumer rights and responsibilities (coming later).

  Wider (teacher choice, not part of the student steps): ACARA's elaborations for AC9HE7K03 include "describing the characteristics of First Nations Australian entrepreneurs; for example, community-run companies such as the Gumatj Aboriginal Corporation and individuals such as Dean Foley and Tahnee Edwards, by asking questions such as 'What is their story?', 'How did they achieve success?' and 'What processes did they apply?'" The node's wider items also suggest comparing how success is defined in different cultural contexts. If you do, start from ACARA's wording, then use the entrepreneurs' or corporation's own published words and local, community-approved material. The lesson writes nothing about them.
exit:
  q: "Explain one reason Riverbend Cargo Bikes succeeded, with evidence, and one thing outside its control that helped."
  a: "For example: it showed initiative by running a lunchtime trial before anyone asked, or innovation by adding cool boxes to carry medicine. Outside its control: the new bike lanes opened as it started."
explain: |
  **Initiative** is acting on your own to start something or fix a problem. **Innovation** is a new or better way of doing something that adds value.

  One way to explain why a business succeeds is by what its people did: recognising an opportunity, initiative, innovation, and keeping stakeholders on side. Luck, timing and starting money matter too. "It made money" describes the success; it doesn't explain it.
