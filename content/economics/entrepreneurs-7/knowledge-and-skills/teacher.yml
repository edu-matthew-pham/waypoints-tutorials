summary: "Students identify the knowledge and skills entrepreneurs use: recognising opportunities, establishing a shared vision and making decisions about how a business is run. The planted mistake is that the idea is the only skill. Students then find the skills in a real local business the class has looked at."
learning: "identify the knowledge and skills entrepreneurs use, with an example of each from a business"
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 8 min · Practise 6 min · Make 6 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can name the skills entrepreneurs use, with an example of each.
  - I can explain why a good idea alone doesn't make a business.
  - I can find those skills in a real business we have looked at.
struggle: "Students often think the entrepreneur is 'the person with the idea' and treat everything after it as ordinary work. Keep asking: what would have happened without that step?"
before: |
  Riverbend is a made-up town, and every person and business in the student steps is made up, so nothing dates and no real brand or person is described. The node's criteria ask for examples from real entrepreneurs: that is what the Make step is for. Build a class set of entrepreneur profiles first (local, national and First Nations; the node calls this repertoire building), so students have real stories to draw on. Use the business's or person's own published words rather than second-hand summaries.

  The definition of "entrepreneur" varies: some people count anyone who starts a business, others only people who do something new. The lesson uses the skills ACARA lists for this standard and says so once. Researchers also disagree about how much any personal characteristic explains success; that comes up in lesson 3.
running:
  - "Predict: take a vote. Many pick 'a good idea will run itself'. Ask who has had an idea that went nowhere, and why."
  - "Try: after the match, ask which of the four only Maya could have done."
  - "Worked example: let Nib's lines sit. Ask what would happen to the business if Maya stopped at line 4."
  - "Vary: the sort has two opportunities, one shared vision and two running decisions. Ask pairs to defend any they split."
  - "Make: students choose from the class set of profiles, or a business they visited, and write in their own book."
stuck:
  - see: "A student says the shared vision is the logo or the name."
    ask: "If the growers all had the logo on their trucks but picked the vegetables a day early, would the plan work?"
    fix: "A shared vision is what the people involved agree to aim for, not how the business looks."
  - see: "A student says copying another shop is recognising an opportunity."
    ask: "Is there a need here that no one is meeting yet?"
    fix: "An opportunity is a gap. Doing the same as the shop next door doesn't fill one."
  - see: "A student says only big-company founders are entrepreneurs."
    ask: "How many people did Maya need to agree with her?"
    fix: "The skills are the same at any size, from a market stall to a national company."
stretch: "Pick one skill and argue it was the most important for Maya. Then find a business where a different skill mattered more. It does not go on to the next lesson."
support: "A three-column card: Spotted (the opportunity), Agreed (the shared vision), Decided (how it runs). Students write one Maya example in each before the sort."
leads: |
  Next in Entrepreneurs and business success: Values and the decisions entrepreneurs make.

  Wider (teacher choice, not part of the student steps): ACARA's elaborations for AC9HE7K03 include "describing the characteristics of First Nations Australian entrepreneurs; for example, community-run companies such as the Gumatj Aboriginal Corporation and individuals such as Dean Foley and Tahnee Edwards, by asking questions such as 'What is their story?', 'How did they achieve success?' and 'What processes did they apply?'" If you use these or other First Nations entrepreneurs, start from ACARA's wording, then use the entrepreneurs' or corporation's own published words and local, community-approved material. The lesson writes nothing about them.
exit:
  q: "Name two entrepreneurial skills and give an example of each from Maya's Farm Boxes."
  a: "Recognising an opportunity (boxes wilting on hot days), establishing a shared vision (growers and drivers agreeing on 'picked this morning, delivered by lunch'), or making decisions about how it runs (routes, prices, cool crates)."
explain: |
  An **entrepreneur** starts or runs a business, spotting a chance and acting on it.

  The skills: **recognising an opportunity** (a need no one is meeting well), **establishing a shared vision** (the people involved agree on the aim), and **making decisions about how the business is run**. A good idea is only the first of these.
