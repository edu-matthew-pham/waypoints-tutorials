summary: "Students use an interactive graph to read made-up data on casual and full-time workers in Riverbend over ten years, and describe each trend with its direction, how much it changed, and the period. The planted mistake is reading one year's dip as the trend."
learning: "identify and describe a trend in data over time, using an interactive graph"
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 8 min · Practise 6 min · Make 6 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can read values off a graph with a cursor.
  - I can describe a trend with its direction, how much, and the period.
  - I can tell a trend from one year's change.
struggle: "Students fix on the most recent or most dramatic change. Ask: what happened over the whole period, from the first year to the last?"
before: |
  The graph's legend says "Fulltime" (one word) because board series names can't contain a hyphen.

  All data is made up, shaped to show a clear rise in casual work with one dip, and a slow fall in full-time work. The years are numbered 1 to 10 on purpose, so the data isn't mistaken for real years.

  The elaboration's question ("For a 10-year period, to what extent has the number of people in casual work changed?") is the lesson's question. If you want real data, the ABS Labour Force releases include full-time and part-time employment; check what each table counts (casual is not the same as part-time) before using it.

  The wider step on what more casual work means for people is a judgement; both model answers are reasonable. It links back to Work, income and identity, but doesn't assume students have done it.
running:
  - "Predict: take a vote. Many will say 'falling' from one year."
  - "Try: show how the cursor works on the board, then let students read years 1 and 10."
  - "Worked example: put the three parts on the board (direction, how much, period)."
  - "Vary: students describe the full-time line in the same three parts."
  - "Make: students write their trend sentence in their book."
stuck:
  - see: "A student reads one year's change as the trend."
    ask: "What was it in the first year, and the last?"
    fix: "A trend is the overall direction over the whole period."
  - see: "A student says the line 'went up and down'."
    ask: "Overall, did it end higher or lower than it started?"
    fix: "Say the overall direction, how much, and the period. A dip can be mentioned, but it isn't the trend."
  - see: "A student mixes up the two lines."
    ask: "Which letter reads which line?"
    fix: "R reads the first line (casual); S reads the second (full-time)."
stretch: "Make up a set of ten numbers where the last year is lower than the first, but most years went up. What would you say the trend is? It does not go on to the next lesson."
support: "A trend card: Direction ___ · From ___ to ___ · Over ___ years."
leads: |
  Next in Responding to an economic issue: Cause and effect in data.

  The node's wider items include comparing trends for different groups (by gender or region) and choosing a digital tool for a self-directed question. Both suit a class with access to real ABS data.
exit:
  q: "Describe the trend in casual work in Riverbend in one sentence."
  a: "Over the ten years, casual work rose from 420 to 650 workers (up 230), with a dip in year 5."
explain: |
  A **trend** is the overall direction of change over a period. Describe it with its **direction**, **how much** it changed, and **over what period**.

  One year's jump or dip isn't the trend: look at the whole period.
