summary: "Students develop a response to an economic issue: choosing one alternative over another and justifying it by weighing costs and benefits. The case is two made-up phone plans (the elaboration's phone-and-budget example), with 12-month costs worked out on the sheet board. The planted mistake is counting the list instead of weighing it. The Make step is the student's own response, unmarked, with two model answers that choose differently."
learning: "develop a response to an economic issue that chooses one alternative and justifies it by weighing costs and benefits"
time: 45
timing: "Predict and Try 8 min · Worked example 14 min · Vary 8 min · Practise 6 min · Make 9 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can work out and compare the costs of two alternatives.
  - I can write a response with the issue, alternatives, costs and benefits, a choice and a because.
  - I can explain why two people can choose differently and both be well reasoned.
struggle: "Students list costs and benefits and then pick by counting, or by price alone. Ask: which point matters most here, and why?"
before: |
  The phone plans are made up, priced for easy arithmetic, and are not real offers. Amounts in the lesson are written without dollar signs in places on purpose (the site's maths text treats paired dollar signs as maths in some fields).

  **The response is the student's judgement.** The Make step is unmarked: the student compares their own response with two models that choose different plans, and ticks the criteria. Judge the reasoning, not the choice.

  The typical step links the elaboration's recyclable-packaging example to sustainable use of resources (from Scarcity and opportunity cost). The wider step (the council's parkland) is the node's community example; both models are reasonable.

  Nothing asks about students' own phones, plans or money; "yourself" is offered as one option in Make, and students can choose a made-up person instead.
running:
  - "Predict: take a vote. Many will pick 'the longer list'."
  - "Try: students write the two formulas on the sheet; ask what the totals leave out."
  - "Worked example: put the five parts on the board and build Mia's response together."
  - "Vary: change Plan A's price live and ask whether anyone's choice changes."
  - "Make: books out. Ask two students who chose different plans to read their because."
stuck:
  - see: "A student chooses by counting the list."
    ask: "Which point matters most to this person, and why?"
    fix: "A response weighs the points; one big cost can outweigh several small benefits."
  - see: "A student chooses by price alone."
    ask: "What would the cheaper plan cost them that isn't money?"
    fix: "Non-financial costs (running out of data, being locked in) count too."
  - see: "A student gives a choice with no reason."
    ask: "Why that one?"
    fix: "A response needs a because, linked to the costs and benefits."
stretch: "Find a price for Plan A where you'd change your choice, and explain why that's the tipping point for you. It does not go on to another lesson."
support: "A five-line frame: The issue is ___. The alternatives are ___. The costs and benefits are ___. I choose ___. Because ___."
leads: |
  This is the last lesson in Responding to an economic issue. The full inquiry (choosing an issue, gathering information, presenting the response) is class work; the Economics inquiry skeleton in Humanities skills sets it out.

  Wider (teacher choice, not part of the student steps): the node's wider items include a response to an economic issue facing a First Nations community, from within that community's context. If you take this up, use the community's own published words and local, community-approved material. The lesson writes nothing about it.
exit:
  q: "Write a one-sentence response for Mia: her choice and the because."
  a: "For example: I choose Plan B, because Mia uses little data and saving 120 a year matters more to her than switching freely. (Plan A with a good reason is also a good answer.)"
explain: |
  A **response** chooses one **alternative** over another and says why. It has five parts: the issue, the alternatives, the costs and benefits, the choice, and the because.

  Weigh the costs and benefits; don't just count them. Two people can choose differently and both be well reasoned.
