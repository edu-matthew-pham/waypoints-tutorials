summary: "Students identify the potential costs and benefits of a decision, financial and non-financial, and see the opportunity cost as one of the costs. The case is Sam deciding whether to take Saturday shifts (the elaboration's part-time work example). This is the hinge lesson for AC9HE7S04: students who count only money will weigh every response in the next lesson wrongly."
learning: "identify financial and non-financial costs and benefits of a decision, including the opportunity cost"
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 8 min · Practise 6 min · Make 6 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can list the costs and benefits of a decision.
  - I can tell financial from non-financial costs and benefits.
  - I can name the opportunity cost as one of the costs.
struggle: "Students count only money, especially when something is 'free'. Ask: what does it take from you that isn't money? What could you have done instead?"
before: |
  This is a hinge lesson. The Worked example's bug task, with its Build up to it question, is the check before moving on.

  Sam is the same made-up Riverbend person from Work, income and identity and Consumer rights, but no lesson assumes students have met him.

  Opportunity cost was taught in Scarcity and opportunity cost; this lesson places it inside a cost-benefit list rather than teaching it again.

  Nothing asks about students' own jobs or money. The Make step uses a made-up decision.
running:
  - "Predict: take a vote. Many will say 'only the bus fare'."
  - "Try: the four-box sort; pause on netball (a cost) and the reference (a benefit)."
  - "Worked example: let Nib's lines sit. Ask what Sam gives up that isn't money. This is the hinge check."
  - "Vary: the playground moves the same idea to a community."
  - "Make: students choose a made-up decision for their table."
stuck:
  - see: "A student counts only money as a cost."
    ask: "What does Sam give up that isn't money?"
    fix: "Time, enjoyment and other options are costs too: non-financial costs."
  - see: "A student says something free has no costs."
    ask: "What would you be doing with that time otherwise?"
    fix: "Free in money isn't free in time. The opportunity cost still applies."
  - see: "A student lists the pay as a cost."
    ask: "Does Sam give it up, or gain it?"
    fix: "What you gain is a benefit; what you give up is a cost."
stretch: "Can a cost for one person be a benefit for another in the same decision? Find an example in the playground. It does not go on to the next lesson."
support: "A four-box grid: Financial cost / Non-financial cost / Financial benefit / Non-financial benefit, with one Sam example in each."
leads: |
  Next in Responding to an economic issue: Developing a response.

  Wider (teacher choice, not part of the student steps): the node's wider items include how a First Nations community might weigh a new development proposal's financial returns against cultural, environmental and community impacts. If you take this up, use the community's own published words and local, community-approved material. The lesson writes nothing about it.
exit:
  q: "Give one financial cost, one non-financial cost and one non-financial benefit of Sam taking the Saturday shifts."
  a: "Financial cost: the bus fare. Non-financial cost: Saturday mornings with friends or netball (his opportunity cost). Non-financial benefit: new skills, a reference or new friends."
explain: |
  **Costs** are what you give up; **benefits** are what you gain. Both can be **financial** (money) or **non-financial** (time, skills, enjoyment, community good).

  The **opportunity cost** (the next best thing you give up) is always one of the costs.
