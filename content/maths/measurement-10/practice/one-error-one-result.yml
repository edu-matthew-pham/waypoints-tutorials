# Practice for "One error, one result". Highest and lowest areas and perimeters from readings.
templates:
  - q: "A rectangle is measured as {l} m by {w} m, each to the nearest 0.1 m. What is the highest its area could be? (m², 2 decimal places)"
    vars: { l: "3..9", w: "2..6" }
    where: "l > w"
    answer: "{(l + 0.05) * (w + 0.05)}"
    tolerance: 0.01
    feedback:
      - ["{l * w + 0.05}", "Both lengths are out at once. Use the highest length times the highest width."]
    explain: "({l} + 0.05) × ({w} + 0.05) = {l + 0.05} × {w + 0.05} = {(l + 0.05) * (w + 0.05)}."
  - q: "A rectangle is measured as {l} m by {w} m, each to the nearest 0.1 m. What is the lowest its area could be? (m², 2 decimal places)"
    vars: { l: "3..9", w: "2..6" }
    where: "l > w"
    answer: "{(l - 0.05) * (w - 0.05)}"
    tolerance: 0.01
    explain: "({l} − 0.05) × ({w} − 0.05) = {l - 0.05} × {w - 0.05} = {(l - 0.05) * (w - 0.05)}."
  - q: "A fence goes round a rectangle measured as {l} m by {w} m, each to the nearest 0.1 m. How far could the perimeter be out, at most? (m)"
    vars: { l: "3..9", w: "2..6" }
    answer: "0.2"
    tolerance: 0.005
    feedback:
      - ["0.05", "The perimeter adds four sides, and each could be 0.05 m out."]
    explain: "Four sides, each up to 0.05 m too long: 4 × 0.05 = 0.2 m."
  - q: "A room's area is worked out as {a} m² and could be out by {e} m². What is the percentage error? (%, 1 decimal place)"
    vars: { a: [10, 12, 15, 20, 24], e: [0.3, 0.4, 0.5, 0.6] }
    answer: "{e * 100 / a}"
    tolerance: 0.06
    explain: "{e} ÷ {a} × 100 = {e * 100 / a}%."
