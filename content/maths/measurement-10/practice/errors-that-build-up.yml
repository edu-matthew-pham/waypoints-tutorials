# Practice for "Errors that build up". Totals, products and percentage errors.
templates:
  - q: "{n} pieces of {p} m are each measured to the nearest 0.1 m. How far out could the total be, at most? (m)"
    vars: { n: "3..12", p: [1.5, 2.0, 2.5, 3.0, 4.0] }
    answer: "{n * 0.05}"
    tolerance: 0.005
    feedback:
      - ["0.05", "Every piece could be 0.05 m out, and the errors add."]
    explain: "{n} pieces, each up to 0.05 m out: {n} × 0.05 = {n * 0.05} m."
  - q: "A cube's side is out by {e}%. About what percentage could its volume be out by? (%)"
    vars: { e: "1..9" }
    answer: "{3 * e}"
    tolerance: 0.3
    explain: "The side appears three times in the volume: {e} + {e} + {e} = {3 * e}%."
  - q: "A rectangle's length is out by {a}% and its width is out by {b}%. About what percentage could its area be out by? (%)"
    vars: { a: "1..5", b: "1..5" }
    answer: "{a + b}"
    tolerance: 0.3
    explain: "Multiplying two measurements adds their percentage errors: {a} + {b} = {a + b}%."
  - q: "A box is {l} cm by {w} cm by {h} cm, each to the nearest 0.1 cm. What is the highest its volume could be? (cm³, 1 decimal place)"
    vars: { l: "8..12", w: "4..7", h: "2..4" }
    answer: "{(l + 0.05) * (w + 0.05) * (h + 0.05)}"
    tolerance: 0.1
    explain: "{l + 0.05} × {w + 0.05} × {h + 0.05} = {(l + 0.05) * (w + 0.05) * (h + 0.05)}."
