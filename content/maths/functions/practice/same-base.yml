# Practice for "Same base both sides".
templates:
  - q: "Solve {b}^x = {pow(b, n)}."
    vars: { b: "2..9", n: "2..4" }
    where: "pow(b, n) <= 4000"
    answer: "{n}"
    feedback:
      - ["{pow(b, n) / b}", "{pow(b, n) / b} is {pow(b, n)} ÷ {b}, but {b} isn't multiplying x. Count the {b}s that multiply to make {pow(b, n)}."]
    explain: "{pow(b, n)} = {b}^{n}, so {b}^x = {b}^{n} and x = {n}."
  - q: "Solve {pow(c, 2)}^x = {pow(c, n)}. Write both sides as powers of {c}."
    vars: { c: [2, 3, 5], n: [3, 5, 7] }
    answer: "{n / 2}"
    feedback:
      - ["{n}", "{c}^{n} = {pow(c, n)}, but the base here is {pow(c, 2)}. Write {pow(c, 2)} as {c}² first."]
    explain: "{pow(c, 2)} = {c}², so {pow(c, 2)}^x = {c}^(2x) and {pow(c, n)} = {c}^{n}. So 2x = {n} and x = {n / 2}."
  - q: "Solve {k}({b}^x) = {k * pow(b, n)}."
    vars: { k: "2..9", b: "2..4", n: "2..5" }
    answer: "{n}"
    feedback:
      - ["{n * b}", "Divide both sides by {k} first: {b}^x = {pow(b, n)}. Then count the {b}s."]
    explain: "Divide both sides by {k}: {b}^x = {pow(b, n)} = {b}^{n}, so x = {n}."
  - q: "Solve {b}^x = 1/{pow(b, n)}."
    vars: { b: "2..5", n: "1..3" }
    answer: "{0 - n}"
    feedback:
      - ["{n}", "{b}^{n} = {pow(b, n)}, not 1/{pow(b, n)}. A fraction needs a negative index."]
    explain: "1/{pow(b, n)} = 1/{b}^{n} = {b}^-{n}, so x = -{n}."
