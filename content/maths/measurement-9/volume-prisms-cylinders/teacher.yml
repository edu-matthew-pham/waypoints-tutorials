summary: "Students find the volume of prisms and cylinders as base area times height (AC9M9M01, node 2)."
time: 40
timing: "Predict and Run 6 min · Investigate 12 min · Modify 10 min · Practise and Make 12 min"
goals:
  - I can use V = Ah for a prism.
  - I can use V = πr²h for a cylinder.
  - I can change cubic metres into litres.
struggle: "Using the diameter. Ask: is that the full way across or half way?"
before: |
  Students need Surface area from nets.

  The one idea: stack the base layer. For a cylinder the base is a circle, so use the radius.

  1 mm of rain on 1 m² is about 1 litre (Bureau of Meteorology: approximate). The tank and roof sizes are made up for the task.
running:
  - "Predict: show of hands before the check."
  - "Paper: the tank in Make is worked on paper first."
stuck:
  - see: "A student gets about 30 m³ for the tank."
    ask: "Is 2.2 the radius?"
    fix: "It's the diameter: halve it."
stretch: "How tall would a tank of the same radius need to be to hold 10,000 L?"
support: "A printed layer picture with the base shaded."
leads: |
  Continues AC9M9M01 node 2.

  Where it leads: Problems with surface area and volume.
exit:
  q: "A cylinder has radius 2 and height 5. What is the base area times the height?"
  a: "π × 4 × 5 ≈ 62.8."
explain: |
  A prism or cylinder is a base layer stacked up to the height: V = Ah.

  For a cylinder A = πr², so V = πr²h.
