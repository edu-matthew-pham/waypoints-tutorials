summary: Students build triangles from given parts and see that SSS, SAS, ASA, AAS and RHS fix one triangle while SSA can give two (AC9M8SP01, node 1).
time: 40
timing: "Predict and Run 10 min · Investigate 10 min · Modify 10 min · Practise and Make 10 min"
goals:
  - I can name the four congruence tests (SSS, SAS, ASA or AAS, RHS).
  - I can choose the test that shows two triangles are congruent.
  - I can explain why SSA is not a congruence test.
struggle: "Where the angle is. Ask students to point to the angle and say which sides meet there before they name a test."
before: |
  Do the Run board yourself first: try SSA with a short BC. Students need triangle classification and the angle sum (Year 7).

  The one idea: a test is a set of parts that fixes the triangle, so any two triangles with those parts are congruent. The common mistake is treating SSA as SAS (Tom's mistake).

  The board draws every triangle the parts allow: none, one, or two (only for SSA).

  Wider: show two triangles formed by a rectangle's diagonal are congruent (it leads to the quadrilateral proofs in two lessons).
running:
  - "Predict: ask where the 40° angle could be."
  - "Run: ask what changed between one triangle and two."
  - "Investigate: ask Tom which sides meet at the 40° angle."
  - "Modify: ask why the angles must add to less than 180°."
  - "Make: ask when SSA gives one triangle, and why that is not enough."
stuck:
  - see: "A student calls SSA 'SAS'."
    ask: "Is the angle between the two sides?"
    fix: "SAS needs the included angle."
  - see: "A student says AAA proves congruence."
    ask: "Could a bigger triangle have the same angles?"
    fix: "Equal angles mean similar; congruence needs a side too."
  - see: "A student matches the wrong sides."
    ask: "Which corners match? Read the letters in order."
    fix: "△ABC ≡ △PQR: A with P, B with Q, C with R."
stretch: "Find the range of BC (with AB = 6 and angle A = 40°) that gives no triangle, two triangles and one triangle. What is special at the boundaries?"
support: "A card with the four tests drawn, the equal parts marked."
leads: |
  This starts AC9M8SP01.

  Where it leads: similar shapes (next lesson), proving quadrilateral properties, and congruence algorithms.
exit:
  q: "Two triangles have AB = PQ = 7 cm, BC = QR = 5 cm and angle B = angle Q = 60°. Are they congruent? Which test?"
  a: "Yes, by SAS: angle B is between AB and BC."
explain: |
  **Congruent** triangles are the same shape and size. Each **test** fixes a triangle: **SSS**, **SAS** (the angle between the sides), **ASA** or **AAS**, and **RHS**.

  **SSA** (an angle not between the two sides) is not a test: it can give two different triangles. Equal angles alone give the same shape, not always the same size.
