# Practice for "Similar shapes".
templates:
  - q: "A triangle has sides {a} cm, {b} cm and {c} cm. A similar triangle's shortest side is {k * a} cm. How long is its longest side, in cm?"
    vars: { a: "2..6", d: "1..3", e: "1..3", k: [1.5, 2, 2.5, 3, 4] }
    let: { b: "a + d", c: "a + d + e" }
    where: "a + b > c"
    answer: "{k * c}"
    feedback:
      - ["{c + k * a - a}", "Similar shapes multiply, not add: the scale factor is {k * a} ÷ {a} = {k}."]
    explain: "Scale factor {k * a} ÷ {a} = {k}. Longest side {c} × {k} = {k * c} cm."
  - q: "A {h} m post casts a {s} m shadow. At the same time, a tree casts a {t} m shadow. How tall is the tree, in metres?"
    vars: { h: [1, 1.5, 2, 2.5], s: [1, 2, 2.5, 3, 4], k: [3, 4, 5, 6, 8] }
    let: { t: "s * k" }
    answer: "{h * k}"
    feedback:
      - ["{t - s + h}", "Similar triangles multiply: the tree's shadow is {k} times the post's, so the tree is {k} times as tall."]
    explain: "The shadow is {t} ÷ {s} = {k} times as long, so the tree is {k} × {h} = {h * k} m."
  - q: "A triangle's sides are {a}, {b} and {c} cm. A similar triangle's matching sides are {k * a}, {k * b} and {k * c} cm. What is the scale factor?"
    vars: { a: "2..8", b: "3..9", c: "4..10", k: [2, 3, 4, 5, 1.5, 2.5, 0.5] }
    where: "a < b and b < c and a + b > c"
    answer: "{k}"
    feedback:
      - ["{1 / k}", "That goes from the copy back to the first triangle. Divide a side of the copy by the matching side of the first: {k * a} ÷ {a}."]
    explain: "{k * a} ÷ {a} = {k} (and {k * b} ÷ {b} = {k}). Every side is × {k}."
  - q: "A rectangle {l} cm by {w} cm is {k < 1 ? 'reduced' : 'enlarged'} so the {l} cm side becomes {k * l} cm. How long is the {w} cm side now, in cm?"
    vars: { l: [4, 6, 8, 10, 12, 20], w: [2, 3, 4, 5, 6], k: [0.5, 1.5, 2, 3] }
    where: "w < l"
    answer: "{k * w}"
    feedback:
      - ["{w + k * l - l}", "Each side is multiplied by the same scale factor, {k}."]
    explain: "Scale factor {k * l} ÷ {l} = {k}, so {w} × {k} = {k * w} cm."
