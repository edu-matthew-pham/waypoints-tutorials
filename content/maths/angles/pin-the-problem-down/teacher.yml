summary: "Students pin down a spatial problem before designing anything: the inputs, the output, what counts as done, what must hold and what is assumed. They split the sprinkler job into two smaller problems and find the biggest square one sprinkler covers (AC9M10SP03, node 1)."
time: 45
timing: "Predict and Run 8 min · Investigate 17 min · Modify 8 min · Practise and Make 12 min"
goals:
  - "I can write a spatial problem with exact inputs, output and success criterion."
  - "I can say what I'm assuming, out loud."
  - "I can split a job into two smaller problems that fit together."
struggle: "Saying 'cover the oval' without saying what covered means, or leaving out the shape. Ask: could a machine check your layout for any point? What would it need to be told?"
before: |
  Do the Predict yourself first. Students need Pythagoras (Finding a side) and the Year 9 idea of an algorithm as exact steps.

  The one idea: a problem has to be exact before an algorithm can solve it. Input, output, 'must be true', aim and assumption are the five pieces on the sort. The same job then splits into two smaller problems: how much one sprinkler covers, and how many of those fit.

  Hinge node, and a judgement one: there is no smaller step on purpose, because a lead-in would hand students the pieces. Let them argue over the sort, and keep asking what a machine would do with each line.

  The oval is treated as a rectangle, which is a simplification we name as an assumption. The real, curved school oval is the class project (node 3). The sizes, the sprinkler reach and the senior oval are all made up. Nothing here is a real measurement or needs a source.
running:
  - "Predict: take a show of hands before the check, then ask where the farthest point of a square is."
  - "Paper: the 6 m spray try-one and the Make task are worked on paper first, with a sketch of the square and its corner."
  - "Investigate: for the sort, ask a pair to disagree about one line (the aim and the success criterion are the usual tangle)."
  - "Investigate: for Kai, ask what two ovals of 100 m² you could draw that need different numbers of sprinklers."
  - "Modify: before the cricket-pitch rule, ask which of the five kinds of piece it is."
  - "Make: ask what the caretaker would still have to tell you."
stuck:
  - see: "A student puts 'as few as possible' under 'Must be true'."
    ask: "Does a layout with lots of sprinklers count as covered? Does a layout with dry patches?"
    fix: "Covering is the rule; fewest is only the aim among layouts that cover."
  - see: "A student gives the side as twice the radius."
    ask: "Where is the furthest point of the square from the middle?"
    fix: "The corner, not the edge, so work from the half-diagonal."
  - see: "A student says the area decides how many sprinklers."
    ask: "What about a 100 m by 1 m strip with the same area as a 10 m square?"
    fix: "Put the lengths in the input, not just the area."
stretch: "Pin down a different spatial job, such as the fewest benches along a path with no one more than 20 m from a seat, and split it into two smaller problems."
support: "A printed frame with five headings (Input, Output, Must be true, Aim, Assumption) and the oval job's sentences to cut up and sort."
leads: |
  This covers AC9M10SP03 node 1.

  Where it leads: Write the algorithm (next lesson), which turns the two smaller problems into numbered steps and tests them on two ovals. Testing awkward cases and refining the algorithm (node 3) is the class project.
exit:
  q: "A spray reaches 7 m. Write one thing that must be true of a layout, and find the side of the biggest square one sprinkler covers, to 1 decimal place."
  a: "Every point of the oval is within 7 m of a sprinkler. The side is 7 × √2 ≈ 9.9 m."
explain: |
  A problem is **pinned down** when you can say its inputs, its output, what counts as done, what must hold and what you're assuming.

  For the sprinklers: the oval's length and width and the spray's reach go in, a count and positions come out, and a layout counts only if every point is within reach of a sprinkler. The job splits into two smaller problems: how big a square one sprinkler covers (its corner is the furthest point, so the side is r × √2) and how many of those squares the oval takes.
