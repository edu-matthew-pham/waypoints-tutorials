summary: "Students solve two equations in two letters by substitution: one equation says what a letter is, they replace that letter in the other (in brackets), solve, and find the second letter (AC9M10A02, node 3, first of two lessons on the hinge). They also meet a pair with no solution and a pair with infinitely many. The plan prices are made up."
time: 45
timing: "Predict and Run 8 min · Investigate 16 min · Modify 11 min · Practise and Make 10 min"
goals:
  - I can replace one letter with an expression from the other equation, using brackets.
  - I can solve for one letter, then find the other.
  - I can tell what a false result such as 10 = 14, or a true one such as 0 = 0, means.
struggle: "Replacing the letter without brackets, so a multiplier reaches only the first term. Ask students to write 5c as 5 times the whole expression before they expand."
before: |
  Do the paper try-one and the Modify edge cases yourself first. Students need to solve a one-letter linear equation, expand a bracket and graph two lines (Solving equations with graphs, Comparing two plans).

  The one idea: where the plans cost the same, c is the same, so one rule stands in for c in the other. The common mistake is dropping the brackets (Zoe's working). The graph is the picture of the answer: the crossing point is the pair (g, c) that works in both rules.

  This is a hinge: algebraic solution of two equations in two letters leads to everything in the unit, and errors in expanding show here first. The `smaller:` folds step down to one move each.

  The prices (12 and 4 dollars, 30 and 1 dollar) are made up so the crossing is whole. Real plans have data limits and speed caps.
running:
  - "Predict: take a show of hands. 3 comes from 30 ÷ 12 and 9 from 12 + 30 − 4 × 6; ask which students tried values."
  - "Run: ask what the two lines have in common at the crossing."
  - "Paper: the try-one after the worked example and the Lite and Mid plan in Make are worked on paper first. Books out, example beside them; look for brackets."
  - "Modify: before the parallel-lines task, ask what 10 = 14 means. Before the same-line task, ask what 0 = 0 means."
stuck:
  - see: "A student writes 4(x − 5) = 3x as 4x − 5 = 3x."
    ask: "What does the 4 multiply? Write 4(x − 5) as two products."
    fix: "4 × x and 4 × (−5): 4x − 20."
  - see: "A student finds g = 6 and stops."
    ask: "What does the question want: the GB, the cost, or both?"
    fix: "Put g = 6 into a rule to find c = 36, and check the other rule gives 36."
  - see: "A student says a pair with 10 = 14 has no answer because they made a mistake."
    ask: "Can 10 = 14 ever be true? Are the two plans' per-GB prices the same?"
    fix: "Same price per GB and different fees: the plans never meet. The lines are parallel."
stretch: "Make up two plans that cost the same at 5 GB and 40 dollars. Check them by substitution."
support: "Use the Run board: read the crossing first, then match each step of the algebra to it."
leads: |
  Starts the hinge of AC9M10A02 (node 3).

  Next: Solving by elimination, for pairs where neither equation says what a letter is. Where it leads: Setting up equations from a situation, and Where they meet (functions) for a line and a curve.
exit:
  q: "Solve y = 3x and x + y = 20."
  a: "x + 3x = 20, so 4x = 20, x = 5 and y = 15. Check: 5 + 15 = 20."
explain: |
  When one equation says what a letter equals, **substitute** it into the other equation. With $c = 12 + 4g$ and $c = 30 + g$, both rules equal $c$, so $12 + 4g = 30 + g$. Solve to get $g = 6$, then put it back in a rule to find $c = 36$.

  Put the replacement in **brackets**: for $5c - 2g = 21$ with $c = g + 3$, write $5(g + 3) - 2g = 21$, not $5g + 3 - 2g$.

  A false result such as $10 = 14$ means the lines are parallel and there is no solution. A true result such as $0 = 0$ means the lines are the same and every point is a solution.
