summary: Students substitute the known values into a formula, solve the equation that is left for the unknown, and check by substituting back (AC9M7A01, node 3).
time: 45
timing: "Predict and Run 8 min · Investigate 15 min · Modify 12 min · Practise and Make 10 min"
goals:
  - I can substitute the values I know into a formula to make an equation.
  - I can solve the equation by undoing each operation, last first.
  - I can check my answer by substituting it back into the formula.
before: |
  Do the Run and Modify boards yourself first. The board lets students hunt for the answer by moving a slider: that is fine at Run, but in Investigate and Modify they should write the equation and solve it first, then use the board to check.

  The new move is putting together substitution (last lesson) and backtracking (Equations unit). The common error is repeating the operation instead of undoing it (Mia's mistake: 2w = 8, so w = 16). The check catches it every time, so make checking non-negotiable.

  One practise question needs only substitution, on purpose: students must decide which job each question asks for.
running:
  - "Predict: ask students who chose 14 or 8 to check their width in P = 2l + 2w."
  - "Run: ask why P goes up 2 for each 1 cm of width."
  - "Investigate: model the worked example live. Ask after each line: what did we undo?"
  - "Modify: for the battery, ask what the minus means before anyone calculates."
  - "Make: ask how they found it: guessing with the slider, or writing 6w = 24?"
stuck:
  - see: "A student repeats the operation instead of undoing it (Mia's mistake)."
    ask: "Does your answer check? Put it back into the formula."
    fix: "Undo × with ÷, and + with −. Check every answer by substituting back."
  - see: "A student puts the known answer in for the wrong letter (45 as h)."
    ask: "Which letter is the cost? Which is the hours?"
    fix: "Write each known value next to its letter before substituting."
stretch: "A rectangle's length is 3 cm more than its width, and its perimeter is 30 cm. Find both sides."
support: "Give a template: formula; what I know; substitute; undo; check."
leads: |
  Next: the Expressions unit continues with writing expressions from words. Solving for an unknown is the Equations unit, and in Linear relations it becomes finding x for a given y on a graph.
exit:
  q: "A gym costs T = 15w + 30 dollars for w weeks. Someone paid 120 dollars. How many weeks? Check your answer."
  a: "120 = 15w + 30, so 15w = 90 and w = 6. Check: 15 × 6 + 30 = 120."
explain: |
  When you know a formula's answer but not one of its letters, **substitute** the values you know. What is left is an **equation** with one unknown.

  Solve it by **undoing**: undo the last operation first (+ and − before × and ÷).

  Then **check**: put your answer back into the formula. It should give the value you started with.
