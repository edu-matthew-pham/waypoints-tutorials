# Practice for "Expanding brackets".
templates:
  - q: "Expand {a}({b|c}x {c|s})."
    vars: { a: "2..9", b: "1..6", c: [-9, -7, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5, 7, 9] }
    answer: "{a * b}x {a * c|s}"
    form: expanded
    feedback:
      - ["{a * b}x {c|s}", "The {a} multiplies every term in the bracket, so {c|p} becomes {a} × {c|p} = {a * c}."]
      - ["{a + b}x {a + c|s}", "Multiply, don't add: {a} × {b|c}x and {a} × {c|p}."]
    explain: "{a} × {b|c}x = {a * b}x and {a} × {c|p} = {a * c}, so {a * b}x {a * c|s}."
  - q: "Expand −{a}(x {c|s})."
    vars: { a: "2..9", c: [-9, -7, -6, -5, -4, -3, -2, 2, 3, 4, 5, 6, 7, 9] }
    answer: "-{a}x {-a * c|s}"
    form: expanded
    feedback:
      - ["-{a}x {a * c|s}", "−{a} × {c|p}: the signs {c < 0 ? 'are the same, so the answer is positive' : 'differ, so the answer is negative'}."]
    explain: "−{a} × x = −{a}x and −{a} × {c|p} = {-a * c}, so −{a}x {-a * c|s}."
  - q: "Expand and simplify {a}(x + {b}) + {c}(x {d|s})."
    vars: { a: "2..6", b: "1..9", c: "2..6", d: [-6, -5, -4, -3, -2, -1, 1, 2, 3, 4, 5] }
    where: "a * b + c * d != 0"
    answer: "{a + c}x {a * b + c * d|s}"
    form: expanded
    feedback:
      - ["{a + c}x {b + d|s}", "Each number outside multiplies every term in its own bracket: {a} × {b} and {c} × {d|p}."]
    explain: "{a}x + {a * b} + {c}x {c * d|s}. Collect: {a + c}x {a * b + c * d|s}."
  - q: "Expand and simplify {a}({b}x + {c}) − {d|c}x."
    vars: { a: "2..5", b: "2..4", c: "1..9", d: "1..7" }
    where: "a * b != d"
    answer: "{a * b - d|c}x + {a * c}"
    form: expanded
    feedback:
      - ["{a * b}x + {a * c - d}", "{d|c}x is an x term: collect it with {a * b}x, not with the number."]
    explain: "Expand: {a * b}x + {a * c} − {d|c}x. Collect the x terms: {a * b - d|c}x + {a * c}."
