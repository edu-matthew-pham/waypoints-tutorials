# Practice for "Classifying triangles".
templates:
  - q: "An isosceles triangle has an angle of {a}° between its two equal sides. What is each of the other two angles, in degrees?"
    vars: { a: "20..150 by 2" }
    where: "a != 60"
    answer: "{(180 - a) / 2}"
    feedback:
      - ["{a}", "The equal angles are opposite the equal sides: the base angles, not the angle between the sides."]
    explain: "180 − {a} = {180 - a}, shared between the two equal base angles: {(180 - a) / 2}° each."
  - q: "An isosceles triangle has two equal angles of {b}°. What is the third angle, in degrees?"
    vars: { b: "20..85" }
    where: "b != 60 and b != 45"
    answer: "{180 - 2 * b}"
    explain: "180 − {b} − {b} = {180 - 2 * b}°. {180 - 2 * b > 90 ? 'Over 90°: an obtuse isosceles triangle.' : 180 - 2 * b == 90 ? 'A right-angled isosceles triangle.' : 'All under 90°: an acute isosceles triangle.'}"
  - q: "How many of these triangles are obtuse: angles {a}°, {b}°, {180 - a - b}°; angles {c}°, {d}°, {180 - c - d}°; angles {e}°, {f}°, {180 - e - f}°?"
    vars: { a: "20..110", b: "20..80", c: "20..110", d: "20..80", e: "20..110", f: "20..80" }
    where: "a != 90 and c != 90 and e != 90 and a + b < 165 and c + d < 165 and e + f < 165 and a + b != 90 and c + d != 90 and e + f != 90"
    let: { n: "(max(a, b, 180 - a - b) > 90) + (max(c, d, 180 - c - d) > 90) + (max(e, f, 180 - e - f) > 90)" }
    answer: "{n}"
    explain: "A triangle is obtuse when its biggest angle is over 90°. Biggest angles: {max(a, b, 180 - a - b)}°, {max(c, d, 180 - c - d)}°, {max(e, f, 180 - e - f)}°. {n} obtuse."
