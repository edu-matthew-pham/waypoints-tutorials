# Practice for "Every outcome, and the total of 1".
templates:
  - q: "A spinner has outcomes with probabilities 0.{a}, 0.{b} and 0.{c}, and one more outcome. What is the probability of the last outcome?"
    vars: { a: "1..4", b: "1..3", c: "1..2" }
    answer: "{(10 - a - b - c) / 10}"
    tolerance: 0.005
    explain: "0.{a} + 0.{b} + 0.{c} = {(a + b + c) / 10}, so the last is 1 − {(a + b + c) / 10} = {(10 - a - b - c) / 10}."
  - q: "A bag has {r} red and {b} blue counters. Two are drawn with nothing put back. How many outcomes have two reds? (Treat every counter as different.)"
    vars: { r: "2..6", b: "1..4" }
    answer: "{r * (r - 1)}"
    explain: "{r} choices for the first, {r - 1} for the second: {r * (r - 1)}."
  - q: "The probabilities of three events that cover everything are {a}/12, {b}/12 and ?. What is the missing numerator over 12?"
    vars: { a: "2..5", b: "2..5" }
    answer: "{12 - a - b}"
    explain: "They add to 12/12, so {12 - a - b}/12."
