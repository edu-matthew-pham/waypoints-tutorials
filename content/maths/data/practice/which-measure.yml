# Practice for "Which measure?".
templates:
  - q: "Weekly pocket money ($): {o = 0 ? c + ', ' + e + ', ' + a + ', ' + d + ', ' + b : o = 1 ? d + ', ' + a + ', ' + e + ', ' + b + ', ' + c : b + ', ' + e + ', ' + d + ', ' + a + ', ' + c}. What is the median, in dollars?"
    vars: { a: "4..6", d1: "0..2", d2: "0..2", d3: "0..3", e: [30, 35, 40, 45, 50], o: "0..2" }
    let: { b: "a + d1", c: "b + d2", d: "c + d3" }
    answer: "{c}"
    feedback:
      - ["{(a + b + c + d + e) / 5}", "That is the mean, dragged up by the ${e} outlier. The median is the middle value once sorted: better for a typical student here."]
    explain: "Sorted: {a}, {b}, {c}, {d}, {e}. The median is {c}. (The mean is {(a + b + c + d + e) / 5}, pulled up by {e}.)"
  - q: "Five values: {o = 0 ? b + ', ' + e + ', ' + a + ', ' + d + ', ' + c : d + ', ' + a + ', ' + c + ', ' + e + ', ' + b}. Find the mean minus the median."
    vars: { a: "5..8", d1: "1..3", d2: "1..3", d3: "1..3", e: [40, 45, 50, 55, 60], o: [0, 1] }
    let: { b: "a + d1", c: "b + d2", d: "c + d3" }
    where: "(a + b + c + d + e) % 5 = 0"
    answer: "{(a + b + c + d + e) / 5 - c}"
    explain: "Mean {a + b + c + d + e} ÷ 5 = {(a + b + c + d + e) / 5}. Median (sorted, middle) {c}. {(a + b + c + d + e) / 5} − {c} = {(a + b + c + d + e) / 5 - c}: the outlier {e} pulls the mean up; the median stays with the typical values."
  - q: "The values {a}, {b}, {c} and {d} have a mean of {m}. A fifth value, {x}, is added. What is the new mean?"
    vars: { a: "2..15", b: "2..15", c: "2..15", m: "6..12", x: "20..40" }
    let: { d: "4 * m - a - b - c" }
    where: "d >= 1 and d <= 20 and (4 * m + x) % 5 = 0"
    answer: "{(4 * m + x) / 5}"
    feedback:
      - ["{(m + x) / 2}", "Don't average the old mean with {x}: the 4 old values count 4 times. New total {4 * m} + {x}, ÷ 5."]
    explain: "Old total 4 × {m} = {4 * m}. New total {4 * m + x}, ÷ 5 = {(4 * m + x) / 5}. One large value pulls the mean up by {(4 * m + x) / 5 - m}."
