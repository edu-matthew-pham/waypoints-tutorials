# Practice for "Stem-and-leaf plots". Key: 2 | 4 means 24.
templates:
  - q: "A stem-and-leaf plot (key: {s} | 4 means {s}4) has rows {s} | {a} {b} {c}{n4 ? ' ' + h : ''} and {s + 1} | {d} {e} {f}{n5 ? ' ' + g : ''}. What is the median?"
    vars: { s: "1..7", a: "0..2", b: "2..4", c: "4..6", h: "6..9", d: "0..2", e: "2..5", f: "5..7", g: "7..9", n4: [0, 1], n5: [0, 1] }
    where: "a < b and b < c and c < h and d < e and e < f and f <= g"
    let: { v1: "s * 10 + a", v2: "s * 10 + b", v3: "s * 10 + c", v4: "n4 ? s * 10 + h : (s + 1) * 10 + d", v5: "n4 ? (s + 1) * 10 + d : (s + 1) * 10 + e", N: "6 + n4 + n5" }
    answer: "{N = 6 ? (v3 + v4) / 2 : N = 7 ? v4 : (v4 + v5) / 2}"
    explain: "{N} values, in order: {v1}, {v2}, {v3}, {v4}, {v5}, … {N % 2 = 1 ? 'The middle (' + (N + 1) / 2 + 'th) value is ' + v4 : 'Two middle values: ' + (N = 6 ? v3 + ' and ' + v4 : v4 + ' and ' + v5) + ', so the median is halfway: ' + (N = 6 ? (v3 + v4) / 2 : (v4 + v5) / 2)}."
  - q: "A stem-and-leaf plot has rows {s} | {a} {b} {c}, {s + 1} | {d} {e} and {s + 2} | {f} {g}. What is the range?"
    vars: { s: "1..7", a: "0..4", b: "3..6", c: "6..9", d: "0..4", e: "4..9", f: "0..5", g: "3..9" }
    where: "a < b and b < c and d < e and f < g"
    answer: "{(s + 2) * 10 + g - s * 10 - a}"
    feedback:
      - ["{g - a}", "Use the whole values: {s + 2}{g} and {s}{a}, not just the leaves."]
    explain: "Highest {(s + 2) * 10 + g}, lowest {s * 10 + a}: {(s + 2) * 10 + g} − {s * 10 + a} = {(s + 2) * 10 + g - s * 10 - a}."
  - q: "A stem-and-leaf plot has rows {s} | {L1}, {s + 1} | {L2} and {s + 2} | {L3}. How many values does it show?"
    vars: { s: "1..6", n1: "1..5", n2: "0..4", n3: "1..5" }
    let: { L1: "n1 = 1 ? '3' : n1 = 2 ? '2 7' : n1 = 3 ? '1 4 4' : n1 = 4 ? '0 3 5 8' : '1 2 2 6 9'", L2: "n2 = 0 ? '(no leaves)' : n2 = 1 ? '5' : n2 = 2 ? '4 4' : n2 = 3 ? '0 6 7' : '1 3 3 8'", L3: "n3 = 1 ? '2' : n3 = 2 ? '0 9' : n3 = 3 ? '3 5 5' : n3 = 4 ? '1 1 4 7' : '0 2 3 6 8'" }
    answer: "{n1 + n2 + n3}"
    feedback:
      - ["3", "Count the leaves, not the stems: each leaf is one value."]
    explain: "One value per leaf, repeats included: {n1} + {n2} + {n3} = {n1 + n2 + n3}.{n2 = 0 ? ' The empty stem shows a gap.' : ''}"
  - q: "A stem-and-leaf plot has rows {s} | {a} {b} {b} and {s + 1} | {c} {d} {d} {d}. What is the mode?"
    vars: { s: "1..8", a: "0..3", b: "4..9", c: "0..2", d: "3..9" }
    where: "a < b and c < d"
    answer: "{(s + 1) * 10 + d}"
    feedback:
      - ["{d}", "The value is the stem and leaf together: {s + 1}{d}."]
    explain: "{(s + 1) * 10 + d} appears 3 times, more than any other value."
