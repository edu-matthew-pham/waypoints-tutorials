# Practice for "Records as probabilities".
templates:
  - q: "A bus was late on {k} of {n} school days (made up). What is the relative frequency of a late bus (a decimal)?"
    vars: { n: [20, 25, 40, 50, 80, 100], k: "2..9" }
    answer: "{k / n}"
    tolerance: 0.005
    feedback:
      - ["{k}", "That is the count. Divide by the {n} days."]
    explain: "{k} ÷ {n} = {k / n}."
  - q: "The chance of a faulty item is estimated at {p}%. About how many faulty items do you expect in {n} items?"
    vars: { p: "2..9", n: [200, 500, 1000, 2000] }
    answer: "{p * n / 100}"
    explain: "{p}% of {n} = {p * n / 100}."
  - q: "In {n} trials an event happened {k} times. What is its relative frequency as a percentage?"
    vars: { n: [20, 40, 50, 100, 200], k: "3..19" }
    answer: "{k * 100 / n}"
    tolerance: 0.1
    explain: "{k} ÷ {n} × 100 = {k * 100 / n}%."
