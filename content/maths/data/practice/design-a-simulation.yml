# Practice for "Designing a simulation".
templates:
  - q: "A player scores {p}% of the time (made up). How many of the 10 digits 0 to 9 should stand for a goal?"
    vars: { p: "10..90 by 10" }
    answer: "{p / 10}"
    feedback:
      - ["{p}", "There are only 10 digits. {p}% of 10 is the number of goal digits."]
    explain: "{p}% of 10 = {p / 10}."
  - q: "One trial uses {k} digits. How many digits do {n} trials need?"
    vars: { k: "3..8", n: [20, 50, 100] }
    answer: "{k * n}"
    explain: "{k} × {n} = {k * n}."
  - q: "A digit 0 to {g} stands for a goal. What percentage of digits are goals?"
    vars: { g: "1..8" }
    answer: "{(g + 1) * 10}"
    explain: "Digits 0 to {g} are {g + 1} of 10 digits: {(g + 1) * 10}%."
