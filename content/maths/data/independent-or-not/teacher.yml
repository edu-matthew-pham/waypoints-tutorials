summary: "Students decide whether two events are independent by comparing the chance of one given the other with its chance on its own, from two-way tables of made-up survey counts. They see that counts mislead and rates decide, and that events that can't happen together are not independent (AC9M10P01, node 3)."
time: 45
timing: "Predict and Run 10 min · Investigate 15 min · Modify 8 min · Practise and Make 12 min"
goals:
  - I can compare P(A | B) with P(A) to decide whether two events are independent.
  - I can explain in words what independent means.
  - I can say why counts can mislead and rates are compared.
struggle: "Comparing counts (18 against 42). Ask: 'How many walkers are there, and how many students who don't walk?'"
before: |
  Do the Run and Modify boards yourself first. Students need the last two lessons (given; tables, Venns and trees).

  The one idea: A and B are independent when P(A | B) = P(A), so knowing B tells you nothing about A. The board gives both numbers when you choose A with the given group set: c is the chance inside the group and p is the chance out of everyone. Independence is judged on these two rates.

  In plain words: "knowing one doesn't change the chance of the other". Independence is a matter of the numbers in the survey. It is not a statement about cause, and a small sample can make independent events look different. The last Make question keeps that careful.

  Every number is made up: the 100-student survey, the rain and late-bus days, the chess and choir survey, the new 120-student survey.
running:
  - "Predict: show of hands. Many students choose 'more likely'."
  - "Run: ask students to say the two rates out loud before they compare."
  - "Paper: the chess survey and the Make survey are worked on paper first. Look for the group named first."
  - "Modify: for the last board, ask 'can a student both walk and take the bus on the same trip?'"
stuck:
  - see: "A student says the events are dependent because the counts differ."
    ask: "How many walkers are there? How many non-walkers? Is 18 out of 30 the same as 42 out of 70?"
    fix: "Divide each count by its group before comparing."
  - see: "A student says events that cannot happen together are independent."
    ask: "If you know a student walks, what do you know about whether they take the bus?"
    fix: "Knowing one rules out the other, so the chance changes to 0."
  - see: "A student says the events are independent because the two chances are close."
    ask: "How close is close enough? With 100 students, what could a different sample give?"
    fix: "Say the two chances and what they show in this survey. Don't claim equal if they are not."
stretch: "Check the same table another way: multiply P(walk) by P(sport) and compare with P(walk and sport). Does it agree with comparing P(sport | walk) with P(sport)?"
support: "A table with the rows and columns already totalled, and a sentence frame: 'Of the ___ who ___, ___ also ___. That is ___ out of ___.'"
leads: |
  Continues AC9M10P01 node 3.

  Where it leads: simulating a conditional chance (next lesson), and 'A careful claim' in Statistics, where the same care is used for 'may be linked' against 'causes'.
exit:
  q: "Of 100 students, 50 play basketball. Of the 20 students who are left-handed, 10 play basketball. Are playing basketball and being left-handed independent in this survey?"
  a: "Yes: 10/20 = 0.5 and 50/100 = 0.5, the same."
explain: |
  Two events are independent when the chance of one stays the same whether or not the other happened.

  - Compare P(A | B) with P(A), both as rates.
  - Equal chances: independent. Different chances: not independent.
  - Counts mislead because the groups are different sizes.
  - Events that cannot both happen are not independent: if one happens, the other's chance drops to 0.
sources:
