# Boards for "Linked, but not the cause". Made-up monthly figures for one Australian town, months 1 to 12 = January to December.
# Each line is shown as an index so that its highest month is 100: ice-cream sales (90; 85; 60; 40; 25; 18; 17; 22; 35; 52; 70; 88 thousand tubs),
# drownings (6; 6; 4; 3; 2; 1; 1; 2; 2; 3; 4; 6) and the average daily maximum temperature (29; 28; 26; 22; 18; 15; 14; 16; 19; 22; 25; 28 °C). The cursor R follows the first line.

# region: run
widget: graph
axes: Month, Index
x: 0, 13
y: 0, 110
grid: 1, 20
series Icecream: 1,100; 2,94; 3,67; 4,44; 5,28; 6,20; 7,19; 8,24; 9,39; 10,58; 11,78; 12,98
series Drownings: 1,100; 2,100; 3,67; 4,50; 5,33; 6,17; 7,17; 8,33; 9,33; 10,50; 11,67; 12,100
series Temperature: 1,100; 2,97; 3,90; 4,76; 5,62; 6,52; 7,48; 8,55; 9,66; 10,76; 11,86; 12,97
cursor R: 1
# endregion

