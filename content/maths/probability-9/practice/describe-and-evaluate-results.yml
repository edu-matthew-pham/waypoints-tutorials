# Practice for "Why real results differ".
templates:
  - q: "{n} groups each ran 50 trials. Group results were {a}, {b} and {c} successes (3 groups). What is the pooled relative frequency of success (a decimal)?"
    vars: { n: [3], a: "20..30", b: "20..30", c: "20..30" }
    answer: "{(a + b + c) / 150}"
    tolerance: 0.005
    explain: "({a} + {b} + {c}) ÷ 150 = {(a + b + c) / 150}."
  - q: "A simulation of {n} trials gave a relative frequency of 0.{a}. The counted probability is 0.{b}. By how much do they differ?"
    vars: { n: [100, 500, 1000], a: "40..70", b: "40..70" }
    answer: "{abs(a - b) / 100}"
    tolerance: 0.001
    explain: "|0.{a} − 0.{b}| = {abs(a - b) / 100}."
  - q: "A real record of {n} trials had {k} successes. The model says the probability is {p}. How many successes did the model expect?"
    vars: { n: [10, 20, 40, 50], k: "2..9", p: [0.2, 0.25, 0.3, 0.5] }
    answer: "{n * p}"
    explain: "{p} × {n} = {n * p}. The real record had {k}; a few trials can easily differ by that much."
