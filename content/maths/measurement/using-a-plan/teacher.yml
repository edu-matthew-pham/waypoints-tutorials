summary: "Students read lengths off a scaled plan, convert them with the scale, and use them to decide whether things fit, including how a reading error on the plan is multiplied by the scale (AC9M10M05, node 2)."
time: 40
timing: "Predict and Run 7 min · Investigate 13 min · Modify 8 min · Practise and Make 12 min"
goals:
  - I can read a length off a plan and find the real length.
  - I can use real lengths to decide whether something fits.
  - I can say how far out a plan reading could be.
struggle: "Naming the wrong unit after multiplying. Ask: what unit was the plan length in?"
before: |
  Students need Scale factors.

  Students will measure the plan on paper or screen; a printed copy of the plan lets them use a ruler. The Make is a small modelling task: it asks students to say what they assumed (the plan is accurate, nothing else is on the wall, the door swings away). A real floor plan from an estate agent is a copyright image; the plan here is drawn for the lesson and the sofa and bookcase are made up.
running:
  - "Predict: show of hands. Those who choose 'yes' read 3.4 as metres or centimetres without the scale."
  - "Paper: the long wall after the worked example and the sofa and bookcase in Make are worked on paper first."
  - "Modify: ask why a coarser scale (1 : 200) makes a reading error bigger."
stuck:
  - see: "A student says the wall is 420 m."
    ask: "What unit was 8.4 in? What is 420 cm in metres?"
    fix: "Centimetres. 420 cm is 4.2 m."
  - see: "A student gives the spare space as 0.1."
    ask: "Is 3.3 bigger or smaller than 3.4?"
    fix: "Smaller, so short by 0.1 m: the answer is −0.1."
  - see: "A student forgets the door gap."
    ask: "Can furniture stand where the door opens?"
    fix: "Take the gap away before comparing."
stretch: "At what scale would reading the plan to the nearest millimetre be out by 10 cm in real life?"
support: "A strip showing plan cm, then × 50, then real cm and metres for each wall."
leads: |
  Continues AC9M10M05 (node 2).

  Where it leads: the modelling task of node 3, left to class, and any scaled design.
exit:
  q: "At 1 : 100 a corridor is 0.8 cm wide on the plan. How wide is it in real life?"
  a: "0.8 × 100 = 80 cm = 0.8 m."
explain: |
  To use a plan, read a length with a ruler, multiply by the scale, change to metres, and compare with what you want to fit.

  A reading error on the plan is multiplied by the scale too, so check whether the margin is bigger than the error.
