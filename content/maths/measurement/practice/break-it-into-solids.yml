# Practice for "Break it into solids".
templates:
  - q: "A box is {a} cm by {b} cm by {c} cm. A second box, {p} cm by {q} cm by {r} cm, is joined to it. What is the total volume in cm³?"
    vars: { a: "3..9", b: "3..9", c: "2..8", p: "2..6", q: "2..6", r: "2..6" }
    answer: "{a * b * c + p * q * r}"
    explain: "{a}×{b}×{c} + {p}×{q}×{r} = {a * b * c} + {p * q * r} = {a * b * c + p * q * r}."
  - q: "A block is {a} cm by {b} cm by {c} cm. A square hole {s} cm by {s} cm goes straight through, along the {c} cm side. What is the volume of the block with the hole in cm³?"
    vars: { a: "6..12", b: "6..12", c: "2..9", s: "1..4" }
    answer: "{a * b * c - s * s * c}"
    feedback:
      - ["{a * b * c + s * s * c}", "A hole has nothing in it: take its volume away, don't add it."]
    explain: "The whole block is {a}×{b}×{c} = {a * b * c}. The hole is {s}×{s}×{c} = {s * s * c}. Taking it away leaves {a * b * c - s * s * c}."
