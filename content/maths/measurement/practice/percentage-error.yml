# Practice for "Percentage error".
templates:
  - q: "A length is {t} cm and out by {e} cm. What is the percentage error? (%)"
    vars: { t: [20, 25, 40, 50, 100, 200], e: "1..4" }
    answer: "{e * 100 / t}"
    tolerance: 0.01
    explain: "{e} ÷ {t} × 100 = {e * 100 / t}%."
  - q: "A relative error is {r}. What is the percentage error? (%)"
    vars: { r: [0.01, 0.02, 0.025, 0.04, 0.05, 0.08] }
    answer: "{r * 100}"
    tolerance: 0.01
    explain: "{r} × 100 = {r * 100}%."
