# Practice for "Reading log scales".
templates:
  - q: "At {b} dB the safe time is 8 hours, and every 3 dB more halves it. How many hours are safe at {b + 3 * n} dB?"
    vars: { b: "70..90", n: "1..4" }
    answer: "{8 / pow(2, n)}"
    feedback:
      - ["{8 - n}", "Each 3 dB halves the time. It doesn't take off one hour."]
    explain: "{n} steps of 3 dB: halve {n} times, 8 ÷ {pow(2, n)} = {8 / pow(2, n)} hours."
  - q: "At {b} dB the safe time is 480 minutes, and every 3 dB more halves it. How many minutes are safe at {b + 3 * n} dB?"
    vars: { b: "70..90", n: "2..5" }
    answer: "{480 / pow(2, n)}"
    explain: "{n} steps of 3 dB: 480 ÷ {pow(2, n)} = {480 / pow(2, n)} minutes."
  - q: "A ruler has marks at {pow(10, a)} and {pow(10, a + 2 * k)}, with equal steps of ×10 between them. What number is halfway along?"
    vars: { a: "0..4", k: "1..3" }
    answer: "{pow(10, a + k)}"
    form: simplified
    feedback:
      - ["{(pow(10, a) + pow(10, a + 2 * k)) / 2}", "That's the average. On this ruler each equal step multiplies by 10."]
    explain: "From {pow(10, a)}, {k} equal steps of ×10 reach {pow(10, a + k)}, and {k} more reach {pow(10, a + 2 * k)}. Halfway is {pow(10, a + k)}."
  - q: "On a ruler of powers of 10, one thing sits at 10^{a} and another at 10^{a + k}. The second is 10^n times the first. What's n?"
    vars: { a: "-6..4", k: "3..9" }
    answer: "{k}"
    explain: "{k} equal steps along the ruler, each ×10, is 10^{k}."
