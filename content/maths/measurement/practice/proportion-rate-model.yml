# Practice for "Set up a rate model".
templates:
  - q: "A walk is {d} km with no climb. By Naismith's rule (5 km/h) how many hours?"
    vars: { d: [5, 10, 15, 20, 25, 30] }
    answer: "{d / 5}"
    tolerance: 0.01
    explain: "{d} ÷ 5 = {d / 5} hours."
  - q: "A walk has {c} m of climb. By Naismith's rule (600 m per hour) how many hours does the climb add?"
    vars: { c: [300, 600, 900, 1200, 1500] }
    answer: "{c / 600}"
    tolerance: 0.01
    explain: "{c} ÷ 600 = {c / 600} hours."
