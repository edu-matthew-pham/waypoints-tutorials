# Practice for "Scale factors". Plan to real, real to plan, and finding the scale.
templates:
  - q: "A plan is drawn at 1 : {s}. A wall is {p} cm long on the plan. How long is the real wall? (m)"
    vars: { s: [20, 50, 100, 200], p: [2.5, 3.2, 4, 5.5, 6, 7.5] }
    answer: "{p * s / 100}"
    tolerance: 0.005
    feedback:
      - ["{p * s}", "That is in centimetres. Change to metres."]
      - ["{p / s}", "The real wall is bigger than the plan: multiply."]
    explain: "{p} × {s} = {p * s} cm = {p * s / 100} m."
  - q: "A plan is drawn at 1 : {s}. A real wall is {m} m long. How long is it on the plan? (cm)"
    vars: { s: [20, 50, 100, 200], m: [2, 3, 4, 5, 6] }
    answer: "{m * 100 / s}"
    tolerance: 0.005
    explain: "{m} m = {m * 100} cm, and {m * 100} ÷ {s} = {m * 100 / s} cm."
  - q: "A model is {a} cm long. The real thing is {b} m long. What is the scale factor from model to real?"
    vars: { a: [5, 10, 12, 20], k: [20, 25, 40, 50] }
    let: { b: "a * k / 100" }
    answer: "{k}"
    explain: "{b} m = {a * k} cm, and {a * k} ÷ {a} = {k}: the scale is 1 : {k}."
  - q: "At 1 : {s}, a room is {w} cm by {l} cm on the plan. What is the real area? (m²)"
    vars: { s: [50, 100], w: "2..6", l: "3..8" }
    where: "l > w"
    answer: "{(w * s / 100) * (l * s / 100)}"
    tolerance: 0.01
    feedback:
      - ["{w * l * s}", "Areas do not scale by the scale factor itself. Find the real sides first."]
    explain: "Sides: {w * s / 100} m by {l * s / 100} m, so {(w * s / 100) * (l * s / 100)} m²."
