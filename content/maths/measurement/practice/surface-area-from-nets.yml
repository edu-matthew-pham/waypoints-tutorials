# Practice for "Surface area from nets".
templates:
  - q: "A box is {a} cm by {b} cm by {c} cm. What is its total surface area in cm²?"
    vars: { a: "2..9", b: "2..9", c: "2..9" }
    answer: "{2 * (a * b + a * c + b * c)}"
    explain: "2 × ({a}×{b} + {a}×{c} + {b}×{c}) = {2 * (a * b + a * c + b * c)}."
  - q: "A rectangular label for a tube is {w} cm wide and {h} cm tall. What is its area in cm²?"
    vars: { w: "5..20", h: "4..15" }
    answer: "{w * h}"
    explain: "{w} × {h} = {w * h}."
