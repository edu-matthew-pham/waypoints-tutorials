summary: Students open and close the angle between two sides to see that c² = a² + b² only at 90°, then use the comparison to classify triangles from their side lengths as right-angled, acute or obtuse, and hunt for Pythagorean triples (AC9M8M06, node 3).
time: 40
timing: "Predict and Run 8 min · Investigate 12 min · Modify 10 min · Practise and Make 10 min"
goals:
  - I can tell from three side lengths whether a triangle is right-angled, acute or obtuse.
  - I can explain why the longest side must be c in the test.
  - I can find and check Pythagorean triples.
struggle: "Remembering which way the inequality goes. Ask students to open the angle on the board and say what happened to c² before they use the rule, instead of giving them the table."
before: |
  Do the Run board yourself first. Students need Pythagoras (previous two lessons) and acute, right and obtuse triangles (Classifying triangles).

  The one idea: compare a² + b² with the longest side squared; equal means right-angled, and the bigger angle opposite c pushes c² up. The common mistake is testing with a shorter side as c (Ava's mistake).

  The test is the converse of Pythagoras' theorem: if a² + b² = c², the angle opposite c is a right angle. It is a separate fact from the theorem (which starts from a right angle); the board's angle slider shows why it holds.

  The board's angle slider keeps a and b fixed and works out c, so students see c² change continuously.
running:
  - "Predict: take a vote; most guess right-angled because the numbers are consecutive."
  - "Run: ask what happens to c as the angle opens, and to c²."
  - "Investigate: build the three-row table on the board from the Run observations."
  - "Modify: for 2, 3, 6, ask students to try to build it with straws or strips."
  - "Make: list the triples the class finds and spot multiples."
stuck:
  - see: "A student uses a shorter side as c (Ava's mistake)."
    ask: "Which side is opposite the biggest angle?"
    fix: "c is always the longest side."
  - see: "A student mixes up acute and obtuse."
    ask: "If the angle opens wider, does the opposite side get longer or shorter?"
    fix: "Wider angle, longer c, bigger c²: obtuse."
  - see: "A student compares the sides, not the squares."
    ask: "What does the theorem say: sides or squares?"
    fix: "Square all three first."
stretch: "Euclid's recipe: for whole numbers m > n, the numbers m² − n², 2mn and m² + n² make a triple. Test it for m = 2, n = 1 and m = 3, n = 2."
support: "Use the decision table and a list of squares to 20²; check with the board."
leads: |
  This completes AC9M8M06.

  Where it leads: the converse of Pythagoras in proofs, the cosine rule (Year 11), and distances on the Cartesian plane.
exit:
  q: "Classify triangles with sides (a) 8, 15, 17 and (b) 4, 6, 8."
  a: "(a) 64 + 225 = 289 = 17²: right-angled. (b) 16 + 36 = 52 < 64: obtuse."
explain: |
  To test a triangle, call its **longest** side $c$ and compare $a^2 + b^2$ with $c^2$:

  - equal: **right-angled**;
  - $a^2 + b^2 < c^2$: **obtuse** (the angle opposite $c$ is over 90°);
  - $a^2 + b^2 > c^2$: **acute**.

  Whole numbers that fit exactly are **Pythagorean triples**: 3-4-5, 5-12-13, 8-15-17, and their multiples.
