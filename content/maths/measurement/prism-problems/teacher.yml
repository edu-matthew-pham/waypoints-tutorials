summary: Students use V = Ah for rectangular and triangular prisms, work backwards to missing lengths, and solve capacity problems in context (AC9M8M02, node 2).
time: 40
timing: "Predict and Run 8 min · Investigate 10 min · Modify 10 min · Practise and Make 12 min"
goals:
  - I can find the volume of any right prism from the area of its end.
  - I can find a missing length from a volume or a capacity.
  - I can answer in the units the problem asks for.
struggle: "Deciding which face is the end. Ask students to point to the shape that stays the same all the way along before they calculate."
before: |
  Do the Run board yourself first. Students need volume and capacity conversions (previous lesson) and composite areas.

  The one idea: V = A × h for every right prism, where A is the area of the end. The common mistake is using length × width × height on a prism that is not a box (Mia's mistake).

  The board's prism is built in layers of the end's area; its triangular prism has a right-triangle end.

  Wider: packaging (the box with the least card for a given volume), and finding dimensions for a required capacity.
running:
  - "Predict: ask what to do with the litres first."
  - "Run: ask how the depth would change for a bigger base."
  - "Investigate: ask Mia which face stays the same all the way along."
  - "Modify: ask for the depth before they move the slider."
  - "Make: ask for the plan in one sentence."
stuck:
  - see: "A student multiplies three lengths for a triangular prism."
    ask: "What shape is the end, and what is its area?"
    fix: "V = area of the end × length."
  - see: "A student mixes m and cm in one problem."
    ask: "Are all your lengths in the same unit?"
    fix: "Convert first, then calculate."
  - see: "A student multiplies when working backwards."
    ask: "What times the end's area gives the volume?"
    fix: "Divide the volume by the end's area."
stretch: "A box must hold 1 L. Which whole-number dimensions use the least card? Compare at least four designs."
support: "Give a printed prism with the end shaded, and a formula card V = A × h."
leads: |
  This completes AC9M8M02.

  Where it leads: cylinders (Year 9), surface area of prisms, and rates of filling (Rates).
exit:
  q: "A tank with a 2 m by 1.5 m base holds 4500 L. How deep is the water?"
  a: "4500 L = 4.5 m³; 4.5 ÷ 3 = 1.5 m."
explain: |
  For any **right prism**, $V = A \times h$: the area of the end times the length. Find the end's area with its own formula (rectangle, triangle or composite).

  To find a missing length, divide: $h = V \div A$. Convert units first, and answer in the units the problem asks for (mL, L or m³).
