summary: Students cut a parallelogram along its height and move the triangle to make a rectangle, see that sliding the top keeps the area, and use A = bh with the perpendicular height (AC9M7M01, node 1).
time: 40
timing: "Predict and Run 8 min · Investigate 12 min · Modify 10 min · Practise and Make 10 min"
goals:
  - I can explain why a parallelogram has the same area as a rectangle with the same base and height.
  - I can find the area of a parallelogram with base × perpendicular height.
  - I can tell the perpendicular height from a slanted side.
struggle: "Choosing the perpendicular height when a slanted side is also labelled. Ask students to trace the right-angle mark with a finger before they multiply, rather than telling them which number to use."
before: |
  Do the Run board yourself first. Students need area of rectangles by counting rows of squares (Year 6) and the meaning of cm².

  The one idea: a parallelogram rearranges into a rectangle with the same base and height, so A = bh. The common mistake is using the slanted side (Ruby's mistake); the board's dashed height with its right-angle mark is the fix.
running:
  - "Predict: take a show of hands. Students who chose the parallelogram think longer sides mean more area."
  - "Run: ask where the cut went, and why there."
  - "Investigate: have students point to the height on the bug task's picture in their head: which length meets the base at a right angle?"
  - "Modify: for the missing height, ask what operation undoes × 6."
  - "Make: collect different base and height pairs for 18."
stuck:
  - see: "A student multiplies by the slanted side (Ruby's mistake)."
    ask: "Which length meets the base at a right angle?"
    fix: "Use the perpendicular height: the dashed line with the ∟."
  - see: "A student adds base and height."
    ask: "How many rows of squares, and how many in each row?"
    fix: "Area is rows × squares in a row: multiply."
  - see: "A student writes cm for an area."
    ask: "Are we counting lengths or squares?"
    fix: "Squares: cm²."
stretch: "Draw three different parallelograms on squared paper, each with area 24 cm², none of them a rectangle."
support: "Cut paper parallelograms and rearrange them; count squares on the board for small cases."
leads: |
  Next: Area of triangles (node 1), half of a parallelogram.

  Where it leads: area of trapeziums and composite shapes (Year 8), and volume of prisms (the base times the height again).
exit:
  q: "A parallelogram has base 9 cm, slanted side 5 cm and perpendicular height 4 cm. Find its area."
  a: "9 × 4 = 36 cm² (the 5 cm slanted side is not used)."
explain: |
  A parallelogram is a rectangle pushed over. Cut the triangle off one end along the **perpendicular height** and move it to the other end: it becomes a rectangle with the same base and height. So:

  $$A = b \times h$$

  where $h$ is the perpendicular height, at a right angle to the base, not the slanted side. Area is in square units: cm², m².
