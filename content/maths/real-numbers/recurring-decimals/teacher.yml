summary: Students divide fractions out on a long-division board, watch the remainders, and see why decimals either stop or repeat, writing recurring decimals with bars and dots (AC9M8N03, node 1).
time: 35
timing: "Predict and Run 8 min · Investigate 8 min · Modify 10 min · Practise and Make 9 min"
goals:
  - I can tell whether a fraction's decimal terminates or recurs.
  - I can write a recurring decimal with a bar or dots.
  - I can explain why a remainder coming back means the digits repeat.
struggle: "Trusting the remainders over the calculator. Ask students to predict the next remainder before the board shows it."
before: |
  Do the Run board yourself first. Students need fractions as decimals (Number Foundations).

  The one idea: the remainders are always less than the denominator, so either one is 0 (the decimal stops) or one comes back (the digits repeat). The common mistake is calling a recurring decimal irrational (Zoe's mistake): a recurring decimal is a fraction.

  The board shows the first 12 steps; longer blocks (1/17, 1/19, 1/23, 1/29) are written out in full on the decimal line.

  Wider: why 0.999… = 1; the longest blocks (1/7 has 6, 1/17 has 16: the block is at most one less than the denominator).
running:
  - "Predict: ask a 'yes' student to keep dividing 1 by 3."
  - "Run: ask why the remainder can never be 7 or more when dividing by 7."
  - "Investigate: ask Zoe whether 1/7 is a fraction."
  - "Modify: ask which denominators gave decimals that stop."
  - "Make: ask for the longest block they found."
stuck:
  - see: "A student says a long calculator decimal never stops, so it is irrational."
    ask: "Do the digits repeat?"
    fix: "A repeating decimal is a fraction: rational."
  - see: "A student puts the bar over the wrong digits."
    ask: "Which digits come round again?"
    fix: "The bar goes over the whole repeating block, and only that."
  - see: "A student thinks 0.33 is exactly 1/3."
    ask: "What is 3 × 0.33?"
    fix: "0.99 is not 1: 0.33 is an approximation."
stretch: "Find the length of the repeating block of 1/17, 1/19 and 1/23. What is the longest a block can be for denominator b, and why?"
support: "Do 1 ÷ 3 and 1 ÷ 4 on paper side by side before the board."
leads: |
  This starts AC9M8N03.

  Where it leads: predicting from the denominator (next lesson), irrational numbers, and converting recurring decimals to fractions (Year 9 and 10).
exit:
  q: "Does 5/6 terminate or recur? Write it with a dot."
  a: "It recurs: 5/6 = 0.8333… = 0.83 with a dot over the 3."
explain: |
  A fraction's decimal **terminates** (stops) or **recurs** (repeats a block forever). In long division, a remainder of 0 means it stops; a remainder that comes back means the digits repeat.

  Mark the repeating block with a **bar** or **dots**: $0.\overline{142857}$, $0.1\dot{6}$. A recurring decimal is still a fraction, so it is rational.
