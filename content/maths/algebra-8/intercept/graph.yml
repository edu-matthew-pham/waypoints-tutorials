# Graph boards for "What c does to a line". The rule is y = 2x + c unless a task needs m too; the dashed line
# y = 2x + 1 is where the line started, to compare with.

# region: run
widget: graph
x: -1, 5
y: -4, 14
slider c: -3, 6, 1
plot: y = 2x + c
plot: y = 2x + 1, dashed
table: 0, 1, 2, 3
step: 1
# endregion

# region: below
widget: graph
x: -1, 5
y: -6, 12
slider c: -5, 5, 1
plot: y = 2x + c
point T: 0, -2
# endregion

# region: origin
widget: graph
x: -1, 5
y: -6, 12
slider c: -5, 5, 2
plot: y = 2x + c
point T: 2, 4
# endregion

# region: off-axis
widget: graph
x: -1, 5
y: -6, 14
slider c: -5, 8, 0
plot: y = 2x + c
point T: 1, 6
# endregion

# region: parallel
widget: graph
x: -1, 5
y: -8, 8
slider m: -3, 3, 1
slider c: -5, 5, 2
plot: y = mx + c
plot: y = -x + 3, dashed
point T: 0, -1
# endregion

# region: make
widget: graph
x: -1, 5
y: -4, 12
slider c: -10, 12, 1
plot: y = 2x + c
plot: y = 2x + 1, dashed
point P: 3, -2, drag
# endregion

# region: explain
widget: graph
x: -1, 4
y: -6, 12
slider c: -2, 4, 1, 3
plot: y = 2x + c
plot: y = 2x + 1, dashed
# endregion

# region: explain-pic
widget: graph
x: -1, 4
y: -2, 14
plot: y = 2x + 4
plot: y = 2x + 1, dashed
point A: 0, 4
point B: 0, 1
# endregion
