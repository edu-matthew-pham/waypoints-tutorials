  Where it leads: Solving problems with these rules.
exit:
  q: "What is the turning point of y = (x − 1)² + 4?"
  a: "(1, 4)."
explain: |
  In y = a(x − h)² + k the turning point is (h, k). A negative a gives a peak.

  The bracket must be zero at the turning point, so the sign of h flips.
