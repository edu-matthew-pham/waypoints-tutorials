# Graph boards for "Plotting a rule". Points A to D start in a row at the bottom; students drag each one to a pair
# from the table.

# region: run
widget: graph
x: -1, 6
y: -2, 9
point A: 3, -1, drag
point B: 4, -1, drag
point C: 5, -1, drag
point D: 6, -1, drag
# endregion

# region: pic
widget: graph
x: -1, 5
y: -2, 9
plot: y = 2x + 1, from 0, to 3
point A: 0, 1
point B: 1, 3
point C: 2, 5
point D: 3, 7
# endregion

