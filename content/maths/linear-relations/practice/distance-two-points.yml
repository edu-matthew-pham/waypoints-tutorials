# Practice for "Distance between two points".
templates:
  - q: "Find the distance between ({x}, {y}) and ({x + a}, {y + b})."
    vars: { x: "0..4", y: "0..4", a: [3, 5, 6, 8], b: [4, 12, 8, 15] }
    where: "(a == 3 and b == 4) or (a == 5 and b == 12) or (a == 6 and b == 8) or (a == 8 and b == 15)"
    answer: "{sqrt(a * a + b * b)}"
    feedback:
      - ["{a + b}", "That adds the sides. Square them, add, then take the square root."]
    explain: "Across {a}, up {b}: {a * a} + {b * b} = {a * a + b * b}. The square root is {sqrt(a * a + b * b)}."
  - q: "Find the distance between (0, 0) and ({a}, {b}), to 1 decimal place."
    vars: { a: "1..9", b: "2..9" }
    where: "a != b"
    answer: "{rd(sqrt(a * a + b * b), 1)}"
    tolerance: 0.06
    feedback:
      - ["{a + b}", "That adds the sides. Square them first."]
    explain: "{a * a} + {b * b} = {a * a + b * b}. √{a * a + b * b} ≈ {rd(sqrt(a * a + b * b), 1)}."
  - q: "A flight goes {a} km east and {b} km north. How far is it in a straight line? (to 1 decimal place)"
    vars: { a: "2..9", b: "2..9" }
    where: "a != b"
    answer: "{rd(sqrt(a * a + b * b), 1)}"
    tolerance: 0.06
    explain: "{a * a} + {b * b} = {a * a + b * b}. √{a * a + b * b} ≈ {rd(sqrt(a * a + b * b), 1)} km."
