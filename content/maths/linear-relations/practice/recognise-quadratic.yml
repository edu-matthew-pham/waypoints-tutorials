# Practice for "Recognising a quadratic".
templates:
  - q: "A table has y = {a * 1 * 1}, {a * 4}, {a * 9}, {a * 16} for x = 1, 2, 3, 4. What is the second difference?"
    vars: { a: "1..6" }
    answer: "{2 * a}"
    feedback:
      - ["{a}", "That's a. Take the differences of the differences."]
    explain: "First differences: {a * 3}, {a * 5}, {a * 7}. Second differences: {2 * a}."
  - q: "A table has y = {c}, {c + b}, {c + 2 * b}, {c + 3 * b} for x = 0, 1, 2, 3. Is it linear or quadratic?"
    vars: { c: "1..9", b: "2..8" }
    choices: ["Linear: the first differences are all {b}", "Quadratic: the second differences are {b}"]
    explain: "Each value goes up by {b}: the first differences are equal, so it's linear."
  - q: "A quadratic table has first differences {d}, {d + 2 * s}, {d + 4 * s}. What is the next first difference?"
    vars: { d: "1..7", s: "1..4" }
    answer: "{d + 6 * s}"
    explain: "The first differences go up by {2 * s} each time, so the next is {d + 6 * s}."
  - q: "A quadratic table has y = {c}, {c + d}, {c + 2 * d + 2 * s}, ... with second differences {2 * s}. What is the third y value?"
    vars: { c: "1..5", d: "1..5", s: "1..3" }
    answer: "{c + 2 * d + 2 * s}"
    explain: "First differences {d}, {d + 2 * s}. {c} + {d} + {d + 2 * s} = {c + 2 * d + 2 * s}."
