summary: "Students compare strategies for calculations with fractions, decimals and percentages: changing the order (any order for multiplying), changing the form (0.75 = 3/4), and splitting (the distributive law), with an estimate to check (AC9M7N06, node 4)."
time: 40
timing: "Predict and Run 8 min · Investigate 12 min · Modify 10 min · Practise and Make 10 min"
goals:
  - I can choose a quick strategy for a calculation and explain why it is quick.
  - I can use any order for multiplying, a friendly fraction, or splitting a number.
  - I can estimate to check that my answer is about right.
struggle: "Pausing to look for a quick route instead of starting the long way. Give ten seconds of no-writing time to spot a friendly number before anyone calculates."
before: |
  Do the Run board yourself first. Students need multiplying fractions and percentages (previous lessons).

  The one idea: there is more than one right way, and the best one depends on the numbers. Students own their working: the reasoning checks never mark the free working, only the answer and the reason at the key step.

  This node integrates everything in the unit; there is no single new misconception. Listen for students who use the long way every time, and ask what made the quick way possible.
running:
  - "Predict: ask a student who chose halving to explain why it works."
  - "Run: ask which other percentages are friendly fractions (10%, 20%, 50%, 75%)."
  - "Investigate: share two different routes for 4 × 2.7 × 25 and compare."
  - "Modify: for 37% of 50, show that percentages can swap: 37% of 50 = 50% of 37."
  - "Make: collect pairs that give 18 and sort them by how quick they are."
stuck:
  - see: "A student always multiplies the long way."
    ask: "Is any number here a friendly fraction, or a pair that makes 10 or 100?"
    fix: "Look for 25 and 4, 0.5, 0.25, 0.75, 10% and 50% first."
  - see: "A student splits a product into a sum but forgets to multiply every part (25 × 3 + 0.2)."
    ask: "What is 3.2 made of? Does each part get multiplied by 25?"
    fix: "Every part of the split is multiplied."
  - see: "A student's answer is far off and they do not notice."
    ask: "Roughly how big should it be?"
    fix: "Estimate first: round the numbers and compare."
stretch: "Make a poster of your own efficiency rules: when to use a fraction, a decimal, or a percentage, with an example of each."
support: "Keep a table of friendly percentages and their fractions visible (10% = 1/10, 25% = 1/4, …)."
leads: |
  Next: Calculating with negative fractions and decimals (AC9M8N04), where the same moves work with signs.

  Where it leads: mental strategies in financial maths (AC9M7N09) and algebraic manipulation, where the distributive law becomes expanding brackets.
exit:
  q: "Work out 5 × 3.6 × 2 and 40% of 15, each in a quick way. Say which move you used."
  a: "5 × 2 = 10, then × 3.6 = 36 (any order). 40% = 2/5: 15 ÷ 5 × 2 = 6 (change the form)."
explain: |
  A quick strategy usually comes from one of three moves:

  - **Change the order:** multiplying can be done in any order, $4 \times 2.7 \times 25 = 100 \times 2.7 = 270$.
  - **Change the form:** $0.75 = \tfrac{3}{4}$, so $0.75 \times 36 = 27$; $25\% = \tfrac{1}{4}$.
  - **Split a number:** $12 \times 2.5 = 12 \times 2 + 12 \times 0.5 = 30$.

  Then check with an estimate: is the answer about the right size?
