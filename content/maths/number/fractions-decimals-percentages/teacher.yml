summary: Students use a fraction bar and a hundred grid to see one amount as a fraction, a decimal and a percentage, convert in every direction, and meet a recurring decimal (AC9M7N04, node 2).
time: 40
timing: "Predict and Run 8 min · Investigate 12 min · Modify 10 min · Practise and Make 10 min"
goals:
  - I can convert between fractions, decimals and percentages.
  - I can explain why 0.5 = 50%, not 5%.
  - I can compare amounts written in different forms.
before: |
  Do the Run board yourself first. Students need Equivalent fractions (the lesson before) and place value with decimals (Year 6).

  The one idea: percent means out of 100, so hundredths connect all three. The common mistake is reading the digits after the point as the percentage (0.5 = 5%); it is planted in Max's working and named in the success criteria.

  Decimal answers are marked by form (3/8 is told to write a decimal); a percentage can be typed with or without the % sign.
running:
  - "Predict: take a show of hands. Students who chose 34% are reading digits."
  - "Run: ask how many squares one quarter is, then three."
  - "Investigate: model each line of the worked example with the grid beside it."
  - "Modify: before the 1/3 task, ask students to shade 1/3 of the grid exactly."
  - "Make: ask why odd numbers of eighths cannot be shaded exactly."
stuck:
  - see: "A student writes 0.5 as 5% (Max's mistake)."
    ask: "How many hundredths is 0.5? Shade it on the grid."
    fix: "× 100: 0.5 = 50%."
  - see: "A student writes 3/4 as 3.4 or 0.34."
    ask: "What does the fraction bar mean: 3 of 4 parts. What is 3 ÷ 4?"
    fix: "Divide the top by the bottom: 0.75."
  - see: "A student cannot simplify a percentage as a fraction."
    ask: "What do 16 and 100 have in common?"
    fix: "Over 100, then divide by the highest common factor."
stretch: "Which fractions with a bottom number up to 12 give decimals that stop, and which recur? What do the stopping ones have in common? (In simplest form, bottoms made only of 2s and 5s.)"
support: "Use the hundred grid for every conversion; for eighths, allow half squares."
leads: |
  Next: Fractions and decimals on the line (node 3).

  Where it leads: percentage of an amount, percentage change and discounts (Year 8), and probability.
exit:
  q: "Write 3/5 as a decimal and as a percentage, and 0.08 as a percentage."
  a: "0.6 and 60%; 0.08 = 8%."
explain: |
  **Percent** means out of 100, so a percentage is a fraction over 100: $75\% = \tfrac{75}{100} = \tfrac{3}{4}$. A decimal counts tenths and hundredths: $0.75$ is 75 hundredths.

  - Fraction to decimal: divide the top by the bottom ($\tfrac{3}{8} = 0.375$).
  - Decimal to percentage: × 100 ($0.5 = 50\%$, not 5%).
  - Percentage to fraction: over 100, then simplify ($16\% = \tfrac{4}{25}$).

  Some decimals never end: $\tfrac{1}{3} = 0.333\ldots$
