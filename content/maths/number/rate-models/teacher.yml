summary: Students model practical problems as a ratio or a rate (paint coverage, cordial, fuel, sharing, filling), solve them and interpret the answer in the situation (AC9M8M07, node 1).
time: 40
timing: "Predict and Run 8 min · Investigate 10 min · Modify 10 min · Practise and Make 12 min"
goals:
  - I can decide whether a problem needs a ratio or a rate.
  - I can set up and solve a ratio or rate model.
  - I can interpret the answer in the situation, such as rounding up to whole tins.
struggle: "Choosing the model. Ask students to name the two quantities and their units before they calculate: same units, ratio; different units, rate."
before: |
  Do the Run board yourself first. Students need ratios (Year 7) and rates (previous lessons).

  The one idea: same kind of quantity, ratio; different units, rate; then interpret the answer in the situation. The common mistake is rounding the wrong way for the context (Ana's mistake).

  Wider: ratios in First Nations string and cordage making (fibre lengths and twisting), taught with local knowledge where you can; radiocarbon dating as a ratio of isotopes.
running:
  - "Predict: ask what units 30 ÷ 12 gives."
  - "Run: ask how many tins, and why."
  - "Investigate: ask Ana whether 2 tins are enough."
  - "Modify: ask which of the problems were ratios."
  - "Make: ask how many 4 L tins, and what is left over."
stuck:
  - see: "A student multiplies area by coverage."
    ask: "What units would that give?"
    fix: "m² ÷ (m² per L) = L: divide."
  - see: "A student uses 4 parts for a 1 : 4 ratio."
    ask: "How many parts altogether?"
    fix: "1 + 4 = 5 parts."
  - see: "A student rounds to the nearest."
    ask: "Is that enough for the job?"
    fix: "Round to suit the situation: up for tins and buses."
stretch: "Plan the paint for your classroom: measure the walls, subtract the windows and door, choose a paint and tin size, and cost it."
support: "A model card: what do I need (units)? Ratio or rate? Calculation. Does the answer fit the situation?"
leads: |
  This starts AC9M8M07.

  Where it leads: checking models and their assumptions (next lesson), and linear models (Linear relations).
exit:
  q: "A recipe uses 2 cups of rice to 3 cups of water. How much water for 5 cups of rice? Is this a ratio or a rate?"
  a: "A ratio (cups to cups): 5 × 1.5 = 7.5 cups of water."
explain: |
  To **model** a problem: say what you need (with units), choose a **ratio** (same kind of quantity) or a **rate** (different units), solve, then **interpret** the answer in the situation.

  Paint comes in whole tins and buses in whole buses: round up when you must have enough.
