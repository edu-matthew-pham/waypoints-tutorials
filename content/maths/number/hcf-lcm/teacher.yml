summary: Students grow two factor trees, sort the primes in a Venn diagram, and find the HCF (shared primes) and LCM (all the primes) of two numbers, then choose between them in context (AC9M7N02, node 3).
time: 45
timing: "Predict and Run 8 min · Investigate 15 min · Modify 10 min · Practise and Make 12 min"
goals:
  - I can find the HCF and LCM of two numbers from their prime factorisations.
  - I can explain why the method works.
  - I can decide whether a problem needs the HCF or the LCM.
struggle: "Deciding whether a problem needs the HCF or the LCM. Ask whether the answer should be smaller than the numbers (sharing) or bigger (lining up again) before any calculation."
before: |
  Do the Run board yourself first. Students need prime factorisation with exponents (previous lesson).

  The one idea: shared primes give the HCF; all the primes, shared ones once, give the LCM. The common mistake is taking the product as the LCM (Zoe's mistake), which counts shared primes twice.

  Listing factors and multiples is a fine check, but this lesson aims at the prime method, which the next unit uses for common denominators.
running:
  - "Predict: students who chose 2 or 3 found a common factor but not the highest."
  - "Run: ask what is in the middle of the diagram, and why it divides both numbers."
  - "Investigate: for the buses, ask what would happen at 6 minutes (the HCF)."
  - "Modify: for the bags, ask how many apples and pears go in each bag."
  - "Make: compare methods; some students list multiples of 6 up to 36."
stuck:
  - see: "A student multiplies the two numbers for the LCM (Zoe's mistake)."
    ask: "Is there a smaller number both divide into?"
    fix: "Count each shared prime once: all the primes, not both lists."
  - see: "A student gives a common factor that is not the highest."
    ask: "Does a bigger number also divide both?"
    fix: "Multiply all the shared primes, not just one."
  - see: "A student cannot tell whether a problem needs the HCF or the LCM."
    ask: "Is the answer smaller than the numbers (sharing out) or bigger (meeting again)?"
    fix: "Sharing into equal groups: HCF. Events lining up: LCM."
stretch: "Check that HCF × LCM = the two numbers multiplied for three pairs. Explain why with the Venn diagram."
support: "Use the board's Venn diagram for every pair, and list factors or multiples as a check."
leads: |
  Next: the fractions unit, where the LCM of two denominators is the lowest common denominator (AC9M7N06).

  Where it leads: simplifying fractions in one step (dividing by the HCF), and algebraic HCFs when factorising.
exit:
  q: "Find the HCF and LCM of 20 and 30."
  a: "20 = 2² × 5 and 30 = 2 × 3 × 5. HCF = 2 × 5 = 10; LCM = 2² × 3 × 5 = 60."
explain: |
  Write both numbers as products of primes: $12 = 2^2 \times 3$ and $18 = 2 \times 3^2$.

  The **HCF** is the product of the primes they **share** (each to its lower power): $2 \times 3 = 6$. The **LCM** is the product of **all** the primes, each shared one counted once (each to its higher power): $2^2 \times 3^2 = 36$. Multiplying the two numbers ($12 \times 18 = 216$) counts the shared primes twice, so it is a common multiple but not usually the lowest.
