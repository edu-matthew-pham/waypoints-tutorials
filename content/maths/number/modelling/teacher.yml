summary: Students model money problems (discounts, rises, markups, profit and sharing) by formulating what is known and unknown, choosing a representation, solving, and interpreting and justifying the answer in dollars (AC9M7N09, nodes 1 to 3).
time: 45
timing: "Predict and Run 8 min · Investigate 12 min · Modify 12 min · Practise and Make 10 min"
goals:
  - I can say what is known and unknown in a money problem and choose how to model it.
  - I can solve problems with fractions, percentages and ratios, including percentages in two steps.
  - I can write my answer in dollars and explain why I chose that representation.
struggle: "Knowing what the percentage is of. Ask 'of which amount?' every time a percentage appears, especially the second one in a two-step problem."
before: |
  Do the Run board yourself first. Students need percentages of amounts (Percentages), sharing in a ratio, and rounding for money.

  Three nodes in one lesson: formulate (known, unknown, representation), solve and interpret in dollars, and justify the choice. The two traps are using the wrong base (profit as a percentage of the selling price, Ben) and adding percentages that are of different amounts (20% then 10% is not 30%).

  Calculators are fine. The estimate comes first, and the answer is written to the cent with units.
running:
  - "Predict: students who chose $140 added 20% and 10%; $150 and $160 are other slips."
  - "Run: ask why 10% of $160 is less than 10% of $200."
  - "Investigate: have students say 'of what?' aloud for each percentage in the jumper and the scarf."
  - "Modify: for the markup then sale, ask whether the final price is more or less than $50, and why."
  - "Make: share the pairs and ask which shop would you prefer, and why."
stuck:
  - see: "A student divides profit by the selling price (Ben's slip)."
    ask: "What did the shop spend, and what is the profit compared with?"
    fix: "Profit as a percentage is out of the cost, the original amount."
  - see: "A student adds 40% and subtracts 20% to get +20%."
    ask: "Is the 20% off of $50 or of the new price?"
    fix: "Do it in steps: × 1.4, then × 0.8."
  - see: "A student gives an answer without units."
    ask: "33.6 what?"
    fix: "Write dollars to the cent: $33.60."
stretch: "A shop marks up its cost by 25%, then offers a 20% sale on the new price. Does it make a profit? Does the shop ever lose money with a 25% markup followed by a bigger sale?"
support: "Use the bar for each step, and write 'of $…' next to every percentage."
leads: |
  Next: Modelling with ratios, with mixes, scale drawings and models in measurement.

  Where it leads: GST, simple and compound interest, profit and loss, and financial literacy in Years 8 to 10.
exit:
  q: "A $80 jacket is marked up 25% then sold at 25% off the new price. Is the final price more than, less than or equal to $80? Work it out."
  a: "80 × 1.25 = 100, then 100 × 0.75 = 75: less than $80."
explain: |
  **Modelling** with money: **formulate** (known, unknown, which representation: fraction, decimal, percentage or ratio), **solve** (estimate, then calculate efficiently), **interpret** and **justify** (the answer in dollars, rounded to the cent, and why that representation).

  A percentage is always *of* something. Profit is a percentage of the **cost**. Percentages of different amounts do not add: 20% off $200 then 10% off the new price is $200 × 0.8 × 0.9 = $144, not 30% off.
