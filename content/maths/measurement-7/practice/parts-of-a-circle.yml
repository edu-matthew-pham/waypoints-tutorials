# Practice for "Parts of a circle".
templates:
  - q: "A circle has radius {r} cm. What is its diameter, in cm?"
    vars: { r: "2..30 by 0.5" }
    answer: "{2 * r}"
    feedback:
      - ["{r / 2}", "The diameter is two radii: double it."]
    explain: "d = 2r = 2 × {r} = {2 * r} cm."
  - q: "A {thing} has diameter {d} cm. What is its radius, in cm?"
    vars: { w: [0, 1, 2, 3], u: "0..10" }
    let: { thing: "w = 0 ? 'bike wheel' : w = 1 ? 'pizza' : w = 2 ? 'clock face' : 'plate'", d: "w = 0 ? 50 + 2 * u : w = 1 ? 20 + 2 * u : w = 2 ? 20 + 3 * u : 18 + u" }
    answer: "{d / 2}"
    feedback:
      - ["{2 * d}", "The radius is half the diameter."]
    explain: "r = d ÷ 2 = {d} ÷ 2 = {d / 2} cm."
  - q: "Two points on a circle of radius {r} cm are joined by a chord. What is the longest the chord can be, in cm?"
    vars: { r: "2..20" }
    answer: "{2 * r}"
    feedback:
      - ["{r}", "The longest chord goes through the centre: the diameter."]
    explain: "The longest chord passes through the centre: it is the diameter, 2 × {r} = {2 * r} cm."
