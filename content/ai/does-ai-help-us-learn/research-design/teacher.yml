summary: "Students find the other differences that could explain a study's result, match tests to claims, and design a fairer study of an AI feature."
time: 40
goals:
  - "I can spot a difference between groups, other than the AI, that could explain a result."
  - "I can choose a test that fits a claim (during, straight after, or weeks later)."
  - "I can design a fair comparison for an AI feature and say what it still couldn't show."
before: |
  Teaching move: take a study apart, then rebuild it.
  The AI-class and worksheet-class table, and the "same tutorial with and without an AI helper" design, are made up. Do not imply a study like this has been done.
  Words used for students: a confounding difference ("a difference that could explain the result instead") and validity ("does the test give good evidence for this claim?").
  Nakamura's October 2026 paper, "Augmentation or Erosion? Regulating Cognitive Offloading in Generative AI-Supported STEM Learning", is a theoretical review (https://doi.org/10.1007/s10648-026-10224-6), now in the Elaborate extension. Its terms are "peripheral" and "constitutive", on a graded continuum; the student text says "on the edge" and "is the skill". Its seven propositions are testable predictions, not experimental findings. Keep it separate from the studies in Unit 2, lessons 1 and 2.
running:
  - "Engage: begin with a result that sounds convincing and ask what was actually compared."
  - "Explore: after the sort, ask which differences a non-AI computer tutor could also provide (instant feedback, more time)."
  - "Explain: separate scores during the lesson, straight after, and weeks later, and other aims such as getting more done."
  - "Elaborate: every design must name at least one thing it still can't show."
  - "Extension: ask what result would prove the 'is the skill / on the edge' prediction wrong."
struggle: "Students may think adding a comparison group automatically isolates the AI, even when the groups differ in other ways."
stuck:
  - see: "A student compares AI only with no help."
    ask: "What is the best way a student could learn this today, without AI?"
    fix: "Compare the same lesson with and without the AI feature, with the same time."
support: "Give a fill-in table: goal, groups, what stays the same, what we measure and when, what we still can't tell."
stretch: "How would students' prior knowledge, school resources or different values change who the result applies to?"
leads: "Unit 3 looks at handing thinking to tools, other tools besides AI, and how help is designed."
exit:
  q: "Why might a real rise in test scores still not settle whether AI helps learning?"
  a: "It depends on what the AI was compared with, what else changed, which test was used and when, and what we value."
explain: |
  A fair study changes one thing and keeps the rest the same. Its test must fit its claim: a quiz during the lesson shows help, a test weeks later shows remembering. Even a good study has limits.
  Don't turn a fair criticism into "research tells us nothing". The aim is to read narrow findings accurately.
