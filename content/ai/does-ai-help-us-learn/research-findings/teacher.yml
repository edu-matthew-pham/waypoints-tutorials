summary: "Confront two genuine studies and teach students to distinguish results, comparisons, outcomes and overclaims."
time: 40
goals:
  - "I can identify comparison conditions and outcome measures in a study."
  - "I can describe accurately what two contrasting AI education studies found."
  - "I can challenge a research claim that goes beyond the observed results."
before: |
  Teaching move: evidence confrontation. Prepare the two original papers or accessible summaries. This lesson uses the published results as of October 2026.
  Bastani et al. (2025), PNAS: https://doi.org/10.1073/pnas.2422633122
  Kestin et al. (2025), Scientific Reports: https://doi.org/10.1038/s41598-025-97652-6
  Avoid suggesting GPT Tutor failed or succeeded outright: its unassisted outcome was statistically indistinguishable from control. Explain why this is not proof of equivalence.
running:
  - "Start from apparently conflicting headlines and ask for the comparison conditions before any verdict."
  - "Have students distinguish assisted practice, immediate post-test, and durable transfer."
  - "Ask which alternative educational tools were not represented by the experiments."
  - "Invite participants to argue for the strongest defensible interpretation of each study."
struggle: "Students often treat a reported gain as an AI-specific effect without recognising that several parts of the instructional package changed."
stuck:
  - see: "A learner says the positive and negative results cancel."
    ask: "Were the students, tasks, comparison conditions and outcomes identical?"
    fix: "Return to the actual methods and isolate each study's measured question."
support: "Provide a two-column comparison for participants, treatment, comparison, measure and conclusion."
stretch: "Ask how the conclusions would change with a high-quality conventional digital tutor or a delayed assessment."
leads: "Lesson 5 investigates metacognitive confidence and how learners judge AI-assisted competence."
exit:
  q: "Can both contrasting studies be credible?"
  a: "Yes. They compared different instructional conditions and outcomes; their findings need not be direct contradictions."
explain: |
  Empirical findings should be accurately represented; open inquiry concerns interpretation and educational value, not invented ambiguity.
