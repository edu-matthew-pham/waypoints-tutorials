summary: "Students sort facts from two real studies, then learn to ask what was compared, what was measured, and whether a claim fits."
time: 40
goals:
  - "I can say what two real studies of AI and learning compared and measured."
  - "I can spot which part of a headline goes further than a study shows."
  - "I can explain why 'not clearly different' is not the same as 'exactly equal'."
before: |
  **Core idea:** Before you believe that help works, ask: measured when, compared with what, and does the claim fit? The minimum path is Mia's spelling helper and an advert. The two real studies (sort, careful reading, what they can claim) are typical; the two careful claims are wider.
  Teaching move: evidence confrontation. The lesson uses the published results as of October 2026; have the papers or summaries ready.
  Bastani et al. (2025), PNAS: https://doi.org/10.1073/pnas.2422633122. Three arms: control (books and notes), GPT Base, GPT Tutor (teacher-designed prompts with hints and safeguards). Both AI arms did better during practice; on the later unassisted exam GPT Base was about 17% below control and GPT Tutor was not statistically distinguishable from control. Do not say GPT Tutor failed or succeeded outright, and explain why "not distinguishable" is not proof of equivalence.
  Kestin et al. (2025), Scientific Reports: https://doi.org/10.1038/s41598-025-97652-6. 194 undergraduate physics students, a crossover design (each student had one topic with the AI tutor and one in an instructor-led active-learning class, order randomised). Immediate post-tests favoured the AI tutor; pace, format and feedback changed together, and long-term learning was not tested. The authors themselves say structured AI tutoring may not beat active learning for "complex synthesis of multiple concepts and higher-order critical thinking": the lessons were first encounters with new material.
  Student text says "plain AI chatbot" for GPT Base and "AI tutor with teacher-written hints" for GPT Tutor.
running:
  - "Engage: start from the two headlines and ask for the comparisons before any verdict."
  - "Explore: the sort is the first look at the methods; go through any fact students placed in the wrong study."
  - "Explain: separate practice scores, a test straight after, and a test weeks later without help."
  - "Ask which other tools neither study compared AI with (a well-designed non-AI computer tutor)."
struggle: "Students often treat a gain as caused by AI when several parts of the teaching changed at once."
stuck:
  - see: "A student says the positive and negative results cancel out."
    ask: "Were the students, the tasks, the comparisons and the tests the same?"
    fix: "Go back to the sort: each study answered a different question."
support: "Give a two-column table: who took part, what each group got, compared with what, what was tested, what we can claim."
stretch: "How would the conclusions change with a strong non-AI computer tutor as a comparison, or a test months later?"
leads: "Unit 2, lesson 2 looks at confidence: do students know how well they are really doing?"
exit:
  q: "Can a study showing AI helps and a study showing AI harms both be trustworthy?"
  a: "Yes. They compared different kinds of help with different groups and tested different things, so their results need not contradict each other."
explain: |
  Ask three questions about any study: compared with what, measured how, and does the claim fit? Study A compared AI with books and notes and tested later without AI. Study B compared an AI tutor with a teacher-led class and tested straight after. They answer different questions.
  Report the real findings accurately; the open part is what they mean and what we value.
