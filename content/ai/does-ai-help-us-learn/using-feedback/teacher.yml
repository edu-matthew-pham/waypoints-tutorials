summary: "Students answer a seasons question, sort feedback by whether it gives a next step, and use the try–feedback–act–try again loop."
time: 40
goals:
  - "I can tell feedback that gives me a next step from feedback that only marks me right or wrong."
  - "I can choose a next step from feedback and explain why it might help."
  - "I can explain why AI feedback is worth checking before I act on it."
before: |
  This lesson is about the learner using feedback (self-regulation), not about comparing tutoring tools again.
  The seasons misconception is an illustration; have a simple diagram of Earth's tilt ready.
  Words used for students: formative feedback (feedback you can use to improve) and self-regulation (choosing your own next step).
  Sources for the feedback claims: Hattie and Timperley (2007), "The power of feedback" (https://doi.org/10.3102/003465430298487): feedback helps most when it tells the learner where they are going, how they are going and what to do next, and much less when it is praise or a grade alone. Black and Wiliam (1998), "Assessment and classroom learning" (https://doi.org/10.1080/0969595980050102): formative assessment, where evidence is used to adjust teaching and learning, can raise achievement.
running:
  - "Engage: question what a convincing correction actually shows."
  - "Explore: everyone answers the seasons question before reading any feedback; the sort then separates next-step feedback from marks and praise."
  - "Explain: teach the loop: try, feedback, act, try again."
  - "Elaborate: ask students to justify a next step and name what would change their plan."
struggle: "Students may think reading a correct explanation is enough to show they have learned."
stuck:
  - see: "A student picks the longest explanation every time."
    ask: "What does the learner already know, and what would show the remaining gap?"
    fix: "Link the feedback to a new try the learner can do."
support: "Give frames: I think I understand..., I will try..., If that fails, I will..."
stretch: "How could wrong AI feedback mislead a student's next step? How would they notice?"
leads: "Unit 4, lesson 2 separates feedback for learning from judging what someone has achieved."
exit:
  q: "How can feedback help you decide what to do next?"
  a: "Use it for a next step, then try again to see if the step helped. Check feedback, including AI feedback, before acting on it."
explain: |
  Feedback is most useful in a loop: try, get feedback, do something with it, try again. A mark or "good try" doesn't tell you what to do next. AI feedback can be wrong, so check it.
sources:
  - { title: "Hattie and Timperley (2007), The power of feedback", url: "https://doi.org/10.3102/003465430298487", checked: 2026-10-18 }
  - { title: "Black and Wiliam (1998), Assessment and classroom learning", url: "https://doi.org/10.1080/0969595980050102", checked: 2026-10-18 }
