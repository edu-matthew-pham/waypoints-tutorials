summary: "Students say how sure they are before checking a new question, compare that with how they did, and look at research on AI and overconfidence."
time: 40
goals:
  - "I can say whether my confidence matched how well I did."
  - "I can explain why feeling sure after reading an explanation is not the same as being able to do it."
  - "I can say what the Fernandes study shows and what it doesn't."
before: |
  **Core idea:** Feeling sure is a guess about yourself; check it with a new try, without help. The minimum path is the student's own confidence check on the board; the Fernandes study is typical.
  Teaching move: check your own confidence against a fresh attempt, then meet a counterexample from research. The board is scripted, not a generative AI system.
  Source: Fernandes et al., Computers in Human Behavior (2026): https://doi.org/10.1016/j.chb.2025.108779. Adults (246 and 452 participants) on AI-assisted logical reasoning tasks. Do not present it as direct evidence about long-term school learning.
  Words used for students: metacognition ("thinking about your own thinking"), confidence that is too high or too low (the research word is calibration), and illusion of competence.
  The optional AI-tool step (typical width) is never needed to finish, and every check can be done without AI. Students use an AI tool only if the school allows it and you say so; check the tool's terms first, since many require users to be 13 or older. The step gives a no-AI version (a partner or a table).
running:
  - "Engage: collect a confidence prediction before any feedback."
  - "Explore: ask students to explain what their new attempt shows and what it misses."
  - "Explain: Tom and Kai are both mismatched, in opposite directions; make sure students see both."
  - "Elaborate: compare the classroom board with the research design and avoid claiming the board proves anything."
  - "Link to choosing what to do next: practise, ask for help, or move on."
struggle: "Students may treat one wrong confidence guess as proof they misunderstand the whole topic."
stuck:
  - see: "A student treats the board as proof that AI causes overconfidence."
    ask: "Was a live AI used here? What comparison would you need?"
    fix: "Call the board a prepared example and go back to the published study."
support: "Use low, medium and high rather than numbers or percentages."
stretch: "Design a better measure: several new questions, and look for both too-high and too-low confidence."
leads: "Unit 2, lesson 3 asks how to design a fairer study of AI and learning."
exit:
  q: "Why might doing well with AI make it harder to know what you can do alone?"
  a: "Some of the thinking came from the tool, so it can feel like you know it. A new try without help shows what you can actually do."
explain: |
  Feeling sure is a guess about yourself. Check it with a new try without help. Your confidence can be too high or too low. When it matches what you can do, you can choose well when to practise and when to move on.
  Some evidence shows overestimation in AI-supported reasoning tasks. Avoid claims about all students or all AI use.
