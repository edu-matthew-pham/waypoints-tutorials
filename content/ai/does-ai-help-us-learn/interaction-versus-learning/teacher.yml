summary: "Students answer one negative-number question, compare four kinds of help with it, then tell visible activity apart from thinking, responsiveness and evidence of learning."
time: 40
goals:
  - "I can tell the difference between what a learner does (clicks, answers) and what they think about."
  - "I can explain how different kinds of help respond to a learner, with or without AI."
  - "I can say what evidence would show that someone learned."
before: |
  All four kinds of help are made up, not captured from real apps or a real AI conversation. The student text names no products.
  If you want real examples, choose ones your students know (quiz games, maths practice sites, tutorial platforms); their features and AI use change often, so treat them as examples, not categories or endorsements. No account or platform is needed.
  Research words behind the four dimensions: behavioural interaction (what you do), cognitive engagement (what you think about), instructional responsiveness (how the help responds), and evidence of learning.
running:
  - "Engage: draw out assumptions about quiz-like activity and learning."
  - "Explore: everyone answers (-3) × (-4) first, then compares the four kinds of help with their own attempt."
  - "Explain: take each dimension separately; ask which help needed no AI to respond to the exact mistake."
  - "Elaborate: change the learner to challenge any simple ranking of the tools."
struggle: "Students may think a chat tool must teach best because it can say the most things."
stuck:
  - see: "A student ranks the kinds of help without naming a learner or goal."
    ask: "Does this learner need speed, an explanation of why, or to explore?"
    fix: "Compare the same help for Learner 1 and Learner 2."
support: "Give a four-column table: what each kind of help makes the learner do, in one sentence."
stretch: "Use the same four dimensions on a writing task: sentence practice, peer feedback and open chat."
leads: "Unit 3, lesson 3 looks at how help could be ordered and reduced as a learner improves."
exit:
  q: "Can a worked example on paper sometimes be better than an interactive quiz?"
  a: "Yes. It depends on the goal, the learner and how learning is checked afterwards."
explain: |
  Clicking a lot is not the same as thinking, and thinking during an activity is not the same as learning. Ask what the help makes you do, how it responds to your mistakes, and what would show you learned. A prepared tutorial can respond to a common mistake without AI.
