inquiry:
  q: "Should school care most about what you can do alone, or what you can do with people and tools?"
  prompts:
    - "Which would matter more in a job? In an exam? In a community project?"
    - "What would we lose if school only valued one of them?"
  notes: "There is no right answer here; this is a question about values. Reward students who can state the other side fairly."
activities:
  - at: investigate
    kind: discussion
    title: "Four learners, four corners"
    minutes: 5
    do: |
      Go to the corner of the learner whose learning you value most: Maya, Jules, Aria or Sam. In your corner, agree on one reason and one thing you still don't know about that learner.
    notes: "Sam's corner may be empty; ask what Sam might have learned anyway, and what evidence would tell us."
  - at: end
    kind: discussion
    title: "Argue the other side"
    minutes: 4
    do: |
      With a partner, each give the best case for the view you disagree with. Then say whether your own view changed, and why.
    notes: "Changing your mind is not the goal. A clearer reason is."
