inquiry:
  q: "Could a study showing benefits and a study showing harms both be trustworthy?"
  prompts:
    - "Who learned, using what help?"
    - "What was actually compared and tested?"
  notes: "Use the actual Bastani and Kestin findings. Avoid treating headlines as conflicting proofs."
activities:
  - at: run
    kind: activity
    title: "Measured when? Compared with what?"
    minutes: 5
    do: |
      In pairs, ask Mia's three questions about her spelling helper: measured when, compared with what, does the claim fit? Then sort the fact cards into Study A (high school maths) and Study B (university physics), and say one thing each study compared.
    notes: "Mia's case is the minimum path; the studies are typical width. Check the comparisons: A compared AI with books and notes; B compared an AI tutor with a teacher-led active class."
  - at: end
    kind: discussion
    title: "Rewrite the headline"
    minutes: 4
    do: |
      Write a headline that is true to one study. Name what was compared and what was tested.
    notes: "A careful headline can report a real result without claiming AI works or fails everywhere."
