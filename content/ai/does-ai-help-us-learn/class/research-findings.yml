inquiry:
  q: "Could a study showing benefits and a study showing harms both be trustworthy?"
  prompts:
    - "Who learned, using what help?"
    - "What was actually compared and tested?"
  notes: "Use the actual Bastani and Kestin findings. Avoid treating headlines as conflicting proofs."
activities:
  - at: run
    kind: activity
    title: "Which study?"
    minutes: 5
    do: |
      In pairs, sort the fact cards into Study A (high school maths) and Study B (university physics). Then say one thing each study compared.
    notes: "Check the comparisons: A compared AI with books and notes; B compared an AI tutor with a teacher-led active class."
  - at: end
    kind: discussion
    title: "Rewrite the headline"
    minutes: 4
    do: |
      Write a headline that is true to one study. Name what was compared and what was tested.
    notes: "A careful headline can report a real result without claiming AI works or fails everywhere."
