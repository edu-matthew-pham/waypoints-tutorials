inquiry:
  q: "Can AI assistance help someone learn while making their achievement harder to judge?"
  prompts:
    - "What is the intended capability?"
    - "Who benefits from and who is challenged by the decision?"
  notes: "Students need not agree. Distinguish facts, predictions and educational values."
activities:
  - at: run
    kind: discussion
    title: "Rank what school is for"
    minutes: 5
    do: |
      Rank four things school could value: doing it yourself, making useful things with tools, working well with others, making good choices. Compare with a partner and find your biggest difference.
    notes: "Disagreement here is about values; ask each pair to state the other's top choice fairly."
  - at: end
    kind: discussion
    title: "Return to the course question"
    minutes: 6
    do: |
      Does AI help us learn? Offer a conditional claim, one piece of evidence (a learner from the course, or a research finding), one strong objection, and what might change your mind.
    notes: "A spoken discussion is sufficient; a formal final submission is an optional teacher decision."
  - at: end
    kind: discussion
    title: "Our class agreement: AI and homework"
    minutes: 10
    do: |
      When should our class use AI for homework? In groups, draft three rules: one "yes, when…", one "no, when…", and one "always check…". Share and combine them into one class agreement.
    notes: "Optional, for a longer lesson or the next one. Tie each rule to the course: the goal of the task (Unit 1), evidence (Unit 2), what thinking to keep (Unit 3). The agreement sits inside the school's own AI rules; it can be posted and revisited at the end of term."
