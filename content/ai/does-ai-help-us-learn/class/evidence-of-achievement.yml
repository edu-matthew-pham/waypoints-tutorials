inquiry:
  q: "Should a test judge what you can do alone, what you can do with tools, or both?"
  prompts:
    - "Which would a future employer care about?"
    - "Is it fair to ban a tool people use every day?"
  notes: "It depends on what the assessment is meant to show. Different goals need different evidence."
activities:
  - at: run
    kind: activity
    title: "Match the evidence to the goal"
    minutes: 6
    do: |
      Goal 1: can judge evidence without help. Goal 2: can run a good investigation using tools. Sort these: a decision log, an unseen question in class, a polished report, a spoken explanation.
    notes: "Some evidence fits both goals. The polished report alone fits neither well; ask what would need to go with it."
  - at: end
    kind: discussion
    title: "Design a fair task"
    minutes: 4
    do: |
      Suggest one assessment for this unit that allows AI and still shows what you learned. What would you ask students to hand in alongside the work?
    notes: "Look for process evidence: drafts, decisions, a short spoken check."
  - at: investigate
    kind: discussion
    title: "Where do you stand? Talking to an AI about your work"
    minutes: 7
    do: |
      Stand on a line from "strongly agree" to "strongly disagree": "A locked conversation with an AI about my work is a fair way to show what I learned." Explain your spot to someone nearby, then listen to someone far from you.
    notes: "Raise if nobody does: nervous students, students still learning English, what happens to the recording, whether a teacher can read and overrule the judgement. Students may move after hearing a reason; ask what moved them. No phones needed; on paper, mark a spot on a printed line."
