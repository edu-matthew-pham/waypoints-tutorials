summary: "Students follow one question through a made-up AI helper (sent, stored, reviewed, trained on) and change its settings. Typical: the OAIC says a quiet policy update is generally not enough to train on existing data. Wider: the draft Children's Online Privacy Code."
time: 35
goals:
  - "I can explain where a chat with an AI app can go: sent, stored, reviewed, trained on."
  - "I can find and change the settings about history and training."
  - "I can leave out personal details a question doesn't need."
before: |
  **Core idea:** your chat can be kept, read and learned from; check settings and leave out what isn't needed. Kind: makes new content.
  **The board** (`consent` widget, mode trace) is made up: Club Helper, an AI feature in the Coding Club app from How computers work › Cyber safety and privacy. Its stages and defaults (training on, history on, 30-day deletion with history off, some chats reviewed for safety) are modelled on common patterns in real AI apps, not copied from any one company. Platform-agnostic by design (decision, 18 Oct 2026).
  Link to Cyber safety and privacy › Your digital footprint (8P14) for the footprint, and › The Australian Privacy Principles (10P14) for the APPs; this lesson doesn't re-teach them.
  Optional, for teachers: show one real company's data-controls page and **write the date you checked it on the slide**; these pages change often.
  **Re-check after 10 Dec 2026:** whether the Children's Online Privacy Code was registered, and what the final version says.
  Sources (checked 18 Oct 2026, research brief claims 3 and 5):
  - OAIC, guidance on privacy and developing and training generative AI models (21 Oct 2024): "updating a privacy policy or providing notice by themselves will generally not be sufficient". https://www.oaic.gov.au/privacy/privacy-guidance-for-organisations-and-government-agencies/guidance-on-privacy-and-developing-and-training-generative-ai-models
  - OAIC, Children's Online Privacy Code page (updated 5 Aug 2026): "The final Code must be registered by 10 December 2026." Draft: collect only what is strictly necessary; age-appropriate notices. https://www.oaic.gov.au/privacy/privacy-registers/privacy-codes/childrens-online-privacy-code
  "Once learned from, it can't easily be taken back out" is a simplification: removing specific data from a trained model ("unlearning") is an open research problem.
  Idea credit: Experience AI's "Your data and AI" (CC BY-NC-ND, use as-is or link) is an optional extra.
running:
  - "Engage: lock in where the question goes."
  - "Explore: open each stage together; pause on 'reviewed' and 'training'."
  - "Explain: the three checks."
struggle: "Students think closing an app deletes what they typed."
stuck:
  - see: "A student turns off history and thinks training is off too."
    ask: "Which switch is about improving the AI?"
    fix: "They're separate switches; check both."
support: "Give the five stages as a strip of cards with the two switches beside them."
stretch: "Design the settings page for a school AI helper. What starts on, what starts off, and why?"
leads: "Lesson 6: reading a consent screen."
exit:
  q: "Name one thing to check, and one thing to leave out, before typing into an AI app."
  a: "Check whether 'use my chats to train the AI' is on; leave out personal details like your full name and school."
explain: |
  1. A chat is sent to the company and stored.
  2. Some chats may be read by people.
  3. With training on, the AI may learn from it, and that can't easily be undone.
  4. Leave out what isn't needed, and check the settings.
