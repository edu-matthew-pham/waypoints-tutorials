summary: "A made-up, non-sexual case: a fake video of a classmate shared in a group chat. A fake can hurt even when known to be fake; the key question is consent; bystanders don't share, support, tell and report. Typical: shared responsibility. Wider: when a fake is a crime. FLAGGED for wellbeing review."
time: 35
goals:
  - "I can explain why a fake about a real person can hurt even when people know it's fake."
  - "I can name four things a bystander can do: don't share, support, tell, report."
  - "I can say where to report a fake and where to get help."
before: |
  **⚑ Flagged for review with the school's wellbeing lead before teaching** (decision, 18 Oct 2026). Share this lesson and these notes; agree the support pathway, the school's own reporting process and any local wording first. Align with your school's bullying policy.
  **Ground rules:** teacher-led by default. The case is made up and non-sexual on purpose. **Never ask students whether this has happened to them or to anyone they know**, and don't ask for examples. Some students may have been targeted; watch for distress and follow up privately. Have support ready: the wellbeing team; Kids Helpline (1800 55 1800, kidshelpline.com.au; check the number is current); eSafety (esafety.gov.au/report).
  **Teacher notes only, not for students:** eSafety reported that reports of altered intimate images of under-18s more than doubled in 18 months, and that about four in five involved girls (media release, page undated, probably June 2025; research brief claim 12, https://esafety.gov.au/newsroom/media-releases/esafety-urges-schools-to-report-deepfakes-as-numbers-double). eSafety has a guide for schools on responding to image-based abuse involving deepfakes (March 2026): https://www.esafety.gov.au/sites/default/files/2026-03/Respond-Guide-to-responding-to-image-based-abuse-involving-AI-deepfakes.pdf (found 18 Oct 2026, not yet read for this course). Read your state's law too (for example NSW's new deepfake law; see the NSW Department of Education's page for parents) before discussing legal details.
  **Wider step source** (checked 18 Oct 2026): eSafety Youth Council, The Digital Landscape: deepfakes (March 2026): deepfakes can "spread lies, embarrass people"; "explicit deepfakes are illegal"; report at eSafety.gov.au/report; Kids Helpline listed. https://www.esafety.gov.au/sites/default/files/2026-03/YC-TheDigitalLandscape-March26-deepfakes_0.pdf
  **Core idea:** consent, not realism; bystander moves. Kind: makes new content.
  Idea credit: Common Sense's "Deepfakes & Consent" (Grade 8; link only) is optional teacher background.
running:
  - "Engage: 'just a joke'? Take answers without names or stories."
  - "Explore: sort the bystander actions; pause on 'forward it to ask if it's fake' (it spreads it)."
  - "Explain: the consent question and the support slide."
struggle: "Students separate 'fake' from 'harmful'. The lesson ties harm to consent and being laughed at, not to belief."
stuck:
  - see: "A student says it's fine because it's obviously fake."
    ask: "How would Kai feel when the year group laughs at it?"
    fix: "The harm is being shown and laughed at without agreeing."
  - see: "A student starts telling a real story."
    ask: "(Gently) Let's keep to Kai; you can tell me after class."
    fix: "Follow up privately and with the wellbeing team."
support: "Give the four moves as a card: don't share, support, tell, report."
stretch: "Write the reporting steps an app should offer someone who finds a fake of themselves."
leads: "Lesson 10: voice clones that pretend to be family."
exit:
  q: "What are four things you can do if you see a fake about someone you know?"
  a: "Don't share it, support the person, tell an adult you trust, and report it."
explain: |
  1. A fake about a real person can hurt even when everyone knows it's fake.
  2. The key question is consent: did they agree?
  3. Bystanders: don't share, support, tell, report.
  4. Report in the app, and serious cases to eSafety (esafety.gov.au/report). Get help from an adult you trust or Kids Helpline.
