inquiry:
  q: "If a school can't catch AI use, is there any point having rules about it?"
  prompts:
    - "Do rules only work when people can be caught?"
    - "What else makes people follow a rule?"
  notes: "Many rules work mostly through understanding and habit. Push students towards what makes a rule followable: tasks, honesty, reasons."
activities:
  - at: run
    kind: activity
    title: "Our real policy"
    minutes: 8
    do: |
      Read our school's AI policy (or the policy AI sits in). Which of the six parts does it cover?
      Does it cover staff? Does it rely on catching people?
    notes: "Printed and dated. Frame it as improving a draft, not criticising its authors."
  - at: end
    kind: discussion
    title: "Version 1"
    minutes: 5
    do: |
      Agree one class version 1. Which line are we least sure of? That's the one to watch.
staff:
  notes: "For staff, version 1 is often the school's existing policy. Start there."
  activities:
    - title: "Map the existing policy"
      minutes: 15
      do: "Sort the school's current policy lines into the six parts. Which are missing? Which cover staff use (planning, feedback, reports)?"
    - title: "Catching or working?"
      minutes: 10
      do: "Mark each line: does it rely on detecting AI use, or does it work through task design and honest acknowledgement? Note the detection lines for lesson 11."
