summary: "Students learn how a policy differs from a charter, sort Westbrook's draft lines into the parts of a policy, and write a short, broad version 1 for students and staff that is honest about what can't be policed and says how it will be refined."
time: 45
goals:
  - "I can explain how a policy differs from a charter."
  - "I can write a short first policy that covers students and staff."
  - "I can explain why a policy that relies on catching AI use mostly fails."
before: |
  **Core idea:** a charter says what matters; a policy says what happens, for students and staff. A first policy can be broad if it says how and when it will be refined. Schools can't police most AI use, so a workable policy relies on task design, honesty about use, and understanding, not detection; "check" means checking the policy works.
  Westbrook's draft lines are made up. The honesty line ("saying so is never in itself a reason for a lower mark") is deliberate: it's what lets a policy work without catching people. A teacher may still mark down work where AI did the thinking the task was for; the point is that owning up isn't the offence.
  **Detection (for your own background; keep product names out of student text):** OpenAI withdrew its own AI text classifier on 20 July 2023 "due to its low rate of accuracy" (it caught about 26% of AI-written text and wrongly flagged about 9% of human text). Liang and colleagues (2023) found popular detectors flagged over half of a set of 91 human-written TOEFL essays as AI-generated (average false positive rate 61%), while doing well on US Year 8 essays. Detectors change, but the burden falls hardest on students writing in a second language. Checked 18 Oct 2026; sources below.
  Policy built on current limits ("AI can't do maths") breaks when capability shifts; lesson 11 develops this.
  **For the class plan:** bring the school's real AI policy (or the policy AI sits in, such as academic integrity or ICT acceptable use), printed and dated. The committee proposes; leadership decides. Unit 4's last lesson refines version 1 into version 2.
running:
  - "Engage: 'No AI, ever'. Who does it catch?"
  - "Explore: sort the draft lines; each student writes version 1."
  - "Explain: charter vs policy; 'check' means checking it works."
  - "Evaluate: version 1 on paper; keep it for lesson 11."
struggle: "Students reach for enforcement: detectors, bans, punishments. Ask what happens at home, and who a detector would wrongly accuse."
stuck:
  - see: "A draft is all bans and punishments."
    ask: "How would a teacher know? Who would it wrongly catch?"
    fix: "Swap a ban for a task-design or honesty line."
  - see: "A student says the policy is only for students."
    ask: "Do teachers use AI? For what?"
    fix: "Add a line for staff use."
support: "Give the six parts as a table with one example line each."
stretch: "Write the one line of version 1 you expect to change most by the end of the course, and why."
leads: "Units 2 and 3 produce the evidence; lesson 11 refines version 1."
exit:
  q: "Why does a policy that relies on catching AI use mostly fail?"
  a: "Schools can't see home use and detectors are unreliable, so it punishes honest students and teaches others to hide it."
explain: |
  1. A charter says what matters; a policy says what happens.
  2. A policy covers students and staff.
  3. A first policy can be broad, if it says how it will be refined.
  4. Most AI use can't be policed, so check that the policy works, not each student.
sources:
  - { title: "OpenAI, New AI classifier for indicating AI-written text (update note, 20 July 2023)", url: "https://openai.com/index/new-ai-classifier-for-indicating-ai-written-text", checked: 2026-10-18 }
  - { title: "Liang, Yuksekgonul, Mao, Wu and Zou (2023), GPT detectors are biased against non-native English writers", url: "https://arxiv.org/abs/2304.02819", checked: 2026-10-18 }
