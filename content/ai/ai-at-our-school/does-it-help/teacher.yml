summary: "Students read StudyPal's (made-up) pitch and its one small study like a committee: name the problem, the kind of AI and what the evidence does and doesn't show, then plan a small fair trial measuring learning without the tool, later."
time: 45
goals:
  - "I can ask what problem a tool solves before asking if it's good."
  - "I can tell evidence that a task got done from evidence of learning."
  - "I can plan a small fair trial: compared with what, measured when, without the tool."
before: |
  **Core idea:** before trust, decide what problem you're solving and whether the evidence shows learning (compared with what, measured when, without the tool, and who chose to use it).
  StudyPal is made up; its pitch, study, privacy page, settings and terms run through lessons 4 to 6.
  **For the class plan (a real tool, dated):** if the committee has a real proposal, gather the vendor's description and claims from its own pages and date them. Don't make student accounts.
  **Worked example for teachers (illustrative, not a recommendation; checked 18 Oct 2026):** Microsoft's support page for the Study and Learn agent in Microsoft 365 Copilot says it's designed so the learner does the thinking and the agent coaches them, with flashcards, quizzes and writing support. It's for education users aged 13 and over with a Microsoft 365 Education licence, and IT admins must turn Copilot Chat on for 13 to 17 year olds. Which charter principles does it test? Learning first (does coaching beat a well-prompted general assistant, and does learning last?), age and stage (13+ leaves some Year 7s out), fair for everyone. The page states no learning evidence of its own: that's the question for a trial. Re-check before use.
  The trial checklist in [Choosing AI tools for learning](../../../../choosing-ai-tools/) is the teacher version of this lesson.
running:
  - "Engage: read the pitch aloud; vote on '30% higher'."
  - "Explore: sort the study facts in pairs; each student plans a trial."
  - "Explain: the four questions; apply them to the maths teachers' real problem."
  - "Evaluate: recommendation part 1 on paper."
struggle: "Students accept numbers in ads. Ask 'compared with what, measured when?' every time, and let them find the gaps themselves."
stuck:
  - see: "A student says the study proves StudyPal works."
    ask: "Could a student copy every answer and still score higher on that homework?"
    fix: "Then the score shows the task got done, not learning."
  - see: "A trial plan has no comparison."
    ask: "Higher than what?"
    fix: "Add a class doing the same work without StudyPal, or with the usual help."
support: "Give the trial frame with blanks: Compare ___ with ___; ___ students for ___ weeks; measure ___ without the app, ___ weeks later."
stretch: "Find a real education ad (teacher-chosen) and list which of the four questions its evidence answers."
leads: "Lesson 5: StudyPal's privacy page, settings and terms, and who it affects."
exit:
  q: "Why aren't higher homework scores while using StudyPal evidence that it helps learning?"
  a: "The app helped finish the homework; learning shows up later, on a task without it, compared with students who didn't use it."
explain: |
  1. Name the problem first.
  2. Name the kind of AI.
  3. Ask whether the evidence shows learning: compared with what, measured when, without the tool?
  4. If the evidence is thin, plan a small fair trial.
sources:
  - { title: "Study and Learn agent overview (Microsoft Support)", url: "https://support.microsoft.com/education/study-learn-agent", checked: 2026-10-18 }
