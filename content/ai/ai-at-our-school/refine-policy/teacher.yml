summary: "Students refine Westbrook's version 1 policy using evidence from Units 2 and 3: sort draft lines into too vague, about right and too prescribed, move fast-changing detail into guidelines or task instructions, and rewrite lines that rely on catching people. The product is a version 2 policy proposal."
time: 50
goals:
  - "I can tell a policy line that is too vague from one that is too prescribed."
  - "I can put detail in the right layer: policy, guidelines or task instructions."
  - "I can rewrite a policy line that relies on catching people so it works without it."
before: |
  **Core idea:** version 2 gets specific where the evidence says so, and no more. Fast-changing detail goes in guidelines (termly) or task instructions (per task), so the policy stays stable. A school can't police most AI use, so a workable policy relies on task design, honest acknowledgement and understanding, keeps enforcement for clear cases, and checks that it works.
  This lesson draws on students' version 1 (lesson 4) and the products of Units 2 and 3. Students who skipped those units can use the Westbrook examples in the models.
  **Detection (keep product names out of student text; checked 18 Oct 2026):** OpenAI withdrew its AI text classifier on 20 July 2023 for "its low rate of accuracy". Liang and colleagues (2023) found detectors flagged over half of 91 human-written TOEFL essays as AI-generated (average false positive rate 61%). The student text states both without names. Detectors change; the point is that a detector score isn't evidence a policy should act on alone.
  The "task instructions" layer is where many schools use an AI-use scale (levels of AI allowed per task). If your school has one, show it here as an example of that layer; don't name it as the course's recommendation.
  **For the class plan:** the committee's real proposal goes to whoever owns the policy (often leadership or a policy committee), dated, with its evidence. Proposals are advice; the school decides.
running:
  - "Engage: 'list every app'. What happens in a month?"
  - "Explore: sort the draft; each student rewrites one line with its evidence."
  - "Explain: the three layers; then sort catching vs working."
  - "Evaluate: version 2 on paper; collect the four products."
struggle: "Students swing from vague to listing everything. Keep asking: will this line still be true next term? If not, which layer does it belong in?"
stuck:
  - see: "A version 2 line names a specific app or version."
    ask: "Will that be true next term?"
    fix: "Write the principle in the policy; put the app in the guideline."
  - see: "A student's fix for cheating is a detector."
    ask: "Who would it wrongly flag? What can it see at home?"
    fix: "Change the task so the thinking is visible, and reward honesty."
support: "Give three version 1 lines and the evidence for each; students choose the layer and rewrite."
stretch: "Write the matching guideline for one version 2 line: what it says this term, and who updates it."
leads: "The course ends with four products. Send them, dated, to whoever owns the school's AI policy, and set the committee's next review date (lesson 10)."
exit:
  q: "Why shouldn't a school's AI policy list every approved app?"
  a: "Apps change every term, so the policy would always be out of date; the list belongs in a guideline the policy points to."
explain: |
  1. Too vague can't decide; too prescribed goes out of date.
  2. Policy, guidelines and task instructions change at different speeds.
  3. Most AI use can't be policed, so design tasks, reward honesty, and check the policy works.
sources:
  - { title: "OpenAI, New AI classifier for indicating AI-written text (update note, 20 July 2023)", url: "https://openai.com/index/new-ai-classifier-for-indicating-ai-written-text", checked: 2026-10-18 }
  - { title: "Liang, Yuksekgonul, Mao, Wu and Zou (2023), GPT detectors are biased against non-native English writers", url: "https://arxiv.org/abs/2304.02819", checked: 2026-10-18 }
  - { title: "The Australian Framework for Generative AI in Schools (Department of Education)", url: "https://www.education.gov.au/schooling/announcements/australian-framework-generative-artificial-intelligence-ai-schools", checked: 2026-10-18 }
