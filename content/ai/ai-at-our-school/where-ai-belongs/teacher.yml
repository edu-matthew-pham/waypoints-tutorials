summary: "Students see that AI changes how existing rules apply. They sort AI situations into the policy that should own each one (integrity, behaviour, privacy, inclusion, devices, staff conduct) and write a short AI statement (principles, a map of where each rule lives, who holds it, when it's reviewed) instead of one big AI rulebook."
time: 45
goals:
  - "I can say which existing school policy should own an AI situation."
  - "I can write a short AI statement that points to other policies instead of repeating them."
  - "I can explain why someone has to hold the map, and why most AI use can't be policed."
before: |
  **Core idea:** AI changes how existing rules apply, so its rules mostly belong inside the policies that already own each situation. A short AI statement holds the principles, the map, who holds it and when it's reviewed. Overreach test: if an existing policy owns the situation, the rule goes there and the statement points to it. Risk: without someone holding the map, scattered AI lines drift apart.
  Westbrook's six policies are made up; real schools name them differently (ICT acceptable use, assessment, child safety, privacy collection notice, learning support). Adjustments for students with disability are a legal duty as well as a fairness principle: an AI rule must not quietly remove them. For deepfakes and other harm, follow your school's wellbeing and child safety procedures; keep class discussion general.
  **Policing (background; product names out of student text):** OpenAI withdrew its AI text classifier on 20 July 2023 "due to its low rate of accuracy". Liang and colleagues (2023) found detectors flagged over half of 91 human-written TOEFL essays as AI-generated (average false positive rate 61%). Rules built on detection mostly catch the honest and wrongly flag second-language writers.
  **Rules from outside (checked 19 Oct 2026):** **IB Academic integrity policy, Appendix 6 (AI tools; added March 2023; read 19 Oct 2026):** the IB "will not ban the use of AI software" and aims to avoid the detector "arms race": detectors are not yet reliable enough to be "the sole evidence of academic misconduct"; better that "students can speak about their work with their teachers". AI-produced work, "even only in part", is not the student's own: copied or paraphrased AI text, images or graphs must be credited in the body (quotation marks, in the school's referencing style, with **the prompt and the date**) and in the bibliography; otherwise it's misconduct. Authentication rests on process: the teacher has seen the work develop over time, the student can explain it, referencing is clear, quality fits the student. **It is the school's decision**, under its own academic integrity policy, how to deal with work that isn't the student's own; the IB only requires that such work isn't submitted. Language acquisition is an exception (language and translation tools not permitted); software for access and inclusion requirements is considered under the IB's Access and inclusion policy. It also says to teach integrity through discussion, and that discussing ethical AI use is "a great classroom exercise". This fits the map: the IB sets what counts as the student's own work and how to cite AI; the school's integrity policy owns the consequences; inclusion owns access arrangements; language subjects need their own AI line. The ACT BSSS Teacher Guide on AI and Academic Integrity (2023) says "the unattributed or disallowed use of AI in assessment is a breach of academic integrity", that teachers decide acceptable AI use for each task, that students declare permitted use, and warns "Don't rely solely on AI plagiarism detectors". Check for newer versions before teaching.
  **For the class plan:** bring a list of the school's policies (titles, owners, review dates), dated. The committee maps and proposes; each policy's owner decides its wording.
running:
  - "Engage: the fake image. Which rules already cover it?"
  - "Explore: sort the seven situations; each student writes a short statement."
  - "Explain: the twelve-page problem; a statement and a map, and who holds it."
  - "Evaluate: statement and map on paper; keep them for lesson 11."
struggle: "Students want the AI statement to cover everything. Ask, for each rule, whether another policy already owns that situation."
stuck:
  - see: "Every situation goes into 'a new AI policy'."
    ask: "If this happened without AI, which rule would cover it?"
    fix: "That policy owns it; add an AI line there."
  - see: "A student's statement is all bans and detection."
    ask: "How would a teacher know? Who would it wrongly catch?"
    fix: "Point to integrity for assessed work, and rely on task design and honesty."
support: "Give the six policy names as cards; students place each situation, then explain one."
stretch: "Find a situation that two policies could both claim (an AI deepfake in an assessed media task). Who should own it, and how does the map show it?"
leads: "Units 2 and 3 produce evidence; lesson 11 refines the AI lines and the map."
exit:
  q: "Why shouldn't a school's AI statement repeat the rules about bullying or cheating?"
  a: "Those policies already own them; two versions will drift apart, so the statement points to them instead."
explain: |
  1. AI changes how existing rules apply.
  2. Each AI rule lives in the policy that owns that situation.
  3. A short AI statement holds the principles, the map, who holds it, and the review date.
  4. Most AI use can't be policed, so check the rules work, not each student.
