summary: "Jobs as bundles of tasks: exposed is not lost, augment versus automate, no widespread displacement yet in Australia (JSA 2025). Typical: call-centre novices gained most. Wider: the contested junior-jobs evidence."
time: 40
goals:
  - "I can split a job into tasks and say which AI could do, help with, or not do."
  - "I can explain the difference between a job being exposed to AI and being lost to AI."
  - "I can explain augment and automate."
before: |
  **Core idea:** AI changes tasks before whole jobs; exposed is not lost. Kind: mostly generative AI, plus predictive tools.
  **Re-check each January** (Jobs and Skills Australia updates; the Stanford paper is revised as data arrive).
  Sources (checked 18 Oct 2026, research brief claims 62–66):
  - ILO (2023): generative AI "likely to augment rather than automate jobs". https://www.ilo.org/publications/generative-ai-and-jobs-global-analysis-potential-effects-job-quantity-and. Refined in 2025: about 1 in 4 workers in an occupation with some exposure, 3.3% in the highest tier; women more exposed (clerical work).
  - Jobs and Skills Australia (14 Aug 2025): far more augmentation than automation; about 4% of the workforce in high-automation-exposure jobs; "no current evidence of widespread displacement in Australia". https://www.jobsandskills.gov.au/download/19803/our-gen-ai-transition-implications-work-and-skills/3364/our-gen-ai-transition/pdf
  - Brynjolfsson, Li and Raymond (QJE 2025), abstract: productivity +14% on average, +34% for novices. https://www.nber.org/papers/w31161
  - Stanford Digital Economy Lab, "Canaries in the coal mine" (rev. Aug 2026): US workers aged 22–25 in the most exposed jobs about 19% below trend; descriptive, not causal. https://digitaleconomy.stanford.edu/publications/canaries-in-the-coal-mine/
  - Yale Budget Lab (1 Oct 2025): no discernible economy-wide disruption. https://budgetlab.yale.edu/research/evaluating-impact-ai-labor-market-current-state-affairs
  Headline exposure figures range from about 25% to 60% depending on the method (ILO, IMF); keep away from single scary numbers.
  Some students have parents in jobs often named as exposed (admin, call centres, design). Keep it about tasks, not about anyone's family.
  The office-worker sort's answers are judgements about "right now", not facts; accept reasoned alternatives.
  Idea credit: Day of AI Grade 7 "Human Skills in an AI World" (dayofai.org) is an optional class extra; Code.org's "Ethics & AI: Privacy & the Future of Work" video can be shown as-is.
running:
  - "Engage: ask what 'exposed' means before revealing."
  - "Explore: the sort; accept reasoned disagreement about 'help' versus 'do'."
  - "Explain: augment versus automate on the board."
struggle: "Students hear 'AI will take jobs' as settled fact. The evidence so far is mostly about tasks changing."
stuck:
  - see: "A student says exposed jobs will disappear."
    ask: "Which tasks in the office job could AI do, and which still need a person?"
    fix: "Exposed means some tasks; the job changes rather than vanishes, at least so far."
  - see: "A student argues about a sort answer."
    ask: "What would AI need to be able to do for your answer to be right?"
    fix: "Accept it if the reason is sound; the categories are judgements."
support: "Give the three task columns with one example task already in each."
stretch: "Pick a job that didn't exist 20 years ago. What new jobs might AI create?"
leads: "Lesson 10: making rules about AI."
exit:
  q: "What's the difference between a job being exposed to AI and being lost to AI?"
  a: "Exposed means AI could do or help with some tasks; lost means the job is gone. So far, AI is mostly changing tasks, not removing whole jobs."
explain: |
  1. A job is many tasks.
  2. AI can do some, help with some, and can't do others.
  3. Exposed means some tasks could change; it doesn't mean the job is lost.
  4. So far: far more augmenting than automating, and no widespread job loss in Australia.
