summary: "Students build the course lens (who gains, who loses, who decides, what's the catch) on AI breast screening in Sweden, a real benefit with a catch."
time: 35
goals:
  - "I can use four questions to judge any system: who gains, who loses, who decides, and what's the catch."
  - "I can say what a study about AI showed, and what it didn't."
  - "I can explain why a helpful AI still needs the question 'who was it tested on?'."
before: |
  **Core idea:** the lens. Every later lesson uses the same four questions, so make it visible (a poster, or four boxes on the board).
  Kind of AI: predict or sort (classifiers trained on labelled scans).
  Sources (checked 18 Oct 2026, research brief claims 67–70):
  - MASAI trial, Lancet Oncology 2023 (abstract via Lund University): screen-reading workload reduced by 44.3% with AI, without more false positives. https://lup.lub.lu.se/record/be033994-ed89-4a99-904a-f6e97b3d2b21. A 2026 Lancet paper reports fewer interval cancers (only the Lund summary was read; not in student text).
  - Charles Sturt University, 11 Sep 2026: AI should complement, not replace, specialists in melanoma detection (dermatologists about 97%, AI about 81% in that study). https://news.csu.edu.au/latest-news/ai-no-match-for-skin-cancer-specialists-in-detecting-melanomas
  - ECMWF, Feb 2025: its AI model outperforms physics-based models on many measures. https://www.ecmwf.int/node/29308
  - Bureau of Meteorology AI transparency statement (2 Mar 2026): "We do not use neural network systems". https://www.bom.gov.au/sites/default/files/2026-03/artificial-intelligence-ai-transparency-statement-2026.pdf
  The breast-screening case is about health but not about any student personally; keep it at the level of systems. Some students may have family members affected by cancer: keep it calm and factual.
  Idea credit: the lens is our own, in the spirit of the Ethical Matrix (Payne, MIT Media Lab, 2019) and the Digital Technologies Hub's "Systems thinking and AI applications" (CC BY 4.0), which uses several Australian AI cases. Both are optional teacher background.
running:
  - "Engage: list everyone affected on the board before showing the lens."
  - "Explore: sort the facts into the four boxes; the headline check is the first 'what did it really show?' of the course."
  - "Explain: 'who was it tested on?' links back to bias in AI Foundations › Why does AI make mistakes?"
struggle: "Students tend to see a benefit as having no catch, or a catch as cancelling the benefit. The lens keeps both."
stuck:
  - see: "A student says the catch means the AI doesn't work."
    ask: "What did the study find, and what didn't it test?"
    fix: "The result is real for that study; the catch is about where else it applies."
  - see: "A student puts 'the health service' under who gains."
    ask: "Which question is about choosing whether to use it?"
    fix: "It may gain too, but its role in the lens is deciding."
support: "Give the four boxes as a printed table with one item already placed in each."
stretch: "Who is missing from the lens for breast screening? (Families, taxpayers, the company that made the AI.)"
leads: "Lesson 3 uses the lens on a system that made decisions about students: the 2020 exam grades."
exit:
  q: "Name the four lens questions."
  a: "Who gains? Who loses, or could be harmed? Who decides? What's the catch?"
explain: |
  Use four questions on any system:
  1. Who gains?
  2. Who loses, or could be harmed?
  3. Who decides whether it is used?
  4. What's the catch: what don't we know yet?
  A helpful AI needs the lens too: ask who it was tested on.
