summary: "Train and test a genuine tiny neural network without teaching the mathematics."
time: 30
goals:
  - "I can explain that training changes a network's connections and testing does not."
  - "I can explain why changing examples can change learned predictions."
  - "I can say how a chatbot is like this tiny network, and how it is different."
before: |
  The board uses a small genuine 2-2-1 sigmoid neural network with backpropagation.
  It sees only colour and shape, not photographs. No account or online model is needed.
  The lesson ends by linking back to Unit 1: chatbots are very large neural networks trained to predict the next word.
  Optional extension, with school approval: train an image model in Teachable Machine (https://teachablemachine.withgoogle.com/) and test photos not used in training. An image model processes much richer information than two hand-chosen clues; neither guarantees correct predictions.
running:
  - "Have students record a prediction before training."
  - "Reset the network whenever comparing training datasets."
  - "Ask what changed internally and what stayed the same."
struggle: "Students may think testing a new fruit automatically retrains the model."
stuck:
  - see: "Student assumes an output label proves the model is right."
    ask: "What examples did it learn from? Does testing change the connections?"
    fix: "Compare predictions before and after training on a reset network."
support: "Start with all examples and compare one fruit before and after 100 training steps."
stretch: "Show optional connection numbers; ask why they are not percentages."
leads: "Unit 3 turns to talking with AI: writing a clear request, then following up."
exit:
  q: "What changes during training, and what happens during testing?"
  a: "Training updates network parameters using labelled examples; testing uses them without updating."
explain: |
  This model has two input features, two hidden neurons and one output.
  Training genuinely changes weights using an error-based adjustment.
  The toy data is intentionally limited and is not a realistic image-recognition task.
