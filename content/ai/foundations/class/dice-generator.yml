inquiry:
  q: "Is a generator that always picks the most common word better than one that rolls a die?"
  prompts:
    - "Better at what: being right, or sounding like real writing?"
    - "What would a whole story look like if it always picked 'mat'?"
  notes: "There is no single answer. Always picking the top word is predictable and repetitive; sampling gives variety but sometimes unlikely words. Real systems tune this trade-off."
activities:
  - at: predict
    kind: discussion
    title: "Three, two, one"
    minutes: 3
    do: |
      Three faces say 'mat', two 'chair', one 'roof'. Show with fingers how many of six rolls you expect to be 'mat'. Then: could all six be 'roof'?
    notes: "Collect the finger counts. Most will say three; push on whether three is guaranteed."
  - at: run
    kind: activity
    title: "Roll the model"
    minutes: 8
    do: |
      In pairs, label a paper die (or a normal die with a key: 1–3 mat, 4–5 chair, 6 roof). Roll ten times and tally. Add your tally to the class total on the board.
    notes: "Pairs will disagree; the class total will be closer to 3 : 2 : 1. That gap between one pair and the whole class is the point of the Explain step."
  - at: investigate
    kind: check
    title: "Roof twice in a row"
    minutes: 2
    do: |
      Your die has just rolled 'roof' twice. On a mini whiteboard, write the chance of 'roof' on the next roll.
    notes: "Still 1 in 6. Anyone writing less is reasoning as if the die remembers."
