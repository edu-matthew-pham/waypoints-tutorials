summary: "Distinguish a plausible AI claim from a claim justified by independent evidence."
time: 30
goals:
  - "I can compare a claim with independent evidence rather than relying on confidence."
  - "I can explain the limits of a small dataset and identify missing evidence."
before: |
  The activity deliberately uses invented data with known values, not a claim of conducting authentic science. Students need to understand that supported means supported *by these observations*, not universally proved.
  The core board is offline and requires no AI account.
  The optional AI-tool step (typical width) is never needed to finish, and every check can be done without AI. Students use an AI tool only if the school allows it and you say so; check the tool's terms first, since many require users to be 13 or older. The step gives a no-AI version (a partner or a table).
running:
  - "Engage: ask what evidence would settle the 'every seedling' claim."
  - "Explore: students judge each claim against the measurements, and say which word (every, always, average) needs checking."
  - "Explain: separate 'supported by these measurements' from 'always true'."
struggle: "Students may treat a narrow match between a claim and one data record as universal proof."
stuck:
  - see: "A student marks a claim supported because it sounds reasonable."
    ask: "Which numbers in the record back it up?"
    fix: "Point to the measurements and test the claim's key word (every, always, average) against them."
support: "Do the first claim together, underlining the word that needs checking."
stretch: "Rewrite each unsupported claim so the measurements would support it."
leads: "Next, decide what AI work can be delegated without surrendering important thinking."
exit:
  q: "A dataset records plant height but not plant health. Can it support 'the eight-hour plants were healthier'?"
  a: "No. Height is not health; you would need measurements of health to support that claim."
explain: |
  These are prepared cases and feedback, not outputs of an AI language model.
  The learning objective is transferable judgement, not a vendor-specific technique.
