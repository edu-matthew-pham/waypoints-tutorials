summary: "Compare manual and automated sampling and identify what judgement remains with the learner."
time: 25
goals:
  - "I can name the job the computer took over (rolling and counting) and the judgement that stayed with me."
  - "I can explain why 1,000 rolls get closer to 3 : 2 : 1 than ten rolls do."
  - "I can choose help from an AI tutor that leaves the thinking I'm practising to me."
before: |
  Use the board as a transparent fixed-context model, not a miniature modern LLM. No AI account is required. The Explain it to me clip is an optional scaffold after prediction.
  The three prepared tutor responses model how apparently helpful AI can still over-assist. Response B is usually better for a first independent attempt, but scaffolding should adapt to the student. If your school allows it, you can demonstrate the same request in a school-approved assistant yourself; students do not need accounts, and no provider or study mode is required. Avoid entering personal student information.
  The "cognitive offloading" definition follows Lodge and Loble (2026), listed in the lesson's sources.
running:
  - "Engage: ask what the computer should and should not do before anyone presses Run."
  - "Explore: have students perform five manual rolls before pressing Run 100."
  - "Explain: separate the job handed over (rolling, counting) from the judgement kept (is this a good model?)."
  - "Learning with AI: the independent check uses a new table, so students cannot reuse the Evaluate answer."
struggle: "Faster output does not establish understanding or truth."
stuck:
  - see: "A student says the computer understands the sentence."
    ask: "Exactly which steps did it perform?"
    fix: "Return to the board and list them: pick a number, look it up, count. Nothing else."
support: "Use the prepared examples, read the explanation aloud and repeat a small trial."
stretch: "Explain where the toy model differs from a modern AI assistant."
leads: "Unit 2 moves from generating text to how AI learns from examples."
exit:
  q: "What must you still understand after automating the rolls?"
  a: "How the six faces map to words, what the results mean, and how to judge whether the model suits the task."
explain: |
  The computer can repeat the same die-and-table procedure quickly. Running a hundred or a thousand trials gives more data to compare, but it does not make the words true or the model suitable. We can delegate repetitive execution while retaining judgement about the model and checking our own understanding. When an AI tutor over-helps, ask it for one hint at a time.
