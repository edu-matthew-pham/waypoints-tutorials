summary: "Make situational decisions about independent work, AI assistance and delegated execution."
time: 30
goals:
  - "I can distinguish task completion from developing my own capability."
  - "I can decide what to delegate and describe how I will check its output."
before: |
  Avoid treating delegation as inherently bad. The same task may be appropriate to delegate during performance but important to practise during learning. Follow school expectations for independent work and assessment.
  The core board is offline and requires no AI account.
  These habits apply to your own AI use too. Keep the parts you need to understand or control.
running:
  - "Engage: ask what the learner still has to do after handing over formatting."
  - "Explore: for each situation, name the goal before choosing an approach."
  - "Explain: compare the same kind of help under a learning goal and a getting-it-done goal."
struggle: "Students may apply fixed rules such as 'AI always does the boring work' without identifying the actual learning objective."
stuck:
  - see: "A student hands over everything that is boring."
    ask: "Is this boring part the skill you are learning?"
    fix: "Name the goal first, then decide."
support: "Give a three-column table: keep, get help with, hand over and check."
stretch: "Take one task and show how the split changes for a timed test versus practice at home."
leads: "Does AI Help Us Learn? asks whether these habits actually help students learn, and when."
exit:
  q: "Your goal is to understand controlled variables. What would you keep, and what could you hand over?"
  a: "Keep writing the explanation (that is the skill); you could hand over formatting or spelling checks, then check the result."
explain: |
  These are prepared cases and feedback, not outputs of an AI language model.
  The learning objective is transferable judgement, not a vendor-specific technique.
