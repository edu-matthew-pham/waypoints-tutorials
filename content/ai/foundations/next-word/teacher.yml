summary: "Count example endings and distinguish a frequent next word from a certain one."
time: 25
goals:
  - "I can count which endings follow a phrase in a set of examples and say which is most common."
  - "I can explain why the most common ending is likely but not certain."
  - "I can check a suggested next word against what I actually mean."
before: |
  Use the board as a transparent fixed-context model, not a miniature modern LLM. No AI account is required. The Explain it to me clip is an optional scaffold after prediction.
  Formal fractions and percentages are an optional extension, not a prerequisite: start with counts and bars. Ask learners to justify answers using counts rather than guesses about the writer's intentions.
  Common misconceptions: most likely means certain; the generator understands what the writer intends; changing the examples cannot change the prediction.
running:
  - "Engage: ask students to write their own ending before seeing any examples."
  - "Explore: count mat, chair and roof before revealing fractions; then add five roof examples."
  - "Explain: the Explain it to me clip or its text is optional; do not require watching before exploring."
struggle: "Students may read 'most common' as 'must come next'."
stuck:
  - see: "A student says mat must follow because it is most common."
    ask: "Which other endings appear in the examples? Could one of them come next?"
    fix: "Point to the counts on the board: roof is 1 of 6, so it still happens sometimes."
support: "Use the prepared examples, read the explanation aloud and repeat a small trial."
stretch: "Explain where the toy model differs from a modern AI assistant (tokens, much longer context, learned patterns)."
leads: "Unit 1, lesson 2 uses a die to choose an ending by its chance. A physical die helps; no online AI account is needed."
exit:
  q: "What happens to the most frequent ending when five roof examples are added?"
  a: "Roof becomes most frequent: six roof, three mat and two chair."
explain: |
  A simple fixed-context model counts possible endings. Mat appears three times, chair twice and roof once. Mat is the most frequent, but not the only possible word. Changing the examples changes these counts. A modern language model is far more complex, and a plausible suggestion still needs checking against what you mean.
