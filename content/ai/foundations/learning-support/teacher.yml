summary: "Choose among hints, worked examples and independent practice based on the learning goal."
time: 30
goals:
  - "I can select assistance that leaves appropriate thinking for me to practise."
  - "I can check learning by completing a related task independently."
before: |
  The board uses scripted hints and worked examples rather than live AI. Do not imply that hints are always preferable: worked examples can reduce unproductive confusion for novices.
  The core board is offline and requires no AI account. If your school allows it, you can demonstrate a hint-first request in a school-approved assistant yourself.
running:
  - "Engage: ask which help leaves the next step to the learner before anyone opens the board."
  - "Explore: students do the challenge twice, once with a hint and once with the worked example, and compare."
  - "Explain: ask who did the thinking in each run."
struggle: "Students may think every finished example is harmful, or that looking at an answer proves learning."
stuck:
  - see: "A student goes straight to the worked example every time."
    ask: "What could you try before looking? Which part are you stuck on?"
    fix: "Ask for one hint, write the next step, then decide if you need more."
support: "Model one run aloud: attempt, one hint, attempt, new question."
stretch: "Apply the decision to a different subject or to performance rather than learning mode."
leads: "Next, examine why useful-looking AI responses still require verification."
exit:
  q: "You used the worked example. How can you tell whether you learned the method?"
  a: "Try a new question without looking back. If you can do it, the example helped you learn; if not, you followed it without learning it yet."
explain: |
  These are prepared cases and feedback, not outputs of an AI language model.
  The learning objective is transferable judgement, not a vendor-specific technique.
