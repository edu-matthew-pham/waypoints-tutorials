summary: Students compare a 9 V PP3 with 4 × AA for a robot, work out run time from capacity and draw with an 80% margin, find why NiMH cells fail a voltage range, and choose a battery against voltage, run time and weight, which leads to a LiPo.
time: 40
timing: "Predict and Try 5 min · Worked example 10 min · Vary 8 min · Practise and Make 17 min"
goals:
  - I can work out a battery's run time from its capacity and the current.
  - I can choose a battery against a brief's criteria.
  - I can explain the difference between voltage and capacity.
struggle: "Students rank batteries by one number. Keep all three criteria on the board for every candidate."
before: |
  Figures are typical, not exact: alkaline AA capacity falls a lot at high current, and PP3s are poor at motor currents (often well under 500 mAh). Check the packs you buy. The board's run time is capacity × usable % ÷ draw.

  LiPos appear here as the battery that fits; the next lesson is required before anyone uses one.
running:
  - "Predict: ask what the 9 in 9 V tells you, and what it doesn't."
  - "Make: ask students to say which criterion rules out each battery."
stuck:
  - see: "A student divides current by capacity."
    ask: "Which is bigger, and which way gives hours?"
    fix: "Capacity ÷ current."
stretch: "Two batteries in series: what happens to the voltage, and to the capacity? In parallel?"
support: "A table with a row per battery and a column per criterion."
leads: |
  Next: LiPo safety (required before any LiPo use).
exit:
  q: "A 1500 mAh pack and a robot drawing 500 mA. Using 80%, how long does it run?"
  a: "1500 × 0.8 = 1200 mAh; 1200 ÷ 500 = 2.4 h = 144 minutes."
explain: |
  **Voltage** (V) is how hard a battery pushes; **capacity** (mAh) is how much charge it holds. **Run time ≈ capacity ÷ current**, and plan on using about 80% of it. A robot's battery must meet every criterion: voltage in the driver's range, enough run time, and light enough to carry.
sources:
  - { title: "Energizer AA alkaline datasheet (capacity against current; link)", url: "https://data.energizer.com/", checked: 2026-10-12 }
