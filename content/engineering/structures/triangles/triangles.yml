# Boards for "Triangles hold their shape". A square frame pushed sideways at the top. Forces in newtons.

# region: run
widget: truss
joint A: 0, 0 pin
joint B: 2, 0 roller
joint C: 2, 2
joint D: 0, 2
member: A-B, B-C, C-D, D-A
load D: 500 right
strength: 5000
buckle: 20000
edit: on
# endregion

