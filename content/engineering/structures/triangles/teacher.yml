summary: Students watch a square frame on pins collapse under a sideways push, brace it with one diagonal, learn the counting rule (members + 3 = 2 × joints for a pin and a roller), and brace two- and three-storey towers with the fewest members.
time: 40
timing: "Predict and Try 8 min · Worked example 8 min · Vary 10 min · Practise and Make 14 min"
goals:
  - I can explain why triangles keep their shape and squares don't.
  - I can use the counting rule to say how many members a frame needs.
  - I can brace a frame with the fewest members.
struggle: "Students think stronger members fix a wobbly frame. Ask whether any member changes length when the square leans."
before: |
  Straws and pipe cleaners, or card strips and split pins: a square and a triangle side by side settle this in a minute.

  The counting rule m + 3 = 2j is for flat frames on a pin and a roller (three support reactions). It is necessary but not sufficient: members can be in the wrong place (two diagonals in one panel and none in another), so always test. The board finds collapse directly.

  Curriculum hooks: Design and Technologies, engineering principles and systems; Maths, linear relations (the rule).
running:
  - "Predict: hold up a square of straws and push its corner."
  - "Try: let students try both diagonals."
  - "Worked example: count ways to move (2 per joint) against things that stop them (members and supports)."
  - "Vary: ask a student who added two diagonals to one panel what went wrong."
stuck:
  - see: "A student adds members but it still collapses."
    ask: "Is there a square panel with no diagonal?"
    fix: "One diagonal in every square panel."
  - see: "A student adds 3 in the rule."
    ask: "Do supports add ways to move, or take them away?"
    fix: "They take 3 away: members = 2 × joints − 3."
stretch: "Take the pin and roller away and use two pins instead (four support forces). How does the counting rule change?"
support: "Give the rule as a fill-in: joints ___, × 2 = ___, − 3 = ___ members."
leads: |
  Next: Design a bridge.

  Real examples: gates, scaffolding, electricity pylons, cranes, the Eiffel Tower.
exit:
  q: "A frame has 9 joints on a pin and a roller. How many members does it need to be rigid with none spare?"
  a: "2 × 9 − 3 = 15."
explain: |
  A **triangle** can't change shape unless a side changes length; a **square** on pins can lean without any member stretching, so it folds over however strong its members are. A **diagonal brace** turns a square into two triangles.

  For a flat frame on a pin and a roller, **members + 3 = 2 × joints** gives the number it needs with none spare: one diagonal per square panel.
sources:
  - { title: "TeachEngineering: K-12 engineering design challenges (benchmark; the briefs and wording are our own)", url: "https://www.teachengineering.org/", checked: 2026-10-12 }
