summary: Students change the driving dimensions of a parametric case and watch the outside follow, write each size as an expression of the part, clearance and wall, see why Sam's typed-in number forces a redraw, build the same model with variables in Onshape, and work back from a size limit to the largest part.
time: 40
timing: "Predict and Try 5 min · Worked example 8 min · Onshape 15 min · Practise and Make 12 min"
goals:
  - I can tell driving dimensions from driven ones.
  - I can write a size as an expression of variables.
  - I can change a parametric model by changing one number.
struggle: "Students type the number they worked out. Insist: if you worked it out, it's an expression."
before: |
  Onshape: free education plan, runs in the browser; variables are made with the Variable feature (#name) and used in any dimension box. Fusion works the same way with Parameters. This links to Maths (expressions and substitution) and to Code (variables).
running:
  - "Predict: ask what the case's outside depends on."
  - "Worked example: underline the driving numbers."
stuck:
  - see: "A student's model doesn't update."
    ask: "Is that dimension a number or an expression?"
    fix: "Type the expression with the variables."
stretch: "Add a #fillet variable for rounded corners and a #lid_gap for the lid. Which sizes depend on each?"
support: "A three-column table: variable, value, which sizes use it."
leads: |
  Next (optional): Laser cutting and kerf.
exit:
  q: "Why make a case's outside width an expression instead of a number?"
  a: "So it updates by itself when the part, clearance or wall changes, instead of being redrawn."
explain: |
  In a **parametric** model, sizes are linked by rules: outside = part + 2 × (clearance + wall). The numbers you choose or can't change (**driving dimensions**) are variables; everything else is an **expression** of them, so changing one number updates the model.
sources:
  - { title: "Onshape Learning Center: variables (link)", url: "https://learn.onshape.com/", checked: 2026-10-12 }
