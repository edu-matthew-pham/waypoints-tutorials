# Boards for "A small system". The knob on A0 stands in for a soil moisture sensor (dry = low reading).

# region: run
widget: arduino
led: 13
knob: A0
level: 50
edit: off
test: 0, blink
test: 150, blink
test: 299, blink
test: 301, off
test: 800, off
code: int level = 0;
code:
code: void setup() {
code: pinMode(13, OUTPUT);
code: }
code:
code: void loop() {
code: level = analogRead(A0);
code: if (level < 300) {
code: digitalWrite(13, HIGH);
code: delay(250);
code: digitalWrite(13, LOW);
code: delay(250);
code: } else {
code: digitalWrite(13, LOW);
code: delay(100);
code: }
code: }
# endregion

