# Boards for "Outputs that vary": an LED on pin 9 (a PWM pin), its signal drawn beside it.

# region: run
widget: arduino
led: 9
wave: on
edit: off
code: void setup() {
code: }
code:
code: void loop() {
code: analogWrite(9, 128);
code: delay(100);
code: }
# endregion

# region: explain
widget: arduino
led: 9
knob: A0
level: 50
wave: on
edit: off
code: int level = 0;
code:
code: void setup() {
code: }
code:
code: void loop() {
code: level = analogRead(A0);
code: analogWrite(9, level / 4);
code: delay(50);
code: }
# endregion

