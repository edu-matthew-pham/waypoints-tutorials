# Boards for "Talking to the computer": a knob on A0, printing to the serial monitor.

# region: run
widget: arduino
knob: A0
level: 50
edit: off
code: int level = 0;
code:
code: void setup() {
code: Serial.begin(9600);
code: }
code:
code: void loop() {
code: level = analogRead(A0);
code: Serial.println(level);
code: delay(250);
code: }
# endregion

