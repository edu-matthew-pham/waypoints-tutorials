# Boards for "Same circuit, new board". The LED is wired to pin 12; the sketch uses pin 13.

# region: run
widget: arduino
led: 12
edit: off
code: void setup() {
code: pinMode(13, OUTPUT);
code: }
code:
code: void loop() {
code: digitalWrite(13, HIGH);
code: delay(500);
code: digitalWrite(13, LOW);
code: delay(500);
code: }
# endregion

