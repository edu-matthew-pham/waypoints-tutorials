inquiry:
  q: "Pennerby's council has one budget. What should it spend it on first?"
  prompts:
    - "What does the evidence say is causing the shortage?"
    - "Who else would your choice affect?"
  notes: "Expect different answers. Ask each group for the cause their choice targets and one trade-off."
activities:
  - at: investigate
    kind: discussion
    title: "Causes before cures"
    minutes: 5
    do: "Pairs list every cause the evidence pack shows before anyone names a strategy. Collect them on the board."
    notes: "The list should include dry years, the leaking dam, growing use, and others sharing the river."
  - at: make
    kind: activity
    title: "Write the plan"
    minutes: 15
    do: "Students write Pennerby's plan in four parts in their books, then swap. The partner checks the four parts are there and the four words are used correctly."
    notes: "The site does not mark this writing. Different strategies can all be good if the four parts are there."
