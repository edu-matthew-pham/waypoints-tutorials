summary: Explain erosion, transport and deposition as processes that change a place, rather than merely naming
  a landform.
time: 40
timing: Predict and Try 8 min · Worked example 12 min · Vary 8 min · Practise 6 min · Make 6 min. Optional
  width is extra.
goals:
  - I can explain how flowing water removes and carries material.
  - I can distinguish erosion, transport and deposition.
  - I can explain a physical change instead of just naming a landform.
struggle: Students may say the river found a valley as if location were a process. Ask what is removed, what
  carries it and how the place looks different.
before: "Usually Year 7. Minimum Make explains one change process: runoff eroding a slope and carrying soil
  away. A complete removal-to-deposition explanation is optional width. Kerrin, storms, valleys and cover
  comparisons are made up. The sourced Snowy River channel replaces an unchecked story about formation of a
  particular mountain valley. River valleys may have complex histories; do not imply one storm makes a large
  valley or all valleys are formed by rivers. Flow speed is not the only condition affecting sediment
  movement: particle size, discharge and sediment supply matter."
running:
  - "Try: ask whether the place gains or loses material."
  - "Worked example: order the chain before discussing Nib."
  - "Vary: connect scour with removal and transport with carrying."
  - "Make: expect water acting on named material, not only a labelled sketch."
stuck:
  - see: A valley is named with no process.
    ask: What happens to soil or rock, and where does it go?
    fix: Add erosion and transport to explain change.
  - see: Erosion and deposition are swapped.
    ask: Does the place lose or gain material?
    fix: Removal is erosion; settling adds material by deposition.
  - see: All flowing water is said to deposit.
    ask: Can this flow keep carrying these particles?
    fix: Settling depends on whether flow can carry the material.
support: Use the smaller removal question. Act out remove, carry, settle with three cards, then return to the picture.
stretch: Change ground cover in the invented case, keeping the same process explanation.
exit:
  q: Why is the river is in a low place not enough to explain a deepening valley?
  a: It gives location, not a process. Flow erodes soil or rock and transports it away; repeated removal can
    deepen the channel.
explain: Erosion removes material, transport carries it, and deposition adds sediment where it settles.
  Explain water acting on material and the resulting change to a place.
sources:
  - title: "Managing water for the environment: Snowy and montane rivers (NSW Environment and Heritage)"
    url: https://www.environment.nsw.gov.au/topics/water/water-for-the-environment/catchments/snowy-and-montane/managing
    checked: 2026-10-30
leads: "Next: classification, connection and change together. Optional width stays on the same process, with
  no older-year geomorphology."
