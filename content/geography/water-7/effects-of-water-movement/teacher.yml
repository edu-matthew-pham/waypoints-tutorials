summary: "Students explain an effect of moving water as a change, not a description, and see that one change can benefit some people and places and harm others. They sort effects as environmental, economic or social, treating these as lenses that can overlap. The worked example is the Snowy Mountains scheme; the other cases are made up."
learning: "explain an effect of moving water and show how it can benefit some places or groups and harm others"
time: 40
timing: Predict and Try 8 min · Worked example 12 min · Vary 8 min · Practise 6 min · Make 6 min. Optional
  width is extra.
goals:
  - I can explain one effect of water movement using a specific example.
  - I can distinguish environmental, economic and social effects.
  - I can identify a benefit and an adverse effect of the same movement.
struggle: Students may label an effect without a causal link. Ask what changed because water went somewhere
  different. Accept justified overlapping categories.
before: Usually Year 7. The minimum Make explains one effect type using the Snowy Scheme, plus a contrasting
  benefit and harm. Introducing three lenses in a short sort does not require an essay on all three. Real
  facts are limited to the source cards; no current volumes, allocations or particular community viewpoints
  are asserted. Towns, swimming areas and other comparison cases are made up. Environmental releases are
  acknowledged so historic diversion is not mistaken for all current operations.
running:
  - "Try: channel length is a description, not a consequence."
  - "Worked example: compare the real economic use with the environmental consequence."
  - "Vary: mark the swimming-town case as hypothetical."
  - "Board: one storm without the dam, one with it. Ask who gained and who gave something up."
  - "Board: Kerrin and the catchment board are made up. The board is a simple model of which way things change, not amounts; it leaves out rain amount and intensity, soil type, groundwater, dams releasing or flushing water, and change over years. Ask students what a real catchment would add."
  - "Make: expect one explained type; all three remain optional width."
stuck:
  - see: A student gives dam size as an effect.
    ask: What changes because water moves?
    fix: Add a consequence for a place or group.
  - see: One benefit is taken to benefit everyone.
    ask: Where might less water arrive?
    fix: Compare receiving places with places from which flow is diverted.
  - see: Every effect is given exactly one category.
    ask: Which aspect are you focusing on?
    fix: Accept overlapping categories with a reason.
support: "Use the smaller two-place question, then the frame: water moves from __ to __, so __ changes."
stretch: Use both viewpoints in the invented case without making up evidence about actual communities.
exit:
  q: Explain one effect of the Snowy Scheme and a contrasting consequence.
  a: Diversion supplies water for irrigation, an economic benefit for farms. Much lower Snowy River flows changed
    the channel greatly; environmental releases now flush sediment to reclaim a deeper channel.
explain: An effect says what changes because water moves. Environmental focuses on nature, economic on
  production and income, social on daily life. One movement can help one place and harm another.
sources:
  - title: Moving water through the Snowy Scheme (Snowy Hydro fact sheet)
    url: https://www.snowyhydro.com.au/wp-content/uploads/2025/11/3-Moving-water-thru-SS_Water-scheme-Factsheet.pdf
    checked: 2026-10-30
  - title: "Managing water for the environment: Snowy and montane rivers (NSW Environment and Heritage)"
    url: https://www.environment.nsw.gov.au/topics/water/water-for-the-environment/catchments/snowy-and-montane/managing
    checked: 2026-10-30
leads: 'Next: the physical processes by which water changes land. First Nations extension is teacher-led only.
  ACARA’s AC9HG7K01 elaboration says: "explaining the environmental, economic or social effects of water as it
  connects places; for example, the environmental effects of water diversion in the Snowy Mountains, the
  economic effects of irrigation in the Ord River or the social effects of the Mutitjulu Waterhole connecting
  Australian First Nations Peoples in Central Australia". Start from that elaboration and add local,
  community-approved material with the school’s Indigenous education contact. No student explanation of First
  Nations history, culture, values or connection to Country is supplied.'
