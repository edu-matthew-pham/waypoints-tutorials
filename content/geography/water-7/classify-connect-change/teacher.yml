summary: "Students join at least two of the course's three ideas (classifying water as a resource, connecting places through water movement, and physical change by erosion and deposition) in one explanation of a case. Optional steps join all three. The worked example is the Murray Mouth; the other cases are made up."
learning: "explain a water case by joining at least two of classification, connection and physical change"
time: 40
timing: Predict and Try 8 min · Worked example 12 min · Vary 8 min · Practise 6 min · Make 6 min. Optional
  width is extra.
goals:
  - I can link at least two of classification, connection and physical change in one case.
  - I can use water forms, named places and process terms accurately.
  - I can distinguish a linked explanation from a list of ideas.
struggle: The challenge is linking concepts in one case rather than listing three definitions. Ask students to
  point to a word linking the pathway to a consequence.
before: Usually Year 7. Minimum width is two concepts, as in node 5’s minimum. The Murray Mouth card supports
  connection plus physical change; do not force a resource label on an estuary without considering mixing,
  supply and timescale. Rill Bay supplies the refilling evidence for optional all-three integration. Rill Bay,
  Pebblewash Creek and the pipeline are made up. The sourced real card simplifies a pathway without claiming the
  present mouth condition. Barrages keep seawater out of the lake; the report card says sand comes in from the ocean when outflow is low, and dredging has been used to keep the mouth open. The original SA DEW topic page would not load on 1 Nov, so the card now cites these two SA government documents. No new policy
  study or K02 content is required.
running:
  - "Worked example: identify a pathway and linked physical change."
  - "Vary: compare a causal sentence with a list."
  - "Practise: Pebblewash Creek is a fresh transfer case."
  - "Make: read for two linked tools before the reflect tick; all three are optional width."
stuck:
  - see: The response lists definitions.
    ask: Where does one idea affect something in this case?
    fix: Use because, so or when to link pathway and consequence.
  - see: Renewable is taken as unlimited flow.
    ask: Can use exceed the speed of refilling?
    fix: Renewable describes replenishment, not a guaranteed downstream supply.
  - see: All sand is assumed to arrive from upstream.
    ask: What does the card say about the ocean?
    fix: Tides also influence the mouth; do not invent a sediment source.
support: "Use the smaller check, then offer two headings: what moves between places; how a place changes.
  Rehearse aloud before writing."
stretch: Apply the same three tools to the invented pipeline without requiring a new management strategy.
exit:
  q: Water carries soil from Pebblewash Creek’s slope to a pond, where it settles. Explain two tools together.
  a: Surface water connects the places by carrying soil. When flow slows in the pond, deposition adds sediment
    to its bed, changing the place.
explain: Classify with a refilling reason, connect with a pathway and what it transfers, and explain physical
  change through a process. Join at least two tools in the same case.
sources:
  - title: River Murray flow report, 9 July 2021 (SA Department for Environment and Water)
    url: https://www.waterconnect.sa.gov.au/Content/Flow%20Reports/RM-Flow-Report-20210709.pdf
    checked: 2026-11-01
  - title: Murray Mouth barrage outflow and dredging (SA environmental trend and condition report card, 2023)
    url: https://data.environment.sa.gov.au/Content/Publications/RC2023_RC_WA_SW_MurrayMouthBarrageOutflowAndDredging.pdf
    checked: 2026-11-01
leads: This completes AC9HG7K01. Water in Australia (AC9HG7K02) comes next.
  Local cases used in class need their own checked sources.
