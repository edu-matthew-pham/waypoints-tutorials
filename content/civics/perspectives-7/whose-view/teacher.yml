summary: "Students read four made-up sources on one local decision (closing Main Street for a Saturday market) and work out each one's perspective: who made it, what they want, and what they put in or leave out. Official and factual-looking sources have a perspective too."
learning: "identify the perspective of a civic source by asking who made it, what they want and what they leave out"
time: 40
timing: "Read the sources 4 min · Predict and Try 6 min · Worked example 10 min · Vary 6 min · Practise 6 min · Make and exit 8 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can say who made a source and what they want to happen.
  - I can find something a source leaves out.
  - I can explain why an official source still has a view.
struggle: "Students treat official or factual-looking sources as neutral, and treat 'having a view' as 'being wrong'. Keep the three questions on the board: who made it, what do they want, what's in and what's left out?"
before: |
  Hinge n1. Kit's reason: identifying perspective is what comparing perspectives rests on; students who can't see a source as a positioned view, rather than neutral information, can't compare views or see why an issue is hard. Use the smaller check before moving on.

  One made-up issue runs through the course (Wattle Creek, a Saturday market on Main Street). It is a model chosen to be low-stakes and not party-political; any local issue would do. If you swap in a real local issue, pick one that is not party-political or a live dispute in your school community, and use Make your own version to change the sources. All sources, people and groups are written for the course; nothing is copied from real outlets.

  Nearby skills are taught elsewhere: English *Who says so?* and *Spot the bias*, ICT *Who made it and why?*, History *Source origin and purpose*. This course does not assume them. What is Civics' own is reading perspectives on a civic decision and, in the next two lessons, why views differ and why the decision is hard.

  First Nations: AC9HC7S03's elaborations have none. Kit's wider item suggests First Nations perspectives on civic issues such as land rights and constitutional recognition; following the site's First Nations rule, there is no student step on this, because those perspectives should come from First Nations voices and the issues are live. If you take it up, use First Nations-led, community-approved material.

  Nothing personal is asked: students are never asked what they or their family think about a real issue.
running:
  - "Sources: read them aloud together, or in pairs, before the Predict."
  - "Predict: take a vote. Many will pick the council or the bus notice. Leave it open."
  - "Worked example: ask 'Can anyone check that yet?' about the council's hope."
  - "Practise: the bus notice is the tricky one. Ask what it doesn't say."
  - "Make: the student writes in their own book or document; a partner or teacher reads it. The site only records a reflect tick."
stuck:
  - see: "A student says the council notice is just facts."
    ask: "Which line can't anyone check yet?"
    fix: "'Will bring the town together' is the council's hope. That's its view."
  - see: "A student says having a perspective means a source is wrong or biased."
    ask: "Could a source be completely true and still come from someone's point of view?"
    fix: "Every source comes from somewhere. A perspective isn't a mistake; it's something to notice."
support: "Write the three questions as column headings and fill them in for the council notice together."
stretch: "Is it possible to write a source on this issue with no perspective at all? What would you have to include?"
exit:
  q: "Choose one source and answer: who made it, what do they want, and what does it leave out?"
  a: "For example, the Gazette editorial: the newspaper's editors, who want the market made permanent; it leaves out people who need to drive in or park nearby."
explain: |
  Every source about a civic issue comes from someone with a **perspective**. Ask: **Who made it? What do they want? What did they put in, and what did they leave out?**

  Official and factual-looking sources have a perspective too. A source can be accurate and still lean, through the facts it chooses.
leads: >-
  Next in this course: Why views differ.


  ACARA elaboration for AC9HC7S03 (an example, not a checklist): "examining online publications to find examples of
  how the system of government protects respect for human rights and the rule of law, and compare these examples with
  other publications that have different perspectives or challenge these views"
