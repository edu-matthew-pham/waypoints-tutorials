summary: "Students compare made-up sources on the Wattle Creek market (an editorial, a traders' post, a resident's letter and a youth council survey): where they agree, where they disagree, and why, using four reasons views differ: values, interests, information and role."
learning: "compare two civic sources and explain why their perspectives differ"
time: 42
timing: "Read the sources 3 min · Predict 3 min · Board 6 min · Worked example 10 min · Vary 6 min · Practise 6 min · Make and exit 8 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can find a point where two sources agree and a point where they disagree.
  - I can explain why their views differ, using values, interests, information or role.
  - I can explain why a disagreement doesn't mean someone is lying.
struggle: "Students treat disagreement as a contest with a liar and a truth-teller. Keep asking 'What does each one care about, or stand to lose?'"
before: |
  The board reuses the English `cohesion` board in parts mode, with three labels for this course (what they want, why it matters to them, a fact anyone could check). It checks only the planted labels on the made-up sentences.

  Ines uses a wheelchair and is written as an ordinary resident with a practical need, in her own voice, who likes the idea of a market. Her letter gives the decision a real trade-off (lesson 3). Avoid framing her as a problem or an object of pity; she is one of several people with a view.

  The four reasons (values, interests, information, role) are a simple model for explaining why views differ; real disagreements often mix them. The survey is made up and small; the typical step asks who it reached. Kit's wider items include real polls (such as the Lowy Institute) and topics where views changed over time; those are left to class, chosen by you, avoiding live party-political debates.

  Everything is made up. Nothing personal is asked.
running:
  - "Sources: read Ines's letter and the survey aloud. Ask what each one tells you that the other doesn't."
  - "Predict: take a vote. Expect 'one must be wrong'. Leave it open."
  - "Board: put it up and label one sentence of each kind together."
  - "Vary: role is the hardest reason. Ask what the council's job is."
  - "Make: the student writes in their own book or document; a partner or teacher reads it. The site only records a reflect tick."
stuck:
  - see: "A student says one source must be lying."
    ask: "What does each one care about, or stand to gain or lose?"
    fix: "Views differ because of values, interests, information or role. Both can be honest."
  - see: "A student says Ines's letter doesn't matter because most people support the market."
    ask: "What does her letter tell the council that the survey doesn't?"
    fix: "The survey counts support; the letter shows a practical problem to solve."
support: "Write AGREE, DISAGREE and WHY on the board and do the Gazette and the Traders together first."
stretch: "Find a disagreement in Wattle Creek that more evidence could settle, and one it couldn't."
exit:
  q: "Compare two sources: one point they agree on, one they disagree on, and why."
  a: "For example, Ines and the Gazette both like a market; they disagree on running it as planned, because Ines needs nearby parking and the Gazette values a lively street."
explain: |
  To compare two sources: find where they **agree**, where they **disagree**, and explain **why**.

  Views usually differ because of **values** (what people care about), **interests** (what they stand to gain or lose), **information** (what they know) or **role** (the job they have to do). Disagreeing doesn't mean someone is lying.
leads: >-
  Next in this course: Why it's hard to decide.


  ACARA elaboration for AC9HC7S03 (an example, not a checklist): "evaluating data from surveys or reports to draw
  conclusions about a current issue of challenge; for example, a Lowy Institute poll on important issues facing
  Australia or media reports on the effectiveness of the court system"
