inquiry:
  q: "In Wattle Creek, one resident writes a letter to the paper saying the council's new rubbish fee is unfair. Another resident posts a made-up story online claiming a local baker poisons bread. Why does Australian law protect the first resident's speech, but step in to limit the second?"
  prompts:
    - "Who is harmed when someone publishes a false accusation about a neighbour or small business?"
    - "Why does democracy need citizens to be free to criticise council fees, while still protecting people from defamation?"
  notes: "Show that 'within the bounds of law' is about balancing competing rights and protecting others from harm, while keeping peaceful political debate free."
activities:
  - at: run
    kind: activity
    title: "Where is the boundary, and who does it protect?"
    minutes: 4
    do: |
      For three of the freedoms (speech, assembly, movement), ask pairs to state in one sentence: (1) something you are free to do, (2) one legal boundary, and (3) who that boundary protects.
    notes: "Keep the focus on protecting others' rights, safety and reputation."
  - at: make
    kind: discussion
    title: "Rules for a fair limit"
    minutes: 4
    do: |
      Ask the class: what stops a government from passing a law that says 'Nobody may criticise the government'? Bring back the High Court and the implied freedom of political communication from the Constitution.
    notes: "Links back to Course 1's separation of powers and constitutional checks."
questions:
  - at: investigate
    title: "Within the bounds of law"
    type: question
    q: "Why are democratic freedoms in Australia subject to legal limits such as defamation law and peaceful-assembly rules?"
    options:
      - "To protect other people's rights, reputation and safety where one person's action would harm others"
      - "To prevent citizens from ever questioning government policy"
      - "Because freedoms only apply to members of Parliament"
      - "Because Australia has no courts to interpret the law"
    answer: 0
    explain: "Legal limits balance competing rights so that freedoms can be exercised without harming others' safety, rights or reputation."
