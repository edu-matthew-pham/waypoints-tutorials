summary: "Students distinguish between formal citizenship (legal status, rights and responsibilities) and active citizenship (engaged participation in civic and community life), and identify that not all people in Australia have historically had equal access to citizenship rights, particularly in relation to First Nations Australians."
learning: "distinguish formal citizenship from active citizenship and explain how access to citizenship rights in Australia has changed"
time: 40
timing: "Predict and Try 8 min · Worked example 10 min · Vary 8 min · Practise 8 min · Make 6 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can explain the difference between formal citizenship and active citizenship.
  - I can name examples of legal rights and responsibilities of formal citizenship, and examples of active citizenship.
  - I can identify that First Nations Australians were historically excluded from full citizenship and voting rights, and that active citizenship helped change the law.
struggle: "Two things commonly trip students up here: (1) thinking 'citizenship' only means holding a passport, and (2) mixing up the 1962 Commonwealth Electoral Act (which gave First Nations Australians the right to enrol and vote in federal elections) with the 1967 referendum (which changed sections 51(xxvi) and 127 of the Constitution). Keep those two legal facts clear."
before: |
  This is the final lesson of AC9HC7K02, bringing together formal legal status and active participation.

  First Nations content and teacher guidance: Student steps state only the settled legal and constitutional facts (the *Commonwealth Franchise Act 1902* exclusion, the *Commonwealth Electoral Act 1962* federal voting right, compulsory enrolment in 1984, and the 1967 referendum changing s 51(xxvi) and repealing s 127). We do not write explanations of First Nations history, lived experience or culture from outside.

  ACARA's elaborations for AC9HC7K02 include:
  - "identifying characteristics of formal citizenship and the attributes of active citizenship, and identifying who has been included and excluded from the rights and freedoms of citizenship in Australia, particularly in relation to First Nations Australians"
  - "examining the active citizenship of First Nations Australians such as Neville Bonner, Adam Goodes, Noel Pearson, Murundoo Yanner, Charles Mene, Ellie Gaffney, Evelyn Scott and Pat O'Shane, and their contributions to the rights and freedoms of Australian First Nations Peoples"

  When exploring the stories and contributions of First Nations active citizens (such as Evelyn Scott, Neville Bonner, Ellie Gaffney, Charles Mene, Pat O'Shane, Noel Pearson, Murundoo Yanner, Adam Goodes, or local community leaders), use First Nations-led resources, published speeches in the person's own words, and local community-approved material (see Sources below, including AIATSIS and the National Museum of Australia's *Collaborating for Indigenous Rights* archive).
running:
  - "Predict: contrast Orla (legal status only) with Dev (legal status plus active contribution)."
  - "Try: note that voting in Australia is both a formal democratic right and a legal obligation for adults."
  - "Worked example: walk through the timeline carefully so students see that even when people were excluded from formal voting rights, they used active citizenship (petitions, meetings, speeches) to win legal change."
  - "Practise: students write their comparison in their own book first, then check against the two model answers and three criteria."
  - "Make: partner review in books."
stuck:
  - see: "A student says a permanent resident or young person under 18 cannot practise active citizenship."
    ask: "Can a 13-year-old or a permanent resident volunteer, sign a petition, or help run a community group?"
    fix: "Yes! Even before someone has the formal adult right to vote, they can practise active citizenship in their community."
  - see: "A student writes that the 1967 referendum 'gave Aboriginal people the right to vote'."
    ask: "Which year's law changed the federal voting rules, and what did the 1967 referendum actually change?"
    fix: "The *Commonwealth Electoral Act 1962* gave First Nations Australians the right to enrol and vote in federal elections. The 1967 referendum changed two sections of the Constitution: s 51(xxvi) (law-making power) and s 127 (the census)."
  - see: "A student lists only rights (passport, voting) and forgets responsibilities."
    ask: "What does the law require an adult citizen to do in return?"
    fix: "Obey the law, enrol and vote at elections and referendums, and serve on a jury if called."
stretch: "With your teacher's guidance, read an account or speech in the own words of one of the First Nations active citizens named in ACARA's elaboration (for example, Evelyn Scott on the 1967 referendum campaign, or Senator Neville Bonner's first speech to the Senate in 1971). Which methods of active participation from Lesson 3 did they use?"
support: "Two-column T-chart on the board: 'Formal citizenship (Legal status: rights + duties)' on the left, 'Active citizenship (Getting involved to help the community and democracy)' on the right."
leads: |
  This completes Freedoms and taking part (AC9HC7K02). Next in Year 7 Civics and Citizenship: Law and justice (AC9HC7K03 — the legal system, the rule of law and the courts).
exit:
  q: "What is the difference between formal citizenship and active citizenship, and give one example of how access to formal citizenship rights in Australia has changed since 1901."
  a: "Formal citizenship is legal membership of a country with legal rights and duties; active citizenship is participating actively to contribute to the community and democracy. For example, most First Nations Australians were excluded from voting in federal elections after 1901 until the Commonwealth Electoral Act was changed in 1962."
explain: |
  - **Formal citizenship** is your legal status as a member of the nation, with legal rights (voting, passport, standing for parliament) and duties (obeying laws, compulsory voting, jury service).
  - **Active citizenship** is getting involved in community and democratic life (volunteering, petitioning, campaigning, staying informed).
  - Not everyone in Australia has always had equal access to formal citizenship rights: First Nations Australians were excluded from the federal franchise until 1962 and from the constitutional census count until the 1967 referendum.
