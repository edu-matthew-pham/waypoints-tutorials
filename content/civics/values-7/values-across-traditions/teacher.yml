summary: "Students recall Christian heritage from A diverse democracy and see one value many traditions practised in Australia share, giving and helping others, in each tradition's own word (tzedakah, zakat, dana, seva, charity), while recognising that shared values don't mean shared beliefs. Religious freedom, within the law, connects it to civic life."
learning: "identify a value shared across religious traditions in Australia and explain how religious freedom lets different beliefs be practised"
time: 40
timing: "Read 4 min · Predict and Try 6 min · Worked example 10 min · Vary 6 min · Practise 6 min · Make and exit 8 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can name a value many traditions share, with two traditions' own words for it.
  - I can explain that a shared value doesn't mean shared beliefs.
  - I can explain religious freedom and why it has limits.
struggle: "Students swing between 'religions have nothing in common' and 'they're all really the same'. Keep both halves: a shared value, different beliefs."
before: |
  Depth is deliberately light (Matthew, 1 Nov 2026). Religions hold many beliefs across many denominations and groups, and it isn't the site's job to unpack them. Student text gives one checked line per tradition on one shared value, in that tradition's own word, and says plainly that beliefs differ. For more, point to each community's own educational material (for example, the national peak bodies for Australia's Jewish, Muslim, Buddhist, Hindu and Christian communities; check their current websites) and, where possible, local faith communities your school has links with.

  The one-line descriptions were checked against: My Jewish Learning (tzedakah as helping people in need, a duty linked to justice), BAPS (seva as selfless service, connected with devotion), Britannica and the Pluralism Project (zakat: a required share of wealth for those in need, one of the Five Pillars) and Heim's study of dāna in Hindu, Buddhist and Jain thought (generosity, giving without expecting a return). Dana is not only Buddhist and seva is also central in Sikhism; the lesson says so, and the match pairs words with meanings, not with traditions, so no student is marked wrong for knowing their own tradition's word. Each is a simplification; within each tradition there are different understandings.

  Christian heritage was taught in *A diverse democracy* (lesson 2), including the one transparency line about First Nations communities that the elaboration on Christianity's impacts calls for; this lesson recalls it rather than repeating it.

  Nothing personal is asked: students are not asked about their own religion or their family's practice. Some students will belong to these traditions and may want to add to them; that's welcome but never required, and their account is theirs, not a lesson resource.

  The food bank and Wattle Creek are made up.
running:
  - "Read: go through the five words aloud. Ask what they have in common."
  - "Predict: take a vote. Many will say different religions share nothing."
  - "Worked example: ask 'Does working together change what each group believes?'"
  - "Vary: the 'particular to one tradition' items are about practice and meaning; keep it to what the lesson says."
  - "Make: the student writes in their own book or document; a partner or teacher reads it. The site only records a reflect tick."
stuck:
  - see: "A student says different religions share nothing."
    ask: "What does each word in the list have to do with?"
    fix: "Each is about giving or helping others: a shared value."
  - see: "A student says sharing a value means they believe the same things."
    ask: "Could two people both value giving for different reasons?"
    fix: "A shared value is common ground. Beliefs can still differ."
support: "Write SHARED VALUE in the middle of the board and the five words around it."
stretch: "Find another value many traditions share. What different reasons might each give for it?"
exit:
  q: "Name a value many traditions share and two traditions' words for it, and explain why sharing a value isn't sharing every belief."
  a: "For example, giving: zakat (Islam) and tzedakah (Judaism). Traditions can value giving for different reasons and still believe different things."
explain: |
  Many religions practised in Australia share values, such as **giving and helping others**, each in its own word: tzedakah (Judaism), zakat (Islam), dana (Buddhism, and Hindu and Jain traditions), seva (Hinduism, and Sikhism), charity (Christianity).

  Shared values don't mean shared beliefs. **Religious freedom** lets people follow any religion, or none, within the law.
