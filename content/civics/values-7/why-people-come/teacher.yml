summary: "Students explain why people come to Australia (pushes such as war and persecution, pulls such as work, family, study, safety and freedom), distinguish migrants from refugees, and connect becoming a citizen to the values named in the citizenship pledge."
learning: "explain why migrants and refugees come to Australia and connect this to values and freedoms in Australian society"
time: 40
timing: "Read 4 min · Predict and Try 6 min · Worked example 10 min · Vary 5 min · Practise 7 min · Make and exit 8 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can explain the difference between a migrant and a refugee.
  - I can give reasons people come to Australia.
  - I can connect a value in the citizenship pledge to why people come.
struggle: "Students blur migrants and refugees, and assume one reason (money) for everyone. Keep the push and pull columns on the board."
before: |
  Integration node (n4): it joins values (lesson 1), whether they're lived (lesson 2) and religious freedom (lesson 3) with why people come to Australia.

  Definitions: a refugee, under the Refugee Convention, is someone outside their own country who can't return because of a well-founded fear of persecution on grounds of race, religion, nationality, membership of a particular social group or political opinion; migrants choose when to leave, where to go and when to return (Australian Human Rights Commission). The Convention's five grounds are the whole list, so student text gives them without "for example". War alone is not persecution under the Convention; in everyday use, and in UNHCR's wider work, people fleeing war are often called refugees too. The student checks use persecution, to match the definition taught. Asylum seekers (people who have applied for refugee protection) are left out of student text to keep two clear terms; add them if your class is ready. Voting: federal elections are for citizens (a small group of British subjects enrolled before 1984 can also vote); the typical step says "generally".

  No made-up hardship stories (Matthew, 1 Nov 2026). Student text teaches reasons as general categories. If you want first-person voices, choose real published accounts from refugee and settlement organisations or public broadcasters (for example the Refugee Council of Australia, UNHCR and SBS; check their current sites), and preview them for your class.

  No current policy debates in student text: immigration levels, visa rules, offshore processing and boat arrivals are left out. Kit's wider item on immigration and refugee policy debates is for you to lead, with views on more than one side, if you take it up.

  Nothing personal is asked. Students are never asked about their own or their family's migration story, visa status or citizenship. Some students in your class may be refugees or from refugee backgrounds; let them choose whether to share anything, and be ready to follow your school's wellbeing process.

  Wattle Creek and its ceremony are made up; the definitions and the pledge are real.
running:
  - "Read: draw PUSH and PULL columns and add a reason to each together."
  - "Predict: take a vote. Many will say migrants and refugees are the same."
  - "Worked example: link back to the pledge from lesson 1."
  - "Practise: 'keeping your culture' links to pluralism in A diverse democracy."
  - "Make: the student writes in their own book or document; a partner or teacher reads it. The site only records a reflect tick."
stuck:
  - see: "A student says migrants and refugees are the same."
    ask: "Did both people choose to leave?"
    fix: "A refugee had to flee because of persecution; a migrant chose to move."
  - see: "A student says people only come for money."
    ask: "What might someone fleeing a war be looking for?"
    fix: "People come for many reasons: safety, freedom, family and study as well as work."
support: "Use the PUSH and PULL columns and add the two definitions underneath."
stretch: "Which values from the first lesson might matter most to someone who arrived as a refugee, and why?"
exit:
  q: "What's the difference between a migrant and a refugee, and give one reason each might come to Australia?"
  a: "A migrant chooses to move (for example for work); a refugee had to flee because of a well-founded fear of persecution (for example seeking safety and freedom)."
explain: |
  People come to Australia for many reasons: some **push** them to leave (war, persecution), others **draw** them here (work, family, study, safety, freedom).

  A **migrant** chooses to move. A **refugee** had to flee because of a well-founded fear of persecution and can't safely return. Many become **citizens** and make a pledge naming democratic beliefs, rights and liberties, and the law.
sources:
  - title: Questions and answers about refugees and asylum seekers (Australian Human Rights Commission)
    url: https://humanrights.gov.au/our-work/questions-and-answers-about-refugees-asylum-seekers
    checked: 2026-11-01
  - title: What is the Australian citizenship pledge? (Department of Home Affairs)
    url: https://immi.homeaffairs.gov.au/citizenship/ceremony/what-is-the-pledge
    checked: 2026-11-01
leads: >-
  This is the last lesson in Values and living together.


  ACARA elaboration for AC9HC7K05 (an example, not a checklist): "investigating why migrants and refugees wish to come
  to Australia and become Australian citizens"
