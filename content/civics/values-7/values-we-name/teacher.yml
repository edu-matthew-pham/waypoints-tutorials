summary: "Students identify values often named as Australian (freedom, respect, fairness, equality of opportunity, a fair go, compassion, inclusion, religious freedom), see how they are expressed through customs and protocols (the anthem, flag and citizenship ceremonies) and institutions, and recognise that many democracies share them."
learning: "identify values often named as Australian and explain how they are expressed in public life"
time: 40
timing: "Predict and Try 8 min · Pledge and worked example 12 min · Vary 6 min · Practise 6 min · Make and exit 8 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can name values often called Australian and say what they mean.
  - I can give an example of how a value shows up in public life.
  - I can explain why these values aren't Australia's alone.
struggle: "Students treat 'Australian values' as values only Australians hold, or as rules everyone already follows. Keep two questions going: do other countries share this? Does naming it mean everyone lives it?"
before: |
  The values are taught as values *often named* as Australian (by ACARA and in government documents such as the citizenship pledge), not as values only Australians hold, and not as a claim that every Australian lives up to them. That second question is the next lesson's hinge.

  Nothing personal is asked. No step asks a student's background, beliefs or family, or how their family marks national days. Some students and families have different feelings about national symbols (the anthem, the flag, 26 January); the lesson states facts about the symbols and keeps views for discussion. Don't ask students to declare a stance on any symbol.

  Facts: Advance Australia Fair became the national anthem on 19 April 1984, and on 1 January 2021 one word changed ("young" to "one") in the second line (Parliamentary Education Office). The citizenship pledge has two versions, one with "under God" and one without (Department of Home Affairs). The student text says "one" is about unity and leaves the reasons for the change to you; if you discuss them, note the change was linked to recognising First Nations peoples' long history, and keep to what was said at the time.

  Wattle Creek's ceremony is made up; the pledge and anthem are real.
running:
  - "Predict: take a vote. Many will say only Australians value a fair go. Mention France's motto."
  - "Pledge: read it aloud. Ask which words name a value."
  - "Vary: the equal vote is a good example of a value shown through how an institution works."
  - "Make: the student writes in their own book or document; a partner or teacher reads it. The site only records a reflect tick."
stuck:
  - see: "A student says these values only belong to Australia."
    ask: "Could people in another country want everyone to have a fair chance?"
    fix: "Many democracies share these values. 'Fair go' is Australia's name for one of them."
  - see: "A student says a fair go means everyone gets the same."
    ask: "Is it about the same result, or the same chance?"
    fix: "A fair go is a fair chance, not the same result for everyone."
support: "Write VALUE and HOW IT'S SHOWN as two columns and fill them in for the pledge together."
stretch: "Pick a value and find a place in public life where it shows up, and a place where it might not."
exit:
  q: "Name two values often called Australian and one way each shows up in public life."
  a: "For example, respect for rights and liberties (named in the citizenship pledge) and equality (every adult citizen's vote counts the same)."
explain: |
  Some values are **often named as Australian**: freedom, respect, fairness, a fair go, equality of opportunity, compassion, inclusion and religious freedom.

  They show up in public life through customs and protocols (the anthem, flag and citizenship ceremonies) and through how institutions work. Many democracies share them.
sources:
