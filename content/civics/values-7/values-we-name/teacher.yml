    url: https://peo.gov.au/understand-our-parliament/history-of-parliament/history-milestones/australian-parliament-history-timeline/events/new-national-anthem/
    checked: 2026-11-01
leads: >-
  Next in this course: Do we live our values?


  ACARA elaborations for AC9HC7K05 (examples, not a checklist): "identifying how Australian values can include
  patriotism, inclusion, civility, personal and collective responsibility, compassion, equality, justice, a 'fair go'
  and religious freedom, and evaluating the extent to which values are reflected in Australian society"; "identifying
  shared values across the diverse communities within Australia and how these can be expressed through customs and
  protocols such as flag-raising ceremonies and singing the national anthem (this could include investigating the
  history of changes to our national anthem)"
