summary: "Students learn that Australia has a secular government in a multi-faith, pluralist society: section 116 limits the Commonwealth, not people's beliefs, and religious people take part in public life. They define secular, multi-faith, pluralist, culturally diverse and diverse society."
learning: "explain what secular, multi-faith and pluralist mean and why Australia can be secular and multi-faith at once"
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 6 min · Practise 6 min · Make and exit 8 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can explain secular, multi-faith and pluralist in my own words.
  - I can explain that secular describes the government, not the people.
  - I can say what section 116 of the Constitution stops the Commonwealth doing.
struggle: "Students read secular as 'no religion' or 'against religion'. Keep asking: is this about the government, or about people?"
before: |
  Hinge n1. Kit's reason: without a clear idea of what secular means in Australian constitutional terms, students conflate secular government with irreligion or hostility to religion, and misread the heritage and diversity lessons that follow. Use the smaller check before moving on.

  Nothing personal is asked in this course. No step asks a student's religion, beliefs, background or family, and every example is made up or public data. Students who choose to mention their own background are welcome, but never required, and nothing they share should be recorded or used as an example without their agreement. Made-up people are not given a religion as their identity.

  Section 116 limits only the Commonwealth, not the states. Its four parts: no law establishing a religion, imposing religious observance or prohibiting the free exercise of any religion, and no religious test for any office or public trust under the Commonwealth. Whether members of Parliament hold an "office under the Commonwealth" for section 116 is a legal question; the student text says only that no rule for standing for Parliament is about religion, which is true of the qualifications in sections 34 and 44. The courts have read section 116 narrowly; that detail is left out.

  "Secular" has more than one meaning. The lesson uses the descriptor's sense (government separate from religion). The wider step separates a secular state from a secular society and is discussion only: students may reasonably answer differently, and nothing is marked.

  Wattle Creek, the candidate and the club are made up. Whether religion should have more or less place in public life is a values question for discussion, not something the site marks or takes a side on.
running:
  - "Predict: take a vote. Many will say no. Leave it open until the worked example."
  - "Try: stop on secular. Ask 'secular what: secular people, or a secular government?'"
  - "Worked example: read section 116's four parts aloud before Nib's mistake."
  - "Vary: government or society is the key move. Ask students to say which word goes with which."
  - "Make: the student writes in their own book or document; a partner or teacher reads it. The site only records a reflect tick."
stuck:
  - see: "A student says secular means religion isn't allowed."
    ask: "Is section 116 a rule for the government, or for people?"
    fix: "Secular limits the government. People can follow any religion, or none."
  - see: "A student says multi-faith means each person has several religions."
    ask: "Is multi-faith about one person, or about the whole country?"
    fix: "Multi-faith describes the society: many religions, and none, are part of it."
support: "Draw two boxes: GOVERNMENT and SOCIETY. Put secular in one and multi-faith and pluralist in the other, then sort the Vary items aloud."
stretch: "Can a country have an official religion and still respect people of every faith? What would you need to know to decide?"
exit:
  q: "How can Australia be secular and multi-faith at the same time?"
  a: "Secular describes the government, which favours no religion. Multi-faith describes the society, where people follow many religions or none."
explain: |
  **Secular** describes the government: it is separate from religion. Section 116 of the Constitution stops the Commonwealth from setting up a religion, forcing or stopping religious practice, or using a religious test for a Commonwealth job.

  **Multi-faith** and **pluralist** describe society: many religions, and none, are part of Australian life, and that variety is accepted side by side.
