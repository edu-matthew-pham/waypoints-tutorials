leads: >-
  This is the last lesson in A diverse democracy. First Nations histories and cultures are taught in class.


  ACARA elaboration for AC9HC7K04 (an example, not a checklist): "identifying trends regarding religious observance
  and/or cultural heritage in Australian society, using the Australian Bureau of Statistics and other data sources"
