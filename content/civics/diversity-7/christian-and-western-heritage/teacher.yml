summary: "Students identify features of Australia's political and legal systems that come from Christian heritage (Parliament's prayers, Christmas and Easter holidays, the oath) and Western (British) traditions (common law, Westminster, juries), and explain that a tradition is not an official religion. Weighing how much heritage should shape public life is discussion only."
learning: "identify features of Australia's political and legal systems that come from Christian and Western heritage and explain why a tradition is not an official religion"
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Practise 8 min · Make and exit 8 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can give examples of Christian and Western heritage in Australia's political and legal systems.
  - I can explain why a tradition isn't the same as an official religion.
  - I can describe different views about heritage without saying who is right.
struggle: "Students jump from 'this came from Christianity' to 'Australia has an official religion'. Bring back section 116 from the last lesson: traditions, yes; an official religion, no."
before: |
  "Christian heritage" and "Western heritage" are the descriptor's terms and are kept. The student text says they are one strand among several and that people weigh their influence differently. How much heritage should shape public life is a values question: the wider step is discussion only, with reasons on each side and no marked answer. Don't take a side.

  First Nations content: Kit's criterion asks students to "acknowledge that the influence of Christian heritage has had varied impacts on different communities", and its wider item names missions and government policies. Following the site's First Nations rule, the student text has one line only, naming that different communities, including First Nations communities, experienced this heritage differently, and saying the teacher may take it up. It explains nothing. If you take it up, start from ACARA's elaborations (below) and use First Nations-led sources and local, community-approved material; ask your school's Indigenous education contact first. No sources are linked here until a First Nations educator has looked.

  Facts: the Senate and the House of Representatives begin each sitting day with prayers under their standing orders; members are not required to be present or take part; since 2010 an Acknowledgement of Country comes before the prayers (Parliamentary Education Office, below). Some members have tried to replace the prayers with a time for reflection, and others have argued to keep them; that is a live debate, so the student text states the practice and leaves the debate to the wider discussion in general terms. The oath or affirmation is set out in the Schedule to the Constitution (section 42). Christmas Day, Good Friday and Easter Monday are public holidays in every state and territory.

  The class and its table are made up. Nothing personal is asked: students don't say which holidays or traditions their own family keeps.
running:
  - "Predict: take a vote. Link back to section 116 when you reveal."
  - "Try: ask which column is harder to fill, and why."
  - "Worked example: the oath or affirmation is the key example. Ask why offering both matters."
  - "Practise: ask students to say 'tradition' or 'rule' for each case."
  - "Make: the student writes in their own book or document; a partner or teacher reads it. The site only records a reflect tick."
stuck:
  - see: "A student says the prayers mean Australia has an official religion."
    ask: "What does section 116 stop the Commonwealth doing?"
    fix: "It can't set up a religion. The prayers are a tradition, and no one has to take part."
  - see: "A student says the affirmation is a lesser promise."
    ask: "Is the promise any different, or only the words about God?"
    fix: "It is the same promise and counts the same. The affirmation just doesn't name God."
support: "Write TRADITION and RULE on the board. Read each example and ask which word fits."
stretch: "How can a country keep traditions from one religion and still treat people of every belief equally?"
exit:
  q: "Give one example of Christian heritage and one of Western heritage in Australia's system, and say why a tradition isn't an official religion."
  a: "For example, Parliament's prayers (Christian) and the common law (Western). A tradition is a practice; section 116 stops the Commonwealth setting up a religion or making anyone follow one."
explain: |
  Some features of Australia's system come from **Christian heritage** (Parliament's prayers, Christmas and Easter holidays, the oath) and some from **Western (British) heritage** (the common law, the Westminster Parliament, juries).

  A tradition isn't an official religion: no one has to take part, and section 116 stops the Commonwealth setting up a religion. People weigh this heritage differently, and different communities have experienced it differently.
