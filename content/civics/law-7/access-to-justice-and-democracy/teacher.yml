summary: "Students connect the course to democracy: a fair legal system protects rights, keeps government under the law and settles disputes peacefully, and access to justice (legal aid, community legal centres, interpreters, plain processes) is what makes equal laws real in practice."
learning: "explain how a fair legal system supports democracy and how people can get access to justice"
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 6 min · Practise 8 min · Make and exit 6 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can explain one way a fair legal system supports democracy.
  - I can explain why equal laws don't always mean equal chances.
  - I can name kinds of help that give people access to justice.
struggle: "Students think equal laws mean equal chances. Use Tarn: the law is the same, but knowing the rules and having help is not."
before: |
  Integration node (n4): it pulls lessons 1 to 3 together with the democratic principles from How Australia is governed and Freedoms and taking part.

  What is a view and what is settled: that access to justice matters for democracy is broadly agreed and is in ACARA's elaborations. How well Australia provides it, and how much legal aid should be funded, is debated; the student text says so and gives no figures or policy positions. Keep the Wider step a discussion: students may reasonably rank the barriers differently, and nothing is marked.

  Legal aid is simplified in student text as "depending on your income and your case". In practice each state and territory's legal aid commission uses a means test (income and assets), guidelines on which kinds of matter it funds, and usually a merit test (is the case likely to succeed and worth public money); free information and some advice are available more widely (Legal Aid Queensland's guide, below, is one example). Bond disputes usually go to a tenancy tribunal rather than a court; the student text says "courts and tribunals" where it matters.

  First Nations content: Kit's wider items here include comparing access to justice across groups by cultural background. Following the site's First Nations rule, the student steps keep to cost, distance and know-how and write nothing about First Nations people's experience of the justice system. If you take it up, start from ACARA's elaborations (below) and use First Nations-led sources and local, community-approved material; ask your school's Indigenous education contact first.

  Tarn, the landlord, the council and Wattle Creek are made up.
running:
  - "Predict: take a vote on 'same chance'. Ask what Tarn doesn't know that the company's lawyers do."
  - "Try: ask who has heard of a community legal centre. Many won't have."
  - "Worked example: let Nib's line 3 sit. Ask if 'the same law' and 'the same chance' mean the same thing."
  - "Practise: books out for the reasoning task. Students compare with the models and tick their own self-check."
  - "Make: the student writes in their own book or document; a partner or teacher reads it. The site only records a reflect tick."
stuck:
  - see: "A student says everyone has the same chance because the law is equal."
    ask: "If you didn't know the rules or the forms, could you still use the law well?"
    fix: "Equal laws need help to be used equally. That is access to justice."
  - see: "A student thinks courts help democracy by agreeing with the government."
    ask: "What could a court do if the government broke the law?"
    fix: "Independent courts can rule against the government, which keeps it under the law."
support: "Draw a see-saw: law on one side, money and know-how on the other. Ask what legal aid adds."
stretch: "If you could fund only one kind of help (legal aid, community legal centres or interpreters), which would you choose, and who might disagree?"
exit:
  q: "Give one way a fair legal system supports democracy, and one kind of help that gives people access to justice."
  a: "For example: independent courts keep the government under the law. Legal aid or a community legal centre helps people who can't afford a lawyer."
explain: |
  A fair legal system supports democracy: it protects rights, keeps the government under the law, and settles disputes peacefully.

  Equal laws only help if people can use them. **Access to justice** comes from help such as **legal aid**, **community legal centres** and **interpreters**. Most people agree it matters; how well Australia provides it is debated.
sources:
  - title: Can I get legal aid? (Legal Aid Queensland)
    url: https://legalaid.qld.gov.au/Find-legal-information/Factsheets-and-guides/Factsheets/Can-I-get-legal-aid
    checked: 2026-11-01
leads: >-
  This is the last lesson in Law and justice.


  ACARA elaborations for AC9HC7K03 (examples, not a checklist): "making connections between a fair and just legal
  system and democratic principles"; "exploring how Australians can receive access to justice and can apply for
  legal representation, such as through legal aid"
