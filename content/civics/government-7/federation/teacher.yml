summary: Federation shares constitutional power between the Commonwealth and the states. State and territory
  governments run many everyday services, while responsibilities can overlap.
time: 40
timing: Predict and Try 8 min · Worked example 12 min · Vary 6 min · Practise 6 min · Make and exit 8 min.
  Optional width is extra.
goals:
  - I can explain what federation means.
  - I can give examples of Commonwealth and state or territory responsibilities.
  - I can distinguish state powers, territory self-government and local council responsibilities.
struggle: Students see a ladder with the national government on top. Keep asking what lawful power authorises
  a decision, and distinguish paying for a service from running it.
before: "Usually Year 7. Do not imply states and territories have identical constitutional positions: s122
  permits Commonwealth territory laws. Councils are created by state or territory law; the ACT has no local
  councils. The responsibility sort deliberately says running public schools/hospitals and ordinary
  state/territory police, rather than treating education, health or all policing as exclusive state subjects.
  Section 109 assumes a valid Commonwealth law and applies only to inconsistency; it does not grant a new
  federal power. The label laws and Nib’s claim are made up, not legal advice about real services.
  Federation’s trade and defence arguments are two examples, not a complete history or a claim that everyone
  agreed. Before Year 7 three-levels catch-up is still planned; do not link to an unbuilt lesson."
stuck:
  - see: A student says federal is in charge of all state decisions.
    ask: Why keep state parliaments if every decision belongs to the Commonwealth?
    fix: The Constitution divides powers rather than turning states into national departments.
  - see: A student thinks receiving funds means giving up operation.
    ask: Can one government help pay while another runs the service?
    fix: Yes. Health and education involve shared responsibilities and funding.
support: Start with national defence and running a public school. Say the job precisely before deciding which
  government.
stretch: Explain how section 109 can resolve a conflict without making the Commonwealth an unlimited law-maker.
exit:
  q: What makes Australia a federation? Give one responsibility at each level of the Commonwealth–state
    division.
  a: The Constitution divides powers between national and state governments. Defence is Commonwealth; running
    public schools is state or territory, with funding also coming from the Commonwealth.
explain: Federation joins states in one country with a national government and a constitutional division of
  powers. Defence is national; states and territories run public schools and hospitals. Responsibilities and
  funding can overlap. Territories and local councils have different legal foundations from states.
