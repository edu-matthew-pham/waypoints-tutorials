running:
  - "Predict: collect answers before revealing the result."
  - "Try and worked example: give the chain time; ask students to explain the support and accountability
    arrows."
  - "Vary and Practise: ask for reasons, not just labels."
  - "Make: the student writes in their own book or document; a partner or teacher reads it. The site only
    records a reflect tick."
leads: >-
  Next in this course: Power shared, power checked.


