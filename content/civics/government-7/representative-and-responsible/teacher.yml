summary: Voters choose representatives. The government is drawn from Parliament and must answer to it, with
  the support of the House of Representatives.
learning: "explain how a House vote leads to a government and why ministers must answer to Parliament"
time: 44
timing: Predict and Try 8 min · Worked example 12 min · Vary 6 min · House board 4 min · Practise 6 min · Make
  and exit 8 min. Optional width is extra.
goals:
  - I can trace a House vote through to the formation of government.
  - I can explain how ministers come from and answer to Parliament.
  - I can describe the roles of the House, Senate and Governor-General.
struggle: The counter-intuitive move is that ministers are both in Parliament and accountable to it. Let
  students reorder the chain and explain its arrows before supplying the terms.
before: "Hinge n2: without the accountability link between executive and legislature, students misread who
  holds power. Spend time on the chain and the direct-election slip before leaving this waypoint. Majority
  support, not merely being the largest grouping, is the test; support can come from members outside the
  governing grouping. The chain is a teaching sequence, not a full legal timetable. Section 64 permits a
  minister to hold office outside Parliament for up to three months: the core states the continuing rule, not
  that exception. No current office holders, named parties or real election results are used in student
  steps. Nib and all situations are made up. The 1975 dismissal is left for a teacher-led extension after
  understanding is secure.


  The House board (Practise: who has the numbers?) is a model. It is a made-up House of 15 with two made-up
  sides named by letter, coloured so neither looks like a real party. It leaves out the Speaker, who is a
  member but usually votes only to break a tie, so real majorities are counted with more care. \"Backing\" a
  side means supporting it on confidence and supply (keeping it in office and passing its budget), not agreeing
  with it on everything or joining it. The Senate is left out because it does not decide who forms government.


  A real example, if you want one (teacher-led; not in student steps): the 2010 federal election gave the first
  hung parliament since 1940. No party or coalition won a majority of House seats (Labor 72, the Coalition 73,
  with 76 needed). Labor formed a minority government on 7 September 2010 after 4 of the 5 crossbench members
  agreed to support it. Keep it to what happened, as the board does: who backed whom, not whether they were
  right."
stuck:
  - see: A student says they vote for Prime Minister.
    ask: What electorate is on the House ballot?
    fix: A House ballot chooses a local member; the leader able to command House support is appointed Prime
      Minister.
  - see: A student says the side with the most seats always forms government.
    ask: On the board, how many members does Side A need, and how many does it have?
    fix: A side governs with the support of more than half the House, which can include crossbench members who
      back it without joining it.
  - see: A student says the executive is outside Parliament.
    ask: What other job does a minister still have?
    fix: They are a parliamentarian as well as a minister.
support: Lay out five chain cards. Ask which arrow explains why the government must keep the support of the House.
stretch: Compare a Question Time question with a vote testing House confidence. Which asks for an explanation,
  and which tests the ability to govern?
exit:
  q: How is the government connected to the voters, and who checks it between elections?
  a: Voters elect representatives. House majority support allows government to form; ministers come from
    Parliament and answer to it between elections.
explain: We elect representatives. Government needs majority support in the House, which can include members
  who back a side without joining it. The Governor-General
  formally appoints the Prime Minister and ministers. Ministers come from Parliament and remain answerable to
  it.
