summary: Authority comes from the people. Australia shares law-making, executive and judicial powers, with
  ministers in Parliament and independent courts.
time: 40
timing: Predict and Try 8 min · Worked example 12 min · Vary 6 min · Practise 6 min · Make and exit 8 min.
  Optional width is extra.
goals:
  - I can explain popular sovereignty and representation.
  - I can distinguish legislative, executive and judicial work.
  - I can explain why Australia’s separation of powers is partial.
struggle: Students may think separate powers means no shared membership. Ask them to identify the minister’s
  two roles and the court’s different position.
before: "Usually Year 7. This follows the n2 hinge: retrieve the minister’s parliamentary membership before
  adding the three powers. The diagram is a simplified view of Commonwealth functions, not an exhaustive
  constitutional chart. Parliament and the executive both include the Crown; say this explicitly so the
  shorthand does not erase the Governor-General. Popular sovereignty is taught as a democratic principle, not
  a claim that every person can make binding law directly. All disputes and statements by Nib are made up. No
  current office holders, parties or live policy debates."
stuck:
  - see: A student confuses legislative with executive.
    ask: Is this making a rule or carrying an existing rule out?
    fix: Name the job before naming the branch.
  - see: A student says independent courts can do anything.
    ask: What must a court use to explain its judgement?
    fix: Independence means freedom from directions in deciding cases, not freedom from law. Judgements give
      reasons and can be reviewed through appeals where available.
support: "Use three job cards first: make, carry out, decide a legal dispute. Then attach the institutional names."
stretch: Why might elections and independent courts both matter even when a government has popular support?
exit:
  q: Why is Australia’s separation of powers called partial?
  a: Ministers belong to Parliament and the executive. Courts decide legal disputes independently of both.
explain: People are the source of democratic authority and elect representatives. Parliament makes laws, the
  executive carries them out, and courts decide legal disputes. Ministers sit in Parliament, so the separation
  is partial; judicial decisions remain independent.
