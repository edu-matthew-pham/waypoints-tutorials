summary: Australia combined Westminster responsible government and constitutional monarchy with a written
  federal constitution and equal state representation in the Senate.
time: 40
timing: Predict and Try 8 min · Worked example 12 min · Vary 6 min · Practise 6 min · Make and exit 8 min.
  Optional width is extra.
goals:
  - I can identify two Australian features from Westminster and two from the US federal model.
  - I can explain why the founders combined these influences.
  - I can connect the mixture to the earlier four lessons.
struggle: Naming a feature is easier than explaining the compromise. Ask what problem an equal-state Senate
  addressed and what responsible government keeps accountable.
before: Integration n5 is required, not an optional extension. Usually Year 7. Teach influences rather than a
  binary claim that every feature came solely from one place. The Governor-General is Australia’s
  representative of the monarch, not an office copied from the UK itself. Both states and territories elect
  senators, but equal state representation does not mean equal territory representation. No seat counts,
  current office holders, named parties, real election results or live policy debates. Nib’s explanation is
  made up. Keep wider discussion structural and neutral; do not mark an opinion. No First Nations content is
  written here; the K01 elaboration concerns the institutions and origins.
stuck:
  - see: A student says Australia is a copy of Britain.
    ask: Where do the written federal constitution and equal-state Senate fit?
    fix: The Australian arrangement combines Westminster and US federal influences.
  - see: A student lists four features but gives no reason for the mix.
    ask: What were smaller colonies worried about?
    fix: Equal state representation protected their voice while the House represented people broadly by
      population.
support: "Give four feature cards: responsible government, monarchy, written federal constitution, equal-state
  Senate. Ask for two pairs and one reason."
stretch: Can equal state representation and population-based representation both serve a purpose? Discuss the
  trade-off without marking a preferred position.
exit:
  q: Name two features from each tradition and explain why the founders combined them.
  a: "Westminster: responsible government and constitutional monarchy. Washington: written federal constitution
    and an equal-state Senate. The combination joined parliamentary accountability with national cooperation
    and a protected voice for smaller states."
explain: Westminster contributed responsible government and constitutional monarchy. The US federal model
  influenced the written federal constitution and equal state representation in the Senate. The combination
  kept ministers answerable to Parliament while joining states with a protected voice.
