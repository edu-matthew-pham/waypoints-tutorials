summary: "Students choose where to look from what the question needs (a count, a rule, a view), name four kinds of source (government, news, specialist report, statistics), and search with a few strong words, an exact phrase and a narrower place. History's primary and secondary sources and Geography's fieldwork are not here; they are in those subjects."
time: 40
timing: "Think first and Try 10 min · The idea 10 min · Vary 6 min · Check 5 min · Make 8 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can say what would answer a question and who would have it.
  - I can name four kinds of source and what each is good for.
  - I can write a search with a few strong words.
struggle: "Students often go straight to a search engine and take the first result. Ask 'Who would have written this down?' before they type."
before: |
  This lesson opens Finding information, after Asking questions. The Year 6 catch-up Find it and sort it (in Before Year 7: HASS) is the floor.

  All pages are made up. Search symbols differ between tools; the lesson names quote marks and a site limit and says to check the tool's help. Check what your students' search tool does before the lesson. Pair this with ICT's Search like you mean it if you want longer practice.

  The Economics hinge node asks for two relevant sources found with a search engine; the Civics hinge asks for three types of source and what each provides. Both are covered by the Try and The idea steps and the Make step.
running:
  - "Think first: ask for votes before the answer. Many will pick the web search."
  - "Try: ask which kind of source each pair is."
  - "The idea: let Nib's line sit. Ask where the count is written down."
  - "Make: let students use their real unit topic if you have one."
stuck:
  - see: "A student says to search the whole question as a sentence."
    ask: "Which words are the thing, the place and the detail?"
    fix: "Keep those and drop the rest."
  - see: "A student takes the first result."
    ask: "Who would have this written down?"
    fix: "Go to the source that would have it."
stretch: "Find a question where two kinds of source would give different answers. Say why."
support: "A card with: 'What would answer it? Who would have it? What are the strong words?'"
leads: |
  Next in Investigate like a humanities expert: Keep what answers your question.
exit:
  q: "How do you decide where to look?"
  a: "Ask what would answer the question and who would have it, then search with a few strong words in that place."
explain: |
  Ask **what would answer it, and who would have it.** Then search with a few strong words.
