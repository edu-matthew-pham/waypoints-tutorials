summary: "Students judge a made-up learner who chose her own goal but never checks, sort learners by who chose the goal and whether they check, match three ideas that get mixed up (self-directed learning, self-regulated learning, everyday self-regulation), and find Nib's slip (choosing the goal means you're learning well). Typical width (Years 7 and 8): a long project with frustration in it."
time: 40
timing: "Engage 6 min · Explore 10 min · Explain 12 min · Elaborate 5 min · Evaluate 7 min"
goals:
  - I can explain the difference between choosing what to learn and steering how I learn it.
  - I can say how managing my feelings helps me keep learning when I'm stuck.
struggle: "Students treat 'self-directed' and 'self-regulated' as the same thing. Keep coming back to the two questions: who chose the goal? Is the learner checking how it's going?"
before: |
  **The distinction.** Self-directed learning (from adult education, Malcolm Knowles) is about the learner choosing goals, resources and approach: the *what* and *why*. Self-regulated learning (Zimmerman, Pintrich, Winne) is about planning, monitoring and adjusting on a task, which can be set by someone else: the *how*. Everyday self-regulation (managing emotions and behaviour) overlaps with both. The research uses these words in slightly different ways; the lesson keeps them simple on purpose, and that's fine to say if a student asks.

  **Why it matters at school.** Most school tasks are set by teachers, so self-regulated learning is the one students use most. Projects, homework and anything outside school ask for both.

  **There's no single right answer** in the Engage question or the class debate. Accept reasoned views.

  Years 6: give the link with `?width=minimum` to hide the bridge project scenario.
running:
  - "Engage: take a quick vote, then ask a 'great learner' voter and a 'not so good' voter to explain."
  - "Explore: draw the two questions as a 2 by 2 grid on the board and place the learners in it as a class."
  - "Explain: point out that Mei didn't choose her task and is still steering it well."
  - "Elaborate (Years 7 and 8): ask what Priya should do first, before any plan. (Calm down.)"
  - "Run the class debate in the class plan before Evaluate."
stuck:
  - see: "A student thinks any task a teacher sets can't be self-regulated."
    ask: "Who decides how Mei does the worksheet: the teacher or Mei?"
    fix: "The teacher chose the goal. Mei is steering how she gets there."
  - see: "A student thinks self-regulation means 'behaving'."
    ask: "What does calming down when you're stuck have to do with learning?"
    fix: "Frustration is often when people stop checking and start guessing. Managing it keeps the learning going."
  - see: "A student says Jun is fine because she enjoys it."
    ask: "Is enjoying it the same as getting better at it?"
    fix: "Both matter. Enjoying it is great; if she wants to improve, she needs a check too."
stretch: "Describe a project you could choose yourself, and the one check you'd build in from the start."
support: "The two questions on a card: Who chose the goal? Is the learner checking how it's going?"
leads: |
  Next: when easy fools you. Why some study feels like learning but isn't much.

  Links: Does AI Help Us Learn? looks at who decides what learning is worth (Years 7 and up).
exit:
  q: "Name one thing someone could do to steer a task their teacher set."
  a: "Make a plan, check it against the task partway through, or test their answers before finishing."
explain: |
  Two questions pull these ideas apart: **who chose the goal**, and **is the learner checking how it's going?**

  **Self-directed learning** is choosing what to learn and why. **Self-regulated learning** is planning, checking and adjusting while you learn, even on a task someone else set. **Self-regulation** in the everyday sense is managing how you feel and act, which helps with both.
