inquiry:
  q: "Why do people keep using a strategy that isn't working, like reading the question again and again?"
  prompts:
    - "Is it easier than trying something new?"
    - "How would you notice a strategy isn't working?"
    - "Why might people drop a new one too soon?"
  notes: "Familiar strategies feel safe; new ones feel slow at first. Noticing which is which is the coach's job."
activities:
  - at: investigate
    kind: activity
    title: "Watch me coach myself: what is it asking?"
    minutes: 4
    do: |
      Watch your teacher read a task out loud and work out what it's asking, in the voice of a learning coach.
    notes: "Use a real task from your own subject with more than one part. Model the Model step of NEMO-T: 'OK, what is it asking… is that all? No, keep reading…' Let yourself nearly miss a part and catch it."
  - at: make
    kind: activity
    title: "Plan it"
    minutes: 10
    do: |
      On your own: choose a task, one strategy, and write your if-then plan. Keep it for yourself.
    notes: "Quiet work. Circulate and help students without a task choose from the list. Don't collect."
  - at: end
    kind: info
    title: "Did it help?"
    do: |
      We'll come back to this in a week or two: did your strategy help? Did you hit the dip? What would you change?
    notes: "Set a date. Ask the class as a whole, hands up; nobody has to say what they chose. This follow-up is NEMO-T's Transfer and reflection, and matters more than anything in the lessons."
questions:
  - at: investigate
    title: "Which kind of stuck?"
    type: question
    q: "You've got an answer, but it seems far too big. Which strategy fits?"
    options: ["Check your confidence: does it make sense?", "What is it asking?", "Make a plan"]
    answer: 0
    explain: "An answer that doesn't fit is a 'during' signal to check, perhaps by estimating."
