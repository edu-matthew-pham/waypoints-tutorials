summary: "Students learn the next two questions to ask of any source: context (what was going on when it was made, not just the place) and purpose (why it was made). The second hinge lesson on this skill: students who answer 'ancient China' for context and 'it shows the emperor' for purpose cannot combine the four questions in the next lesson."
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 8 min · Practise 6 min · Make 6 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can say what was going on when a source was made, beyond its place and period.
  - I can say why a source was made, without mixing that up with what it shows.
  - I can write a context and a purpose for a source in my own words.
struggle: "Students give a place or period for context ('ancient China') and content for purpose ('it shows the emperor'). Ask 'What was happening at that moment?' and 'What did the maker want?', and let them argue before you settle it."
before: |
  This is a hinge lesson. Lesson 4 (what can it tell us?) needs students to treat all four questions as distinct. If this lesson goes thinly, the combined conclusion will blur context with setting and purpose with content. Spend the time here.

  Context and purpose are sometimes opinions or inferences. For ancient sources, historians reason from what they know of the time. The cards give one defensible reading. If your class's depth study has a different view of why an inscription or a tomb was made, discuss it. Judge the reasoning, not whether it matches the card.

  The worked example is ancient China in the Qin and Han period, and it is a model: the same questions work on any society. For the tomb (Source A), the usual reading is that the army was made to protect the emperor after his death. Keep modern links factual: the site is a World Heritage site; avoid claims about China today.

  Everything beyond the described sources is made up (Ravi, Dev). Do not ask students about their families or beliefs.
running:
  - "Predict: ask for votes. 'Ancient China' sounds like a context. Ask what it would leave out."
  - "Try: the match has four different purposes for four sources. Ask students to say why the label is different from the other three."
  - "Worked example: let Nib's mistake sit before explaining it. Ask students what 'ancient China' leaves out."
  - "Vary: ask who each source was written for. The answer changes between Source B and Source C."
  - "Make: read one or two out if students are happy to, without names."
stuck:
  - see: "A student gives 'ancient China' as a context."
    ask: "What was going on in ancient China at that moment? What had just happened?"
    fix: "Go back to Source C. The Qin had just joined rival kingdoms into one empire. A setting says where. A context says what was happening."
  - see: "A student gives what a source shows as its purpose."
    ask: "Is that what it shows, or why someone made it?"
    fix: "Purpose is what the maker wanted it to do. Showing the emperor is content."
  - see: "A student says a source made to praise someone is useless."
    ask: "Useless for what question?"
    fix: "It is good evidence of how the maker wanted to be seen. Lesson 4 picks this up."
stretch: "Sima Qian wrote for the Han court, about a century after the Qin fell. Who his readers were could shape what he chose to say. Does that make his history wrong? This is the same idea at greater width. It does not go on to the next lesson."
support: "A card with two questions: 'What was going on? (an event or condition, not a place)' and 'What was it for? (what did the maker want?)'. Students write one sentence for each."
leads: |
  Next in Source origin and purpose: What can this source tell us? (all four questions together).

  Wider (teacher choice, not part of the student steps): ACARA's elaboration for AC9HH7S03 includes explaining "the difficulties in identifying the origin and purpose of some sources, such as the Kimberley Bradshaw paintings". These are culturally significant to First Nations people and are not used as an example here. If you use them, start from ACARA's elaboration and ask your school's First Nations contact for community-approved material.
exit:
  q: "The First Emperor had an inscription cut into stone on a mountain. Give its context and its purpose, in a sentence each."
  a: "Context: the Qin had just defeated rival kingdoms and joined them into one empire. Purpose: to show his power and win people's support for his rule."
explain: |
  **Context** is what was going on when a source was made. A place or a period is not enough.

  **Purpose** is why it was made. What it shows is its content, not its purpose.
