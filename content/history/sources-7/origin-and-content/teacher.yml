summary: "Students learn the first two questions to ask of any source: origin (who made it, when and where) and content (what it shows or says). The first of two hinge lessons on this skill: students who read the maker off the content (a soldier made it because it shows a soldier) carry the mistake into every later question about context and purpose."
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 8 min · Practise 6 min · Make 6 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can say who made a source, when and where.
  - I can say what a source shows or says, without mixing that up with who made it.
  - I can keep origin and content apart in my own words.
struggle: "Students answer 'who made it?' by looking at what the source shows. A clay soldier must have been made by a soldier. Ask 'Who might have made it? How do you know?' and let them argue before you settle it."
before: |
  This is a hinge lesson. Lesson 3 (context and purpose) only works if students can keep origin and content apart. If this lesson goes thinly, the later questions will be answered from the content alone. Spend the time here.

  The worked example is ancient China in the Qin and Han period. It is a model: for your own depth study, swap in sources from Egypt, Greece, Rome, India or another, with the same two questions. A silver Roman coin (Source E, typical) shows how one is swapped in.

  The source cards are plain-words descriptions, not quotations. The inscription (Source C) is the exception worth knowing: the original stones are mostly lost, and the words survive as copied in Sima Qian's history. The card summarises what the inscriptions are known to say, in our own words. The clay warriors, the bamboo slips from Shuihudi (1975) and the museum label are real or described accurately.

  The first lesson (optional) covers primary and secondary. A class that has not done it can still use this lesson, though they will not yet have met the words primary and secondary.
running:
  - "Predict: ask for votes. 'Who made it?' and 'What does it show?' sound alike on purpose."
  - "Try: stop at 'It was buried near the First Emperor's tomb'. A place can feel like content. It is origin."
  - "Worked example: let Nib's mistake sit before explaining it. Ask which line is wrong, then why."
  - "Vary: ask students to give the reason as well as the answer."
  - "Make: read one or two out if students are happy to, without names."
stuck:
  - see: "A student says a soldier made the clay warrior because it shows a soldier."
    ask: "Does what it shows tell you who made it?"
    fix: "Go back to the card. It was made by craftsmen in workshops. Showing a soldier is content."
  - see: "A student says 'it is from China' is the whole origin."
    ask: "Who made it? When? Which part of China?"
    fix: "Origin is who, when and where. Country alone is only one part of where."
  - see: "A student puts a fact about the museum label into the wrong group."
    ask: "Is that about how it was made, or what it says?"
    fix: "Go back to the label. When it was written and by whom is origin. What it says is content."
stretch: "Some sources have no known maker. A small clay figure found with no record of where is hard to place. What can you still say about it? This is the same idea at greater width. It does not go on to the next lesson."
support: "A card with two columns: Origin (who, when, where) and Content (what it shows or says). Students write a fact in the right column before they sort."
leads: |
  Next in Source origin and purpose: Why was it made, and what was going on? (context and purpose).

  Wider (teacher choice, not part of the student steps): ACARA's elaboration for AC9HH7S03 includes "explaining the difficulties in identifying the origin and purpose of some sources, such as the Kimberley Bradshaw paintings". These are culturally significant to First Nations people and are not used as an example here. If you use them, start from ACARA's elaboration and ask your school's First Nations contact for community-approved material on how the Traditional Owners speak of them. Do not generalise from outside sources.
exit:
  q: "A clay warrior shows a soldier in armour. What does that tell you about its origin, and what does it tell you about its content?"
  a: "Nothing about its origin: who made it, when and where are separate questions. It tells you its content: what it shows."
explain: |
  **Origin** is who made a source, when and where. **Content** is what it shows or says.

  They are different questions. What a source shows does not tell you who made it.
