learning: "explain the First Emperor's legacy within and beyond his lifetime and how different writers saw him, keeping 'significant' separate from 'good'"
summary: "Describe what ended with the Qin and what the Han and later dynasties kept, compare how his inscriptions, Han writers and historians today saw him, and explain that significant means important to history, not admirable."
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 5 min · Practise 6 min · Make 9 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can describe one thing the First Emperor set up that lasted after his dynasty fell.
  - I can explain why his inscriptions and Han writers saw him so differently.
  - I can explain that a person can be significant without being good.
struggle: "Students slide between 'significant' and 'good', in both directions: a cruel ruler cannot be significant, or a significant ruler must have been admirable. Keep asking: is that a judgement of how he behaved, or of what changed?"
before: |-
  AC9HH7K13 n3 (not a hinge; the integration node). It pulls together lesson 1's tests and lesson 2's mechanisms, and reaches back to People and power (officials, the 209 BCE revolt) and the How we know courses (his inscriptions, Sima Qian). The node's criterion "does not treat the individual as the sole cause" is carried by lesson 2's Vary and this lesson's practise feedback.

  Facts used (checked 1 Nov 2026): died 210 BCE on a tour; dynasty collapsed by 206 BCE; later Han-era historians portrayed him harshly; the bureaucratic system he set up remained the basis for later dynasties (Britannica). The Qin lasted about 15 years, 221–206 BCE, and the Han carried forward standards first introduced under the Qin (Metropolitan Museum, Age of Empires exhibition). Standards lasted "for centuries" (Smithsonian National Museum of Asian Art on Smarthistory). Jia Yi's The Faults of Qin argues the Qin fell because it ruled by force without care for the people (Han essay; copied into Han histories). Ashoka: about 268–232 BCE, Kalinga about 260 BCE, edicts expressing remorse, empire declined within about 50 years (World History Encyclopedia); Buddhist texts kept his legend, Prinsep read a pillar edict in 1837 (Dhammika, The Edicts of King Asoka). Caesar: dictator for life 44 BCE, killed 15 March 44 BCE by senators who feared he would rule as a king, later deified under Octavian (World History Encyclopedia).

  Simplified: "historians think" carries why the Qin fell (labour, tax, harsh punishment); the details of Qin punishments are debated (see People and power, lesson 3). "About two thousand years" for the imperial system means to the end of the last dynasty in 1912; the system changed a great deal over that time. The script line says only that one shared script shaped Chinese writing; the later standard forms developed further under the Han. Modern views of him, including political uses of his image in the 20th century, are left to the teacher.

  Made up in this lesson: Nib's notes only (the flood in the smaller step is a hypothetical).

  Usually Year 7; Preview, not yet tried with a class. No board or clips.

  Relevant ACARA AC9HH7K13 elaborations (examples, not a checklist): "examining the historical context, early life and achievements of a significant historical figure such as Confucius or Qin Shi Huang, and how each was perceived by their contemporaries"; "examining the historical context, early life and achievements of key individuals such as Chandragupta Maurya or Ashoka"; "analysing the impact of Constantine's reign on society and religion in the Roman Empire"; "describing the social, political and cultural impact of Confucius on ancient Chinese society".

  First Nations: AC9HH7K13 has no First Nations elaborations; we write none. Deep time Australia (AC9HH7K02 to K07) is listed as taught in class in Early human migration.
running:
  - "Predict: put 15 years and 2,000 years on the board and ask how both can be true."
  - "Try: ask which items were about one family and which were about a way of ruling."
  - "Worked example: read Nib's notes aloud; ask whether 'cruel' and 'significant' answer the same question."
  - "Vary: ask which effects he could have seen for himself."
  - "Make: students write in their own book; a partner checks for two views and the significant/good line."
stuck:
  - see: "A student says he was too cruel to be significant."
    ask: "Is 'cruel' about how he behaved, or about what changed?"
    fix: "Significance asks what changed and lasted; whether he was good is a separate judgement."
  - see: "A student says the dynasty was short, so his legacy was short."
    ask: "What did the Han keep?"
    fix: "Officials, commanderies, the shared script and measures carried on for centuries."
  - see: "A student treats Han writers' view as simply the truth."
    ask: "Who did they work for?"
    fix: "The dynasty that replaced the Qin; compare with his inscriptions and with evidence like the bamboo slips."
support: "Give a frame: Lasted / Did not last / Seen by his inscriptions / Seen by Han writers / So is he significant? (use a test)."
stretch: "Was the First Emperor more a cause of change or a product of Qin's long build-up? Use one piece of evidence each way."
leads: "This finishes the course. Return to the class's depth study, or use a swap-in card for another individual."
exit:
  q: "Name one thing that lasted beyond the Qin and explain why the First Emperor is significant even though many judged him cruel."
  a: "For example: the Han kept appointed officials running commanderies; he is significant because his system changed many lives and lasted, which is a different question from whether he was good."
explain: "The Qin fell about fifteen years after unification, but the Han kept the First Emperor's officials, commanderies, script and measures for centuries. His inscriptions praised him and Han writers called him a tyrant. He is significant because of what changed and lasted, not because he was good."
