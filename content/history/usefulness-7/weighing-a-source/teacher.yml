summary: "Students join accuracy and usefulness into one reasoned assessment for an inquiry question, saying what the source can and cannot add. This is the lesson that brings AC9HH7S04 together."
learning: "weigh both the accuracy and the usefulness of a source in one reasoned conclusion for an inquiry question"
time: 40
timing: "Predict and Try 8 min · Worked example 10 min · Vary 8 min · Practise 8 min · Make 6 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can assess both the accuracy and the usefulness of a source for a specific inquiry question.
  - I can join accuracy and usefulness into one reasoned conclusion rather than two separate labels.
  - I can state both what a source contributes to an inquiry and what it cannot tell us on its own.
struggle: "Students often treat accuracy and usefulness as two separate one-word boxes ('Accurate: no. Useful: yes.') without linking them. Push for a joined sentence: 'Because this source was made by [origin] to [purpose], it is accurate/limited on [X], which makes it useful for showing [Y], though it cannot tell us [Z].'"
before: |
  This lesson brings AC9HH7S04 together. Check that students can distinguish factual claims from opinions (lesson 1) and explain why a biased source can still be useful for the right question (lesson 2).

  The Typical step (an inscription about walls and a workers' cemetery) is a made-up case and is labelled so in the question. Nib is made up and labelled.

  Worked example, task 1 (book burning): student text says Sima Qian reports an order in 213 BCE to burn some books. Many historians accept there was an order against some books, but they argue about how much was lost; the details (and the later story about scholars) are tested, not settled. See Michael Nylan, The Five "Confucian" Classics (Yale University Press, 2001), pp. 29–30, and Martin Kern in The Cambridge History of Chinese Literature, vol. 1 (2010), pp. 111–112.

  Worked example, task 3: Source B shows the written fines and punishments officials were meant to apply, not how often or how harshly they were applied. Keep that line when students say the slips show "what really happened".

  Wider step: Caesar's Commentaries on the Gallic War (his own account of his campaigns, 58–50 BCE) is a source from another society for the same skill; it does not preview the Interpretations course. Many historians think his figures for enemy numbers are inflated; accept other reasoned limits.

  The Try step was an ordering task until 1 Nov 2026; it is now a match, because only 'start from the inquiry question' is a real rule and the order of the accuracy checks is a choice (lesson 1 lists them in a different order).

  The Practise step uses a paper reasoning check with two model answers (one for the Shuihudi bamboo slips, one for the mountain inscription) so students can self-check all three criteria before writing their own in the Make step.
running:
  - "Predict: show why the first option is strong. It links origin (217 BCE working rules) to accuracy, then to usefulness for the question, and ends with what is missing."
  - "Try: the match has no fixed order apart from starting with the inquiry question. Ask pairs why the question comes first, and whether they would check fact and opinion or origin and purpose next."
  - "Worked example: show Nib's two-word answer ('Accurate. Useful.') and ask the class what a reader still wouldn't know."
  - "Practise: students write their paragraph in their book first, then open the model answers to tick the three criteria."
  - "Make: partner review in books using the same three criteria."
stuck:
  - see: "A student writes two disconnected sentences: 'It is biased. It is useful.'"
    ask: "How does the bias connect to what it is useful for?"
    fix: "Join them with 'so' or 'which means': 'It is biased towards the emperor, so it cannot prove everyone lived in peace, but it is useful for showing how the court used propaganda.'"
  - see: "A student forgets to mention the inquiry question."
    ask: "Useful for finding out what?"
    fix: "Always name the inquiry question in the usefulness sentence."
  - see: "A student says a source tells us everything we need to know."
    ask: "Whose view or what part of the story is missing from this single source?"
    fix: "Every single source has a limit. Name one thing it cannot show and what kind of second source would help."
stretch: "Take two sources from your depth study, one written and one archaeological, and explain in three sentences how using both together overcomes the limits of each one on its own."
support: "Three-sentence frame: '1. Accuracy: Because [source] was made by [who/when] to [purpose], its claims about [X] are [accurate / biased / limited]. 2. Usefulness: For the question [inquiry question], it is useful evidence of [what it shows]. 3. Limit: However, it cannot tell us [what is missing], so we would also need [other source].'"
leads: |
  Next in the How we know pathway: How we know (AC9HH7K08, already built), which applies these source and evidence questions to archaeological layers, DNA and dating, ancient writing, and site conservation.
exit:
  q: "In three sentences, assess Source C (the First Emperor's mountain inscription) as evidence for the question: 'How did the First Emperor unite and rule the Qin empire?'"
  a: "Source C was ordered by the First Emperor around 219 BCE to celebrate his rule; its claim about one set of laws and measures is backed up by Qin weights that have been dug up, while its claim that everyone now lives in peace is almost certainly false and written to persuade. It is useful evidence of how the state standardised measures and used public propaganda to claim authority. However, it cannot tell us how ordinary people actually experienced Qin rule, so we need legal records and archaeological evidence alongside it."
explain: |
  A complete **assessment** joins **accuracy** and **usefulness** for your inquiry question:

  1. How far can you trust the source's claims (and what backs them up or limits them)?
  2. What does the source **contribute** to answering the inquiry question?
  3. What **cannot** it tell us on its own?
