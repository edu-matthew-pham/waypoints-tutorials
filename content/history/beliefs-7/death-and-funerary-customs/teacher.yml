learning: "describe death and funerary customs in Qin and Han China using tomb evidence, and connect them to the beliefs and values behind them"
summary: "Describe death and funerary customs in Qin and Han China from tomb evidence (Mawangdui, tomb models, the terracotta army), connect each to a belief or value, and say whose burials the evidence shows."
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 5 min · Practise 6 min · Make 9 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can describe three funerary customs of an ancient society, with evidence.
  - I can explain the belief or value behind a custom.
  - I can say whose burials a piece of evidence shows.
struggle: "Students treat the most famous tomb as typical. Keep asking: whose tomb is it, and who could afford one?"
before: |-
  AC9HH7K11 n2. The node asks for one focus area; this course uses death and funerary customs because Qin and Han China has the strongest evidence for it. The typical step opens everyday life and the wider step opens warfare, briefly. If your depth study uses a different focus area, keep lesson 1 and 3 and do this lesson's evidence skills on your own sources.

  Real content (checked 1 Nov 2026): Mawangdui, near Changsha, excavated 1972 to 1974; Li Cang, Marquis of Dai, died 186 BCE; his wife Xin Zhui (Lady Dai) died some time after 168 BCE (sources give 168 or about 163, so the lesson gives no date for her death); a man thought to be their son buried 168 BCE (Smarthistory, Hunan Museum); lacquerware, silk, food, wooden figurines of servants and musicians, silk and bamboo manuscripts, the T-shaped banner, and bamboo slips recording the names and numbers of funerary objects (Hunan Museum); the 2024 count of 26,937 items (Hunan Museum via Xinhua). Tomb models of houses and farm structures in Eastern Han burials to provide for the afterlife (Met, Toledo); models do not necessarily reflect what the person owned, and elaborate burials depended on wealth (Smarthistory). The First Emperor died 210 BCE; thousands of terracotta soldiers and horses face outward from the tomb (UNESCO). The terracotta army is Qin, not Han; the lesson says so by naming the First Emperor of Qin.

  Lady Dai's body was found unusually well preserved and is displayed in the Hunan Museum. The lesson leaves this out on purpose, and shows no images of human remains. Mention it only if you judge it suitable.

  "Historians think... probably" is used for the purpose of the terracotta army, since no Qin text states it. The Zhou claim in the wider step comes from later Chinese accounts; the explain notes the "victor's justice" view.

  Simplified: the lesson says farmers' graves were "much simpler" and less studied; it gives no detail of commoner burials, which varied by region and period.

  Usually Year 7; Preview, not yet tried with a class. No board or clips.

  Relevant ACARA AC9HH7K11 elaborations (examples, not a checklist): "investigating beliefs associated with death, such as belief in an afterlife, and funerary customs and practices (for example, burial in tombs and techniques of mummification)"; "investigating the significant beliefs, values and practices of Chinese society associated with daily life; for example, irrigation and the practice of agriculture, the teachings of Confucius, the evidence of daily life from the Han tombs"; "identifying how the Mandate of Heaven assisted people in understanding and justifying periods of warfare".

  First Nations: AC9HH7K11 has no First Nations elaborations; we write none.
running:
  - "Predict: ask who built Lady Dai's tomb and who paid for it."
  - "Try: for each find, ask 'what would you have to believe to put this in a grave?'"
  - "Worked example: let Nib's mistake sit. Ask how many Han people were farmers."
  - "Vary: a model is evidence of hopes. Ask what a model of your dream house would say about you."
  - "Make: students write in their own book; a partner checks that each custom has evidence."
stuck:
  - see: "A student says everyone was buried like Lady Dai."
    ask: "Who was Lady Dai, and who could afford a tomb like hers?"
    fix: "Famous tombs belong to the rich; say whose burial the evidence shows."
  - see: "A student says the terracotta army 'was made to guard the emperor' as a fact."
    ask: "Does any source from the time say why it was made?"
    fix: "None does; historians think it was probably meant to guard him."
  - see: "A student lists objects but no beliefs."
    ask: "Why would a family think the dead needed that?"
    fix: "Connect each practice to a belief or value, with 'because'."
support: "Give four object cards (food, model granary, bamboo list, clay soldier) and a frame: 'This is evidence that... because many people believed...'."
stretch: "What other evidence would you look for to find out how ordinary farmers were buried, and why might there be less of it?"
leads: "Continue to What do beliefs show about a society?"
exit:
  q: "Name one funerary custom from Han China, the evidence for it, and whose burial the evidence shows."
  a: "For example: stocking tombs with food and models of granaries, from Mawangdui and tomb models; these show wealthy families' burials."
explain: "Han tombs such as Mawangdui held food, clothes, lists of goods and models of houses and farms, and the First Emperor was buried with a clay army. They show beliefs about an afterlife much like this life, but mostly the burials of people who could afford them."
