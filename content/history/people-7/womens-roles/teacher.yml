learning: "describe women's roles in Han China, identify the evidence about them and explain how women influenced society despite limits"
summary: "Describe some roles of women in Qin and Han China, identify kinds of evidence about their lives and its limits, and explain how women influenced the society despite constraints."
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 5 min · Practise 6 min · Make 9 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can describe two roles women had in an ancient society.
  - I can explain why evidence about most women is limited.
  - I can give a specific example of a woman's influence.
struggle: "Students swing between 'women did nothing' and 'one famous woman shows how all women lived'. Keep asking whose life a source shows."
before: |-
  AC9HH7K10 n2. The lesson ties the content to the source skills from Source usefulness: who made it, and what it can and cannot show.

  Real cases (checked 1 Nov 2026): Ban Zhao (about 45 to about 117 CE) helped finish the Book of Han after her brother Ban Gu's death in 92 CE, taught Empress Deng and other women at court, and wrote Lessons for Women, which modern readers disagree about (some see an early argument for women's education, others an endorsement of submission). Empress Lü held power as empress dowager and regent from 195 to 180 BCE; the lesson leaves out the violence against rivals in Sima Qian's account, which you can raise if suitable. Tomb figures and paintings of women's work are described generally.

  Book sources for Ban Zhao teaching the empress and for Empress Lü's regency (not checked online): Cambridge History of China vol. 1 (1986); Sima Qian's annals of Empress Lü (Watson's translation of the Shiji). The UCLA page below gives Ban Zhao's dates as about 45 to 116 CE, a year off the lesson's "about 117"; sources differ.

  The lesson does not claim a single "status of women in Han China"; it varied by class, family and period.

  Usually Year 7; Preview, not yet tried with a class. No board or clips.

  Relevant ACARA AC9HH7K10 elaborations (examples, not a checklist): "describing the rights and responsibilities of women of different classes in the areas of marriage, family life, work and education, and the depiction of women fulfilling these roles in artwork and funerary texts"; "describing the role of women in shaping ancient society in the areas of marriage, family life, work and education".

  First Nations: AC9HH7K10 has no First Nations elaborations; we write none. Deep time Australia (AC9HH7K02 to K07) is listed as taught in class in Early human migration.
running:
  - "Predict: ask who wrote the books students have met so far in History."
  - "Try: ask which source was made by the person it is about."
  - "Worked example: let Nib's mistake sit. Ask: is 'no writing about it' the same as 'it did not happen'?"
  - "Vary: Mei's claim is the opposite slip. Ask whose life Ban Zhao's shows."
  - "Make: students write in their own book; a partner checks for one limit."
stuck:
  - see: "A student says women had no influence because there are few sources."
    ask: "Who did the writing, and what did they write about?"
    fix: "Thin evidence is a limit of the sources. Ban Zhao and Empress Lü show real influence."
  - see: "A student treats Lessons for Women as a description of women's lives."
    ask: "Is it describing what women did, or telling them what to do?"
    fix: "It is advice from one elite woman: evidence of expectations, not of every life."
support: "Give three cards (Ban Zhao, Empress Lü, a tomb figure) and ask, for each, 'who made it?' and 'whose life does it show?'"
stretch: "Why might a court historian like Sima Qian describe a powerful woman such as Empress Lü harshly? What would you want to compare his account with?"
leads: "Continue to The many, and change over time."
exit:
  q: "Give one example of a woman's influence in Han China and one reason evidence about most women is limited."
  a: "For example: Ban Zhao helped finish the Book of Han; most surviving writing was by men at court about government."
explain: "Evidence about women in Han China is thin because most writing was by men at court. Historians use the few women's writings, accounts of powerful women and tomb objects, and say what they cannot know."
sources:
  - title: "Ban Zhao, Lessons for Women, tr. Nancy Lee Swann (1932), UCLA Center for Chinese Studies (her dates, finishing her brother's history)"
    url: https://www.international.ucla.edu/ccs/article/18475
    checked: 2026-11-01
