learning: "describe the social hierarchy of Qin and Han China and explain how the nobility and officials used their power"
summary: "Describe the layers of society in Qin and Han China and the roles of the nobility and officials, and explain how they used their power through registers, tax, law and organised labour."
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 5 min · Practise 6 min · Make 9 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can describe the layers of an ancient society.
  - I can explain the difference between a noble and an official.
  - I can explain one way the people at the top used their power.
struggle: "Students answer 'who had power' and stop. Keep asking 'how did that power reach a village?'"
before: |-
  AC9HH7K10 n1, a hinge: lessons 2 and 3 position women and slaves inside this structure, so students need the layers and the mechanisms first. It follows on from Shaped by the land's surplus lesson (grain tax feeds officials and soldiers).

  Real cases: Qin commanderies and counties after 221 BCE (36 commanderies); the early Han's kingdoms for the emperor's relatives alongside centrally governed commanderies; Qin bamboo-slip rules for officials (Source origin and purpose). "Historians think" is used for why the First Emperor preferred officials. The county official's day is made up (labelled once).

  The table is a simplification: real Han society had many ranks and local variation, and the boundary between nobles and officials blurred over time. Say so if students ask.

  Usually Year 7; Preview, not yet tried with a class. No board or clips.

  Relevant ACARA AC9HH7K10 elaborations (examples, not a checklist): "explaining the social structure of ancient Egypt, including slaves, farmers, craftsmen, merchants, scribes, soldiers, priests, Vizers, Nomarchs and Pharaoh"; "describing the rights of citizens in ancient Athens (for example, the right for men to vote), their responsibilities (for example, military service, attending assembly meetings) and the concept of freedom"; "outlining the rights and responsibilities of the Shi class".

  First Nations: AC9HH7K10 has no First Nations elaborations; we write none. Deep time Australia (AC9HH7K02 to K07) is listed as taught in class in Early human migration.
running:
  - "Predict: take the hook literally. How many weeks' walk, and who carries the grain?"
  - "Try: ask which people got their power from family and which from the emperor."
  - "Worked example: read the four tools aloud, then let Nib's mistake sit."
  - "Vary: ask what a noble family with its own land and soldiers might do that an official could not."
  - "Make: students write in their own book; a partner gives feedback."
stuck:
  - see: "A student says the emperor ran everything himself."
    ask: "How would one person collect grain from thousands of villages?"
    fix: "Through officials, records and owed labour: that is what the bureaucracy was."
  - see: "A student thinks nobles and officials are the same."
    ask: "How did each get their power, and could the emperor remove them?"
    fix: "Nobles by family; officials by appointment, and they could be dismissed."
  - see: "A student ranks groups by wealth."
    ask: "Who could give orders to whom?"
    fix: "Power and wealth overlap but are not the same; rich merchants still answered to officials."
support: "Give a four-row frame (counting, tax, law, labour) and fill the Qin column together before students write their own."
stretch: "Why might a ruler want both nobles and officials? What could go wrong with relying only on one?"
leads: "Continue to What did women do, and how do we know?"
exit:
  q: "Name one tool officials used and explain how it carried the emperor's power to a village."
  a: "For example: household registers listed who could be taxed and called up, so officials knew who owed grain and labour."
explain: "Qin and Han China was a hierarchy. The emperor's power reached villages through appointed officials, who used registers, tax, laws and called-up labour; nobles held power through family."
sources:
  - title: "Anthony Barbieri-Low (UC Santa Barbara), The Qin Empire, lecture slides (36 commanderies, about 1,000 counties, appointed officials, the ban liang coin, axle widths)"
    url: https://wuecampus.uni-wuerzburg.de/moodle/pluginfile.php/5209434/mod_resource/content/1/9.%20Qin%20Empire_Barbieri.pdf
    checked: 2026-11-01
