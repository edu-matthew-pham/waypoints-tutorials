inquiry:
  q: "Can a group with very little power still change history?"
  prompts:
    - "What would they need?"
    - "What example can you think of from this lesson?"
  notes: "Return to the 209 BCE revolt, told according to Sima Qian."
activities:
  - at: modify
    kind: activity
    title: "A quick timeline"
    minutes: 4
    do: |
      Put 221 BCE, 209 BCE, 119 BCE, 17 CE and 23 CE on the board. Pairs place the events and say which group each affected.
    notes: "BCE counts down, CE counts up: check students order them correctly."
questions:
  - at: make
    title: "Check before moving on"
    type: question
    q: "Slavery was abolished in 17 CE and returned after 23 CE. What does this show?"
    options:
      - "Changes in the relationships between groups could be reversed"
      - "Nothing changed in Han China"
      - "Slavery ended forever"
    answer: 0
    explain: "Change over time is not always one-way."
    feedback:
      - null
      - "The rules changed twice."
      - "It came back after Wang Mang died."
