learning: "describe the roles of groups near the bottom of Qin and Han society and how relationships between groups changed over time"
summary: "Describe the roles of slaves, convict and conscripted labourers and other groups in Qin and Han China, explain how the society depended on them, and describe changes in relationships between groups over time."
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 5 min · Practise 6 min · Make 9 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can describe the work of groups near the bottom of an ancient society.
  - I can explain how the society depended on them.
  - I can describe one change in the relationships between groups.
struggle: "Students treat the bottom groups as passive and the order as fixed. Ask: what would stop if they stopped, and what changed?"
before: |-
  AC9HH7K10 n3. Slavery is described factually and without graphic detail; Han slaves were a small part of the population, unlike Rome, which the Typical step compares.

  Real cases (checked 1 Nov 2026): the Dazexiang uprising of 209 BCE (Chen Sheng and Wu Guang, about 900 conscripts), told "according to Sima Qian"; some historians question his claim that lateness meant death, pointing to Qin legal texts with lighter penalties for lateness in labour service, so the lesson says only that they feared punishment. Emperor Wu's heavy taxes on merchants and the state salt and iron monopolies (119 BCE); Wang Mang's abolition of slavery (17 CE), reversed after his death in 23 CE.

  The Confucian ranking of the four occupations is presented as an ideal order (T8), not a description of wealth.

  Usually Year 7; Preview, not yet tried with a class. No board or clips.

  Relevant ACARA AC9HH7K10 elaborations (examples, not a checklist): "describing the significance of slavery in the period of the Roman Empire; for example, the acquisition of slaves through warfare, the use of slaves as gladiators, agricultural labourers and domestic servants, and the rise of freedmen"; "examining evidence of the social structure of Athenian or Spartan society; for example, the roles of citizens, women and slaves in Athenian society and the roles of Spartiates, Perioikoi and Helots in Spartan society".

  First Nations: AC9HH7K10 has no First Nations elaborations; we write none. Deep time Australia (AC9HH7K02 to K07) is listed as taught in class in Early human migration.
running:
  - "Predict: list the building projects students know of, then ask who did the digging."
  - "Try: ask which group had the least choice about its work."
  - "Worked example: let Nib's mistake sit. Ask: is having little power the same as having no influence?"
  - "Vary: put the changes on a quick timeline on the board."
  - "Make: students write in their own book; a partner gives feedback."
stuck:
  - see: "A student says slaves and labourers did not matter."
    ask: "What would stop if they all stopped working?"
    fix: "The society rested on their work, and the 209 BCE revolt helped end the Qin."
  - see: "A student says the order never changed."
    ask: "What happened to slavery between 17 and 23 CE?"
    fix: "Rules changed and changed back; groups' positions shifted over time."
  - see: "A student says merchants were poor because they ranked last."
    ask: "Is the ranking about money, or about what officials respected?"
    fix: "It was an ideal order of respect; some merchants were very rich."
support: "Give a two-column frame (the group's work; one change) and do conscripted labourers together."
stretch: "Compare Han China and Rome: why might slavery matter more to one society's economy than the other's? What evidence would you need?"
leads: "Next in this pathway: Beliefs and practices (planned)."
exit:
  q: "Describe one group near the bottom of Qin or Han society and one change in its position over time."
  a: "For example: slaves worked in households and workshops; Wang Mang abolished slavery in 17 CE, but it returned after his death."
explain: "Qin and Han China rested on the work of farmers, conscripted labourers, convicts and slaves, who had little power but real influence, and the order between groups changed over time."
