learning: "explain how contacts and conflicts drove change in the ancient world, connecting causes to effects with specific examples"
summary: "Explain contact as a driver of change through two connected chains, Roman demand for silk met through traders in between, and Buddhism reaching Han China along the trade routes, and recognise that ancient societies did not develop alone."
time: 40
timing: "Predict and Try 8 min · Worked example 12 min · Vary 5 min · Practise 6 min · Make 9 min. Typical and wider steps are extras and not counted in this."
goals:
  - I can connect a cause, a contact and its effects into one chain of change.
  - I can explain how two societies affected each other without meeting.
  - I can use real examples to show contact changing a society.
struggle: "Students treat each society as sealed off, or list events without linking them. Ask: where did this come from, and what did it lead to?"
before: |-
  AC9HH7K12 n3, the integration node: it joins lesson 1's causes to lesson 2's effects into a chain. The Kit asks for "a connected cause-to-effect account"; the Make step is that account.

  Real cases (checked 1 Nov 2026): silk supplied from China to the Mediterranean world (UNESCO; The Met); silk passed through middlemen, with no direct Roman–Han contact by the overland route (Britannica: Parthian middlemen; Strabo names Parthian, Bactrian and Indian traders); Roman writers' hazy idea of the Seres; Pliny the Elder's complaint about money spent on Eastern luxuries (Natural History 12.84; the commonly quoted figure, about 100 million sesterces a year for India, China and Arabia, is left out of student text because translations and summaries differ); Buddhism first mentioned in China in 65 CE (Liu Ying, half-brother of Emperor Ming); An Shigao, from Parthia, active at Luoyang from about 148 CE (the date the 4th-century scholar Dao'an gives for the start of his work) translating Buddhist texts (Zacchetti; Harrison; both opened 1 Nov 2026). The lesson no longer says he "arrived" in 148 CE: no source gives an arrival date. A group claiming to be envoys from the Roman emperor reached the Han court by sea in 166 CE (Britannica), but historians think they were probably traders; it is left out of student text.

  Florus (ACARA's elaboration on envoys to Augustus): Florus, writing more than a century later, says envoys from the Seres and from India came to Augustus (Florus, Epitome of Roman History 2.34). Augustus's own Res Gestae 31 mentions embassies from Indian kings, but not from the Seres (not checked online; any standard translation). Treat it as one Roman writer's claim that historians treat carefully: no Chinese source records such a mission, and "Seres" was a vague word. Cassius Dio and Strabo describe Indian embassies, which are better supported. A good comparison of accounts for a class (ACARA: "comparing accounts of contact between Rome and Asian societies").

  Simplified: "the Silk Roads" (named in lesson 2 as a modern name) were many routes, by land and sea; the chain model is a teaching frame, and real change had many links. Mithras worship in Rome was linked with Persia in name, but historians debate how much of it came from Persia; the wider step says "linked with Persia" for that reason. Ashoka's missions to Sri Lanka are "according to a later Sri Lankan chronicle" (the Mahavamsa).

  Usually Year 7; not yet tried with a class. No board or clips. Beliefs are described as what people held, not as true or false.

  Relevant ACARA AC9HH7K12 elaborations (examples, not a checklist): "describing indirect contact and interactions between the Roman Empire and the Han Dynasty"; "comparing accounts of contact between Rome and Asian societies in the ancient period; for example, the visit of Chinese and Indian envoys to Rome in the time of Augustus, as described by the Roman historian Florus"; "examining the extent of Indian contact with other societies such as the Persians under Cyrus, the Macedonians under Alexander; the extensive trade with the Romans and Chinese; the material remains of the Mauryan Empire such as the Pillars of Ashoka and the Barabar Caves; and the spread of Hinduism and Buddhism"; "analysing the long-term causes of the rise of the Mauryan Empire and the spread of Mauryan philosophies and beliefs".

  First Nations: AC9HH7K12 has no First Nations elaborations; we write none.
running:
  - "Predict: ask the 'army' voters whether ideas need armies to travel. What else moves along roads?"
  - "Try: draw a three-box chain (cause, contact, change) on the board and fill it as students sort."
  - "Worked example: let Nib's mistake sit. Ask: did Rome need to meet China to be changed by it?"
  - "Vary: ask what else (besides silk and Buddhism) closing the routes would have stopped."
  - "Make: students write in their own book; a partner gives feedback."
stuck:
  - see: "A student says Rome and China had nothing to do with each other."
    ask: "Where did the silk in Rome come from?"
    fix: "Indirect contact: goods passed through traders in between still linked them."
  - see: "A student lists events without linking them."
    ask: "What caused this, and what did it lead to?"
    fix: "Use the three-box chain: cause, contact, change."
  - see: "A student thinks ideas spread only by conquest."
    ask: "Who travelled the trade routes, and what did they carry besides goods?"
    fix: "Merchants and monks carried beliefs as well as goods."
support: "Give a three-box chain frame (cause, contact, change) and fill the silk chain together before students write their own."
stretch: "Florus says envoys from the Seres reached Augustus, but no Chinese source mentions it. How would a historian decide how far to trust his account?"
leads: "Next in this pathway: A significant individual (planned)."
exit:
  q: "Write one chain of change: a cause, the contact it led to, and one change that came from it."
  a: "For example: Romans wanted silk (cause); silk passed from trader to trader across Asia (contact); Roman money flowed east to pay for it (change)."
explain: "Contact drove change in the ancient world. Roman demand for silk, met through traders in between, linked Rome and Han China without them meeting, and the same routes carried Buddhism into China. Ancient societies did not develop alone."
