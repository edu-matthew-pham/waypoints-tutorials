learning: "use undisturbed layers to put finds in order, without reading depth as an exact date"
summary: Read an excavation as a sequence of layers. Use the position of a find and the evidence beside it to explain what may have changed, while keeping relative age separate from an exact date.
goals:
  - I can use undisturbed layers to put finds in relative order.
  - I can use finds to suggest a change and name a limit.
struggle: Depth feels like a clock. Ask students to separate “before” from “how many years before” before giving them a date.
before: |-
  This is the first K08 hinge: without the logic of layers, the scientific and written evidence in lessons 2 and 3 becomes a collection of facts rather than evidence in a sequence. All excavation cards are invented. The diagram is schematic, not to scale. Keep “undisturbed” attached to the deeper-is-older rule. The wider pit case shows why.

  Usually Year 7; not yet tried with a class. The untiered path is the minimum. Time and optional width are the teacher’s choices.

  Across subjects: Year 7 Geography's "How moving water changes the land" (`geography/water-7/water-changes-land`) shows where layers come from: water carries sediment and drops it where the flow slows (deposition). Same year, so it's a mention, not a link. Year 8 science's rock cycle uses the same layers-in-order idea later and can look back here.

  The dig board (1 Nov 2026) is a made-up site seen from the side: students dig from the top down and number the layers from the oldest, find the coin that fell into a later pit, and (Typical) decide what a coin made in 220 BCE can and cannot date. The board only checks these planted answers. Its model is undisturbed layers unless a pit is shown; say so if students ask about real sites, where animals, roots, floods and later digging can mix layers. The Explain it to me clip shows layers building up and a pit cut through them (about 20 seconds, captions first).

  K08 lists AC9HH7K01 and AC9HH7K07 as prior knowledge. Use their curriculum pointer pages (teacher view: /teach/curriculum/history/AC9HH7K01/ and /teach/curriculum/history/AC9HH7K07/; the student lesson no longer links to them), rather than adding our own First Nations explanations. Start with ACARA’s elaborations on that pointer page and ask the school’s First Nations contact for local, community-approved material. Do not treat this methods course as covering K07.

  Relevant ACARA K08 elaboration (an example, not a checklist): “creating a cross-sectional drawing of the earth's surface from an archaeological excavation to identify the evidence located at various layers (stratigraphy) and what it reveals about change over time; for example, a charcoal layer containing human remains and weapons may indicate the capture and destruction of an ancient settlement such as Troy”
running:
  - "Predict and Try: ask students to give a reason before revealing the explanation."
  - "Dig it yourself (board): put it up and dig together first. Ask: which layer did we reach last, and why is it the oldest?"
  - "Worked example: use the smaller lead-in if the main distinction is still insecure."
  - "Vary and Practise: change one condition and ask what remains supported. On the pit board, ask what was dug first, the layers or the pit."
  - "Typical coin step: the hard part is the layer below. A coin gives the earliest date its own layer and those above could have formed; it says nothing certain about older layers underneath."
  - "Make: a partner or teacher judges the explanation in the student’s own book."
stuck:
  - see: "Nib writes: “B is deeper than C, so B is exactly 500 years older.” What needs changing?"
    ask: Can a stack of layers alone tell you how many years passed?
    fix: Depth can establish relative order here. It does not measure a number of years.
  - see: A student gives a conclusion without saying what supports it.
    ask: Which part of the record supports that?
    fix: Name the source or method, then one thing it cannot settle.
  - see: "A student says the layer under the coin is from 220 BCE too."
    ask: "Could the coin have been old when it was dropped? Could the layer under it be older than the coin?"
    fix: "The coin dates its own layer and those above (that year or later). Layers below formed earlier, by an amount the coin cannot tell you."
support: Use three stacked cards labelled earlier floor, burnt wood, later floor. Read one pair at a time before the complete sequence.
stretch: The extra cases add weapons and a later pit. They test the same inference with more evidence or a disturbance, without moving to later standards.
leads: Continue to DNA and dating answer different questions.
exit:
  q: What can you infer from burnt wood between two floors, and what can you not yet say?
  a: A burning event may lie between two periods of use. The cause, exact date and time gap need more evidence.
explain: In an undisturbed sequence, lower layers formed first. Finds and their positions help reconstruct change; depth alone supplies neither an exact year nor a cause.
