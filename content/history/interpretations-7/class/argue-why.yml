inquiry:
  q: "Why is 'they have different opinions' not a good answer to 'why do they disagree?'"
  prompts:
    - "What would you need to add?"
    - "What makes an explanation better than a description?"
  notes: "Draw out evidence, questions and values from the previous lesson."
activities:
  - at: investigate
    kind: discussion
    title: "Three colours"
    minutes: 5
    do: |
      Pairs highlight the worked argument: the claim, the two interpretations, and the reasons. Then they say which reason they found most convincing.
    notes: "Accept any reasoned choice; there is no single right reason."
questions:
  - at: make
    title: "Check before moving on"
    type: question
    q: "Which ending makes an argument about interpretations strongest?"
    options:
      - "So they differ because of the evidence, questions or values behind each"
      - "So they differ because people just have different opinions"
      - "So the Han writers were right, and today's historians are wrong"
    answer: 0
    explain: "It names a reason behind the difference. Any of the three kinds will do; there is no single right reason."
    feedback:
      - null
      - "That says they differ but not why. Why are their opinions different?"
      - "That picks a winner. The question is why they differ, not who wins."
