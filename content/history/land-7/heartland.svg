<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 470" role="img" aria-labelledby="t d"><title id="t">A schematic map of the Qin and Han heartland</title><desc id="d">Not to scale. Gobi Desert and steppe in the north, the Hexi Corridor in the north-west, the Tibetan Plateau in the west, the Loess Plateau inside the Yellow River's bend, the Wei River valley with the capitals, the Qinling Mountains to its south, the North China Plain in the east, the Sichuan Basin in the south-west, the Yangtze River across the south, and the sea in the east.</desc>
