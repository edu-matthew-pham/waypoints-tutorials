inquiry:
  q: "A site you used once gets hacked. Why should you care about your other accounts?"
  prompts:
    - "What would someone try with a leaked password?"
    - "Is a long password enough on its own?"
  notes: "Leave this open: it's the typed Engage, out loud. Collect two or three answers without judging them, and come back to them at Evaluate. Don't name reuse or guessable yet; Explore is where students find them."
activities:
  - at: run
    kind: discussion
    title: "What fell together?"
    minutes: 4
    do: |
      After your first few leaks: which accounts fell together, and which fell on their own? Tell your partner what you think the difference is.
    notes: "Don't name reuse or guessable yet. Students should arrive at 'same password' and 'easy password' themselves."
  - at: investigate
    kind: discussion
    title: "Compare explanations"
    minutes: 5
    do: |
      Read your own-words explanation to a partner. Did you both find two reasons an account fell? Then match the names: breach, reuse, guessable, passphrase.
    notes: "Pick two contrasting explanations to read aloud before showing the names. Then replay the leak on the board and name each part as it appears."
  - at: end
    kind: discussion
    title: "Back to your guess"
    minutes: 3
    do: |
      Read your Engage guess again. What would you add now?
    notes: "Link to Second factors next lesson: even a strong, different password can leak."
  - at: modify
    kind: info
    title: "Unplugged: one key for every door"
    minutes: 2
    do: |
      A key ring with one key that opens every door at home, school and the club. What happens when one copy is lost?
    notes: "Use it here if the password manager feels abstract: the manager is a ring of different keys, locked in one box."
questions:
  - at: investigate
    title: "Which name?"
    type: question
    q: "Ava's password is her name and birth year. Which word fits?"
    options: ["Guessable", "Reuse", "Breach", "Passphrase"]
    answer: 0
    explain: "It's on the lists people try first, leak or not."
