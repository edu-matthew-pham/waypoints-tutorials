summary: Students step a tiny processor through fetch, decode and execute one clock tick at a time, change its program and data, follow a loop, and write a program of their own (AC9TDI8K04 node 3, extended; links to AC9TDI8K01).
time: 50
timing: "Predict and Try 8 min · Worked example 12 min · Vary 14 min · Practise and Make 16 min"
goals:
  - I can describe the fetch, decode and execute cycle.
  - I can say what the program counter and accumulator hold.
  - I can explain that instructions are numbers stored in memory.
  - I can write a short program for a tiny processor.
struggle: "Writing the Make program from an empty memory is the hard part. Have students write the outputs they want first, then the instruction before each OUT."
before: |
  Try the boards yourself. The instruction set is deliberately tiny: HALT, LOAD, ADD, SUB, STORE, JUMP, JZ (jump if zero) and OUT. Each instruction is a number: operation × 16 + address, so LOAD 6 is 22. Numbers wrap at 256.

  The one idea: a processor repeats one cycle: fetch the instruction the program counter points at, decode it, execute it, one step per clock tick. The program is numbers in the same memory as the data (the stored-program idea).

  Simplifications: one register (the accumulator), 16 cells, three ticks per instruction. Real processors overlap the steps (pipelining) and have many registers. It is similar in spirit to the Little Man Computer, which some teachers will know.
running:
  - "Predict: students who said 53 are joining digits, not adding."
  - "Try: ask what PC shows just after a fetch, and why it is already one ahead."
  - "Worked example: model the three ticks for LOAD 6 aloud."
  - "Vary: in the loop, ask which instruction makes it repeat and which one stops it."
  - "Make: collect programs: who used the fewest cells?"
stuck:
  - see: "A student thinks code and data are kept apart (Sam's mistake)."
    ask: "What number is LOAD 6? Where is it stored?"
    fix: "Instructions are numbers in the same memory as the data."
  - see: "A student's program runs off the end."
    ask: "What should happen after the last OUT?"
    fix: "End with HALT."
stretch: "Write a program that multiplies 3 by 4 using a loop of ADDs. How many clock ticks does it take?"
support: "An instruction card: each instruction, what it does, and an example."
leads: |
  Links: Inside a computer: 3 GHz means about 3 billion clock ticks a second, and each core is a processor like this (much bigger). Code pathway: the Python and MakeCode programs students write are turned into instructions like these.
exit:
  q: "Name the three steps a processor repeats, and say what the program counter does."
  a: "Fetch, decode, execute. The program counter holds the cell of the next instruction and goes up by one after each fetch (or jumps)."
explain: |
  A processor repeats one cycle, one step per **clock tick**:

  1. **Fetch**: copy the instruction from the cell the **program counter** (PC) points at; add 1 to the PC.
  2. **Decode**: work out what the instruction means.
  3. **Execute**: do it (load, add, store, jump, output…).

  The **accumulator** (ACC) holds the number being worked on. Instructions are **numbers** in the same memory as the data: a stored program. A 3 GHz processor ticks about 3 billion times a second.
