summary: Students sign in against a stored hash, see one letter change the whole hash, crack an unsalted stolen list by hashing common guesses, then add a salt, and sort what a hash is for against what encryption is for (AC9TDI10K01 node 4, first half; Public and private keys is the second).
time: 45
timing: "Predict and Try 6 min · Worked example 12 min · Vary 10 min · Practise and Make 12 min"
goals:
  - I can explain how sites check passwords without storing them.
  - I can explain what a salt adds.
  - I can say when a hash fits and when encryption does.
struggle: "Hashing is one-way, which runs against intuition, and students call it encryption. Use the meat grinder (you can't un-mince) as the anchor, and the sort in Practise to pull hash and encryption apart."
before: |
  Try the boards yourself. The hash is real SHA-256 (shown short); the passwords in the lesson are practice ones. Tell students never to type a real password into any board.

  The kit's typical width: hashing secures stored passwords; public key cryptography (next lesson) secures data in transit; they address different threats, and mixing them up is why this node is a hinge. Split from Hashes and keys on 25 Oct so each gets a full lesson. Simplifications: real sites use slow hashes built for passwords (bcrypt, Argon2) and store the salt beside the hash.

  Links: Secret messages' key sharing (agreeing a key in public) is the other half of how HTTPS starts.
running:
  - "Predict: students who chose \"your password\" assume sites keep it."
  - "Try: count how many digits changed for one letter."
  - "Worked example: ask why the same password must always give the same hash."
  - "Vary: ask why the thief can crack Ana and Ben without reversing anything; then what the salt changes."
  - "Make: remind students not to type a real password; it is a made-up passphrase."
stuck:
  - see: "A student says the site turns the hash back (Sam's mistake)."
    ask: "Why does the site send a reset link instead of your password?"
    fix: "It can't reverse the hash."
  - see: "A student calls hashing encryption."
    ask: "Could anyone, with any key, turn the hash back into maple?"
    fix: "Encryption is undone with a key; a hash can't be undone at all."
stretch: "Why do security experts recommend a password manager? What does it change about using the same password on several sites?"
support: "Two cards: Only needs checking → hash (one way). Has to be read again → encryption (a key undoes it)."
leads: |
  Next: Public and private keys (protecting data while it travels).
exit:
  q: "Why can't attackers read passwords from a list of hashes, and what can they still do? What does a salt stop?"
  a: "A hash can't be reversed, but common passwords can be guessed: hash the guess, compare. A salt makes the same password hash differently for each person, so one guess no longer cracks everyone who chose it."
explain: |
  Good sites store a **hash** of your password: a one-way scramble, always the same for the same password. At sign-in they hash what you type and compare. A hash can't be turned back, so a stolen list doesn't reveal passwords, though common passwords can still be guessed, which is why long passphrases matter. A **salt** makes the same password hash differently for each person.

  A hash is not encryption: encryption can be undone with a key, a hash can't be undone at all. Hash what only needs checking; encrypt what someone has to read again.
