summary: "Security testing is only legitimate on computers you own or have written permission to test. In the lab you meet Kali (a toolbox of security tools), the target computer, and the rules that keep the work safe. Everything you find is reported and fixed, never used."
time: 40
timing: "Predict and Try 8 min · Worked example 10 min · Vary 10 min · Practise and Make 12 min"
goals:
  - "I can say what must be true before any security test."
  - "I can find the lab's target and reach it."
  - "I can say what to do with a weakness I find."
struggle: "Seeing why permission matters when the test is 'harmless'. Use the locked-door idea: trying doors without permission is the problem, not what you do next."
before: |
  Try the boards yourself.

  The gate (read first). This course teaches security as audit and defence: you scan, read and fix a lab computer your class owns. The pretend Kali and target in the lessons are safe anywhere. The real-lab version is different, so it needs your sign-off before anyone starts: school policy and IT's agreement, a written lab agreement every student signs (lab-rules.txt on the board is a model), and a lab that is cut off from every other network: a Pi running Kali and a second Pi or a virtual machine as the target, joined by one switch or one ethernet cable, with no router and no internet. Download the Kali image and any tools once, at home or at IT's request. Scan only the target named on the lab sheet. This course does not teach breaking into anything: it stops at find, understand and fix. It relaxes the 'defensive only' rule of the other courses only in that the real lab uses real scanning tools on a computer the class owns.

  Simplifications: the pretend Kali refuses a scan of anything but the target and itself, so a student can't scan off-sheet by accident on the board. A real Kali will not, so the rule has to live in the lab agreement and in you. The pretend `ssh` always accepts the password.

  Real lab, if you run one: Kali Linux has a Raspberry Pi image (Pi 4 or Pi 5; the Pi 5 wants its 27 W supply); flash it with Raspberry Pi Imager or the Kali image instructions and boot it with a screen and keyboard, or ssh in. The target can be a second Pi (an older Raspberry Pi OS with a few extra services) or a purpose-made practice target your IT team approves. Start from the same state every time: re-flash, or snapshot a virtual machine. `nmap` is already on Kali. Give each pair a printed lab sheet naming the target's address, the one account they may use and what they are allowed to change.

  Other options: Parrot OS is a similar security distribution; for a no-hardware route, use the pretend lab here or a virtual machine on a teacher's computer.
running:
  - "Predict: ask what makes a test legitimate."
  - "Try: ask what the rules file said first."
  - "Worked example: stop at Sam's mistake and ask what 'harmless' means."
  - "Vary: ask why the pretend lab refuses the off-sheet scan, and what refuses on a real one."
  - "Make: ask what the lab agreement should say."
stuck:
  - see: "A student wants to try the tools on their own network at home."
    ask: "Who owns that network, and has everyone on it agreed?"
    fix: "Only the lab. Keep to the sheet."
  - see: "A student's ping fails."
    ask: "Which name did you use?"
    fix: "ping target, or ping 10.0.0.2."
stretch: "Write a one-page lab agreement for your own class: scope, permission, what happens to findings."
support: "A card with the rules and the one target address."
leads: |
  Links: Security and privacy, Cyber safety and privacy (threat models); next: What is listening.
exit:
  q: "What two things must be true before you test a computer's security?"
  a: "You own it or have written permission, and the test is contained to the lab."
explain: |
  Security testing is only fair on a computer you own or have written permission to test, and only the ones named on the lab sheet. The lab is cut off from other networks so nothing can leak out. What you find is reported and fixed, not used. Kali is a toolbox of security tools; the target is the computer you may test.
