summary: Students type words and read the numbers a computer stores for them, find that capitals go up in order from A = 65, that small letters, spaces and digits have codes too, then spell a word by setting its codes (AC9TDI6K03 node 1).
time: 35
timing: "Predict and Try 6 min · Worked example 8 min · Vary 8 min · Practise and Make 13 min"
goals:
  - I can say how a word is stored as numbers.
  - I can find the number for a letter by counting on from A.
  - I can turn a list of numbers back into a word.
struggle: "Using the alphabet place (C = 3) instead of the code. Have them type C on the board and read it aloud."
before: |
  Do the Try board yourself: type your name, then a space and a digit.

  The one idea: every character has a number (its code), and a word is a list of codes in order. The codes are ASCII, which Unicode keeps for the first 128 characters; nothing here needs those names.

  Year 7–8 catch-up: if students can find D's code (68) and read 72, 73 back as HI, go straight to Everything is numbers and Text as numbers.

  Unplugged: a class code chart on the board; students write a secret message in codes for a partner.
running:
  - "Predict: students who chose 4 used the alphabet place; ask what A's number is."
  - "Try: whose name makes the longest list? Why?"
  - "Worked example: before the T line, ask how far T is from A."
  - "Vary: ask why a space needs a number at all."
  - "Make: let students check by reading their numbers back as letters."
stuck:
  - see: "A student says C is stored as 3 (Sam's mistake)."
    ask: "Type C on the board. What number comes up?"
    fix: "The codes start at A = 65, so C is 67."
  - see: "A student thinks small and capital letters share a number."
    ask: "Type a, then A. Are the numbers the same?"
    fix: "Small letters start at 97."
stretch: "Find the code for ? and for !. Are they near the letters or somewhere else?"
support: "A strip: A 65, B 66, C 67 … up to Z 90; a 97, b 98 …; space 32."
leads: |
  Next: Text or number? (what the computer can do with each).

  Year 7–8: Everything is numbers, then Text as numbers.
exit:
  q: "What numbers does the computer store for BAD?"
  a: "66, 65, 68."
explain: |
  A computer can only store numbers, so every letter has its own number, called its **code**. Capital A is 65, B is 66, C is 67, and they go up in order. Small letters start at 97, and spaces (32) and digits have codes too.

  A word is stored as a list of codes, one for each character, in order: CAT is 67, 65, 84.
