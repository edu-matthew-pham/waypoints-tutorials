summary: Students mix red, green and blue light on a pixel grid to see that a bitmap is a grid of pixels, each stored as three numbers from 0 to 255, and compare bitmaps with vector pictures stored as shapes (AC9TDI8K03 node 3).
time: 40
timing: "Predict and Try 6 min · Worked example 12 min · Vary 10 min · Practise and Make 12 min"
goals:
  - I can say how a pixel's colour is stored.
  - I can count the numbers an image needs.
  - I can explain the difference between a bitmap and a vector picture.
struggle: "Students mix light like paint (red and green make brown). Let them predict, then see yellow on the board; a magnifier on a white part of a real screen shows the three coloured dots."
before: |
  Try the Try and Make boards yourself first.

  The one idea: a bitmap is a grid of pixels and each pixel is three numbers (red, green, blue), each from 0 to 255. Vector pictures store shapes instead, which is why they stay sharp when scaled.

  Simplifications: real images are much bigger and usually compressed (Years 9–10); some formats also store transparency (a fourth number). "0 to 255 fits in one byte" is stated here and explained in the binary lessons.

  Hands-on: CS Unplugged's Image representation activity (colour by numbers on grid paper) works well before the board.
running:
  - "Predict: students who chose brown are thinking of paint. Ask them to hold the thought until the Try."
  - "Try: have students find the colour of 255, 128, 0 (orange) before checking."
  - "Worked example: ask how many numbers a phone photo might need (millions of pixels × 3)."
  - "Vary: ask why grey has equal numbers."
  - "Make: ask how many different numbers they actually used."
stuck:
  - see: "A student says 255, 255, 0 is brown (Sam's mistake)."
    ask: "Does a screen mix paint, or add light?"
    fix: "Light adds up: red and green light look yellow."
  - see: "A student thinks black pixels store nothing."
    ask: "Press Show numbers. What does a black pixel hold?"
    fix: "0, 0, 0: still three numbers."
stretch: "Find the RGB numbers for your favourite colour with the sliders. Then look at the colour picker in a drawing app: it shows the same three numbers."
support: "Give the six main colours: red 255,0,0; green 0,255,0; blue 0,0,255; yellow 255,255,0; cyan 0,255,255; magenta 255,0,255."
leads: |
  Next: Shapes as numbers (vector pictures and 3D models).

  Code links: turtle's `color()` takes RGB amounts; the Teachable Machine lessons train on images, which the model sees as these numbers. Later: why each amount stops at 255 (How many patterns?), and compressing images (Years 9–10).
exit:
  q: "What colour is 0, 255, 0? How many numbers store a 3 × 2 image?"
  a: "Green. 3 × 2 = 6 pixels × 3 = 18 numbers."
explain: |
  A screen picture is a grid of **pixels**. Each pixel is three numbers for **red, green and blue** light (RGB), each from 0 (off) to 255 (full). Light adds up, so red and green make yellow and all three make white. An image needs width × height × 3 numbers.

  A **vector** picture stores shapes instead (a circle: centre, radius, colour), so it can be drawn sharp at any size.
sources:
  - { title: "CS Unplugged: Image representation (CC BY-SA 4.0)", url: "https://www.csunplugged.org/en/topics/image-representation/", checked: 2026-10-12 }
