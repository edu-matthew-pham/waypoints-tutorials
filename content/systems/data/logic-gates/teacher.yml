summary: Students try every combination of two switches in a circuit to build AND and OR truth tables, use NOT, then add two bits with a half adder, to explain why digital systems are built on binary (AC9TDI8K04 node 3).
time: 40
timing: "Predict and Try 7 min · Worked example 10 min · Vary 10 min · Practise and Make 13 min"
goals:
  - I can give the output of AND, OR and NOT gates.
  - I can explain why computers use binary.
  - I can show how gates add two bits.
struggle: "Students read OR as everyday English (one or the other, not both). Point at the circuit: with both switches on, is there still a path for the current?"
before: |
  Try the boards yourself. A torch, a battery and two real switches (or a breadboard) make the Try concrete in a minute.

  The one idea (the kit's chain for this node): electronic components have two reliable states → those states are 0 and 1 → gates combine them → so binary is the foundation of all computing. The half adder in Make shows gates doing the binary addition students know from lesson 5.

  Simplifications: real gates are made of transistors, not mechanical switches; the circuit view is an analogy that holds for AND and OR.
running:
  - "Predict: students who chose \"yes\" picture parallel wiring. Ask them to trace the current."
  - "Try: have students fill a paper truth table as the board's fills."
  - "Worked example: before the OR line, ask what changes when the switches sit side by side."
  - "Vary: ask why AND has only one row that gives 1."
  - "Make: connect to 1 + 1 = 10 in binary and to carrying in base 10."
stuck:
  - see: "A student writes 1 OR 1 = 0 (Sam's mistake)."
    ask: "With both switches on side by side, can the current reach the lamp?"
    fix: "Yes: OR means at least one. One but not both is XOR."
  - see: "A student thinks gates add (1 AND 1 = 2)."
    ask: "How many states can the output wire have?"
    fix: "One bit: 0 or 1. Adding takes several gates, as in the half adder."
stretch: "A full adder adds three bits (two numbers and a carry in). Sketch how two half adders and an OR gate could make one."
support: "Keep the three truth tables on the board for the whole lesson."
leads: |
  Next: Bits all the way down (tracing text and colours to binary).

  Code links: `and`, `or` and `not` in Python and MakeCode conditions are these gates; the Robotics course uses them to combine sensor readings.
exit:
  q: "Fill in the output: 1 AND 1, 0 OR 1, NOT 0. Why are computers built on binary?"
  a: "1, 1, 1. Switches have two reliable states, and gates combine them to do any calculation."
explain: |
  Inside a computer, each bit is a tiny electronic **switch**: off (0) or on (1). Two states are easy to tell apart reliably. Switches wired together make **logic gates**: **AND** gives 1 only when both inputs are 1 (switches in a line); **OR** gives 1 when at least one input is 1 (switches side by side); **NOT** flips one input.

  Gates combined can add bits (1 + 1 = 10 in binary), compare and store them, which is why every computer is built on binary.
