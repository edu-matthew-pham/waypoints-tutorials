summary: "A full 5E lesson (AC9TDI8K02 node 2). Students write what they think will go wrong, watch a message go to pieces on the board (no fixes, nothing named), invent their own fix with two plain switches (Numbers, Ask again) and find a second fix by avoiding busy router C. Only then do they explain it in their own words and meet the names: packet, router, acknowledgement, TCP. Elaborate takes the idea to broken links and live video."
time: 45
timing: "Engage 5 min · Explore 15 min · Explain 12 min · Elaborate 8 min · Evaluate 5 min"
goals:
  - I can explain why data is sent in packets.
  - I can describe what happens when a packet is lost.
  - I can explain how TCP gets the whole message there in order.
struggle: "Students expect the network to be one pipe, and want to be told the fix. Let Explore stay open: the first board has no fix on it, and the second asks them to invent one. Hold back the words packet and TCP until Explain; the names stick when they label something students already did."
before: |
  This is inquiry first (5E): students explore and invent before anything is explained. The words packet, acknowledgement and TCP appear only in Explain, after students have written their own explanation. If you usually teach explicitly, this is the lesson to try the difference.

  Try both Explore boards yourself. The first has no fix: Ali always gets a jumbled message with a gap. The second has two switches, Numbers and Ask again (TCP, not yet named); the goals can be met two ways (both switches with every link working, or no switches with C cut off).

  Engage works well unplugged first: cut MEET AT NOON into four strips with no numbers, hand them out across the room, have students pass them to an "Ali" by different paths, and keep one strip "lost". Ask Ali to read out what arrived. Then have students write their guesses.

  Explain: let students write first, then share two or three explanations before anyone opens Give it names. Then name each part of what they did on the projector, and reveal the worked lines. The "Explain it to me" drawer opens once Engage is answered and uses the names, so ask students to leave it until after Explain.

  Simplifications: real packets carry about 1500 bytes, and real TCP uses acknowledgement numbers and timers; the board waits until everything else has arrived before asking again. Without numbers the board's Ask again gives up, since TCP needs sequence numbers to know what is missing. Router C is set to be busy (slow, and it loses the second packet).

  Review: open the next lesson with a quick question on this one, and this one with one on Wired or wireless (which link loses the most packets?).

  Links: Secret messages' checksum lesson is how a receiver tells a packet was damaged.
running:
  - "Engage: read a few guesses aloud without judging. Note who pictures one pipe."
  - "Explore, first board: ask what they saw, not why. Push on the sort: did they see the routers sort anything?"
  - "Explore, invent a fix: ask what Ali's computer would need on each piece. When Numbers shows a gap, ask how it could get the missing piece."
  - "Explore, switches off: if nobody thinks of breaking links, ask where the trouble starts."
  - "Explain: students write before the names. Share two explanations, then name each part."
  - "Two fixes: ask whether you would always know which router is busy."
  - "Elaborate: ask why a network has spare links, and who would rather have a glitch than a freeze."
  - "Evaluate: have students reread their Engage guess and say one thing they would change."
stuck:
  - see: "A student says the whole message is resent (Sam's mistake)."
    ask: "Which pieces did Ali's computer confirm?"
    fix: "Only the unconfirmed one is sent again."
  - see: "A student thinks the routers reorder packets."
    ask: "On the first board, did anything on the way sort the pieces?"
    fix: "Nothing on the way does. The receiver does, using the numbers."
  - see: "A student switches on Ask again first and it doesn't help."
    ask: "How would Ali's computer know which piece to ask for?"
    fix: "It can't without numbers. Switch Numbers on too."
  - see: "A student is stuck on the switches-off fix."
    ask: "Where does the trouble start? Can you stop pieces going there?"
    fix: "Break the link from C to E."
stretch: "Video calls often use UDP, which never resends lost packets. Why is that better for a live call than waiting for a resend, and worse for downloading a file?"
support: "Give the five words with a picture each: packet, number, router, route, acknowledgement."
leads: |
  Next: Who can see your data? (packets pass through routers you don't control).

  Code links: micro:bit radio sends short packets; Secret messages adds checksums to them.
exit:
  q: "A message is split into 5 packets and packet 3 is lost. What does TCP do, and how does the message end up in order?"
  a: "The receiver never confirms packet 3, so the sender sends it again. The receiver puts the packets in order by their numbers."
explain: |
  Data is sent in small **packets**. Each carries a piece of the data, a **number** and an address. **Routers** pass each packet on, so packets can take different routes, arrive out of order or get lost at a busy router.

  Without numbers, the receiver can only join the pieces in the order they arrive. With numbers it can put them in order and see which is missing. The **TCP** protocol has the receiver confirm (acknowledge) each packet; any packet that isn't confirmed is sent again.
