summary: "Students learn that structure and language are chosen together for a particular reader, and that judging a text means asking whether those choices work for that reader. They colour commands and direct address in a beach poster for children, match features to effects, catch an adult sentence in a children's poster, label a poster's hook, steps and reminder, sort sun safety paragraphs by reader, and rewrite an adult text for a Year 2 student."
time: 50
timing: "Predict and Try 8 min · Worked example 12 min · Vary 6 min · Practise 7 min · Make and own writing 17 min"
goals:
  - I can name structure and language features chosen for a reader.
  - I can judge whether a text's choices work for the reader it was written for.
  - I can rewrite a text for a different reader.
struggle: "Students think 'for kids' means 'shorter' and stop there. The Try shows it is also commands and you; the Vary shows it is also structure (hook, steps, reminder). In the Make, ask: what would this reader do after reading it?"
before: |
  Do the Try board yourself: colour you and your, then the commands.

  The one idea: structure and language work together for a reader. This lesson covers AC9E6LY03 nodes 1 to 3 (structures and features as a system, engaging a specific audience, evaluating effectiveness) and AC9E8LA03 node 1 (structure and language serve the purpose). The evaluating part is the question "does it work for this reader?", asked in the worked example and the Make.

  The safety advice follows common Australian guidance: swim between the red and yellow flags, and if in trouble, float and raise an arm; sunscreen SPF 30 or higher, applied 20 minutes before going out and reapplied every two hours. Check current advice (Surf Life Saving Australia, Cancer Council) if you extend the lesson.

  The wider step (Another reader, another form) is breadth, not acceleration: the same Year 6–8 skill in a spoken form for an older audience, compared with model answers.
running:
  - "Predict: ask students to rewrite sign B so a seven-year-old would follow it."
  - "Try: ask what would be lost if every you were taken out."
  - "Worked example: ask why Nib wrote line 3 that way. (Nib copied it from a source written for adults.)"
  - "Practise: ask which single word in each paragraph gave away the reader."
  - "Make: partners act as the Year 2 reader and stop the writer at any word they wouldn't know."
stuck:
  - see: "A student colours every verb, such as get or see, as a command."
    ask: "Is this word telling the reader to do something?"
    fix: "A command gives an instruction: Swim, Stay, Ask. 'If you get tired' is not an instruction."
  - see: "A student labels the reminder as a step."
    ask: "Is this a new thing to do, or the main idea said again?"
    fix: "A reminder repeats the main idea at the end."
  - see: "A student's rewrite keeps the long words but cuts sentences in half."
    ask: "Would a seven-year-old know 'ultraviolet' or 'individuals'?"
    fix: "Change the words, not just the length: sun, you, hat."
stretch: "Find a real safety sign at school. Who is it written for? Rewrite it for a different reader."
support: "A reader card: How old? What do they know? What should they do after reading?"
leads: |
  Next in How texts are built: mixing text types, where writers borrow one type's stages inside another for a reader.

  Choosing words for a reader is the focus of a later English course, Language for people and situations.
exit:
  q: "A text for parents says 'Wear a hat!' and nothing else. Does it work for its reader? Why or why not?"
  a: "Probably not well: adults can use reasons and detail (why hats matter, which kind), so a single command undersells them. It would suit a young child better."
explain: |
  Writers choose **structure** and **language** together, for a particular **reader**.

  For young readers: a hook, **short commands** (Swim, Stay, Ask) and **you**. For adults: reasons, technical words and more detail.

  To judge a text, ask: would **this** reader understand it and act on it?
