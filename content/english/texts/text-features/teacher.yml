summary: "An optional warm-up from Years 4 and 5. Students learn that imaginative, informative and persuasive texts each have features that fit their purpose, and that informative texts include reports (what something is like) and explanations (how or why something happens). They label three paragraphs about one gum tree, sort features, colour persuasive words, and write the same topic three ways."
time: 45
timing: "Predict and Try 8 min · Worked example 12 min · Vary 10 min · Practise 6 min · Make and own writing 9 min"
goals:
  - I can tell imaginative, informative and persuasive texts apart by their features.
  - I can tell a report from an explanation.
  - I can say why a persuasive text might use a character.
  - I can write about one topic for three different purposes.
struggle: "Students sort by topic rather than purpose: all three Try paragraphs are about the gum tree, so they look the same. Keep asking what the paragraph is trying to do, not what it is about."
before: |
  Do the Try board yourself: click a paragraph and choose a label.

  The one idea: the purpose decides the features. This lesson covers AC9E4LA03 nodes 2 to 4 (features by text type, reports versus explanations, form versus stages), AC9E4LY03 nodes 1 to 3 (imaginative, informative and persuasive features) and AC9E5LY03 nodes 1 to 3 (features serve the purpose, characters in persuasive texts, explaining the features of a text type). That is a lot of nodes for one lesson; they are the same idea seen from different sides.

  Facts in the texts (eucalypt oil, little penguins about 30 cm tall, echolocation in small bats, a koala joey in the pouch for about six months) were checked against general reference sources. The gum tree, the petition and Drip the frog are made up.
running:
  - "Predict: ask which single word gave it away. (Should.)"
  - "Try: ask a student to read the informative paragraph in a persuasive voice. What would they have to add?"
  - "Worked example: the report and explanation sort is the hardest. Ask: does it answer 'what is it like?' or 'how does it happen?'"
  - "Vary: collect other characters students know from public-service ads. What do they all do?"
  - "Make: partners label each other's sentences before they see the labels."
stuck:
  - see: "A student labels all three Try paragraphs informative because they are about a tree."
    ask: "What is each paragraph trying to do to you?"
    fix: "Purpose, not topic: entertain, inform or persuade."
  - see: "A student calls every informative paragraph a report."
    ask: "Does this paragraph describe, or does it tell how or why something happens?"
    fix: "Look for when, so, because and as a result: they often mark an explanation."
  - see: "A student's persuasive sentence is a fact ('Wombats are nocturnal')."
    ask: "Could anyone disagree with it?"
    fix: "Add an opinion: should, must, best, or a reason to act."
stretch: "Find a real public-service poster and list its features. Which are persuasive, and which are borrowed from stories?"
support: "A card with three columns: Imaginative (characters, setting, problem) · Informative (facts, technical words) · Persuasive (opinion, reasons, call to act)."
leads: |
  Next in How texts are built: stages and phases, starting with explanations.

  The report and explanation split comes back in Purpose shapes the text, where the same facts become a recount, a report and an argument.
exit:
  q: "'Lightning is about five times hotter than the surface of the sun.' Imaginative, informative or persuasive, and how do you know?"
  a: "Informative. It's a fact with no opinion or story: no characters, no should or must."
explain: |
  Texts have different **purposes**, and each kind has **features** that fit its job.

  - **Imaginative:** characters, a setting, a problem, dialogue.
  - **Informative:** facts and technical words. A **report** says what something is like; an **explanation** says how or why it happens.
  - **Persuasive:** an opinion, reasons, strong words and a call to act.
