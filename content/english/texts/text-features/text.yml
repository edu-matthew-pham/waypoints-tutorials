s story: Under the old gum tree, Ava found a rusty tin. Inside was a key and a note that said, "For whoever finds this."
para:
s info: Most gum trees, or eucalypts, grow naturally only in Australia. Their leaves contain an oil that gives the bush its strong smell.
para:
s persuade: The council must not cut down our old gum tree. It shades the whole playground, and it was here before the school was built. Write to the council today.
# endregion

# region: vary
widget: cohesion
mode: chain
colours: 1
p: Our school [[must#a]] start a vegetable garden. It is the [[best#a]] way to learn where food comes from. Leaving that corner of the oval empty is a [[terrible#a]] waste. Every student [[should#a]] sign the petition today.
# endregion

