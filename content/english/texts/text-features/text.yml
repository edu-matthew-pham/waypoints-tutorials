role report: Report
s report: Little penguins are the smallest penguins in the world. They are about 30 centimetres tall, with blue-grey feathers on their backs.
para:
s explain: Penguins can't fly, but they swim fast. Their wings are stiff flippers, so each stroke pushes them through the water.
para:
s report: Bats are mammals that can fly. Most Australian bats eat insects, and some eat fruit and nectar.
para:
s explain: When a small bat hunts at night, it makes high-pitched calls. The echoes bounce back from insects, so the bat can tell where they are.
