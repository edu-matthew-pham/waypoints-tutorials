summary: "Students learn four patterns that organise ideas inside a text: cause and effect, compare and contrast, problem and solution, and claim and support. They label paragraphs by pattern, match signal words, catch a comparison that only covers one side, choose a pattern for a purpose, colour alike and different signals, label a problem and solution paragraph, and write their own paragraph in one pattern."
time: 50
timing: "Predict and Try 8 min · Worked example 12 min · Vary 7 min · Practise 7 min · Make and own writing 16 min"
goals:
  - I can name the pattern a paragraph uses and the signal words that show it.
  - I can check that a pattern is carried out, such as both sides of a comparison.
  - I can choose a pattern that fits what my text is for.
  - I can write a paragraph in one pattern.
struggle: "Students spot a single signal word and stop: one 'because' doesn't make a whole paragraph cause and effect. Ask what the whole paragraph is doing, then which words show it."
before: |
  Do the Try board yourself: four canteen paragraphs, four patterns.

  The one idea: ideas inside a text follow patterns, and signal words show them. This lesson covers AC9E7LY04 nodes 1 and 2 (idea structures, and how the choice serves the purpose) and AC9E8LY04 node 1 (organisational structures such as proposition and support). ACARA calls claim and support **proposition and support**; the lesson says "claim" to match the Holding writing together course.

  Patterns can mix: a problem and solution paragraph usually has causes in it. Ask for the main pattern, the one that organises the whole paragraph.

  The cod and platypus facts were checked against general reference sources (both live in the Murray–Darling system; the platypus is an egg-laying mammal that breathes air). The canteen, the walking bus and the town storm are made up.
running:
  - "Predict: ask which two words gave it away."
  - "Try: after labelling, ask how the same canteen could be written in each of the other three patterns."
  - "Worked example: Nib's possums. Ask what the reader expected after line 1, and when they gave up waiting."
  - "Vary: ask students to add one more alike signal and one more different signal to the cod paragraph."
  - "Make: partners name each other's pattern before the writer says what it is."
stuck:
  - see: "A student labels the claim and support paragraph as compare and contrast because it says 'healthier than'."
    ask: "Is the paragraph about both menus, or making a point about one and backing it up?"
    fix: "Find the job of the whole paragraph. For example is the signal for support."
  - see: "A student colours 'the platypus' as a different signal."
    ask: "Is that word showing a difference, or naming one of the things being compared?"
    fix: "Colour only the signal words: both, also, whereas, but, unlike."
  - see: "A student's Make paragraph switches patterns halfway."
    ask: "Which pattern did your first sentence promise?"
    fix: "Keep the whole paragraph in that pattern, or split it into two paragraphs."
stretch: "Take one topic (your school's lunchtime) and write a short paragraph in each of the four patterns. Which pattern would you choose for a letter to the principal, and why?"
support: "A pattern card: four boxes with each pattern's job and three signal words."
leads: |
  Next in How texts are built: what comes first, and what a structure leaves out.

  Claim and support is the shape of the analytical paragraph in Holding writing together (Inside a paragraph), and of each reason in the challenge argument.
exit:
  q: "'Many students forget their hats, so the school now sells cheap hats at the office.' Which pattern, and which word shows it?"
  a: "Problem and solution (forgotten hats, then the fix). So links the problem to what the school did about it."
explain: |
  Ideas inside a text follow **patterns**:

  - **Cause and effect:** because, so, as a result.
  - **Compare and contrast:** both, also, unlike, whereas.
  - **Problem and solution:** the problem is, one way to fix this.
  - **Claim and support:** for example, this shows.

  **Signal words** show the pattern. A writer picks the pattern that fits what the text is for, and carries it through.
