summary: "Students learn that a text's purpose decides its stages and its language. Using the same frog facts, they label a report's stages, match purposes to stages, sort language by purpose, catch a report that drifts into a recount, label an argument built from the same facts, colour time words and technical words, and write their own report."
time: 50
timing: "Predict and Try 8 min · Worked example 12 min · Vary 10 min · Practise 7 min · Make and own writing 13 min"
goals:
  - I can say how a text's purpose decides its stages.
  - I can spot language that fits a recount, a report or an argument.
  - I can notice when a text drifts away from its purpose.
  - I can write a report with a general statement and descriptions.
struggle: "Students keep the topic in charge instead of the purpose: they add a funny excursion moment to a report because it is about frogs. Nib's drift is planted for this. Ask: what is this text for, and does this sentence help?"
before: |
  Do the Try board yourself, then the Vary argument: notice the same facts doing a different job.

  The one idea: purpose drives structure, and language follows. This lesson covers AC9E7LA03 node 1 (purpose drives structure, a hinge) and node 2 (language features vary with purpose). The list in the lesson text summarises four common types; it is a starting point, not a rule, and the Mixing text types lesson shows writers combining them.

  In genre teaching the argument's stages are often called **thesis**, **arguments** and **reinforcement of thesis**; the lesson says position, reasons and restated position. A report's opening is the **general statement** or classification.

  Frog facts (amphibians, skin breathing, tadpoles with gills, burrowing desert frogs) and the echidna and eucalypt facts were checked against general reference sources.
running:
  - "Predict: ask students to name the stages they'd use before they see the list."
  - "Try: ask what a reader learns from the general statement alone."
  - "Worked example: Nib's line 3 is fun. Agree that it is, then ask where it would belong."
  - "Vary: put the report and the argument side by side. Which facts became reasons? Which were left out, and why?"
  - "Make: partners check each other's reports for past-tense sentences: a sign of drift into recount."
stuck:
  - see: "A student labels a description as the general statement because it comes early."
    ask: "Does it say what frogs are, or one thing about them?"
    fix: "The general statement classifies the whole topic. Descriptions each cover one aspect."
  - see: "A student colours we or our class as a time word."
    ask: "Does this word tell the reader when something happened?"
    fix: "Time words place events in time: first, then, after lunch."
  - see: "A student's report reads like a recount ('We saw a wombat...')."
    ask: "Is this about one day you had, or about the animal in general?"
    fix: "Use the present tense and talk about all of them: 'Wombats dig...'"
stretch: "Rewrite your report as an argument. Which facts become reasons? What do you need to add?"
support: "The purpose list on a card, with one example sentence for each kind of text."
leads: |
  Next in How texts are built: patterns for organising ideas inside a text (cause and effect, compare and contrast, problem and solution, claim and support).

  The argument shape returns in the challenge, Build an argument.
exit:
  q: "A text about bushfires is in the present tense, starts 'Bushfires are fires that burn through bush and grassland', and uses technical words such as ember. What is its purpose and type?"
  a: "To describe: it is a report. The general statement and the present tense and technical words fit that purpose."
explain: |
  A text's **purpose** decides its **stages** and its **language**.

  - Retell: a **recount** (orientation, events, ending; past tense, time words).
  - Describe: a **report** (general statement, descriptions; present tense, technical words).
  - Persuade: an **argument** (position, reasons, position restated; should, would, because).

  The same facts can go in any of them. The purpose decides how they are arranged.
