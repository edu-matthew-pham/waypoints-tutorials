# Texts for "Mixing text types" (cohesion board, parts mode). Hybrids borrow one type's stages inside another.

# region: run
widget: cohesion
mode: parts
layout: blocks
roles: story position reason action
role story: Story
role action: Call to act
s story: Last July, floodwater filled Jun's house in the night. For three nights his family slept in the school hall on borrowed mattresses.
para:
s position: Every school in our region should keep an emergency kit of blankets, mattresses and food.
para:
s reason: Floods and fires can arrive with little warning, and a school hall is often where families go first.
para:
s action: Ask your principal this week whether our school has a kit ready.
# endregion

