s entry: Monday 3 March. Mum says we're moving to Darwin. I don't want to leave my friends.
s entry: Wednesday 5 March. Packed my room into six boxes. Found my old swimming ribbons.
s entry: Saturday 8 March. Last day at the beach with Priya. We wrote our names in the sand.
s entry: Monday 10 March. First day at the new school. A girl called Tess saved me a seat.
