s report: The Riverbend Gaol Museum is a sandstone building from 1868 that held prisoners for almost a hundred years.
para:
s recount: Last spring, Year 6 students from Hillside School spent a night in the cells and wrote about every creak and footstep.
para:
s procedure: To book a visit, choose a date on the calendar, enter your group size and press Send.
para:
s persuade: Don't miss the night tours: they are the most exciting history lesson in town.
