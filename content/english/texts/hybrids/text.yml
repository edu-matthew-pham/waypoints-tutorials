# region: explain-pic
widget: cohesion
mode: parts
layout: blocks
roles: recount explain
role recount: Recount
role explain: Explanation
answer: on
s recount: Last week our class stood a stick of celery in a glass of blue water. By the next morning, its leaves had turned blue.
para:
s explain: Water travels up the stalk through thin tubes. As water evaporates from the leaves, more is pulled up behind it, carrying the dye.
