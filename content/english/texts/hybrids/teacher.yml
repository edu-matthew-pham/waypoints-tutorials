summary: "Students learn that writers mix text types on purpose, and that a hybrid works when each borrowed part serves the main purpose and links back to the point. They label a charity letter that opens with a story, catch Nib's story that never connects to the argument, match hybrids to the types they combine, order a story told as diary entries, label a museum web page that mixes four types, and write an argument that opens with a story."
time: 50
timing: "Predict and Try 8 min · Worked example 12 min · Vary 8 min · Practise 6 min · Make and own reading 16 min"
goals:
  - I can find the borrowed parts of a hybrid text and the job each does.
  - I can say why a writer might adapt or mix a text type.
  - I can check that a borrowed story links back to the main point.
  - I can write an argument that opens with a story.
struggle: "Students name the first type they meet: the flood letter is 'a story'. Keep asking what the whole text is trying to do. The second difficulty is linking: a student's opening story is often vivid but unconnected, like Nib's bird."
before: |
  Do the Try board yourself: four parts, two text types.

  The one idea: writers adapt and mix text types for a purpose. This lesson covers AC9E6LA03 node 3 (when and why authors adapt text structures) and AC9E8LA03 node 2 (hybrid texts). Judging how well a hybrid or a broken pattern works at a Year 9–10 standard (AC9E9LA03, AC9E10LA03) is left to the Years 9–10 phase on purpose; the wider step here is breadth at this level: the same question about an advert.

  Jun, the Riverbend Gaol Museum, Hillside School and Nonna's lemonade are all made up. The diary dates are consistent with a year in which 3 March falls on a Monday.
running:
  - "Predict: ask which word or sentence shows the letter is going to ask for something."
  - "Try: ask what would be lost if the letter started with the position."
  - "Worked example: Nib's bird. Ask students to write one sentence that would link the story to longer lunches."
  - "Vary: ask how the story would read if told in one go, a year later. What would the narrator know that she doesn't know on Monday?"
  - "Make: partners read only the story, then guess the position. If they can't, the link needs work."
stuck:
  - see: "A student labels the whole Try text 'Story'."
    ask: "Which paragraph says what the writer wants?"
    fix: "Find the main purpose first, then the borrowed part."
  - see: "A student orders the diary entries by length or by what seems most exciting."
    ask: "What does each entry start with?"
    fix: "The dates put them in order, like time words in a recount."
  - see: "A student's Make story has nothing to do with their position."
    ask: "If I read only your story, could I guess what you want?"
    fix: "Choose a story about someone your change would help."
stretch: "Find a picture book that tells a story through letters, lists or postcards. What does the form add that an ordinary story wouldn't?"
support: "A two-column card: Borrowed part · Its job (hook, make the reader care, make it easy to follow)."
leads: |
  Next in How texts are built: the challenge, Build an argument.

  In Years 9 and 10, students judge when breaking a text's usual pattern works and when it doesn't; that comes in the later Years 9–10 English work.
exit:
  q: "A science web page explains the water cycle as the journey of one raindrop called Drop. What types does it mix, and why?"
  a: "An explanation told as a story (with a character). The character makes the steps easy to follow and remember."
explain: |
  Writers **mix** text types on purpose. The result is a **hybrid**.

  A charity letter opens with a **true story** so you care. A novel told as **diary entries** lets you live each day. A recipe starts with a **memory**.

  A hybrid works when each borrowed part does a job for the **main purpose** and links back to the point.
