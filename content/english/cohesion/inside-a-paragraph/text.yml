s claim: Canberra was planned as a city that fits its landscape.
s example: Walter Burley Griffin and Marion Mahony Griffin, who won the competition to design it in 1912, used the surrounding hills as landmarks to line up the main lines of the city.
s example: Their plan placed a large lake at the centre, and Lake Burley Griffin was filled in 1964.
s explain: Lining the city up with the hills and building it around a lake shows that the designers worked with the land rather than flattening it.
# endregion

