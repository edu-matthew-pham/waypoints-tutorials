p: [[Volcanoes#a]] form where melted rock pushes up through the Earth's crust. An erupting [[volcano#a]] can throw out [[ash#b]], gas and lava. The [[ash#b]] can travel hundreds of kilometres. [[Volcanic ash#b]] makes flying dangerous, so planes stay on the ground after a big [[eruption#a]].
# endregion

