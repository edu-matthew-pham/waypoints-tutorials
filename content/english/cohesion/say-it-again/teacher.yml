summary: "Students learn that repeating a key word on purpose, or swapping in a synonym or antonym, makes a chain that keeps the reader on the same thing. Repetition is a tool: it is clearer than it or they when those could point to two things. Students colour chains in short texts and write their own paragraph and highlight its chain."
time: 40
timing: "Predict and Try 8 min · Worked example 10 min · Vary 6 min · Practise 6 min · Make and own writing 10 min"
goals:
  - I can find the chain of repeats and synonyms for a key word.
  - I can say why a writer repeated a key word.
  - I can repeat a key word on purpose in my own writing.
struggle: "Many students have been told never to repeat a word, and see repetition as a mistake. Let the Predict do the work: the version that repeats is easier to follow."
before: |
  Do the Try board yourself: pick Chain 1, click the volcano words, then Chain 2 for the ash words.

  The one idea: a repeat (or a synonym or antonym) tells the reader "still the same thing". This is AC9E6LA04 node 1 (repetition as a cohesion device).

  The board counts a chain as right when every planted word for that thing is in one colour and no other chain shares the colour. Words you think belong but were not planted show as strays: if a student makes a good case for one, they are right and the board is not.

  The Make step has no board: students write in their own document, and a partner or you check that the chain is clear.
running:
  - "Predict: ask students who chose A what it means in sentence three."
  - "Try: ask whether lava belongs in the ash chain. (It comes out of the volcano too, but it is a different thing.)"
  - "Worked example: compare Nib's 'They eat it' with a version that repeats the key words."
  - "Vary: opposites (dry and wet) make two chains that work against each other."
  - "Make: students write in their own document and highlight their chain. Partners swap and look for any it or they that could mean two things."
stuck:
  - see: "A student colours every noun."
    ask: "Is this word about the same thing as the rest of the chain?"
    fix: "One chain, one thing. Leave other words uncoloured."
  - see: "A student thinks repeating is always bad style."
    ask: "Read Version A of the kelp paragraph aloud. Where did you get lost?"
    fix: "Repeat where the reader needs it; use it where only one thing fits."
  - see: "A student colours a word the board calls a stray, and argues it belongs."
    ask: "Is it a word for the same thing, or something linked to it?"
    fix: "Good argument either way. Chains are about the reader staying on track; the board only knows the words that were planted."
stretch: "Find a speech (a famous one, or a school captain's) that repeats a phrase on purpose. Why does the speaker repeat it?"
support: "A card: Key word. Same word, same-meaning word, opposite word. Repeat when it could mean two things."
leads: |
  Next in Holding writing together: word chains where a general word (the dog, the animal) stands in for a specific one.

  The chains here come back when students write topic sentences, which often name the key word of the paragraph.
exit:
  q: "'Mia and Ava went to the shops. She bought a hat.' What is unclear, and how would you fix it?"
  a: "She could be Mia or Ava. Repeat the name: Ava bought a hat."
explain: |
  Writers repeat **key words** on purpose. Each repeat tells the reader the text is still about the same thing.

  A word that means the **same** (dry spell for drought) carries the chain. A word that means the **opposite** (rain against drought) starts a second chain that answers the first.

  Repeat the key word when **it** or **they** could point to two things.
