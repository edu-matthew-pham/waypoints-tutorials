summary: "Students learn that joining words (connectives) tell the reader how two ideas connect: adding, turning against, showing a result, or putting things in time order. They are not interchangeable. Students choose joining words in gaps, sort them by job, and use three different ones in their own recount."
time: 40
timing: "Predict and Try 8 min · Worked example 10 min · Vary 6 min · Practise 6 min · Make and own writing 10 min"
goals:
  - I can say what job a joining word does (adds, turns, result or time).
  - I can choose a joining word that fits how two ideas connect.
  - I can use different joining words in my own writing.
struggle: "Students often treat joining words as decoration, picking whichever sounds best (however is a favourite). Keep asking: how does the second idea connect to the first?"
before: |
  Do the Try board yourself: the gaps each offer three joining words that do different jobs.

  The one idea: a joining word says how the next idea connects to the last one, so swapping one changes the meaning.

  This is an optional warm-up from Year 4 (AC9E4LA04 nodes 2 and 3: connectives between sentences, and temporal connectives). The four jobs (adds, turns, result, time) are a simplified set. AC9E4LA04 also names conditional connectives (if, unless), which this lesson leaves to class; Year 9 (AC9E9LA04) widens the set further to conclusion and expansion. The word "connective" is in the notes; students can use "joining word".
running:
  - "Predict: ask students to read both versions aloud. Which one sounds like it makes sense?"
  - "Try: for each gap, ask the class to name the job before anyone picks a word."
  - "Worked example: Nib's slip (picking however because it sounds clever) is common. Ask for a time students have done the same."
  - "Vary: the facts are identical in both short paragraphs. What changed the meaning?"
  - "Make: the board only counts joining words. Pairs check each other's jobs."
stuck:
  - see: "A student picks however for every gap."
    ask: "Does the second idea go against the first, or does it follow from it?"
    fix: "Name the job first, then pick a word from that group."
  - see: "A student says so and as a result are different jobs."
    ask: "Do they both say the second idea happened because of the first?"
    fix: "Several words can do the same job; the job is what matters."
  - see: "A student's Make uses only then and then."
    ask: "Is there a place where something happened because of something else, or went wrong?"
    fix: "Add one result or turn word where the story has a reason or a surprise."
stretch: "Find a paragraph in a science or history textbook. List its joining words and the job each one does. Which job is most common, and why do you think that is?"
support: "A card with four boxes (Adds, Turns, Result, Time) and three joining words in each."
leads: |
  Next in Holding writing together: where a sentence starts, and why the start tells the reader what it is about.

  Joining words come back in the course challenge, where students choose them for gaps in a report.
exit:
  q: "'The bus broke down. ___ we were late for school.' Which joining word fits, and what job does it do?"
  a: "So (or as a result): the second idea is a result of the first."
explain: |
  A **joining word** tells the reader how the next idea connects to the last one.

  - **Adds:** also, in addition
  - **Turns against:** however, but
  - **Shows a result:** so, as a result
  - **Shows time order:** first, then, next, finally

  Pick the word for the job. Swapping however for so changes what the sentences mean.
