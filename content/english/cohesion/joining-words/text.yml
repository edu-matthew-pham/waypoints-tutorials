p: We tested whether an egg floats in salty water. [[{First|Finally|However}=First]], we filled a jug with tap water and dropped the egg in. It sank. [[{Next|As a result|But}=Next]], we stirred in six spoons of salt. [[{After that|In addition|So}=After that]], we lowered the egg in again. This time it floated. Salt makes the water denser than the egg. [[{As a result|First|Then}=As a result]], the egg is pushed up. [[{Finally|However|Also}=Finally]], we wrote up our results.
