p: [[The Year 6 students|y6]] counted frogs at [[the school pond|pond]] every Friday. [[They>y6]] found eleven in March and twenty in May, after heavy rain had filled [[it>pond]] up. [[Each week there were more frogs than the week before|more]]. [[This>more]] showed the pond was healthy.
