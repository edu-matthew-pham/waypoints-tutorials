p: [[Ms Tran|tran]] gave [[our class|class]] [[a garden bed|bed]]. [[She>tran]] said [[we>class]] could grow anything. [[It>bed]] gets sun all morning, so the class chose [[tomatoes and basil|plants]]. [[They>plants]] grow well together.
