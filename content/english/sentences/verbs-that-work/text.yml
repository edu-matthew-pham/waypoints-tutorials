as: student
p: Our team played Hillside on Saturday morning. The striker sprinted down the wing and crossed the ball. Hillside's keeper dived but missed it. The crowd roared as the ball hit the net. Our captain lifted the trophy, and everyone cheered very loudly. We won by two goals after a tough, exciting match.
