summary: "Students learn that precise verbs, the right tense and adverb groups make a sentence more exact. They choose a one-word verb for a wordy phrase, match phrases to verbs, catch a plain verb with an adverb, choose the tense a report needs, choose verb forms from time clues, colour adverb groups by what they add and write a match report in their own document."
time: 50
timing: "Predict and Try 8 min · Worked example 12 min · Vary 6 min · Practise 6 min · Make (in their own document) and own writing 18 min"
goals:
  - I can replace a plain verb and an adverb with one precise verb.
  - I can choose past, present or future for what I am telling.
  - "I can say what an adverb group adds: how, where, when or how much."
  - I can write a match report that uses all three well.
struggle: "Students pile on adverbs ('ran very, very quickly') or swap in a long word that is not exact. Ask 'does this verb say more than the plain one?' and let them check against what they meant."
before: |
  Do the Try board yourself: three wordy sentences, three precise verbs.

  The one idea: choose the verb, the tense and the adverb group on purpose. This lesson covers AC9E6LA06 nodes 1 to 3 (precise verb selection, elaborated tenses, adverb groups for precision).

  ACARA's **elaborated tenses** here means the different ways English refers to time: simple present, simple past and future time expressions (will plus a verb). The lesson keeps to those. It does not teach perfect or continuous tenses; 'was planting' appears only as a wrong choice.

  A precise verb is not always a longer one. 'Said' is often the best verb; the aim is exact, not fancy. The board plants verbs whose meanings are clear from the wordy phrase.

  An **adverb group** is an adverb with a word that modifies it (very quietly, just outside). The lesson sticks to these; prepositional phrases (along the creek) are covered in other lessons.

  The facts and sentences are made up for the lesson.
running:
  - "Predict: ask which word 'whispered' replaced, and what the sentence lost."
  - "Try: after choosing, ask when the plain verb and an adverb would be the better choice."
  - "Worked example: Nib's report. Ask which single verb would say 'ran very fast'."
  - "Vary: ask what time clue pointed to each tense."
  - "Make: students write in their own document, then partners underline each precise verb and adverb group, and check the tense."
stuck:
  - see: "A student chooses 'stomped' for 'walked very quietly'."
    ask: "Does this verb mean the same as the wordy phrase?"
    fix: "Match meaning first. Test by saying the wordy phrase and the single verb side by side."
  - see: "A student's report switches between 'scored' and 'scores'."
    ask: "Has this match already happened?"
    fix: "Choose one tense for the whole report and check every verb."
  - see: "A student colours 'along the creek' as an adverb group."
    ask: "Is it an adverb with a modifier, or a phrase that starts with a preposition?"
    fix: "An adverb group is an adverb and its modifier: very early, just outside."
stretch: "Take a paragraph from a class novel and find one plain verb with an adverb. Rewrite it with one precise verb. Did the author make a better choice, or did your version?"
support: "A verb ladder: ran, hurried, raced, dashed, sprinted, from plain to precise."
leads: |
  Next in Building sentences: compound-complex sentences, which combine what you know about clauses.

  Tense reappears in Shaping sentences, where students keep it steady across a whole passage.
exit:
  q: "'The kettle boiled very loudly.' Replace 'boiled very loudly' with one precise verb, or explain why the sentence is fine."
  a: "Roared or bubbled fits, though 'boiled' alone is also fine if the loudness does not matter. The point is to choose on purpose."
explain: |
  Three tools make a sentence more exact.

  - **A precise verb:** *gulped* says what *drank very quickly* needs three words for.
  - **The tense:** *scored* (past), *scores* (present), *will score* (future).
  - **An adverb group:** *very quietly* (how), *just outside* (where), *quite recently* (when).

  Pick the verb that says exactly what happened, keep the tense that matches the time, and add an adverb group only when it helps.
