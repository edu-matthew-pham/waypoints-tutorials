# Texts for "A clause inside a clause" (cohesion parts mode labels each part; the sentence board builds a sentence
# with an embedded clause and counts a biography; chain mode colours embedded clauses).

# region: run
widget: cohesion
mode: parts
layout: inline
roles: main embedded end
role main: Main clause
role embedded: Embedded clause
role end: Clause joined at the end
s main: The old mill,
s embedded: which stands beside the river,
s main: is a museum.
para:
s main: The walkers,
s embedded: who were tired,
s main: sat down.
para:
s main: The track is closed
s end: because the creek is high.
para:
s main: The ranger
s embedded: who knew the track
s main: led the way.
para:
s main: The class went home
s end: after the storm passed.
# endregion

# region: vary
