summary: "Students learn that the tense tells the reader when, and that a text keeps one tense unless it changes on purpose. They label tenses, sort verbs, catch a slip in a diary, choose matching verb forms, spot slips in a recount and write a diary entry."
time: 45
timing: "Predict and Try 8 min · Worked example 10 min · Vary 5 min · Practise 5 min · Make and own writing 17 min"
goals:
  - I can name the tense of a verb as past, present or future.
  - I can find a verb that slips out of the tense a text is using.
  - I can say why a slip confuses a reader.
  - I can write a diary entry in a steady past tense.
struggle: "Students fix a slip by changing the wrong verb. Ask 'what tense does the first sentence set?' and match everything else to it."
before: |
  Do the Try board yourself: six sentences, three labels.

  The one idea: choose a tense and keep it, unless the time really changes. This lesson covers AC9E7LA06 nodes 1 and 2 (verb tense forms, consistency of tense for clarity).

  The lesson names three forms: past, present and future. Other tense forms (continuous, perfect) are left for later. The boards avoid sentences where present tense refers to the future ('The bus leaves at eight' is present), unless the time word makes it clear.

  Tense can change on purpose. Dialogue in a story ('I am hungry,' said Ava), facts that are still true ('the river runs behind our school') and a time word ('Tomorrow, we will...') are all fine. The lesson's slips are accidental, with no reason for the change.

  The sentences are made up for the lesson.
running:
  - "Predict: ask for the verb that does not fit and say it aloud in the right tense."
  - "Try: ask what clue gave away each tense."
  - "Worked example: read the diary aloud and ask where it sounded wrong."
  - "Make: partners underline the verbs and check each one."
stuck:
  - see: "A student labels 'arrive' past."
    ask: "Does it say what already happened?"
    fix: "Arrive is the present form. Compare with arrived."
  - see: "A student changes the other verbs to match the slip."
    ask: "Which tense does the first sentence set?"
    fix: "Match everything to the tense the text starts with."
stretch: "Find a story that changes tense on purpose. What is the effect?"
support: "A tense ladder: walked, walk, will walk."
leads: |
  Next in Building sentences: embedded clauses that say more in fewer words (Year 8).
exit:
  q: "'Ava picked up the ball and throws it.' Fix the slip."
  a: "Ava picked up the ball and threw it. (Or: Ava picks up the ball and throws it.) The verbs must match."
explain: |
  The tense tells the reader when.

  - **Past:** walked
  - **Present:** walk
  - **Future:** will walk

  A text keeps one tense unless the time really changes. An accidental change makes the reader wonder when things happen.
