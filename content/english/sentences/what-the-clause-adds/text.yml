widget: sentence
mode: write
as: student
counts: joiners
p: Dear Mrs Hart, I am writing to ask for a longer lunch break. Students need time to eat and play because we study hard all morning. If lunch were half an hour longer, more of us could join a club. Although the timetable is full, a longer lunch would help everyone concentrate in the afternoon.
# endregion

