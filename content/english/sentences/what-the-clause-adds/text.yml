p: The ferry stopped running [[{until|because|so that}=because]] the wind was too strong. The council planted trees along the path [[{so that|although|until}=so that]] walkers would have shade. [[{Unless|Because|Although}=Although]] the creek was only ankle deep, the guide made everyone wear a life jacket.
