p: Mia has a dog. The dog barks all night. Folded: Mia has a dog [[{that barks all night|barks all night|and a dog}=that barks all night]].
p: Ben met a ranger. The ranger knows the bush. Folded: Ben met a ranger [[{who knows the bush|knows the bush|but the ranger}=who knows the bush]].
p: The oval floods. The oval is behind our school. Folded: The oval [[{which is behind our school|is behind our school|and the oval}=which is behind our school]] floods.
