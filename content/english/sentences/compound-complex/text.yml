# region: make-solution
widget: sentence
mode: write
as: student
p: On Friday our class visited the museum. We left early because the bus came at eight. The guide showed us a model ship, and she explained how it sailed when the wind was strong. Please remember to pack a hat, since the day will be warm.
# endregion

