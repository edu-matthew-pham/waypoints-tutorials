# Texts for "Choose the shape for the job" (cohesion parts mode labels what a dependent clause adds; the sentence
# board builds an extending sentence and counts short and long sentences; chain mode colours short and long ones).

# region: run
widget: cohesion
mode: parts
layout: inline
roles: elaborates extends explains
role elaborates: Elaborates (more detail)
role extends: Extends (something new)
role explains: Explains (says why)
s any: We found a cave
s elaborates: that stretched deep under the hill.
para:
s any: Ben scored in the last minute,
s extends: which won the match.
para:
s any: We turned back
s explains: because the path was flooded.
para:
s any: The market sells fruit
s elaborates: that was picked this morning.
para:
s any: The bus broke down,
s extends: which made us late.
para:
s any: Ava stayed home
s explains: since she had a cold.
# endregion

