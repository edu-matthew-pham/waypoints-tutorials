summary: "Students learn that a dependent clause can elaborate, extend or explain, and that a writer chooses short or long, simple, compound or complex sentences for the job. They label what clauses add, match jobs to shapes, catch a sentence too long for a notice, build an extending sentence, colour short and long sentences and write a school fair notice."
time: 50
timing: "Predict and Try 10 min · Worked example 12 min · Vary 5 min · Practise 5 min · Make and own writing 18 min"
goals:
  - I can say whether a dependent clause elaborates, extends or explains.
  - I can choose a short or long sentence for the job.
  - I can mix sentence lengths so the key point stands out.
  - I can write a notice with a deliberate mix of shapes.
struggle: "Students think a longer sentence is always the better one. Ask 'who reads this, and how fast?' and let the reader's need decide."
before: |
  Do the Try board yourself: six clauses, three labels.

  The one idea: the job decides the shape. This lesson covers AC9E7LA05 nodes 3 and 4 (elaborating, extending and explaining; sentence structure as a deliberate choice).

  Elaborating gives more detail about something already named, extending adds a related new fact, and explaining gives a reason. Items on the board were chosen so one label clearly fits; a few real sentences can sit between labels, and students can argue them in discussion.

  The counts (short is five words or fewer, long is fifteen or more) are rough aids. They show a mix exists, not that the mix is good.

  The sentences are made up for the lesson.
running:
  - "Predict: take a quick vote before showing the answer."
  - "Try: ask which clause could stand as its own sentence (the extending ones can)."
  - "Worked example: ask where a driver's eyes go first."
  - "Make: partners check the key instruction sits in a short sentence."
stuck:
  - see: "A student labels 'since she had a cold' as extends."
    ask: "Does the clause answer why?"
    fix: "If it gives the reason, it explains."
  - see: "A student's notice is all short sentences."
    ask: "Where does the reader learn the reason or detail?"
    fix: "Join two short sentences with a joining word to carry the reason."
stretch: "Find a notice in the school and say whether its sentence shapes suit its readers."
support: "Give a frame: one short instruction, one long sentence with because."
leads: |
  Next in Building sentences: steady tense, which keeps a text clear about when things happen.
exit:
  q: "'We left early because it was hot.' Does the clause elaborate, extend or explain?"
  a: "Explains: it gives the reason for leaving early."
explain: |
  A dependent clause can add one of three things.

  - **Elaborates:** more detail.
  - **Extends:** something new.
  - **Explains:** why.

  A writer also chooses a short or a long sentence for the job, and mixes them so the key point stands out.
