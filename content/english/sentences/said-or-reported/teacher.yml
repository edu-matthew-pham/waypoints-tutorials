summary: "Students learn two ways to tell what someone said. They label six sentences as direct or indirect, sort the features of each, catch a report that kept the speaker's own words, choose which suits a job, build a reported sentence, choose punctuation for speech, and write a newsletter item in their own document that quotes one person and reports another."
time: 45
timing: "Predict and Try 8 min · Worked example 12 min · Vary 5 min · Practise 5 min · Make (in their own document) and own writing 15 min"
goals:
  - I can tell direct speech from indirect speech.
  - I can report what someone said, changing the tense and the pronouns.
  - I can punctuate direct speech.
  - I can choose which kind of speech suits what I am writing.
struggle: "Students drop the quotation marks and stop, leaving 'Ava said I am tired.' Ask who is speaking now, and who 'I' is."
before: |
  Do the Try board yourself: six sentences, two kinds of speech.

  The one idea: direct speech quotes, indirect speech reports and changes the words. This lesson covers AC9E4LA07 nodes 1 to 3 (direct speech features, indirect speech features, choosing between them).

  The reports in this lesson are made after the event, so the tense moves back (am becomes was). If a statement is still true when it is reported, writers sometimes keep the present tense ('Ava said she is tired' about someone still tired). The lesson teaches the shift because that is the usual pattern, and the board never asks about a case where both would work.

  Quotation marks: the lesson uses single marks, as many Australian schools do; double marks are also correct. The punctuation board plants the marks and asks only for the mark before the closing mark and before the opening mark.

  All the speech is made up for the lesson.
running:
  - "Predict: ask what changes besides the quotation marks."
  - "Try: after labelling, ask which sentences could swap kind, and which words would change."
  - "Worked example: Nib's recount. Ask who 'I' is in line 3."
  - "Vary: ask why the two decoys each fail."
  - "Make: students write in their own document, then partners find the reported sentence and check its tense and pronouns."
stuck:
  - see: "A student labels 'Ben asked where the bridge was' as direct because it is a question."
    ask: "Are those Ben's exact words? Is there a quotation mark? Did a word change?"
    fix: "Questions can be reported too. The test is whether the exact words are quoted."
  - see: "A student builds 'Ava said I am hungry'."
    ask: "Who is 'I' in this sentence?"
    fix: "In a report the writer speaks, so I becomes she."
  - see: "A student writes a full stop before the closing mark when the saying part follows."
    ask: "Is the sentence finished, or is 'said the ranger' still to come?"
    fix: "A comma closes the statement inside the marks when the saying part follows."
stretch: "Write the same three-line argument twice, once in direct speech and once in indirect speech. Which one makes the argument sound more heated?"
support: "A conversion card: five arrows (I → she, am → was, here → there, now → then, quotation marks off)."
leads: |
  Next in Building sentences: how the order of clauses changes what a reader notices.

  Direct speech is used again in Punctuation for meaning (dialogue and commas).
exit:
  q: "'I am cold,' said Max. How would you report this later, without quotation marks?"
  a: "Max said he was cold. The quotation marks go, I becomes he and am becomes was."
explain: |
  **Direct speech** gives the exact words, in quotation marks.

  **Indirect speech** reports what was said, with no quotation marks. The tense usually moves back (am to was) and the pronouns change (I to she).

  A writer picks one: direct speech lets the reader hear the speaker, and indirect speech sums things up quickly.
