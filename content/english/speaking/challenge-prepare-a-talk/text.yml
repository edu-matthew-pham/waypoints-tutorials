# region: script-solution
widget: sentence
mode: write
as: student
counts: short long
p: Who here has ever wished lunch were a bit longer? Today I want to show you how to get ten more minutes. First, the queue wastes time. Last week the last student was served after nine minutes. That is nine minutes of lunch gone, because the line is slow. The canteen has a spare window that is never opened.
# endregion

