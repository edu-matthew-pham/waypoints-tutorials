summary: "Students label the features in the transcript of a made-up speech, work out what a transcript can and cannot show, spot the claim in Nib's notes that the words cannot support, judge marked delivery notes, find the words that speak to the listeners, and judge one feature of a short speech."
time: 45
timing: "Predict and Try 8 min · Worked example 10 min · Vary and Practise 10 min · Make 12 min · Own class 5 min"
goals:
  - I can find features in the transcript of a talk and say what each does for the listeners.
  - I can say what a transcript can show and what it cannot.
  - I can judge a feature with a reason from the words.
struggle: "Students judge the speaker ('she was nervous') instead of the text. Ask 'which words show that?'."
before: |
  Do the Try board yourself: six lines, five features.

  The one idea: judge what the words show, and say what they cannot. This lesson covers AC9E7LY02 node 2 (identify features of a spoken text and evaluate their effect on the audience, with a reasoned justification). The course uses transcripts because the site cannot play or hear a talk, and it treats that as a feature: a transcript lets students point to the exact line that carries a judgement.

  The Try board labels lines by feature. Lines were written to have one defensible label: a question to the listeners, a signpost (First, Second), a repeat, a fact that could be checked, a call to act. The Vary board shows delivery as marked notes in square brackets; the notes are part of the made-up transcript, and the board labels them helps or hurts. Whether a real talk's delivery helps is a judgement you or a partner make from listening.

  The Make step is a reasoning check, so nothing is marked. The two models judge different features on purpose. Both end with something the transcript cannot tell.

  The quiet-corner and wet-steps speeches, Sam and Nib are made up for the lesson. No real speakers or speeches are used.
running:
  - "Predict: ask for one thing a transcript can show and one thing it cannot."
  - "Try: ask what a line is doing for the listeners before choosing its label."
  - "Worked example: ask which words in the transcript would prove each of Nib's notes."
  - "Vary: ask what a listener would catch, or miss, in each marked line."
  - "Make: partners swap judgements and underline the part that uses the words as evidence."
stuck:
  - see: "A student says 'it was good' or 'it was boring'."
    ask: "Which line, and what did it do to the listener?"
    fix: "Name the line and the effect: 'The repeat makes the noise feel everywhere.'"
  - see: "A student claims the speaker sounded nervous or confident."
    ask: "Which words show that? Is it in the transcript?"
    fix: "Judge the words. Say what the transcript cannot tell."
  - see: "A student names a feature but not what it does."
    ask: "What does it make the listener think, feel or do?"
    fix: "Add the effect after the feature."
stretch: "Judge a second feature and say which of the two does more for the listeners, and why."
support: "A card: Name it. What does it do for the listeners? How well? Which line? What can't I tell?"
leads: |
  Next: rehearsing with a partner, and using feedback to change one thing.

  Judging a spoken text uses the same moves as judging a written one (see Judging and persuading): name the feature, give its effect and give evidence.
exit:
  q: "A student says a speech was 'clearly nervous'. They only have the transcript. What is wrong with this judgement?"
  a: "A transcript has the words only, not how they sounded. The judgement needs words from the text, or a note that the transcript cannot show it."
explain: |
  A **transcript** is a talk written down. It shows **structure** and **language features**, such as a question, a repeat or a call to act.

  It does **not** show pace, pitch, volume or tone unless someone marked them. Judge what the words show, and say what they cannot.
