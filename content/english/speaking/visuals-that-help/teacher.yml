summary: "Students label slide ideas as adding something, repeating the speaker or distracting, choose the visual that suits a point, find the slide in a plan that repeats the talk, and plan two visuals for a talk of their own."
time: 45
timing: "Predict and Try 8 min · Worked example 10 min · Vary and Practise 12 min · Make 10 min · Own class 5 min"
goals:
  - I can say whether a visual adds something, repeats the speaker or distracts.
  - I can choose a visual that shows what my words cannot.
  - I can plan two visuals and say what each adds.
struggle: "Students put the script on the slides because it feels safe. Ask 'what do the listeners do while you talk if they can read it all?'."
before: |
  Do the Try board yourself: eight slide ideas, three jobs.

  The one idea: a visual has a job, and the job is to add what the words cannot. This lesson covers AC9E5LY07 node 4 (plan and use at least two visual or digital features, and explain how each contributes; the features support the spoken content and are not just slides with repeated text).

  The Try and Practise boards label ideas for slides; no slide is built here. To build slides, see the ICT course Documents and slides (one idea per slide, pictures that help, readable from the back), which this lesson does not repeat. The site plans the visuals and checks the labels. Whether a student's real slides add something is for a partner or you to judge.

  The step-by-step check counts labels only; it cannot tell whether a student's own slides add anything. Each board item was chosen to have one defensible label: a graph, map, photo or drawing of the thing adds; a copy of the speaker's sentence repeats; a spinning, flashing or unrelated picture distracts. If a student argues that a joke picture helps, ask what it shows about the point.

  The bike rack, worm farm, coral and garden examples are made up for the lesson.
running:
  - "Predict: ask what they do when a slide has words they can read faster than the speaker can say them."
  - "Try: ask what the slide shows that the speaker cannot say in a sentence."
  - "Worked example: ask what Nib could put on slide 2 instead."
  - "Vary: ask which choice would be quickest to take in at a glance."
  - "Make: partners say what they would see while the speaker talked. If it is only the speaker's words, the visual repeats."
stuck:
  - see: "A student's visual is a title and bullet points."
    ask: "What do the bullet points show that you cannot say?"
    fix: "Replace them with a picture, a chart or a label. Keep the points on your cards."
  - see: "A student wants a flashy animation."
    ask: "What does it help the listener understand?"
    fix: "If it only decorates, cut it."
  - see: "A student has no object or picture for an abstract idea."
    ask: "What would show it? A shape, a scale, a before and after?"
    fix: "Draw or find a simple picture of the idea in action."
stretch: "Plan a visual that is not a slide, such as an object to hold up, a drawing on the board or a gesture. Say what it adds."
support: "A card: Does it add? Does it repeat? Does it distract? Keep the words short."
leads: |
  Next: judging a spoken text from its transcript.

  Visuals matter in every subject's presentation. A science talk can use a labelled diagram; a history talk can use a map or a timeline.
exit:
  q: "A slide has the exact sentence the speaker is about to say. What happens, and what could go on the slide instead?"
  a: "Listeners read it first and stop listening. A picture, chart or map that shows the point could go there instead."
explain: |
  A good **visual** has a job. It **adds** something the words cannot, such as a shape or a picture.

  If it **repeats** the words, listeners read ahead and stop listening. If it **distracts**, they watch it and not you.
