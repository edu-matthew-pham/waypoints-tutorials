summary: "Students choose the word to stress in an answer, name the voice setting in delivery notes, find the delivery plan that hides the most important line, match the delivery to the words, and plan how to say three lines. They say them aloud in class."
time: 45
timing: "Predict and Try 8 min · Worked example 10 min · Vary and Practise 12 min · Make 10 min · Own class 5 min"
goals:
  - "I can name the four voice settings: pace, volume, pitch and tone."
  - I can choose the word to stress in a sentence.
  - I can plan how I will say a line and say what the choice is for.
struggle: "Students believe delivery is 'just being confident'. Ask them to say one line two ways and say what changed for the listener."
before: |
  Say the Predict sentence aloud three times, stressing a different word each time, and ask the class what each means.

  The one idea: the voice carries meaning, and a plan with reasons beats one steady setting. This lesson covers AC9E5LY07 node 3 (vocal features for engagement, with an explanation of the effect), AC9E6LY07 node 2 (deliberate use of pitch, tone, pace and volume, with an explanation) and AC9E7LY07 node 2 (select and use voice features, with a reason).

  **The site plans and names voice choices; it does not listen.** Nothing here marks how anyone sounds, and no step records a voice. The nodes also ask for a demonstration in delivery; that happens in class (see the running notes) and in the challenge lesson. Tick-offs for the criteria that need a listener ('demonstrates at least two deliberate variations') are yours or a partner's.

  The Try board holds the student's choice of stressed word only; each answer has one defensible word because the question already supplies the rest. The Vary board labels the setting each note changes; notes were chosen so that each fits one setting. In the Practise gaps the other choices work against the words.

  The Make step is a reasoning check, so nothing is marked. The two models plan differently (one slows down, one speeds up) on purpose.

  The Friday, steps, flood appeal and fundraiser lines are made up for the lesson.
running:
  - "Predict: say the sentence aloud three times with a different stress each time. Ask what each means."
  - "Try: ask which word in each answer the listener did not already know."
  - "Worked example: read Nib's warning aloud, fast and quietly. Would anyone catch it?"
  - "Vary: students say each note's instruction aloud in pairs, then name the setting."
  - "Make: in class, each student says their three lines to a partner. The partner says which setting they heard change, and what it made them feel."
stuck:
  - see: "A student says 'I'll be loud and confident'."
    ask: "Loud on every word, or on the one that matters?"
    fix: "Pick the word or line that matters most and make that the loudest or slowest."
  - see: "A student names a feeling but no setting ('I will sound sad')."
    ask: "What will your voice do to sound sad?"
    fix: "Name the setting: slower, softer, lower in pitch."
  - see: "A student does not know where to stress."
    ask: "What does the listener already know?"
    fix: "Stress the new information, not the words already in the question."
stretch: "Plan the same three lines to make the listeners feel something different. Say which settings you changed."
support: "A card: Pace = how fast. Volume = how loud. Pitch = how high. Tone = how it feels. Stress = the heavy word."
leads: |
  Next: visuals that help a talk without taking it over.

  Voice choices matter in every subject's oral presentation. A science presenter slows down for the result; a history presenter lowers their tone for a sad event.
exit:
  q: "A speaker says the most important line of a talk fast and quietly to save time. What would you tell them?"
  a: "Slow down and speak up for that line. Listeners need to catch it, and the voice should show them that it matters."
explain: |
  Your voice has four settings: **pace**, **volume**, **pitch** and **tone**. **Stress** puts the weight on one word.

  Use them on purpose: slow and clear for what matters, a tone that matches the words, and stress on the new information.
