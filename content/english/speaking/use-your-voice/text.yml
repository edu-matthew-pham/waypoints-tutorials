# region: vary
widget: cohesion
mode: parts
layout: blocks
roles: pace volume pitch tone
s pace: Slow down when you say the number.
s volume: Say the warning louder than the rest.
s pitch: Let your voice rise at the end of the question.
s tone: Use a warm, kind voice to say sorry.
s pace: Talk faster through the quick part of the story.
s volume: Say the secret very softly.
s pitch: Let your voice go high on the surprising word.
s tone: Sound serious when you talk about the accident.
