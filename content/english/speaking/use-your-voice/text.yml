p: 'Do not touch the wires.' [[{Say it quickly and softly.|Say it slowly and clearly, a little louder.|Say it in a bouncy voice.}=Say it slowly and clearly, a little louder.]]
p: 'You won the prize!' [[{Say it in a flat voice.|Say it in a slow, sad tone.|Let your pitch rise and say it with energy.}=Let your pitch rise and say it with energy.]]
