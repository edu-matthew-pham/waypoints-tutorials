p opening: Hello, Year 7. I want to ask you a question: how do you get to school? If you ride, you know the problem.
p point1: First, there are only eight bike spots, and forty students ride. That means bikes lean on fences and fall over.
p point2: Second, a new rack costs less than you think. Local businesses have offered to share the cost, so the school would pay very little.
p close: So let's ask the principal for a bigger rack. More spots, fewer fallen bikes, and a safer ride to school.
# endregion

