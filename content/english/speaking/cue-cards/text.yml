p opening: Good morning, everyone. Have you ever needed ten minutes of quiet and had nowhere to go? Today I will explain why our school needs a quiet room.
p point1: First, lunchtime is loud. The oval, the quad and the library are all full of noise, so students who want calm have to sit on the steps.
p point2: Second, a quiet room helps everyone. When students can reset for ten minutes, they come back to class ready to learn, and teachers get fewer interruptions.
p close: So here is my request. Give us one small room, a few cushions and a sign on the door. Then lunchtime works for everyone.
# endregion

