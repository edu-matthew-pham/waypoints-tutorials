p opening: Good morning, Year 5. Today I want to talk about our lost property box. It is overflowing, and I think we can fix that.
p point1: First, most of the things in it have no name on them. Nobody can tell whose jumper or drink bottle it is.
p point2: Second, nobody checks the box. Things sit there for months and then get thrown out.
p close: So please, put your name on your things, and check the box on Fridays. A tidy box means fewer lost jumpers.
# endregion

