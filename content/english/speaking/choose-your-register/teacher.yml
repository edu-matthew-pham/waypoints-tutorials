summary: "Students place spoken lines on a casual-to-formal scale, name subjective and objective language, find the line in a script that does not fit its listeners, choose formal wording, colour casual words, and plan an opening for a chosen audience, giving a reason for each choice."
time: 45
timing: "Predict and Try 8 min · Worked example 10 min · Vary and Practise 10 min · Make (required) 12 min · Own class 5 min"
goals:
  - I can say how formal a line of speech is.
  - I can choose a register and a stance (subjective or objective) to suit the listeners.
  - I can give a reason for my choice.
struggle: "Students think formal is always better, or that casual is always friendlier. Ask who is listening and what they would think of the speaker."
before: |
  Do the Try board yourself: six lines, three levels.

  The one idea: register is a choice made for the listeners. This lesson is tagged AC9E8LY07 node 1 (plan and craft a presentation: choose language features, voice features and visuals for a purpose and audience, and justify them), which is a hinge node, and AC9E4LY07 node 1 (note whether subjective or objective language is appropriate, with a reason).

  **The Make step is the lesson's required step.** The reasoning check is not marked, so the evidence for AC9E8LY07 node 1 is the student's own written reason, compared with the models and the three criteria. Read a few. A reason that says only 'it sounds right' has not yet justified the choice.

  The scale has three bands, so 'everyday' covers a wide middle. The Try and Practise items were chosen so that each has one defensible band. The board checks marks the lesson plants; it never judges the student's own writing.

  The bus queue, school fair, sports day and lunchtime examples are made up for the lesson. First Nations ways of speaking, and registers used within cultures and families, are not covered here; point students to local guidance and AIATSIS.
running:
  - "Predict: ask what the council would be thinking about Nib, not just the bus queue."
  - "Try: ask which words made you choose the band."
  - "Worked example: ask which line in Nib's script the council would remember, and why."
  - "Vary: ask which choice sounds like a certificate or a ceremony."
  - "Make: partners swap reasons and underline the sentence that links the choice to the listeners."
stuck:
  - see: "A student writes 'I chose formal because it is polite'."
    ask: "Polite to whom, and what would the listeners think of casual?"
    fix: "Name the listeners and what they expect: 'parents at an information night expect …'."
  - see: "A student confuses formal with long and complicated."
    ask: "Can a formal sentence be short?"
    fix: "Formal means careful and polite words. It does not mean more words."
  - see: "A student says a talk can be both subjective and objective."
    ask: "Which sentences give facts and which give opinion?"
    fix: "Yes. Mark each sentence. A talk can open with facts and end with a view."
stretch: "Rewrite your opening for the other audience, and say which words you changed."
support: "A card: Who is listening? What is the talk for? Casual, everyday or formal? My view, or the facts?"
leads: |
  Next: using your voice (pace, volume, pitch and tone) on purpose.

  Register applies to any subject's talk. A science report to the class and a pitch to the principal will not use the same words.
exit:
  q: "A speaker tells a Year 3 class, 'We recommend that you adopt a more considered approach to lunchtime.' What is wrong, and what would you change?"
  a: "The register is too formal for the listeners. Use short, friendly words: 'Let's try to take our time at lunch.'"
explain: |
  **Register** is how formal or casual you sound. Language can be **subjective** (your views) or **objective** (the facts).

  Choose both to suit the **listeners** and the **purpose**, and be ready to say why.
