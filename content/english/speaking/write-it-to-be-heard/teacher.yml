summary: "Students find signpost words in a script, see why a key idea is said twice, spot the sentence a listener would lose, choose the version of a sentence that can be said aloud, rework one long sentence into short ones, and write the start of a script."
time: 45
timing: "Predict and Try 8 min · Worked example 10 min · Vary and Practise 10 min · Make 10 min · Own class 7 min"
goals:
  - I can explain why a script is written differently from a report.
  - I can use short sentences, signpost words and a repeated main idea.
  - I can explain a special word at the moment I use it.
struggle: "Students write a script as an essay and read it out. Ask them to read one sentence aloud: where did they run out of breath?"
before: |
  Read the Predict sentence aloud to yourself, once, then ask what you remember.

  The one idea: a script is written for the ear. This lesson covers AC9E5LY07 node 2 (complex sentences and specialist vocabulary in spoken presentation). The criteria say the complexity must be audible, so the lesson does not ban complex sentences: a short sentence with *because* in it is good speech. What fails is the long sentence with a clause tucked in the middle.

  The Practise board counts sentences and how many have 15 or more words. That count is a rough aid: a 14-word sentence can still be hard to say. The student's script is judged by saying it aloud to a partner.

  The Make step is a reasoning check, so nothing is marked. The two models differ on purpose: one opens with a question to the room, the other states the main idea first.

  The bubbler, oval, tide and trial sentences are made up for the lesson.
running:
  - "Predict: read the sentence aloud once, then ask 'what do you remember?'."
  - "Try: ask what each signpost tells a listener."
  - "Worked example: ask a student to read Nib's third line aloud. Where does the class lose the thread?"
  - "Vary: ask for the version a speaker would not want to say. Why not?"
  - "Make: partners read each other's four sentences aloud. The writer listens for where the reader trips."
stuck:
  - see: "A student reads the script silently and says it is fine."
    ask: "Could you say it aloud without stopping for breath?"
    fix: "Say it aloud. Split where you ran out of breath."
  - see: "A student's script is a list of short, disconnected sentences."
    ask: "How does a listener know how the sentences connect?"
    fix: "Add a signpost word (first, so, this means) to link them."
  - see: "A student explains the special word before using it."
    ask: "When does the listener need the meaning?"
    fix: "Use the word, then say what it means, straight away."
stretch: "Write the same four sentences for parents. Say which words you changed, and why."
support: "A card: One idea per sentence. Signpost words. Main idea twice. Say the word, then what it means."
leads: |
  Next: cutting the script down to cue cards, so you say it instead of reading it.

  The same habits help in any subject's oral presentation. A science talk can say the key word and what it means in the same breath.
exit:
  q: "A speaker says: 'The reduction in lunchtime seating, which was caused by construction, has led to crowding.' Say it so a listener can follow."
  a: "Any version in short sentences: 'There is less lunchtime seating. The building work caused it. So the quad is crowded.'"
explain: |
  A script is written for the **ear**. Listeners hear it once, in order.

  Use **short sentences**, **signpost words** and say the **main idea twice**. Explain a special word as you use it.
