s opening: Ask the room who has ever finished a book and wanted to tell someone. Then say the book club is for exactly that.
s point: Point one: you choose the books.
s detail: Last term the club voted for a graphic novel about a robot.
s point: Point two: you meet people from other classes.
s detail: Two Year 6 members run the quiz at the end of each meeting.
s point: Point three: it meets at lunchtime, so you miss no lessons.
s detail: It starts at ten past one on Thursdays and finishes before the bell.
s close: Say it again: choose, meet, read. Then ask them to come to the library next Thursday.
# endregion

