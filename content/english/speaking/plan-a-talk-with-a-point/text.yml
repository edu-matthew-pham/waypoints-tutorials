s opening: Ask who has ever sat on a hard chair to read. Then say the library has twelve new beanbags.
s point: The beanbags are for reading, not for sleeping.
s detail: They sit in the quiet corner, away from the door.
s close: Say it again: read, book, relax. Then ask them to try one this week.
