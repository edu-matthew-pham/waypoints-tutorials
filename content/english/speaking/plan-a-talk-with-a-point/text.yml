s opening: Ask Year 5 who has ever been lost on the first day at a new school. Then say there are two things that would have helped.
s point: First, every classroom has its room number on the door.
s detail: The number is beside the door in big black numbers, so you can read it from the corridor.
s point: Second, the office will help you with anything.
s detail: A student helper sits at the front desk at recess.
s close: Say it again: look for the number, ask at the office. Then ask them to tell a new student.
