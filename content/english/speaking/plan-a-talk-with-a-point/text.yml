s opening: Ask the room how long their last shower was. Then say there are three easy ways to save water at home.
s point: First, turn the tap off while you brush your teeth.
s detail: A running tap can waste a bucket of water in a minute.
s point: Second, collect the cold water you run while the shower warms up.
s detail: A bucket of it is enough to water a pot plant.
s point: Third, report a dripping tap.
s detail: A tap that drips all day wastes litres, and the waste adds up.
s close: Say it again: brush, bucket, drip. Then ask everyone to pick one way to try this week.
start: 5,2,8,1,7,3,6,4
