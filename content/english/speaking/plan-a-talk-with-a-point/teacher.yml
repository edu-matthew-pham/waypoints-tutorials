summary: "Students decide the purpose and audience of a talk, label a plan's opening, points, details and close, put a shuffled plan in order, find the line that does not belong in a close, and plan a short talk of their own."
time: 45
timing: "Predict and Try 8 min · Worked example 12 min · Vary 7 min · Make 12 min · Own class 8 min"
goals:
  - I can say who a talk is for and what I want listeners to know, think or do afterwards.
  - I can plan a talk with an opening, two or three points, a detail for each, and a close.
  - I can check that every part of my plan serves my purpose.
struggle: "Students plan from the topic ('talk about the library') and end up with a list of facts. Ask 'what do you want them to do afterwards?' before they write any point."
before: |
  Do the Try board yourself: eight lines, four jobs.

  The one idea: a plan starts with an aim, and every line serves it. This lesson covers AC9E4LY07 node 1 (plan a presentation: structure, register, visual features), AC9E5LY07 node 1 (sequence ideas and elaborate each with detail), AC9E6LY07 node 1 (organise at least three points to develop a theme) and AC9E7LY07 node 1 (choices of structure and mode based on purpose and audience; the paper-plane task is the mode choice).

  Because this lesson carries the Year 5 to 7 planning nodes (AC9E5LY07 n1, AC9E6LY07 n1, AC9E7LY07 n1), skip it only if your class is secure on all three. The register and visual-feature parts of AC9E4LY07 node 1 are taught later in the course (Choose your register, and Visuals that help). The Make board counts that every line has words and the right label: it cannot tell whether the plan suits the listeners, so a partner or you must judge that.

  The book club, water-saving, beanbag and new-student talks are made up for the lesson.
running:
  - "Predict: ask what Year 5 would repeat to a friend afterwards."
  - "Try: ask which line is the only one that tells listeners what to do."
  - "Worked example: ask students to say Nib's aim in one sentence that starts 'After my talk, Year 5 will …'."
  - "Vary: the opening promises an order. Ask students to point to the words that decide it."
  - "Make: partners swap plans and say the aim back. If they cannot, the plan has no aim."
stuck:
  - see: "A student's aim is a topic ('the canteen')."
    ask: "What will a listener do or think differently after hearing it?"
    fix: "Start the aim with 'After my talk, my listeners will …'."
  - see: "A student has five or six points."
    ask: "Which two would a listener keep if they could only keep two?"
    fix: "Cut to two or three points. Keep the details for those."
  - see: "A student's close adds a new idea."
    ask: "Did the talk say that already?"
    fix: "Move it into a point, or leave it out of the talk."
stretch: "Plan the same talk for two audiences, such as Year 5 and parents. Say which point or detail you changed and why."
support: "A card: Opening = where we are going. Point = one idea. Detail = a fact or example. Close = the idea again and what to do."
leads: |
  Next: writing the talk so it can be heard, which is not the same as writing it to be read.

  Every subject uses this plan for oral presentations (science reports, history talks). Reuse the Make step's frame in other classes.
exit:
  q: "A plan has an opening, two points with details and a close. The close says 'Also, the canteen has new chips.' What is wrong?"
  a: "The close adds a new idea. A close says the main idea again and what to do; the chips belong in a point or nowhere."
explain: |
  A talk starts with a **purpose** (what listeners should know, think or do) and an **audience** (who they are).

  The plan has an **opening**, two or three **points**, a **detail** for each point, and a **close** that says the main idea again and what to do.
