inquiry:
  q: "Does a talk need slides at all?"
  prompts:
    - "What can a speaker do without slides that a slide cannot do?"
    - "What can a slide show that a speaker cannot say?"
  notes: "Some of the best talks have no slides. The question for each visual is what it adds. If nothing, leave it out."
activities:
  - at: predict
    kind: activity
    title: "Read it and listen"
    minutes: 4
    do: |
      Show a slide with a paragraph of text. Say a different paragraph about the same topic aloud. Ask students what they remember, and which they followed.
    notes: "Most follow the text and lose the speaker, which shows how reading beats listening."
  - at: investigate
    kind: discussion
    title: "What could go on slide 2?"
    minutes: 5
    do: |
      Ask pairs to decide what Nib could put on slide 2 so it adds something. Collect ideas and ask what each shows that the words cannot.
    notes: "Good answers are charts, maps and drawings. A student who suggests more text should say what it adds."
questions:
  - at: investigate
    title: "Add, repeat or distract?"
    type: question
    q: "A speaker says, 'This tap has been broken for a month.' The slide shows a photo of the broken tap. What does the photo do?"
    options: ["Repeats the words, so it should go", "Distracts, because photos always do", "Adds something the words cannot: what the broken tap looks like", "Nothing, because the speaker said it already"]
    answer: 2
    feedback: ["The words say the tap is broken. The photo shows how it looks, which the words do not.", "A photo that fits the point helps. A photo with nothing to do with the point distracts.", null, "Showing it adds something the speaker cannot say in a few words."]
    explain: "A photo of the thing shows what words cannot. The speaker's words and the photo do different jobs."
