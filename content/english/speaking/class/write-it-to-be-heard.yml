inquiry:
  q: "Why is a speech not the same as an essay read out loud?"
  prompts:
    - "What can a reader do that a listener cannot?"
    - "What can a speaker do that a writer cannot?"
  notes: "Listeners cannot go back. Speakers can use pace, a pause and a look. Both change how the words should be built."
activities:
  - at: predict
    kind: activity
    title: "Hear it once"
    minutes: 4
    do: |
      Read the long Predict sentence aloud once. Students write down what it said, without looking. Then read a short version of the same idea.
    notes: "Most hold a fragment from the long version and the whole idea from the short one."
  - at: investigate
    kind: discussion
    title: "Where did you run out of breath?"
    minutes: 5
    do: |
      A student reads Nib's third line aloud. The class puts a hand up at the point where they lost the thread.
    notes: "The hands go up at the tucked-in clause. That is where to split."
questions:
  - at: investigate
    title: "When to explain a word"
    type: question
    q: "A speaker uses the word 'habitat' in a talk to Year 5. When is the best moment to say what it means?"
    options: ["Right after using it, in the same breath", "Never, because listeners will look it up", "In the close, so everyone remembers", "Before the talk starts, in the title"]
    answer: 0
    feedback: [null, "Listeners cannot look anything up while the talk goes on. They lose the thread.", "By the close they may have lost the point of the word.", "A title gives no time to explain, and the word is not yet being used."]
    explain: "The listener needs the meaning at the moment of the word. Say it, then say what it means."
