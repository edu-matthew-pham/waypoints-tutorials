inquiry:
  q: "Why is a speech not the same as an essay read out loud?"
  prompts:
    - "What can a reader do that a listener cannot?"
    - "What can a speaker do that a writer cannot?"
  notes: "Listeners cannot go back. Speakers can use pace, a pause and a look. Both change how the words should be built."
activities:
  - at: predict
    kind: activity
    title: "Hear it once"
    minutes: 4
    do: |
      Read the long Predict sentence aloud once. Students write down what it said, without looking. Then read a short version of the same idea.
    notes: "Most hold a fragment from the long version and the whole idea from the short one."
  - at: investigate
    kind: discussion
    title: "Where did you run out of breath?"
    minutes: 5
    do: |
      A student reads Nib's third line aloud. The class puts a hand up at the point where they lost the thread.
    notes: "The hands go up at the tucked-in clause. That is where to split."
questions:
  - at: investigate
    title: "Say the main idea twice"
    type: question
    q: "A speaker wants listeners to remember one idea. Which is the best plan for a three-minute talk?"
    options: ["Say it once, in the middle, so it is hard to miss", "Say it near the start and again in the close, in different words", "Say it ten times, in exactly the same words", "Never say it, so listeners work it out for themselves"]
    answer: 1
    feedback: ["In the middle it can be lost between other ideas. Listeners cannot look back.", null, "Ten repeats of the same words would sound odd and wear listeners out.", "Listeners cannot reread. If they do not catch the idea, it is gone."]
    explain: "Near the start tells listeners what to listen for. In the close, in new words, it gives them a second chance to catch it."
