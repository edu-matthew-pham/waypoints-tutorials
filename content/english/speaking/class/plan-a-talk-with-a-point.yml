inquiry:
  q: "How much of a talk can a listener keep?"
  prompts:
    - "Think of a talk you heard at assembly. What can you still say from it?"
    - "Why do you think that part stayed?"
  notes: "Use assembly, not a named person's talk. Listen for one idea, not a list. That is the point of an aim."
activities:
  - at: predict
    kind: activity
    title: "Say it back"
    minutes: 4
    do: |
      Read a made-up announcement (one idea, one detail, one action) aloud once. Ask students to write down everything they remember. Then read a second announcement with seven ideas and do the same.
    notes: "The count of what they remember is the point: most hold two or three."
  - at: investigate
    kind: discussion
    title: "Say the aim back"
    minutes: 5
    do: |
      Partners swap plans. Each reads the opening and close and says the aim: 'After this talk, I will …'.
    notes: "If the partner cannot say it, the opening and close do not match the aim."
questions:
  - at: investigate
    title: "What is missing?"
    type: question
    q: "A plan has an opening, three points and a close, but no details. What will listeners most likely miss?"
    options: ["The opening, because it comes first", "Anything that makes each point believable, such as a fact or an example", "The close, because it is short", "Nothing, because points are enough"]
    answer: 1
    feedback: ["The opening is there. What is missing is under each point.", null, "The close is there. Details sit with the points.", "A point on its own is only a claim. Listeners need something to back it."]
    explain: "A detail is the fact or example that makes a point believable. Without one, each point is just a claim."
