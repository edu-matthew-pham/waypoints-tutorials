inquiry:
  q: "Can a voice say something the words do not?"
  prompts:
    - "Say 'Thanks a lot' so that it means thanks. Now say it so that it means the opposite."
    - "What changed? The words did not."
  notes: "Students hear tone, pace and pitch change meaning. Keep to made-up lines so no one is put on the spot."
activities:
  - at: predict
    kind: activity
    title: "Seven ways to say it"
    minutes: 5
    do: |
      Write 'I never said he took it back' on the board. Say it seven times, stressing a different word each time. Ask students to say what each one means.
    notes: "Each stress changes the meaning. Students hear how much one word's weight carries."
  - at: make
    kind: activity
    title: "Say it, then name it"
    minutes: 7
    do: |
      In pairs, each student says their three planned lines to a partner. The partner says which voice setting they heard change and what it made them feel or want to do.
    notes: "The partner's report is the evidence for the criteria. Students who heard nothing change should try again with a bigger change."
questions:
  - at: investigate
    title: "Which setting?"
    type: question
    q: "A speaker's voice rises at the end of a statement, so that it sounds like a question. Which setting changed?"
    options: ["Pitch", "Pace", "Volume", "Tone"]
    answer: 0
    feedback: [null, "Pace is how fast, or where the speaker pauses. The speed did not change.", "Volume is how loud. Nothing here is about loud or soft.", "Tone is the feeling in the voice. The rise is about how high the voice goes."]
    explain: "Rising or falling is a change in pitch. A rise at the end of a statement can make it sound unsure."
