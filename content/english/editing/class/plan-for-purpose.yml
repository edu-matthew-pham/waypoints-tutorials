inquiry:
  q: "Should two texts on the same topic have the same plan?"
  prompts:
    - "Same topic, two readers: Year 3 and the principal. What changes?"
    - "What stays the same?"
  notes: "The topic stays; almost every choice about shape and words changes with the reader. That is why the plan starts with the reader."
activities:
  - at: modify
    kind: activity
    title: "Plan it two ways"
    minutes: 8
    do: |
      Give pairs one topic and two readers. Each partner fills the frame for one reader, then they compare rows 3 and 4.
    notes: "Listen for reasons that name the reader. A choice with no because is a guess."
questions:
  - at: investigate
    title: "Which choice has a reason?"
    type: question
    q: "Which plan line gives a choice and a reason?"
    options: ["Short sentences, because my readers are in Year 3", "Short sentences", "Write about the garden", "Make it good"]
    answer: 0
    feedback: [null, "That is a choice, but it doesn't say why or who it is for.", "That is content, not a choice about how to write.", "That doesn't name a choice or a reader."]
    explain: "A planning choice is useful when it says what you'll do and which reader it is for."
