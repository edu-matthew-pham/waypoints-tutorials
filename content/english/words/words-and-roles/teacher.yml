summary: "Students learn that words signal roles and relationships: orders, requests and shared ideas show who has authority. They place ways of asking on a five-step formality scale, sort lines by speaker, spot an order to someone in charge, choose words for a favour, and write a request to the principal."
time: 45
timing: "Predict and Try 8 min · Worked example 12 min · Vary and Practise 10 min · Make and own writing 15 min"
goals:
  - I can show that formality is a scale, not a switch.
  - I can say what orders, requests and titles show about roles.
  - I can name three things that decide which words to use.
  - I can write a request that fits the person in charge.
struggle: "Students treat 'polite' and 'formal' as the same, or turn every request into an order. Ask 'who is in charge here, and how does the writer show they know it?'"
before: |
  Do the Try board yourself: five ways of asking a class to line up, a five-step scale.

  The one idea: words signal roles, and formality is a scale, not on or off. This lesson covers AC9E5LA01 nodes 1, 2 and 4: register and social context (a hinge: formality as a continuum), language that signals roles and relationships (a hinge), and selecting language for context. The term **register** is for you; the lesson says 'how formal the words are'.

  Kit's node 2 criterion: explain which role a choice signals and for whom, and how the relationship shapes the choice. The sort and the bug task do that. Node 4 asks for at least three contextual factors; the question's explanation names reader, purpose and place.

  **Node 3 (cultural variation in communication norms) is not taught here.** It asks about communication norms from other cultures, including First Nations Australian communities. This site does not supply protocols or interpretations. Use your school's local guidance, Aboriginal and Torres Strait Islander education staff or community members, and AIATSIS. The class plan has a place for it.

  The Try board accepts two steps for three of the five lines, because careful students can argue either.

  The sentences are made up for the lesson.
running:
  - "Predict: ask for evidence in the words."
  - "Try: ask what you would change to move a line one step up."
  - "Worked example: for each sort item, ask which word gave it away."
  - "Vary: read each choice aloud in the speaker's voice."
  - "Make: partners point to the word that makes the request polite."
stuck:
  - see: "A student says 'Tell me the time' is fine because 'tell' is a normal word."
    ask: "Who is the writer talking to, and who is in charge?"
    fix: "Tell me is an order. To someone in charge, ask: Could you tell me ...?"
  - see: "A student puts 'Come on, let's go!' at the formal end because it sounds friendly."
    ask: "Friendly or formal? Are those the same?"
    fix: "Friendly and relaxed words are casual. Formal means careful and complete."
stretch: "Rewrite 'Move it!' for four readers: a friend, a sibling, a teacher and a stranger in charge."
support: "A five-step ladder drawn on the board with a sticky note for each way of asking."
leads: |
  Next in this course: the four levels of formality.
exit:
  q: "Which role does 'Please sit down.' signal, and which does 'May I sit down?' signal?"
  a: "'Please sit down.' signals the person in charge, giving an instruction. 'May I sit down?' signals the person asking for permission."
explain: |
  Orders, requests and titles show who is in charge. Formality is a scale, not a switch.

  To choose words, think about who is reading, what the message is for, and where it will be read.
