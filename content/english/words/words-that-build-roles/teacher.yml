summary: "Students see how words build roles in a group. They label made-up reef crew lines by kind of word, sort lines that welcome or leave out a newcomer, find unexplained acronyms, spot the line that sounds like a boss, choose welcoming wording, place lines as boss, equal or helper and write a club announcement."
time: 45
timing: "Predict and Try 8 min · Worked example 12 min · Vary and Practise 10 min · Make and own writing 15 min"
goals:
  - I can name acronyms, specialist terms, forms of address and pronouns.
  - I can tell when a group's words welcome or leave out a newcomer.
  - I can explain how pronouns and commands build roles.
  - I can write an announcement a newcomer can follow.
struggle: "Students think special words are always bad, or that explaining them is talking down. Ask 'who is hearing this, and what do they need?'."
before: |
  Do the Try board yourself: eight made-up reef crew lines, four kinds of word.

  The one idea: words build roles, and the same group words can include or exclude. This lesson covers AC9E8LA01 nodes 1 and 2: language that builds identity and roles in a group (acronyms, specialist terms, forms of address, pronouns) and its effect on inclusion. The term **register** is not used in the student text.

  Kit's criterion: students explain how a choice positions the speaker and the listener. The question and the Practise board do that.

  The Practise board has one answer per line, chosen so a careful student would not argue two bands.

  The Make check counts the pronouns I, me, we, us and our, and sentences. It cannot judge whether a newcomer would follow; partners should.

  Reef Watch, RWL and every name are made up for the lesson. PPE is a real acronym for personal protective equipment. No student is asked about their own groups or background.
running:
  - "Predict: ask what they would need to be told as a newcomer."
  - "Try: ask which word each line turns on."
  - "Worked example: for each leaving-out line, ask what one change would welcome."
  - "Make: partners underline every word a newcomer might not know."
stuck:
  - see: "A student says explaining a word makes the writer sound less expert."
    ask: "What is the announcement for?"
    fix: "An announcement aims to include readers. Explaining a word once helps everyone."
  - see: "A student labels 'We will survey' as a boss line."
    ask: "Who is in the 'we'?"
    fix: "We puts the speaker beside the others, so it builds an equal role."
stretch: "Rewrite the Reef Watch lines for a visiting school group, and then for a government inspector. What changes?"
support: "A word bank of acronyms and specialist terms from the Try board with plain explanations."
leads: |
  Next: the challenge, rewriting a notice.
exit:
  q: "Give one way words can leave a newcomer out, and one way to fix it."
  a: "Unexplained acronyms or specialist terms leave a newcomer out. Fix by explaining them once or using plain words."
explain: |
  Words build roles in a group: who leads, who is equal, who helps.

  Special words can welcome a newcomer when explained, and leave them out when not.
