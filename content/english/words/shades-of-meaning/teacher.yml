summary: "Students learn that synonyms are not interchangeable: they sit at different strengths and carry different feelings, and an exact or specialist word says more than a general one. They place words on a scale, sort synonym and antonym pairs, catch a word with the wrong shade, choose words that match what happened and write a description."
time: 45
timing: "Predict and Try 8 min · Worked example 12 min · Vary and Practise 10 min · Make and own writing 15 min"
goals:
  - I can tell synonyms from antonyms.
  - I can say how two similar words differ in strength or feeling.
  - I can choose an exact word instead of a plain one.
  - I can explain what a specialist word adds.
struggle: "Students swap in a synonym because it is 'the same'. Ask 'if I put this word in, does the picture in your head change?'"
before: |
  Do the Try board yourself: six words for cold, three bands.

  The one idea: synonyms are close, not identical, and the shade is part of the meaning. This lesson covers AC9E4LA11 nodes 1 to 3 (synonyms and shades of meaning, antonyms, new vocabulary) and AC9E5LA08 node 1 (precision through specialist vocabulary). Word origins (AC9E5LA08 nodes 2 and 3) are not in this lesson.

  Kit's node 1 criterion: does not treat all synonyms as interchangeable. The bug task and the Predict return to this.

  The Try board accepts two bands for chilly and for icy, because a careful student can argue either; the Practise board's words are placed in the band where most readers agree.

  The Make step is written in the students' own documents, with no check on the site. Partners and you judge whether the words are exact.

  Wider (AC9E4LA11 node 2, Kit's wider list): antonyms in persuasive texts. For wider steps on First Nations words in Australian English, point students to AIATSIS and local guidance rather than supplying meanings.
running:
  - "Predict: ask what picture each word puts in your head."
  - "Try: ask 'what weather do you imagine for each word?'."
  - "Worked example: for each pair, say how the strength or feeling differs."
  - "Vary: ask which sentence would sound silly with the wrong word."
  - "Make: partners point to three exact words and say what each adds."
stuck:
  - see: "A student says 'shrieked softly' is fine because shrieked just means said."
    ask: "Would a shriek be soft?"
    fix: "A shriek is loud and sharp, so the shade fights the word 'softly'."
  - see: "A student says 'reptile' is a harder word for animal."
    ask: "Do all animals bask on rocks?"
    fix: "Reptile names a smaller group, so it tells the reader more."
stretch: "Find three synonyms for 'walk'. Put them on a scale from slow to fast and explain your order."
support: "A thermometer picture with the six cold words on cards to place by hand."
leads: |
  Next in this course: how words signal roles and relationships.
exit:
  q: "Which is stronger, 'upset' or 'devastated'? Say how you know."
  a: "Devastated is stronger. Upset is a mild or medium feeling; devastated is the strongest of the two."
explain: |
  Synonyms are words with similar meanings but not the same strength or feeling. Antonyms are opposites.

  An exact or specialist word tells the reader more than a general one.
