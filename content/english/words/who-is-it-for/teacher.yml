summary: "Students learn that familiarity (how well you know someone) and power (their authority) both shape how formal to be. They place situations on a scale, sort cues, find reasoning that ignores power, choose an email opening, choose greetings and write three openings."
time: 45
timing: "Predict and Try 8 min · Worked example 12 min · Vary and Practise 10 min · Make and own writing 15 min"
goals:
  - I can say how well I know someone and whether they have authority.
  - I can choose words that fit both.
  - I can explain why a coach I know well still gets respectful words.
  - I can write openings for three different readers.
struggle: "Students use only how well they know the person. Ask 'who decides?' to bring in power."
before: |
  Do the Try board yourself: six situations, three bands.

  The one idea: familiarity and power are two separate cues. This lesson covers AC9E6LA01 node 2: social distance and power as drivers of register. The term **register** is for you; the lesson says 'how formal the words are'.

  Kit's criterion: students explain a choice using both cues. The sort and the bug task isolate them; the question combines them.

  The Try board accepts two bands for 'Asking a new classmate to share a table' and the Practise board for 'A librarian you have never met', because careful students can argue either.

  The Make step counts words and sentences only. A partner or you should judge whether each opening fits its reader.

  The situations are made up for the lesson.
running:
  - "Try: for each, ask 'how well do you know them, and who decides?'."
  - "Worked example: label each cue before reading the answers."
  - "Make: partners say which cue each opening responds to."
stuck:
  - see: "A student writes 'Hey Coach' because they know the coach well."
    ask: "Who decides whether you can miss training?"
    fix: "Warm words suit knowing them well. Respectful words suit their authority. Use both."
  - see: "A student writes very stiff words to a friend, thinking it is safer."
    ask: "Who is reading, and how will they feel?"
    fix: "Stiff words to a close friend can sound cold. Match the reader."
stretch: "Write one request three times: to a friend, a coach and the principal. Underline what changes."
support: "Two cards, 'How well I know them' and 'Who decides', placed beside each situation."
leads: |
  Next in this course: how words show who you are.
exit:
  q: "Name the two cues that shape how formal to be."
  a: "How well you know the person (familiarity), and who has more authority (power)."
explain: |
  Two things shape how formal to be: how well you know the person, and who has authority.

  They can pull in different directions, so a message can be warm and respectful.
