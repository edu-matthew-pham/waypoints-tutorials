summary: "Students learn that the same message can be worded in many ways and that the words that fit depend on the reader and the purpose. They place ways of asking on a scale, sort messages by reader, spot wording pitched for the wrong reader, choose openings, choose inclusive wording and write two messages about one event."
time: 45
timing: "Predict and Try 8 min · Worked example 12 min · Vary and Practise 10 min · Make and own writing 15 min"
goals:
  - I can tell informal wording from formal wording.
  - I can choose words that fit who is reading.
  - I can explain why formal is not simply more correct.
  - I can choose wording that includes every reader.
struggle: "Students treat formal as the 'correct' way. Ask 'who is reading, and what is the message for?'. If a word suits the reader, it is right for that message."
before: |
  Do the Try board yourself: six ways to ask for a pen, three bands.

  The one idea: the words that fit depend on the reader and the purpose. This lesson covers AC9E4LA01 nodes 1 to 3: register and formality, factors that shape language choices (who is reading, how well they know each other), and inclusive language. The term **register** is named here for you; the lesson says 'how formal the words are'.

  Kit's hinge for node 1: students who treat formal as 'more correct' go wrong later. The Predict, the sort and the bug task all return to this.

  Node 3 criteria: identify a non-inclusive phrasing, suggest an alternative with a reason, and see inclusion as a choice about the reader, not just a rule. The Practise board names the choice. Many schools and the Australian Government Style Manual favour wording like families, everyone and police officer; discuss why with your class.

  **Node 4 (cultural conventions in interaction) is not taught here.** It asks about First Nations Australian conventions for greeting and addressing Elders. This site does not supply protocols or interpretations. Use your school's local guidance, Aboriginal and Torres Strait Islander education staff or community members, and AIATSIS. The class plan has a place for this discussion.

  The Try board treats 'Do you have a spare pen?' as informal or neutral, because a careful student can argue either.

  The sentences are made up for the lesson.
running:
  - "Predict: ask for reasons before the answer."
  - "Try: ask who might say each one."
  - "Worked example: for each sort item, ask who the reader is."
  - "Vary: say each opening aloud to a pretend friend, then to the pretend principal."
  - "Make: partners point to words that changed between the two messages."
stuck:
  - see: "A student says the casual text is wrong."
    ask: "Who is it for?"
    fix: "It is right for a friend. The words fit the reader."
  - see: "A student says 'policeman' is fine because everyone knows what it means."
    ask: "Does the word fit every reader?"
    fix: "Everyone understands it, but police officer includes every reader."
stretch: "Write one sentence in three registers: for a friend, for a teacher and for a stranger in charge. What changes each time?"
support: "A card marked Friend and a card marked Principal. Hold up the one a sentence fits."
leads: |
  Next in this course: shades of meaning in single words.
exit:
  q: "Say which reader each message fits: 'Yo, you coming?' and 'Would you like to join us?'"
  a: "'Yo, you coming?' fits a friend. 'Would you like to join us?' is careful and fits a reader you do not know well or who has authority."
explain: |
  The same message can be worded in many ways. The words that fit depend on who is reading and what the message is for.

  Informal is not wrong and formal is not more correct. Inclusive wording makes sure no reader is left out.
