summary: "Students see that the words we use show the groups we belong to and help make that belonging. They label club jargon, match features to what they signal, tell showing from making belonging, spot a judgement made from speech, choose wording for a newcomer and write a short scene."
time: 45
timing: "Predict and Try 8 min · Worked example 12 min · Vary and Practise 10 min · Make and own writing 15 min"
goals:
  - I can say how words show the groups I belong to.
  - I can explain how using a group's words helps make belonging.
  - I can explain why how someone speaks does not show their character.
  - I can write a scene where a character's words show their group.
struggle: "Students rank ways of speaking as better or worse. Ask 'who uses these words, and what works for them?'."
before: |
  Do the Try board yourself: six lines, three made-up clubs.

  The one idea: language shows identity and helps make belonging. This lesson covers AC9E7LA01 nodes 1 and 2: language and identity (expression and creation), and the idea that different ways of speaking are valid for their groups. The terms **jargon** and **register** are for you; the student text says 'special club words'.

  Kit's hinge: students who treat some ways of speaking as 'wrong' go wrong later. The bug task and the wider step return to this.

  **Wellbeing.** Use made-up clubs only. No student is asked about their own family, language or background. Students may offer examples; accept them without comment on what is 'better'. This site does not name real varieties of English or real communities and does not supply interpretations of them. Draw on local guidance, Aboriginal and Torres Strait Islander education staff or community members, and AIATSIS, for any class discussion of First Nations languages and Aboriginal English.

  The Make step is written in the students' own documents; nothing on the site reads it. The 'good luck' meaning in the Predict is the standard theatre saying.
running:
  - "Predict: ask whether students had heard it before, and where."
  - "Try: ask which word gave each line away."
  - "Worked example: for the bug task, ask what other reasons could explain short sentences."
  - "Make: partners name the group the character belongs to."
stuck:
  - see: "A student says Jo must speak badly."
    ask: "Who is he talking to, and what works for them?"
    fix: "Different ways of speaking suit different groups and places. None shows character."
  - see: "A student says jargon is just showing off."
    ask: "What does it let the group do quickly?"
    fix: "Jargon saves time for people who know it. It can leave newcomers out, which is why we choose wording for the listener."
stretch: "Invent a made-up club with six words of its own, and write a short scene using three of them."
support: "A table with columns 'club' and 'words' filled in as a class before the Try board."
leads: |
  Next in this course: how words build roles in a group.
exit:
  q: "Give one way words show a group, and one way they help make belonging."
  a: "Show: a club's jargon tells others which group you belong to. Make: using the group's words helps you become part of it."
explain: |
  The words we use show which groups we belong to, and using a group's words helps make that belonging.

  All the ways people speak are valid for the groups that use them. None shows a person's character.
