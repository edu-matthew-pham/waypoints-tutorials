summary: "Students place sentences on a four-step scale from slang to formal, separate polite from formal, spot a casual line in a formal letter, name features of formal language, choose formal wording and rewrite an informal message formally."
time: 45
timing: "Predict and Try 8 min · Worked example 12 min · Vary and Practise 10 min · Make and own writing 15 min"
goals:
  - I can place words on a scale from slang to formal.
  - I can tell polite from formal.
  - I can name features of formal language.
  - I can rewrite an informal message formally.
struggle: "Students treat polite and formal as the same thing, or think formal is simply better. Ask 'who is reading, and what is the message for?'."
before: |
  Do the Try board yourself: eight sentences on a four-step scale.

  The one idea: language sits on a scale, and polite is not the same as formal. This lesson covers AC9E6LA01 node 1: the continuum from slang to formal (slang, colloquial, conversational, formal) and its features. The term **register** is for you; the lesson says 'how formal the words are'.

  Kit's hinge: students who treat polite as formal go wrong later. The sort, the bug task and the question all return to it.

  The Try board accepts two steps for 'Nah, can't be bothered.', because a careful student can argue slang or colloquial.

  The Make step starts with an informal message, and the check counts short forms and exclamation marks, which are two rough signs of an informal message. It cannot tell whether the words are exact; a partner or you should.

  The sentences are made up for the lesson.
running:
  - "Try: ask which word gave each sentence away."
  - "Worked example: ask 'warm or official?' for each line."
  - "Make: partners swap messages and underline any word they would not say to the principal."
stuck:
  - see: "A student places 'Thanks so much, that's really kind!' at the formal end because it is polite."
    ask: "Is it warm, or is it official?"
    fix: "It is polite, but it uses a short form and relaxed words, so it is conversational."
  - see: "A student rewrites the message but keeps 'reckon'."
    ask: "Would the principal write that word in a report?"
    fix: "Replace reckon with believe or think that."
stretch: "Write the same news for a friend, a grandparent and a newspaper, and place the three on the scale."
support: "Four labelled boxes on a poster. Students tape each sentence into the right box."
leads: |
  Next in this course: how familiarity and power decide how formal to be.
exit:
  q: "Name one feature of formal language and one of slang."
  a: "Formal: full forms, exact words, no slang. Slang: very casual words used by a close group."
explain: |
  Language sits on a scale from slang to formal. Polite is not the same as formal.

  Formal writing uses full forms and exact words, and no slang.
