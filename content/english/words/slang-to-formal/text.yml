# Texts for "From slang to formal" (scale places sentences on four steps; swap chooses formal wording;
# chain colours informal words; write counts short forms).

# region: run
widget: wordchoice
mode: scale
bands: Slang | Colloquial | Conversational | Formal
word a: That's lit. = 1
word b: Heaps good, eh? = 2
word c: I'm going to grab some lunch. = 3
word d: I will be taking my lunch break at noon. = 4
word e: Nah, can't be bothered. = 1/2
word f: I'm not sure about that idea. = 3
word g: The committee has resolved to postpone the event. = 4
word h: See ya later! = 2
# endregion

# region: vary
widget: wordchoice
mode: swap
bands: Slang | Colloquial | Conversational | Formal
before: Choose the formal wording for each report sentence.
p: The students [[{reckon that@2|think that@3|are of the view that@4}=are of the view that]] the canteen should open earlier.
p: The council [[{sorted out@2|resolved@4|fixed up@2}=resolved]] the matter at its last meeting.
# endregion

# region: practise
widget: cohesion
mode: chain
colours: 1
p: Dear Ms Ortiz, We [[reckon#a]] the library needs [[heaps#a]] more books. Some of the old ones are [[rubbish#a]] and the shelves are full of [[stuff#a]] nobody reads. We would be grateful if you could consider our request.
# endregion

# region: make
widget: sentence
mode: write
counts: contractions exclaims
start: "Hey Mr Hall! We reckon the oval's heaps too muddy for footy, so can we use the gym instead? It'd be awesome!"
# endregion

# region: make-solution
widget: sentence
mode: write
as: student
counts: contractions exclaims
p: Dear Mr Hall, We believe that the oval is too muddy for football training. We would like to ask whether we may use the gym instead. Thank you for considering our request.
# endregion

# region: explain-pic
widget: wordchoice
mode: scale
answer: on
bands: Slang | Colloquial | Conversational | Formal
word a: That's sick! = 1
word b: Heaps good! = 2
word c: That's really good. = 3
word d: That is most impressive. = 4
# endregion
