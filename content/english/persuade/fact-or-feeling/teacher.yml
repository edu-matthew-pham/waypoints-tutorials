summary: "Students separate facts from opinions, find thinking and feeling words, see that any text type can be factual or opinionated, and write a short piece with facts and an opinion in their own document."
time: 45
timing: "Predict and Try 8 min · Worked example 12 min · Vary and Practise 10 min · Make and own writing 15 min"
goals:
  - "I can tell a fact from an opinion."
  - "I can find thinking words and feeling words."
  - "I can say that any kind of text can use facts or opinions."
  - "I can write facts, then an opinion."
struggle: "Students think 'crowded' or 'too many' is a fact because it sounds like a count. Ask 'could two people disagree?'."
before: |
  Do the Try board yourself: six sentences about a made-up school fair, labelled fact or opinion.

  The one idea: a fact can be checked and an opinion shows a view. This lesson covers AC9E4LA02 nodes 1 to 3: thinking verbs and emotive vocabulary (subjective language); summary verbs and objective language; and why a text uses the register it does. The terms **subjective** and **objective** are for you; the lesson says 'opinion' and 'fact'.

  The Make step has no board: students write in their own document, and a partner or you check that the three facts can be checked and that the opinion shows a view.

  Kit's hinge for node 2: students who think only reports can be objective go wrong later. The question and the wider step return to it.

  Kit's example for node 2 is 'The man has 6 cats' against 'The man has too many noisy cats'. The Practise and Vary boards use new sentences.

  The sentences are made up for the lesson.
running:
  - "Predict: ask who could disagree with each sentence."
  - "Try: ask which word gave each one away."
  - "Make: partners underline the sentence they could check."
stuck:
  - see: "A student calls 'too crowded' a fact."
    ask: "Could two people disagree about it?"
    fix: "Crowded for whom? It is a view. A count would be 'sixty people in a small room'."
  - see: "A student says a review cannot have facts."
    ask: "What facts could a review list?"
    fix: "Reviews can list facts, such as the length of a film. The purpose decides."
stretch: "Rewrite one opinion sentence as a fact, and one fact as an opinion."
support: "Two cards, 'Can be checked' and 'A view', to sort the Try sentences on a desk."
leads: |
  Next in this course: how sure a writer sounds, and how to back up a claim.
exit:
  q: "Give one fact and one opinion about your school canteen."
  a: "Any checkable sentence (it opens at 10 am) and any view (the food is great)."
explain: |
  A fact can be checked. An opinion shows what someone thinks or feels.

  Thinking words and feeling words give an opinion away.
