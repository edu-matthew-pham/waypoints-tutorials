# region: make-solution
widget: sentence
mode: write
as: student
counts: quotes
p: The review would persuade most parents. It uses warm words such as 'heart-melting hero' that suit a family film. It names a critic and a librarian, which gives parents people to trust. However, 'everyone knows it will win awards' is weak because nothing backs it.
