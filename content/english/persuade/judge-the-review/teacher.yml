summary: "The challenge. Students judge a made-up film review in steps: name each feature, judge whether each part works for parents, judge two sources, and write a verdict with a quotation, then judge a real review."
time: 45
timing: "Predict and Try 8 min · Worked example 12 min · Vary and Practise 10 min · Make and own writing 15 min"
goals:
  - "I can name the features of a review."
  - "I can say whether a part works for its audience."
  - "I can judge whether a source supports a claim."
  - "I can write a verdict with evidence."
struggle: "Students say a part is 'good' or 'bad' without a reason. Ask 'for whom, and why?'."
before: |
  Do the Make step yourself first: write a verdict on the review.

  This challenge covers AC9E8LY03 nodes 1 and 2: analysing language features against purpose and audience and judging whether they are effective, and evaluating whether a source supports its claim. The students' own judgement is for a partner or you; the board only counts.

  Kit's hinge: node 2 applies the same criteria-based move to sources. The Vary step does that with two claims.

  The Practise board judges each part by its source, not its wording: nobody named, or a speaker who has not seen the film, is weak; a named person who saw it for themselves works. In the Worked-example sort, 'Some critics say it is good' is a vague source, so weak.

  The Make check counts sentences and quotation marks. All texts, people and shops are made up; no real films or reviewers are used.
running:
  - "Try to Practise: ask students for the audience each time."
  - "Make: partners read the verdict and find the reason and the quotation."
stuck:
  - see: "A student writes only 'it is good'."
    ask: "Good for whom, and why?"
    fix: "Name the audience and point to a phrase from the review."
  - see: "A student rejects the exaggeration as lying."
    ask: "What does it do for the audience?"
    fix: "An exaggeration can work in a light, family review."
stretch: "Write a second verdict for a different audience, such as film students."
support: "Sentence starters: 'This works for parents because …', 'This is weak because …'."
leads: |
  End of the course. Students can return to any lesson from the course page.
exit:
  q: "Give one part of the review that works for parents and one that is weak, with a reason for each."
  a: "E.g. the named critic works because parents can trust a critic; 'everyone knows' is weak because nothing backs it."
explain: |
  Judge a text by what each part does for its audience and purpose.

  A source supports a claim when it saw or knows the thing the claim is about.
