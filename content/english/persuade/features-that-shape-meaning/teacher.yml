summary: "Students name four language features, match each to its effect, find a wrongly named feature, see how features change with audience and purpose, and write a short poster in their own document."
time: 45
timing: "Predict and Try 8 min · Worked example 12 min · Vary and Practise 10 min · Make and own writing 15 min"
goals:
  - "I can name four language features."
  - "I can say what each one does to a reader."
  - "I can explain why features change with the audience."
  - "I can use features on purpose in a poster."
struggle: "Students name a feature but cannot say its effect. Ask 'what does the reader feel or do because of it?'."
before: |
  Do the Try board yourself: eight sentences, four features.

  The one idea: a feature has an effect, and the effect depends on the audience and purpose. This lesson covers AC9E7LY03 nodes 1 and 2: identifying language features and explaining how they shape meaning, then explaining why they vary with audience and purpose. The terms **direct address**, **rhetorical question**, **repetition** and **strong verbs** are for you; the lesson uses plain names.

  Kit's hinge: node 1 (explaining how a feature shapes meaning) underlies node 2 (why features vary). The match task, the bug task and the question follow that order.

  Every sentence on the Try board has one stand-out feature. 'Would you want to swim there?' is labelled a question with an obvious answer.

  The Make step has no board: students write the poster in their own document, with at least four sentences, two of them short (five words or fewer). Partners name the features and what each does.
running:
  - "Predict: ask what the writer wants the reader to do."
  - "Try: ask which feature stands out most."
  - "Make: partners name two features and their effects."
stuck:
  - see: "A student calls an invitation a question."
    ask: "Does it ask for an answer?"
    fix: "Join us is an invitation. It speaks to the reader."
  - see: "A student says repetition is just padding."
    ask: "What does the reader remember?"
    fix: "Repetition makes an idea stick."
stretch: "Rewrite your poster for adults and say which features change."
support: "A card listing the four features with one example each."
leads: |
  Next: layers of meaning in irony and exaggeration.
exit:
  q: "Name one feature and what it does."
  a: "E.g. a question expecting a yes nudges the reader to agree."
explain: |
  Writers choose language features on purpose. Each shapes what the reader feels or remembers.

  The audience and purpose explain which features a writer picks.
