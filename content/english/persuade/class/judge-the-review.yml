inquiry:
  q: "How do you judge a persuasive text?"
  prompts: ["Choose one part of the review and say who it is for.", "Does it work? Why?"]
  notes: "Audience and purpose first."
activities:
  - at: predict
    kind: discussion
    title: "Who is it for?"
    minutes: 5
    do: |
      Ask: who is this review written for, and what does it want them to do?
    notes: "Bring in audience and purpose."
questions:
  - at: run
    title: "Which source fits?"
    type: question
    q: "Who best supports \"the animation is brilliant\"?"
    options: ["A film animator", "A stranger", "A friend of a friend"]
    answer: 0
    explain: "An animator knows how animation is made."
