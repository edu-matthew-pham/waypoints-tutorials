inquiry:
  q: "How do you judge a persuasive text?"
  prompts: ["Choose one part of the review and say who it is for.", "Does it work? Why?"]
  notes: "Audience and purpose first."
activities:
  - at: predict
    kind: discussion
    title: "Who is it for?"
    minutes: 5
    do: |
      Ask: who is this review written for, and what does it want them to do?
    notes: "Bring in audience and purpose."
questions:
  - at: run
    title: "Which source fits?"
    type: question
    q: "Who best supports \"the songs are catchy\"?"
    options: ["Someone who has only seen the poster", "A shop that sells film posters", "A music teacher who has listened to the songs"]
    answer: 2
    feedback: ["They have not heard the songs.", "They sell posters, not music.", null]
    explain: "A person who heard the songs can speak to the claim."
