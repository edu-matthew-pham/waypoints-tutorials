inquiry:
  q: "How can words say one thing and mean another?"
  prompts: ["Say 'lovely weather' on a rainy day.", "What did your voice do?"]
  notes: "Three devices. Low-stakes lines only."
activities:
  - at: predict
    kind: activity
    title: "Say it with a straight face"
    minutes: 5
    do: |
      Pairs say the same line as a plain line, then with irony.
    notes: "Listen for the gap."
  - at: investigate
    kind: discussion
    title: "Irony or sarcasm?"
    minutes: 5
    do: |
      Ask: when does irony become sarcasm?
    notes: "Aim for mocking someone."
questions:
  - at: investigate
    title: "Which device?"
    type: question
    q: "'I waited a hundred years for this bus.'"
    options: ["Understatement", "Hyperbole (exaggeration)", "Sarcasm"]
    answer: 1
    feedback: ["It makes the wait bigger, not smaller.", null, "Nobody is being mocked."]
    explain: "A hundred years is an exaggeration."
