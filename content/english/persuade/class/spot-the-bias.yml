inquiry:
  q: "How can a true report still lean?"
  prompts: ["Describe a school match result to a friend on the winning side and a friend on the losing side.", "What changes?"]
  notes: "Low-stakes topics only."
activities:
  - at: predict
    kind: activity
    title: "Winning side, losing side"
    minutes: 5
    do: |
      Pairs report the same match from each side.
    notes: "Listen for the single words that lean."
  - at: investigate
    kind: discussion
    title: "Is plain possible?"
    minutes: 5
    do: |
      Ask: can a report ever be plain? What would it use?
    notes: "Aim for yes, with effort."
questions:
  - at: investigate
    title: "Which leans?"
    type: question
    q: "Which phrase leans toward the students?"
    options: ["Some parents disagreed", "The council brushed students aside", "The council voted on Tuesday"]
    answer: 1
    feedback: ["It reports what the parents did.", null, "It reports what happened."]
    explain: "Brushed aside blames the council. The others report."
