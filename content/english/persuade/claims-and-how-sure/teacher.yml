summary: "Students see that a bare assertion has nothing behind it, learn four small moves that temper a claim, place sentences on a possible-to-certain scale, and write a softened, backed claim."
time: 45
timing: "Predict and Try 8 min · Worked example 12 min · Vary and Practise 10 min · Make and own writing 15 min"
goals:
  - "I can spot a bare assertion."
  - "I can name four small moves that soften a claim."
  - "I can say why a softened claim earns trust."
  - "I can write a claim that fits its evidence."
struggle: "Students think softening is weak. Ask 'would you rather trust a writer who admits limits, or one who says never mind?'."
before: |
  Do the Try board yourself: six sentences on a possible-to-certain scale.

  The one idea: a claim should be as sure as its evidence, and small words say how sure. This lesson covers AC9E5LA02 nodes 1 and 2: bare assertions, and tempering moves (modality, frequency, quantity and distancing). The term **modality** is for you; the lesson says 'how sure'.

  Kit's hinge: tempering moves are a response to what a bare assertion lacks. The bug task and the question return to it.

  The Make check counts a small list of words (may, might, could, would, will, should, must, probably, possibly, perhaps, certainly, definitely and a few more). It cannot see how-often or how-many words, and it cannot judge evidence.

  Sources and examples are made up for the lesson.
running:
  - "Predict: ask what each claim gives the reader to check."
  - "Try: ask which word set how sure each sentence is."
  - "Make: partners point to the sentence that backs the claim."
stuck:
  - see: "A student puts 'is likely to' at 'certain' because it sounds firm."
    ask: "How many times out of ten?"
    fix: "Likely is more than half, not every time."
  - see: "A student softens every sentence."
    ask: "What does a reader learn if everything may be true?"
    fix: "Soften only where the evidence is thin."
stretch: "Rewrite one bare assertion from a real advertisement so it fits the evidence."
support: "A strip of paper with the words from 'possible' to 'certain' for students to point to."
leads: |
  Next: who says so, and why naming a source persuades.
exit:
  q: "Name one word that softens a claim and one thing that backs one up."
  a: "Soften: may, might, some or often. Back up: a count, a survey or a named source."
explain: |
  A bare assertion has nothing behind it. A writer can back a claim up and soften it to fit the evidence.

  Small words show how sure the writer is.
