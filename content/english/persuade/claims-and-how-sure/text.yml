# Texts for "Claims and how sure" (scale places sure-ness; swap fits a word to the evidence; chain colours softening words).

# region: run
widget: wordchoice
mode: scale
bands: Possible | Probably | Certain
word a: The park might close. = 1
word b: The park could close. = 1
word c: The park will probably close. = 2
word d: The park is likely to close. = 2
word e: The park will close. = 3
word f: The park is certain to close. = 3
# endregion

# region: vary
widget: wordchoice
mode: swap
bands: Possible | Probably | Certain
before: Choose the word that fits what the evidence shows.
p: Only 6 of 30 students reported sleeping badly, so homework [[{might@1|will probably@2|will@3}=might]] be affecting a few students.
p: The radar shows rain two kilometres away and heading this way, so it [[{is certain to@3|will probably@2|might@1}=will probably]] rain at lunch.
# endregion

# region: practise
widget: cohesion
mode: chain
colours: 1
p: A class survey says that homework [[may#a]] cut into sleep. [[Some#a]] students [[often#a]] stay up late, and it [[seems#a]] that tired students find lessons harder. A tired class sits in the same room each morning.
# endregion

# region: explain-pic
widget: wordchoice
mode: scale
answer: on
bands: Possible | Probably | Certain
word a: The bus could be late. = 1
word b: The bus will probably be late. = 2
word c: The bus will be late. = 3
# endregion
