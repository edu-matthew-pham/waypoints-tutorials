summary: "Students name irony, exaggeration and understatement, separate irony from sarcasm, find a flipped effect, label new lines, and write a short scene with two devices."
time: 45
timing: "Predict and Try 8 min · Worked example 12 min · Vary and Practise 10 min · Make and own writing 15 min"
goals:
  - "I can name irony, exaggeration and understatement."
  - "I can say what extra meaning a device adds."
  - "I can tell irony from sarcasm."
  - "I can use a device in a short scene."
struggle: "Students call every ironic line sarcasm. Ask 'is anyone being mocked?'."
before: |
  Do the Try board yourself: six lines, three devices.

  The one idea: a device says one thing and means another, and the gap is the extra layer. This lesson covers AC9E8LA02 nodes 1 and 2: rhetorical devices (irony, hyperbole, understatement) and how they create meaning beyond the literal. The terms **irony**, **hyperbole** and **understatement** are used in the lesson because they are the metalanguage in node 2.

  Kit's hinge: students who conflate irony with sarcasm, or cannot identify understatement, cannot explain layers of meaning. The sort and the bug task return to it.

  Each Try and Practise line has one defensible device. 'I'd die for a sandwich right now' is an everyday exaggeration.

  The Make check counts sentences and quotation marks. Partners name the devices. All lines are made up.
running:
  - "Predict: ask what the plain version would be."
  - "Try: ask students to say the plain version aloud."
  - "Make: partners name each device and the extra layer."
stuck:
  - see: "A student calls 'a bit damp' hyperbole."
    ask: "Is it making the flood bigger or smaller?"
    fix: "Smaller. That is understatement."
  - see: "A student says sarcasm and irony are the same."
    ask: "Is anyone being mocked?"
    fix: "Sarcasm mocks someone. Irony does not need to."
stretch: "Write one line of each device about the same event."
support: "Three cards: bigger, smaller, opposite, to point to."
leads: |
  Next: the challenge, judge the review.
exit:
  q: "Name the device in 'a little rain', said by a farmer in a flood."
  a: "Understatement: it plays the flood down."
explain: |
  Irony says the opposite, hyperbole exaggerates and understatement plays down.

  The gap between the words and the meaning is the extra layer.
