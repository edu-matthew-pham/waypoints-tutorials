summary: "Students separate reporting words from emotive words, colour praise and criticism, find an emotive word in a news report, see how wording positions a reader, and write one place two ways."
time: 45
timing: "Predict and Try 8 min · Worked example 12 min · Vary and Practise 10 min · Make and own writing 15 min"
goals:
  - "I can tell a reporting word from an emotive word."
  - "I can say whether a word praises or criticises."
  - "I can say how a word positions the reader."
  - "I can write one thing in two feelings."
struggle: "Students say all strong words are 'wrong'. Ask 'what is this word trying to make me feel, and is that fair for this text?'."
before: |
  Do the Try board yourself: a short text with praise in one colour and criticism in another.

  The one idea: emotive words push a feeling and position the reader. This lesson covers AC9E6LA02 nodes 1 and 2: classifying objective and subjective language, and emotive and judgement vocabulary and its effect on the audience. The terms **objective**, **subjective** and **emotive language** are for you; the lesson says 'report' and 'push a feeling'.

  Kit's hinge: students who treat written text as objective cannot see emotive positioning. The bug task returns to it.

  Chain mode needs two or more words per colour, so each board has at least two praising and two criticising words. The Make step counts sentences and exclamation marks only, so partners circle the emotive words.

  All texts are made up for the lesson.
running:
  - "Predict: ask which feeling each sentence wants."
  - "Try: ask students to say why each word is in its colour."
  - "Make: partners circle the pushing words."
stuck:
  - see: "A student colours 'large' as praise."
    ask: "Does it say if the size is good or bad?"
    fix: "Large only describes. Magnificent judges."
  - see: "A student says a headline cannot be emotive."
    ask: "What feeling does it push?"
    fix: "Headlines can use emotive words."
stretch: "Rewrite an emotive sentence as a report, and a report as an emotive sentence."
support: "A two-column word bank of praising and criticising words."
leads: |
  Next: spotting bias in a whole text.
exit:
  q: "Give one praising word and one criticising word for a school hall."
  a: "Any pair, such as bright and gloomy."
explain: |
  Reporting words describe. Emotive words push a feeling and steer the reader.

  A writer's word choice positions the reader for or against.
