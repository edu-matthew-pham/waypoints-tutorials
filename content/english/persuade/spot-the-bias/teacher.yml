summary: "Students see that bias is word choice that favours one side, label sentences by the side they favour, find a biased line in a report that names both sides, choose plain wording, and write a fair report."
time: 45
timing: "Predict and Try 8 min · Worked example 12 min · Vary and Practise 10 min · Make and own writing 15 min"
goals:
  - "I can name the word that takes a side."
  - "I can say that a text can be biased without false facts."
  - "I can say that naming both sides is not enough."
  - "I can write a report that stays fair."
struggle: "Students think bias means lying. Ask 'could every fact be true and the words still lean?'."
before: |
  Do the Try board yourself: six sentences, three labels.

  The one idea: bias lives in word choices, and true facts can lean. This lesson covers AC9E6LA02 node 3: language choices that construct bias and advantage one perspective. The term **bias** is used in the lesson; **perspective** and **positioning** are for you.

  Kit's hinge: bias depends on seeing emotive positioning (node 2). The wider step compares reports from two publications; here it is two made-up newsletters.

  The Make check counts sentences and exclamation marks only. A partner circles the words that take a side.

  The topic (a phone rule) is deliberately low-stakes. All texts are made up; keep real, contested topics out of this lesson.
running:
  - "Predict: ask which word the sentence leans on."
  - "Try: ask for the plain version of each leaning sentence."
  - "Make: partners circle any side-taking word."
stuck:
  - see: "A student says the report is fair because it names both sides."
    ask: "Read the words used for each group. Are they treated the same way?"
    fix: "One group gets a praising word and the other a blaming word, even though both are named."
  - see: "A student says no text can be fair."
    ask: "Can you say the same fact with plain words?"
    fix: "Yes, 'voted' and 'disagreed' are plain."
stretch: "Take a biased sentence and write a fair version, then a biased version for the other side."
support: "A highlighter or coloured pencils: one colour for each side."
leads: |
  Next: judging and backing up your own views.
exit:
  q: "Why can a text with only true facts still be biased?"
  a: "Because the words around the facts can favour one side."
explain: |
  Bias is word choice that favours one side.

  A text can name both sides and still lean. Ask which words favour whom.
