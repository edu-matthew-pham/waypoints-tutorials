summary: "Students sort judging words into feelings, views of people and views of the thing, sort judgements by their backing, find an unbacked judgement, match backing to a judgement, and write a short review with one backed point."
time: 45
timing: "Predict and Try 8 min · Worked example 12 min · Vary and Practise 10 min · Make and own writing 15 min"
goals:
  - "I can name three kinds of judging word."
  - "I can say whether a judgement is backed up."
  - "I can back a judgement with a detail from the text."
  - "I can write a short review with a backed point."
struggle: "Students believe a strong word is a strong argument. Ask 'what could a reader check?'."
before: |
  Do the Try board yourself: six phrases, three kinds.

  The one idea: judge, then back it up. This lesson covers AC9E7LA02 nodes 1 and 2: evaluative language (emotional response, judgement of behaviour, appreciation of quality) and substantiation by text or outside source. The ACARA terms **affect**, **judgement** and **appreciation** are for you; the lesson says 'how it made me feel', 'what I think of a person's actions' and 'how good the thing is'.

  The Try board has one label per phrase. 'Terrified' labels a feeling because the sentence says how the reader felt.

  The Make check counts sentences and quotation marks, so it cannot tell whether the quote backs the judgement. 'The Last Lantern', Maya and Tom are made up for the lesson.
running:
  - "Predict: ask what a reader could check."
  - "Try: ask what each word is describing."
  - "Make: partners read the judgement, then the detail, and say if the detail backs it."
stuck:
  - see: "A student writes 'The ending is great because it is great.'"
    ask: "What happens at the end?"
    fix: "Say what happens, not just how good it is."
  - see: "A student backs up with 'everyone likes it'."
    ask: "Who is everyone? Could you check?"
    fix: "Use a detail from the story or a named source."
stretch: "Back one judgement with a detail from the text and another with an outside source."
support: "Sentence starters: 'I think … because …', 'For example, when …'."
leads: |
  Next: how language features shape meaning.
exit:
  q: "Give a judgement and a detail that backs it up."
  a: "Any pair where the detail shows what the judgement says."
explain: |
  Judging words come in three kinds: feelings, views of people and views of the thing.

  A judgement is stronger when a detail or a trusted source backs it up.
