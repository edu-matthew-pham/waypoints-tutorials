summary: "Students read fields of records: ClickedItem.title for a Now playing line, LoopItem.length inside For each row to total the lengths (an accumulator), and a variable holding a whole row to find the longest song (a running maximum). The Check traces the total and finds Nib resetting it inside the loop. Make it yours: the average with count(), and the shortest song."
time: 60
timing: "Try 5 min · Build 1–3 30 min · Check 10 min · Make it yours 15 min"
goals:
  - I can read one field of a row with a dot, such as ClickedItem.title or LoopItem.length.
  - I can add up a field of every row with For each row and a running total.
  - I can find the row with the biggest value by keeping the best one so far.
struggle: "Where each part sits: start the total on the parent event, add inside the loop, show it in a sub-event after the loop. The order of sub-events matters, and the actions of an event run before its sub-events."
before: |
  These are the first named algorithms of the course: the **accumulator** (running total) and the **running maximum** (best so far). Name them as algorithm ideas, not App Builder features: they come back in Python and spreadsheets.

  A variable can hold one whole row: Set variable longest to item(Songs, 1), then longest.title. While the app runs, the sidebar shows it as { title: ..., artist: ..., length: ... }.

  A sub-event with no condition always runs; put it after the loop to show the result.
running:
  - "Before Build 2 (whole class): add up 3, 5, 4, 2 aloud, saying the running total after each. That's the loop."
  - "Build 3: one student reads the lengths aloud, another holds up the longest so far and swaps it when a longer one comes."
  - "Check: trace the total in a table on the board: row, length, total after."
stuck:
  - see: "The total is only the last song's length."
    ask: "Where does total go back to 0?"
    fix: "Set total to 0 on the parent event, not inside the For each row sub-event."
  - see: "TotalText shows 0."
    ask: "Does the sub-event that sets the text come after the loop?"
    fix: "Put the no-condition sub-event below the For each row sub-event."
  - see: "Longest shows nothing or an error about a field."
    ask: "What does longest hold before the loop starts?"
    fix: "Start it with Set variable longest to item(Songs, 1), so longest.length exists."
stretch: "Show how many songs are longer than 3 minutes (a count with a condition)."
support: "Build the total together, saying each step aloud; pairs do the longest song."
leads: "Next: Saving between visits."
exit:
  q: "A table Scores has a field points. Write the three parts of an event that adds up every row's points into a variable sum."
  a: "Set sum to 0 on the event; a sub-event For each row in table Scores that adds LoopItem.points to sum; then a sub-event after it that shows sum."
explain: |
  A table is a list of **records**. A dot reads one **field** of a record: `ClickedItem.title`, `item(Songs, 2).artist`, `LoopItem.length`.

  **For each row** runs once per row, and LoopItem is that row. A **running total** starts at 0 before the loop and adds one value per row. A **best so far** starts with the first row and swaps in any row that beats it.
solutions:
  step-6#t1: app.json#sol-average
  step-6#t2: app.json#sol-shortest
