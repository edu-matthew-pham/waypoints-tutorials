summary: "Optional extension: an Embed shows a ready-made pendulum simulation (one web page, pendulum.html in this folder). The page sends period and length; the app sends gravity. Students build the app around it: Sim sends period shows the period (Build 1), planet buttons send gravity (Build 2), Record adds a row to Readings (Build 3). The Check shows that only the names in Sends get through. Then students use the lab to answer a science question and add a Clear button."
time: 45
timing: "Try 5 min · Builds 1–3 20 min · Check 3 min · Use your lab 10 min · Make it yours 7 min"
goals:
  - I can use a value an embedded simulation sends, with an event and its value.
  - I can send a value to an embedded simulation from an event.
  - I can record a simulation's results in a table and use them to answer a question.
struggle: "Seeing the simulation as a part with inputs and outputs: point at the Sends and Listens for boxes in Sim's Properties before Build 1."
before: |
  Needs App Builder 1.13 (the Embed object and its messages, Level 4). The simulation is a single web page; the app never changes it. The page runs in a safe box: it can't see the rest of the app or anything saved in the browser, and the app only takes the message names listed in Sends, each with one plain value.

  The page is the same one as App Builder's Pendulum lab sample. You can make your own for another topic: in an Embed's Properties, fill in Sends and Listens for, then Copy a prompt for an AI chat gives a prompt that asks for a page using those names. Paste the page it gives back with + Paste HTML. Use only an AI chat your school allows; check the page works before a class uses it.

  The physics: a simple pendulum's period is 2π√(L/g), so it grows with length and shrinks with gravity, and doesn't depend on the bob's mass (for small swings). The page works the period out from that formula, so readings are exact; a real pendulum's would vary.
running:
  - "Before Build 1 (whole class): open Sim's Properties. What does the simulation tell the app? What can the app tell it?"
  - "Use your lab: collect a few rows from the class on the board and look for the pattern together."
stuck:
  - see: "Sim sends period isn't in the list."
    ask: "Which group are you looking in?"
    fix: "It's in Sim's group (the object), not System. Sim must list period under Sends in its Properties."
  - see: "An error says Sim hasn't sent period yet."
    ask: "When did the page last send a value?"
    fix: "Run the app and wait a moment, or drag Length: the page sends its values when it starts and whenever they change."
  - see: "Clicking Moon changes the text but not the swing."
    ask: "Is there a Send gravity action, and what does it send?"
    fix: "Add Send gravity = Gravity to Sim after setting the variable."
stretch: "Add a Sim sends length event that shows the length too. Why does the page send both, when the app could work out the period itself?"
support: "Build 1 together with the clip; pairs do Builds 2 and 3."
leads: "Science: Year 10 physics on forces and motion. Code: the web pathway's DOM course, where pages send and receive messages in the same way."
exit:
  q: "A climate simulation page sends temperature and listens for co2. Name the event and the action you would use in App Builder."
  a: "The event Sim sends temperature (with Sim.temperature as the value), and the action Send co2 = … to Sim."
explain: |
  An **Embed** shows a ready-made page, here a pendulum simulation. The page and your events pass **messages**: a name and one value.

  **Sim sends period** runs when the page sends its period, and `Sim.period` is the value. **Send gravity = … to Sim** sends a value the other way. Only the names listed in Sends and Listens for get through.
solutions:
  step-7#t1: app.json#sol-clear
