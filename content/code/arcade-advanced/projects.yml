playground: arcade
projects:
  - id: defender
    title: Defender
    after: arcade-every-one
    goal: |
      Make a **shooting game** with a twist of your own: waves of enemies arrive, the player fires at them, and a button or event does something to all of them at once (freeze them, slow them, clear the screen).
    example: defender.ts
    uses: [for-of, if, random]
    milestones:
      - text: "Enemies keep arriving from random places, and the player can shoot them."
        hints:
          - "A timer block makes something happen every second. Make an enemy inside it."
          - "Give each enemy a random x and a speed downwards. Fire a projectile when a button is pressed."
        way: |
          alien.setPosition(randint(10, 150), 0)
              alien.vy = 20
      - text: "Something happens to every enemy at once, with a for element loop over all of them."
        hints:
          - "Use the block that gives you all sprites of one kind, in a for element of loop."
          - "Inside the loop, change the thing you want, such as the speed or the image."
        way: |
          for (let alien of sprites.allOfKind(SpriteKind.Enemy)) {
                  alien.vy = 0
      - text: "There is a way to lose, checked with if."
        hints:
          - "Decide what counts as losing: an enemy gets through, or the player is hit."
          - "Check it with if, then lose a life or end the game."
        way: |
          if (alien.y > 120) {
                      alien.destroy()
                      info.changeLifeBy(-1)
    reveal: true
    stretch:
      - "A shield that lasts a few seconds."
      - "Bigger enemies that take two hits."
      - "A boss after 20 points."

  - id: my-arcade-game
    title: Your own Arcade game
    after: arcade-level-list
    goal: |
      Make a game with **levels**: each level is a little harder (faster, more enemies, a different map), the levels come from a list, and a function sets each one up. The kind of game is yours.
    example: my-game.ts
    uses: [list, list-index, function]
    milestones:
      - text: "My levels come from a list (speeds, counts or colours), read by level number."
        hints:
          - "Make a list with one number per level, and a variable for the current level."
          - "Read the list at the level number, wherever the level needs its number."
        way: |
          rock.vy = speeds[level]
      - text: "A function sets up a level, and I call it at the start and when a level is done."
        hints:
          - "Put everything that creates a level inside one function."
          - "Clear away the old level at the start of the function, then call it again for the next one."
        way: |
          function startLevel() {
              for (let old of sprites.allOfKind(SpriteKind.Enemy)) {
                  old.destroy()
              }
      - text: "There are at least three levels, and each one is harder."
        hints:
          - "Make the list long enough: three numbers, each bigger than the last."
          - "When the level number goes past the end of the list, the game is won."
        way: |
          level = level + 1
              if (level < speeds.length) {
                  game.splash("Level " + (level + 1))
                  startLevel()
      - text: "Someone else played it and I changed one thing because of what they did."
        hints:
          - "Watch without helping. Which level lost them?"
          - "Change one number, then ask them to try again."
    reveal: true
    stretch:
      - "A different background or tilemap for each level."
      - "A title screen and a win screen."
      - "Power-ups, as in the Power-ups challenge."
    teacher: |
      Will it work in Arcade? is worth doing first: it steers students away from physics games Arcade cannot do well. Ask for a one-sentence pitch before coding.
