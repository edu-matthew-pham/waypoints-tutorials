summary: Students make a patrol robot that follows the line and sends a radio alert to a base station when it is blocked, using a true/false variable so it alerts once, then build a snake spotter.
time: 50
timing: "Predict and Run 10 min · Investigate 10 min · Modify 12 min · Make 15 min · Real robot 3 min (optional)"
goals:
  - I can make a robot send a radio message when its sensor detects something.
  - I can use a true/false variable so a message is sent once, not every time round.
  - I can give one program two roles (robot and base) with a variable.
before: |
  This is the assistance strand: lesson 5's line following plus lesson 7's radio, in the other direction. The robot works on its own and **reports back**. Two new ideas:

  - **Send once.** forever runs many times a second, so an alert inside it would be sent again every time round while the box is there (Noah's patrol). A **true/false** variable, **alerted**, remembers that the robot has already told; it goes back to false when the way is clear. Students met true/false variables in the Foundations challenge (no cheating in the reaction timer).
  - **Roles.** Because the simulator runs the same program on both micro:bits, a **role** variable decides what each one does: every micro:bit starts as a robot; A+B makes it the base, which stops and listens.

  Messages are words (**send string**, **on radio received receivedString**). On real hardware the base can be a bare micro:bit (untested whether the robot start block errors without a robot; if so, give the base a copy without it).
running:
  - "Predict: most expect one beep; some expect continuous beeping. Both are worth hearing before Noah's patrol."
  - "Run: press A+B on the second micro:bit first. Then block the first robot with a box on the line."
  - "Investigate: trace alerted on the board: false → true (send) → stays true (no send) → false when clear."
  - "Modify: 'clear' is sent once for the same reason: only when alerted was true."
  - "Make: the snake spotter turns round, so the box ends up behind it: it sends once without needing alerted. Ask why."
  - "Real robot (optional): range and walls matter; discuss what a real inspection robot should do out of range."
stuck:
  - see: "The base never reacts."
    ask: "Did you press A+B on the base? Is the box on the other robot's line?"
    fix: "Make one micro:bit the base first, then block the other robot."
  - see: "The base beeps again and again."
    ask: "What stops the robot sending every time round?"
    fix: "Use alerted: send only if not alerted, then set alerted to true."
  - see: "'clear' is sent all the time."
    ask: "Is the send inside if alerted?"
    fix: "Send clear only when alerted is true, then set it to false."
stretch: "Two-way: the base sends 'go' with A, and a robot that has stopped waits for 'go' before it carries on (a mode variable from lesson 6)."
support: "Give the base side complete; students add the robot's alert with the alerted variable."
leads: "Next: the challenge unit. Showcase (performance) and Patrol and alert (assistance) put the course together. Real-world links: pipeline and warehouse inspection robots, wildlife cameras that send an alert, smoke alarms that report to a phone."
exit:
  q: "Why does the robot need the alerted variable?"
  a: "forever checks many times a second. Without alerted it would send the alert every time while the box is there; alerted remembers it has already sent, so it sends once."
explain: |
  The robot **reports back** by radio when something happens.

  - Send the alert **once**: a true/false variable remembers that it has already told.
  - It goes back to false when the way is clear, ready for next time.
  - A **role** variable lets one program be the robot or the base.
solutions:
  step-4#t1: report.ts#sol-clear
  step-4#t2: report.ts#sol-count
  step-5: report.ts#sol-make
