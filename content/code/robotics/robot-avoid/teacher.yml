summary: Students use if … else inside forever so the robot turns away from close objects and keeps exploring, then add a random turn to make a robot vacuum.
time: 45
timing: "Predict and Run 8 min · Investigate 8 min · Modify 12 min · Make 12 min · Real robot 5 min (optional)"
goals:
  - I can use if … else in forever so the robot chooses between two moves.
  - I can put a short routine (back up, then turn) in a branch.
  - I can use a random choice so the robot does not always turn the same way.
before: |
  This lesson builds on Stop before you crash: the same distance question, but the answer is now a **choice of two moves**. **if** the distance is less than 15, turn away; **else**, drive forward. Inside **forever**, the robot checks and chooses again every time round, so it explores without a plan, which is how simple robot vacuums cover a floor.

  In this simulator the distance sensor only sees **boxes and other robots**, not the arena's walls, so robots may bump a wall and slide along it. Say so up front; it is a good discussion of how a simulation differs from the real thing. A real sensor sees walls, but weakly at an angle.

  **pick random 0 to 1** (in Math, `randint` in code) gives 0 or 1. A second if … else inside the first picks the turn direction. Schools with MOVE Motor robots can use Kitronik's `measure distance` with the same logic on the real robot.
running:
  - "Predict: most predict it turns away. Ask what makes it drive forward again afterwards."
  - "Run: drag boxes into its path. Mention the walls before anyone asks."
  - "Investigate: Zara's robot is the < and > mix-up from micro:bit Foundations; it is very visible here."
  - "Modify: −50 −50 backs up. Colours: robot set color, click the swatch."
  - "Make: an if … else inside an if is new for some. Draw the decision as a tree on the board: close? then coin toss: left or right."
  - "Real robot (optional): book walls work well. Soft objects are hard for ultrasonic sensors."
stuck:
  - see: "The robot spins in the open and hits boxes."
    ask: "Read the question aloud: when is it true?"
    fix: "Use < (less than): turn when the distance is small."
  - see: "The robot gets stuck turning back and forth."
    ask: "Does it turn far enough to see past the box?"
    fix: "Make the turn longer (700 ms), or back up first."
  - see: "It always turns the same way."
    ask: "Where does the random choice go?"
    fix: "Inside the first if: if pick random 0 to 1 = 0, turn right, else turn left."
stretch: "Count how many times the robot has turned away (a variable, change by 1) and show it on the micro:bit."
support: "Give the random if … else with its question already set; students put a turn in each branch."
leads: "Next: follow a line instead of exploring at random. Real-world link: early robot vacuums worked like this; newer ones map the room."
exit:
  q: "How does if … else inside forever let a robot explore a room without a plan?"
  a: "Every time round, it checks the distance and chooses: turn away if something is close, else drive forward. Many small choices add up to exploring."
explain: |
  **if … else** chooses one of two moves.

  - Inside **forever**, the robot checks and chooses again every time round.
  - A branch can hold a short routine: back up, then turn.
  - **pick random 0 to 1** gives a coin toss, so the robot does not always turn the same way.
solutions:
  step-4#t1: avoid.ts#sol-back
  step-4#t2: avoid.ts#sol-lights
  step-5: avoid.ts#sol-make
struggle: "if … else chooses a move every time round, with no plan. Ask them to read the question aloud and say when it is true."
