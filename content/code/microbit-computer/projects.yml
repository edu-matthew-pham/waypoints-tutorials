playground: microbit
projects:
  - id: live-dashboard
    title: A live dashboard
    after: commands
    goal: |
      Build **both ends** of a micro:bit gadget: the micro:bit measures something (light, temperature, movement) and sends it, and **your own web page** shows it live, changes how it looks when the reading crosses a line you choose, and has a button that sends the micro:bit a command.

      The page talks to the micro:bit with `microbit.js`, which is already in the starter. In this preview it opens a **pretend micro:bit** (type the lines it would send). For the real thing, download the page and open it in Chrome or Edge with the micro:bit plugged in.
    milestones:
      - text: "The micro:bit sends a reading again and again, by name (serial write value)."
        hints:
          - "A forever loop that sends a reading and then pauses repeats for ever."
          - "Send the sensor reading with serial write value, using a name such as temp."
        part: 1
        way: |
          basic.forever(function () {
              serial.writeValue("temp", input.temperature())
              basic.pause(1000)
          })
      - text: "My page shows the reading as it changes (try it with the pretend micro:bit)."
        hints:
          - "The page hears each reading with microbit.onValue(function (name, number) { ... })."
          - "Check the name is the one your micro:bit sends, then put the number on the page with textContent."
        part: 2
        way: |
            microbit.onValue(function (name, number) {
              if (name === "temp") {
                document.querySelector("#reading").textContent = number + " °C";
      - text: "My page changes how it looks when the reading crosses a line I chose."
        hints:
          - "Pick the line first, such as 25 degrees."
          - "Use a comparison on the number, and change a style with el.style.background."
        part: 2
        way: |
                document.body.style.background = number > 25 ? "#ffd6d0" : "white";
      - text: "A button on my page sends a command, and the micro:bit does something when it arrives."
        hints:
          - 'A button click on the page can send a line, such as microbit.send("word").'
          - "On the micro:bit, read the line that arrives and check it is your word before you act on it."
        part: 2
        way: |
            document.querySelector("#alarm").addEventListener("click", function () {
              microbit.send("alarm");
            });
    reveal: true
    stretch:
      - "Send two readings and show both."
      - "Keep a list of the last ten readings on the page."
      - "Try it with a real micro:bit: download the page and open it in Chrome or Edge."
    teacher: |
      A crossover: the micro:bit half needs lessons 1 and 2 of this course; the page half needs the DOM course (events, textContent, style), or Make it react from HTML & CSS for the basics. Students who have only done one half can pair with someone who has done the other.

      The playground preview cannot use USB (it is sandboxed), so `microbit.js` opens a pretend micro:bit there: a panel to type lines such as `temp:30`, which also shows what the page sends. The real micro:bit needs the downloaded page in Chrome or Edge, and MakeCode must not be connected to the micro:bit in another tab.
    parts:
      - title: The micro:bit
        playground: microbit
        uses: [serial-write, serial-read, text-compare]
        example: dashboard.ts
      - title: The web page
        playground: dom
        uses: [js-event, text-content, style-prop]
        example: dashboard.html
        starter: dashboard-starter.html
        height: 560
  - id: press-counter
    title: A press counter
    after: commands
    goal: |
      Make a **counter that lives on both sides**. The micro:bit counts every press of button A and sends the count. **Your own web page** shows it big, and has a Reset button that tells the micro:bit to start again from 0.

      A good counter never loses count: if the page opens late, the next press still shows the right number.
    milestones:
      - text: "Each press of A adds 1 on the micro:bit and sends the count by name (serial write value)."
        hints:
          - "The count needs a variable that keeps its value between presses."
          - "Inside on button A pressed, change the variable by 1, then send it."
          - "Send it with serial write value, giving it a name such as count."
        part: 1
        way: |
          input.onButtonPressed(Button.A, function () {
              count += 1
              serial.writeValue("count", count)
          })
      - text: "My page shows the count and updates on every press (try it with the pretend micro:bit)."
        hints:
          - "The page hears each value with microbit.onValue(function (name, number) { ... })."
          - "Check the name is the one your micro:bit sends, then put the number in the page with textContent."
        part: 2
        way: |
          microbit.onValue(function (name, number) {
            if (name === "count") {
              document.querySelector("#count").textContent = number;
            }
          });
      - text: "The Reset button on my page sends a command, and the micro:bit goes back to 0."
        hints:
          - 'A button click on the page can send a line: microbit.send("word").'
          - "On the micro:bit, read the line that arrives and check it is your word before you reset the count."
    benchmark:
      - { file: counter-a.html, caption: "A plain counter that has counted 12 presses" }
      - { file: counter-b.html, caption: "A door counter that turns red above 25" }
    reveal: true
    stretch:
      - "Turn the page red when the count passes a number you choose."
      - "Show the count on the micro:bit's own screen too."
    teacher: |
      The smallest crossover: one variable on the micro:bit, one name on the wire, one element on the page. It suits students who have done lessons 1 and 2 of this course and the first DOM lessons. The count lives on the micro:bit, and the page only shows what it is sent: ask "where does the real count live?" and what happens if the page is closed and opened again.

      In the playground preview USB is blocked, so `microbit.js` opens a pretend micro:bit (type `count:3`). A real micro:bit needs the downloaded page in Chrome or Edge.
    parts:
      - title: The micro:bit
        playground: microbit
        uses: [variable-update, serial-write, serial-read]
        example: counter.ts
      - title: The web page
        playground: dom
        uses: [js-event, text-content, js-query]
        example: counter.html
        starter: counter-starter.html
        height: 480
  - id: radio-packets
    title: Watch the radio packets
    after: radio-bridge
    goal: |
      Two micro:bits and a page. A **sender** micro:bit sends readings by radio. A **bridge** micro:bit, plugged into the computer, hears every radio packet and passes it on. **Your own web page** lists each packet as it arrives (its name and its value), like a window on the radio.

      Use a different radio group from the rest of the class so you only see your own packets.
    milestones:
      - text: "The sender sends a named reading by radio (send value) on your group."
        hints:
          - "Both micro:bits must be on the same radio group, set first."
          - "Radio send value takes a name (8 letters at most) and a number."
      - text: "The bridge passes each packet on to the computer (serial write value)."
        hints:
          - "The bridge uses on radio received value, which gives you the name and the value."
          - "Pass both straight on with serial write value."
        part: 1
        way: |
          radio.onReceivedValue(function (name, value) {
              serial.writeValue(name, value)
          })
      - text: "My page adds a new line to a list for every packet, so I can see the order they arrived."
        hints:
          - 'Make a new list item for each packet with document.createElement("li").'
          - "Give it text, then add it to the end of the list on the page with append."
        part: 2
        way: |
          var line = document.createElement("li");
          line.textContent = name + " = " + number;
          document.querySelector("#log").append(line);
      - "I tried a different radio group on the sender and saw the packets stop, then put it back."
    benchmark:
      - { file: packets-a.html, caption: "A list of packets in the order they arrived" }
      - { file: packets-b.html, caption: "The same list, coloured by name, with a count" }
    reveal: true
    stretch:
      - "Send two different names from the sender and colour them differently on the page."
      - "Show how many packets have arrived so far."
    teacher: |
      A crossover that makes the packet idea from Networks visible: a packet has a name, a value and an order. The sender and the bridge are the same micro:bit program with different jobs, so it also suits pairs: one builds the sender, one builds the bridge and page. Remind students that `sendValue` names are cut at 8 characters.

      The example shows the bridge and the page. The sender is two blocks (radio set group, then radio send value inside a forever loop); the dashboard's temperature sender is a good model. The playground preview can only run one micro:bit, so test with the pretend micro:bit (type `temp:21`).
    parts:
      - title: The bridge micro:bit
        playground: microbit
        uses: [radio, radio-value, serial-write]
        example: packets.ts
      - title: The web page
        playground: dom
        uses: [js-event, create-element, append-element]
        example: packets.html
        starter: packets-starter.html
        height: 520
  - id: data-logger
    title: A data logger
    after: send-data
    goal: |
      Turn the micro:bit into a **data logger**. It sends a reading (light, temperature or movement) every second. **Your own web page** keeps each reading in a list, and shows the **lowest**, the **highest** and **how many** readings it has seen so far.

      Then use it for something real: log the light near a window for a lesson, or the temperature in two parts of the room, and say what the numbers show.
    milestones:
      - text: "The micro:bit sends a reading every second by name."
        hints:
          - "A forever loop that sends, then pauses for 1000 ms, repeats for ever."
          - "Send the sensor reading with serial write value and a name."
      - text: "My page adds each reading to the end of a list."
        hints:
          - "Make the list once, outside the function that runs for each reading."
          - "Add each new number to the end with push."
        part: 2
        way: |
          readings.push(number);
      - text: "My page shows the lowest and highest reading so far, updating as new ones arrive."
        hints:
          - "Math.min and Math.max can look at a whole list."
          - "If both start at 0, the lowest never changes. Work out why, then fix it."
        part: 2
        way: |
          document.querySelector("#low").textContent = Math.min.apply(null, readings);
          document.querySelector("#high").textContent = Math.max.apply(null, readings);
      - "I logged something real and wrote one sentence about what the numbers showed."
    benchmark:
      - { file: logger-a.html, caption: "A logger showing readings, lowest and highest" }
      - { file: logger-b.html, caption: "A logger used for a real question, with the average added" }
    reveal: true
    stretch:
      - "Show the average as well."
      - "Add a Clear button that starts the log again."
      - "Download the page and log with a real micro:bit."
    teacher: |
      The logger pairs naturally with Science: the same page can log any sensor, so the question can come from a practical (does the light change near the window? does the room cool at lunch?). The new idea is keeping history: the dashboard shows only the latest reading, and the logger remembers all of them. Expect students to need a nudge to compare each new reading with the lowest and highest so far.

      Check that the lowest and highest start properly: starting both at 0 is the usual bug (the lowest never changes). Starting from the first reading, or from very large and very small numbers, fixes it. In the preview, type `light:80`, `light:140` and so on.
    parts:
      - title: The micro:bit
        playground: microbit
        uses: [serial-write, running-time]
        example: logger.ts
      - title: The web page
        playground: dom
        uses: [js-event, text-content, js-query]
        example: logger.html
        starter: logger-starter.html
        height: 560
