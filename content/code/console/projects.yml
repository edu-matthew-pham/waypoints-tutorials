playground: turtle
projects:
  - id: quiz
    title: A quiz game
    after: console-guess
    goal: |
      Write a **quiz** about something you know well. It asks every question in turn, says whether each answer was right, and finishes with a score.
    example: quiz.py
    answers: ["canberra", "8", "blue"]
    uses: [input, list, for-of, variable-update]
    milestones:
      - text: "At least three questions, each with its own right answer."
        hints:
          - "Keep each question and its answer together as a small list, inside one big list."
          - "In each small list, item[0] is the question and item[1] is the answer."
        way: |
          questions = [
              ["What is the capital of Australia? ", "canberra"],
              ["How many legs does a spider have? ", "8"],
              ["What colour do you get from blue and yellow? ", "green"],
          ]
      - text: "One loop asks them all, whatever the number of questions."
        hints:
          - "for item in questions runs the same code once for each question."
          - "Ask with input(item[0]) and keep what they type in a variable."
        way: |
          for item in questions:
              answer = input(item[0]).lower()
      - text: "The program says whether each answer was right, and ends with the score."
        hints:
          - "Start score at 0 before the loop, not inside it."
          - "Inside the loop, if the answer matches item[1], add 1 to score."
          - "After the loop, print the score joined to text, using str()."
        way: |
              if answer == item[1]:
                  print("Correct!")
                  score = score + 1
              else:
                  print("Not quite. It was " + item[1] + ".")
    reveal: true
    stretch:
      - "Ignore capital letters, so Canberra and canberra both count."
      - "Count how many answers were wrong, and give a message for a perfect score."
      - "Ask the questions in a random order."
    teacher: |
      Builds on the guessing game (a running count) and Lists (one loop over them all). Each question is a small list of a question and its answer, so `item[0]` and `item[1]` are the recipe here; students do not need to write them from scratch. The picture shows one run with a wrong answer. A good conversation: where does the score start, and what happens if it starts inside the loop?

  - id: fortune
    title: A fortune teller
    after: console-menu
    goal: |
      Build a **fortune teller**. It keeps asking for a question, answers each one with a reply picked at random, and stops when you type `quit`.
    example: fortune.py
    answers: ["Will I pass maths?", "Is it Friday?", "quit"]
    uses: [while, break, list, random]
    milestones:
      - text: "At least five replies, kept in a list."
        hints:
          - 'A list is square brackets with commas between the items, such as ["a", "b"].'
          - "Write replies that make sense whatever the question is."
        way: |
          replies = ["Yes, definitely.", "Ask again later.", "Not a chance.", "It looks good.", "Hard to say."]
      - text: "It keeps asking until you type quit."
        hints:
          - "while True keeps going until something tells it to stop."
          - "Inside it, check whether they typed quit before you reply, and use break to leave."
        way: |
          while True:
              question = input("Ask a question: ")
              if question == "quit":
                  break
      - text: "Each answer is picked at random from the list."
        hints:
          - "Put import random at the top of the program."
          - "random.choice(a_list) gives back one item from the list, picked at random."
        way: |
              print(random.choice(replies))
    reveal: true
    stretch:
      - "Say something different when the question is blank."
      - "Count the questions and say how many were asked when you leave."
      - "Give a longer reply when the question ends in a question mark."
    teacher: |
      The menu loop with `break` from Menu with break, with a list of replies in place of the menu. `random.choice` is a recipe here (Catch the turtle taught `import random`); students who want to explain it can use `random.randint` on an index instead. The loop's exit is the point: ask where `quit` has to be checked, before or after the reply.
