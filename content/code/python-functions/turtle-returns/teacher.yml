summary: Students write functions that give an answer back with return, see why print is not the same, and combine small functions to build a street.
time: 55
timing: "Predict and Run 10 min · Investigate 15 min · Modify 10 min · Make 15 min · Street 5 min"
goals:
  - I can write a function that gives a value back with return.
  - I can explain the difference between return (hand the value back) and print (only show it).
  - I can build a program from several small functions working together.
before: |
  Read the unit primer first. The one idea to be clear on: `print` shows a value on the screen, but the program cannot use it; `return` hands the value back to the line that called the function, so it can be used, like `forward(metres(5))`. Try the bug task yourself: it stops with a TypeError because a function without return gives back `None` (Python's word for "nothing").
running:
  - "Predict: metres(5) is replaced by its answer, 100, so forward(metres(5)) is forward(100). Write this substitution on the board."
  - "Investigate: work out metres(5) before running. Then do the bug task and ask why the number is printed but the turtle still fails."
  - "Modify: area returns width * depth. Students print it to see it; the room drawing does not change."
  - "Make: there is no starter on purpose. This shows whether students can write and use a function on their own. Give the hint only after a real attempt."
  - "Street: the loop varies the size argument, so each house is different. Ask how to make them shrink instead of grow."
stuck:
  - see: "A TypeError mentioning NoneType, often on a forward line."
    ask: Does the function return its answer, or only print it?
    fix: Replace print(...) inside the function with return ..., then use the value where it is needed.
  - see: The area is worked out but nothing appears.
    ask: Where is the returned value used or shown?
    fix: A returned value has to be used. Print it outside the function, print(area(5, 4)).
  - see: Code after return never runs.
    ask: What happens at the moment a function reaches return?
    fix: return ends the function. Put any other lines before it.
stretch: Write a function that returns the perimeter of a room, then print the area and perimeter of three rooms.
support: Before the Make step, write the one-house function together on the board, then let students add the loop themselves.
leads: "Next lesson: functions that decide, an if inside a function, called for every item in a list. Then modules keep related functions where other programs can import them. Calculators, maps and games are full of functions that take something in and give an answer back. Class ideas: a class toolbox of unit conversions; a street where every house has a different design."
exit:
  q: "def double(n): return n * 2. What does forward(double(30)) do?"
  a: "double(30) gives back 60, so the turtle moves forward 60 steps."
explain: |
  Some functions do something (draw a square). Others **give an answer back**. `return m * scale` hands the result to whoever called the function.

  So `forward(metres(5))` works in two steps: first `metres(5)` is worked out and gives back 100, then `forward(100)` runs.

  `print` is different: it only shows a value on the screen. The program cannot use a printed value. If a function prints instead of returning, the caller gets nothing back (Python calls it `None`).
solutions:
  step-4#t1: returns.py#sol-area
  step-4#t2: returns.py#sol-print
  step-6#t1: returns.py#sol-house
  step-6#t2: returns.py#sol-street
  step-7: returns.py#sol-vary
struggle: "return versus print: both show a number, but only return hands it back. Let the NoneType error happen, then ask what the function gives back."
