playground: dom
projects:
  - id: looks
    title: Light, dark and big text
    after: dom-style
    goal: |
      Give a page you've made **buttons that change how it looks**: a dark mode and big text, and one look of your own. Each button switches its look on, and pressing it again switches it back.
    example: looks.html
    uses: [js-query, js-event, class-list]
    milestones:
      - text: "Each button changes something you can see."
        hints:
          - "Write the look as a CSS class first. Then the button only has to add that class to the page."
          - "A click handler can call classList.toggle with the class name."
        way: |
          document.querySelector("#dark").addEventListener("click", () => {
            page.classList.toggle("dark");
          });
      - text: "Pressing a button again switches its look back off."
        hints:
          - "add only turns a class on. Look for the classList method that turns it on and off."
      - text: "The page still reads well in every look, and with two looks on at once."
        hints:
          - "Turn both looks on together and read the page. Can you still see the words?"
          - "If one look sets a colour that clashes with another, change one of the two classes."
    reveal: true
    stretch:
      - "A third look of your own (a colour theme, wider spacing, a hidden part)."
      - "After Saving between visits: remember which looks were on."
    teacher: |
      A student can paste in a page from the HTML & CSS courses or start from a heading and a paragraph. The idea is the one from Classes and themes: CSS holds the looks as classes, and JavaScript only adds and removes them. Watch for students setting `style.` properties one by one; point them back to `classList.toggle`.

  - id: flashcards
    title: Flashcards
    after: dom-list
    goal: |
      Make **flashcards** for something you're learning: type a question and its answer, add it as a card, then click a card to flip it over.
    example: flashcards.html
    uses: [input-value, create-element, class-list]
    milestones:
      - text: "Adding makes a new card on the page."
        hints:
          - "Read what is in the two boxes with .value, then make a new element for the card."
          - "A new element is not on the page until you append it to a tag that is."
        way: |
          const card = document.createElement("div");
          card.className = "card";
      - text: "Clicking a card shows its answer, and clicking again shows the question."
        hints:
          - "Put both the question and the answer in the card, and hide one of them with CSS."
          - "A class on the card can decide which one is hidden. Toggle it on click."
        way: |
          card.addEventListener("click", () => card.classList.toggle("flipped"));
      - text: "An empty box adds nothing."
        hints:
          - "Check the boxes before you make the card. If either one is empty, stop."
        way: |
          if (q === "" || a === "") return;
    reveal: true
    stretch:
      - "A count of how many cards there are."
      - "A Shuffle button."
      - "A different colour for cards you've flipped."
    teacher: |
      Builds on Building a list (making an element and adding it to the page) and Classes and themes (toggling a class for the flip). The flip is all CSS: two paragraphs in a card, and the `flipped` class hides one and shows the other.

  - id: story
    title: Pick your own path
    after: dom-state
    goal: |
      Write a **short story where the reader picks what happens next**. Two buttons, and the words change with every choice.
    example: story.html
    uses: [js-query, js-event, text-content]
    milestones:
      - text: "My story has at least three places to be."
        hints:
          - "Plan on paper first: a box for each place and an arrow for each choice."
          - "A variable can hold which place the reader is in, as a word."
        way: |
          let place = "start";
          const words = document.querySelector("#words");
      - text: "One ending can be reached two different ways."
        hints:
          - "Two different places can both send the reader to the same next place."
          - "In the click handler, check where the reader is now, then set where they go next."
      - text: "A Start again button takes the reader back to the beginning."
        hints:
          - "On an ending, a button can set the place back to the first one."
        way: |
          else place = "start";
    reveal: true
    stretch:
      - "Something the reader carries (a key, a coin) that changes a later choice."
      - "A picture that changes with each place."
    teacher: |
      The variable that remembers where the reader is (`place`) is the score variable from A page that keeps score, now holding a word. Students who plan on paper first (boxes for places, arrows for choices) finish faster; the planning is the computational thinking here.

  - id: habits
    title: A habit tracker that remembers
    after: dom-save
    goal: |
      Make a **habit tracker**: tick off a habit when you've done it, and your ticks are still there next time the page opens.
    example: habits.html
    uses: [local-storage, create-element, json-data]
    milestones:
      - text: "Clicking a habit ticks it, and clicking again unticks it."
        hints:
          - "Keep a list of the habits that are ticked."
          - "On a click, if the habit is in the list take it out, and if not put it in."
        way: |
          if (ticks.includes(h)) ticks = ticks.filter((t) => t !== h);
          else ticks.push(h);
      - text: "The ticks are still there after I run the page again."
        hints:
          - "localStorage keeps text between visits. A list needs turning into text first."
          - "Save the list every time it changes, and read it back when the page starts."
        way: |
          localStorage.setItem("ticks", JSON.stringify(ticks));
      - text: "A Clear button starts fresh."
        hints:
          - "Empty the list, save the empty list, then show the page again."
    reveal: true
    stretch:
      - "Add your own habits from a box."
      - "Show how many habits are done out of how many."
    teacher: |
      In the playground, "next time the page opens" means pressing Run again: the preview keeps each page's saved data as a stand-in for the browser's own storage. A downloaded copy opened in a real browser keeps its ticks for real. The list is saved as JSON, as in Saving between visits.
