summary: "Students use console.log, warn and error to look inside a page, find elements with querySelectorAll and count them, read an error message for its name and line, and try the real browser Console."
time: 45
timing: "Predict and Run 10 min · Investigate 10 min · Modify 10 min · Make 15 min"
goals:
  - I can use console.log to see what my code is doing.
  - I can read an error message for the name and the line.
  - I can open my browser's Console and inspector.
before: |
  Optional enrichment after the challenge. The playground's Console shows what `console.log`, `warn` and `error` write, and what the browser would say about an error, in plain words first. In the real browser, F12 (or right-click, Inspect) opens the DevTools; the Console tab is the same idea, with more tools. Check the school's browsers allow DevTools before the lesson: some managed devices block it, and the Make step then stays in the playground. Make a point of the safety rule: never paste code into the Console because someone told you to. Changes made in the real Console last until the page is reloaded and do not change the real site.
running:
  - "Predict: ask students to count console lines before running."
  - "Run: ask where the messages appear and where they do not."
  - "Investigate: for the bug, ask \"what is the exact word it does not know?\""
  - "Modify: ask what querySelectorAll gives that querySelector does not."
  - "Make: if allowed, demonstrate F12 on the class page together."
stuck:
  - see: "Nothing appears in the Console."
    ask: "Was Run pressed, and is there a console.log line?"
    fix: "Press Run and check the spelling of console.log."
  - see: "X is not defined."
    ask: "Is X spelled the same as the name you made?"
    fix: "Compare the two names letter by letter."
  - see: "Cannot read properties of null."
    ask: "Did the selector find anything?"
    fix: "Check the selector against the HTML."
  - see: "F12 does nothing."
    ask: "Is DevTools blocked on this device?"
    fix: "Use the playground Console instead; try right-click, Inspect."
stretch: "Use the real Console on a favourite site to find a heading with document.querySelector(\"h1\").textContent, and change it to see the page change (until reload)."
support: "Give the loop and ask students only for the labels in the messages."
leads: "From here: students build their own page project, or move on to the Python web apps course."
exit:
  q: "What two things does an error message tell you?"
  a: "The word it could not make sense of, and the line it happened on."
explain: |
  1. `console.log(…)` writes a message in the Console, not on the page.
  2. `querySelectorAll("p")` finds every paragraph; `.length` counts them.
  3. An error names the problem and the line: read both first.
solutions:
  step-4#t1: page.html#sol-count
  step-4#t2: page.html#sol-loop
  step-5: page.html#sol-make
struggle: "Reading the error word for word: it names what it could not find. Ask \"what is the exact word, and where did you make it?\""
