playground: html
projects:
  - id: business
    title: A page for a local business
    after: bs-components
    goal: |
      Make a one-page site for a **local business**: a café, a bike shop, a vet. A navbar, a big opening line, a card for each thing it offers and a contact form, all from Bootstrap's classes.
    example: business.html
    uses: [bootstrap, bs-component, bs-grid]
    milestones:
      - text: "The navbar and the cards come from Bootstrap's classes."
        hints:
          - "You do not write the CSS: you add Bootstrap's class names to your tags."
          - "A navbar needs navbar on the outer tag, and each link needs a nav-link class."
        way: |
          <nav class="navbar navbar-expand bg-dark" data-bs-theme="dark">
      - text: "The cards sit in a row on a wide screen and stack on a narrow one."
        hints:
          - "Bootstrap's grid is a row holding columns. Each column says how wide it is."
          - "col-md-4 means a third of the row from the medium size up, and a full row below that."
        way: |
          <div class="row" id="services">
            <div class="col-md-4">
      - text: "Every box in the form has a label."
        hints:
          - "Label and box are linked the same way as in plain HTML: for on the label and id on the box."
          - "Bootstrap's form-label and form-control only change how they look."
        way: |
          <label for="name" class="form-label">Your name</label><input id="name" class="form-control">
    reveal: true
    stretch:
      - "An alert for this week's special."
      - "A footer with the opening hours."
    teacher: |
      Navbar, cards and a grid covers everything. To see the cards stack, students widen and narrow the preview (or use Full screen). The labels milestone carries the habit from the HTML forms lesson into Bootstrap's `form-label` and `form-control`.

  - id: yours
    title: Bootstrap, your way
    after: bs-yours
    goal: |
      Take your business page and make it **look like yours, not like Bootstrap**: your colours, your font, and one component styled your own way.
    example: business-yours.html
    uses: [bootstrap, css-rule, class-selector]
    milestones:
      - text: "My own rules come after the link to Bootstrap."
        hints:
          - "When two rules fight, the one that comes later wins."
          - "So your own style tag goes below the link to Bootstrap, not above it."
        way: |
          <link rel="stylesheet" href="bootstrap.min.css">
          <style>
      - text: "There are at least three changes someone could point to."
        hints:
          - "A colour, a font and a shape (rounded or square corners) are easy changes to spot."
          - "Use the class names Bootstrap already put on the tag as your selector."
        way: |
          body { font-family: Georgia, serif; background: #fbf7ef; }
      - text: "It still works on a narrow screen."
        hints:
          - "Make the preview narrow and look at it, or use Full screen to resize."
          - "Change colours, fonts and borders, but leave the grid classes alone."
    reveal: true
    stretch:
      - "Try the same page with Pico or Bulma instead, and say which you'd pick and why."
    teacher: |
      The comparison from Make Bootstrap yours, now on the student's own page. Order matters: rules before the link lose to Bootstrap's. Students who need `!important` have usually put their rule in the wrong place or picked a weaker selector; that's worth a conversation.
