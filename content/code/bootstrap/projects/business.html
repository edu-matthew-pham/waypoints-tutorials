<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="bootstrap.min.css">
</head>
<body>
  <nav class="navbar navbar-expand bg-dark" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="#">Spoke &amp; Chain</a>
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="#services">Services</a></li>
        <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
      </ul>
    </div>
  </nav>
  <div class="container py-4">
    <h1 class="display-5">Bikes fixed while you wait</h1>
    <p class="lead">A small repair shop on the high street, open six days a week.</p>
    <div class="row" id="services">
      <div class="col-md-4"><div class="card mb-3"><div class="card-body"><h2 class="card-title h5">Flat tyres</h2><p class="card-text">Fixed in 15 minutes.</p></div></div></div>
      <div class="col-md-4"><div class="card mb-3"><div class="card-body"><h2 class="card-title h5">Brakes</h2><p class="card-text">Checked and tuned.</p></div></div></div>
      <div class="col-md-4"><div class="card mb-3"><div class="card-body"><h2 class="card-title h5">Full service</h2><p class="card-text">Your bike, like new.</p></div></div></div>
    </div>
    <form id="contact">
      <div class="mb-3"><label for="name" class="form-label">Your name</label><input id="name" class="form-control"></div>
      <div class="mb-3"><label for="msg" class="form-label">What needs fixing?</label><textarea id="msg" class="form-control"></textarea></div>
      <button class="btn btn-primary">Send</button>
    </form>
  </div>
</body>
</html>
