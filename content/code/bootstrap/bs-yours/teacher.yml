summary: "Students put their own CSS after the Bootstrap link, predict that their later rule wins, sort jobs into Bootstrap or hand-built CSS, find a style block in the wrong place, meet Bulma, Tailwind, daisyUI and Pico, and give a Bootstrap club page a look of its own."
time: 55
timing: "Predict and Run 10 min · Investigate 10 min · Other frameworks 10 min · Modify 10 min · Make 15 min"
goals:
  - I can change Bootstrap's look with my own rules after the link.
  - I can explain when Bootstrap suits a page better than my own CSS, and when it does not.
  - I can tell component classes (Bootstrap, Bulma) from utility classes (Tailwind).
before: |
  Read the unit primer first. The rule students need is the cascade they met in HTML & CSS: when two rules match a tag equally (same kind of selector), **the later one wins**. So the Bootstrap link goes first and the student's `<style>` block after it. The planted bug puts the style block first, and Bootstrap's `h1` rule then wins.

  Two catches you may meet. Bootstrap's spacing and colour **utility classes** (`bg-body-tertiary`, `mt-3`, `text-center`) are marked important and beat ordinary rules wherever they are, so the run page takes `bg-body-tertiary` off the navbar before giving it a colour. And a button's hover colour is a separate, stronger rule (`.btn:hover`), so restyling buttons is fiddly; the tasks avoid it on purpose.

  **Other frameworks.** Bootstrap is one of many. Bulma works the same way with different names (`button is-primary`). **Tailwind**, very popular for new projects, has no ready-made parts: each class sets one CSS property (`bg-blue-600`, `px-4`), and a build tool writes CSS for just the classes a site uses. Here a browser version of Tailwind (`tailwind.js`) does that as the page loads; Tailwind's makers say it is for trying things, not real sites. **daisyUI** adds Bootstrap-style names (`btn btn-primary`) on top of Tailwind. **Pico** is classless: it styles plain tags, so a page needs no class names at all. Every one of them is served from this site.
running:
  - "Predict: ask \"which rule comes later?\" before anyone answers."
  - "Run: everyone moves the style block above the link, sees it lose, and moves it back."
  - "Investigate: the sort has no single right answer in real life; ask for a reason for each."
  - "Other frameworks: ask what Tailwind would need for a whole card (many classes) and why some people prefer that (everything is in the HTML)."
  - "Modify: the Bulma task swaps the whole framework; ask what changed apart from the link (every class name)."
  - "Make: ask each student to point to their three rules and say what each changed."
struggle: "When a rule does nothing, students add more rules. Ask \"which rule is winning, and why?\" and have them check the order before writing anything new."
stuck:
  - see: "A rule of their own does nothing."
    ask: "Is the style block after the link?"
    fix: "Move the link line to the top."
  - see: "The navbar colour will not change."
    ask: "Does the navbar have a bg- class?"
    fix: "Take the bg- class off; Bootstrap's utility classes beat ordinary rules."
  - see: "A button changes colour but goes back to blue when the mouse is over it."
    ask: "Which rule styles a button under the mouse?"
    fix: "That is .btn:hover; use a Bootstrap colour class instead (btn-success), or leave buttons alone."
  - see: "Tailwind classes do nothing."
    ask: "Is the tailwind.js script on the page?"
    fix: "Add script src=\"tailwind.js\"; without it there is no Tailwind CSS at all."
stretch: "Rebuild one club card in Tailwind using only utility classes, then in daisyUI with card and card-body. Which took fewer classes? Which would be easier to change across a whole site?"
support: "Give students three rules on the board (a font, a navbar colour, a border) and ask them only to place and change them."
leads: "This is the end of the Bootstrap course. The DOM course makes pages react; Vue does for JavaScript what Bootstrap does for CSS, ready-made ways to build an app. Class discussion: a framework saves time and makes sites look alike; which matters more for a club page, and for a company?"
exit:
  q: "Your rule .card { border-color: teal; } does nothing. What is the first thing to check?"
  a: "Whether the style block comes after the Bootstrap link; when two rules match equally, the later one wins."
explain: |
  1. A Bootstrap card has Bootstrap's grey border.
  2. Your style block comes after the link.
  3. Your rule for the same class sets a teal border: both rules match, and the later one, yours, wins.
  4. Bootstrap gives the shapes and the grid; your rules give the look.
solutions:
  step-5#t1: page.html#sol-brand
  step-5#t2: page.html#sol-corners
  step-5#t3: page.html#sol-bulma
  step-6: page.html#sol-make
