<!-- region: finished -->
<div id="app">
  <h1>To do</h1>
  <input v-model="newTask" placeholder="Something to do">
  <button @click="addTask">Add</button>
  <ul>
    <todo-item v-for="t in tasks" :task="t"></todo-item>
  </ul>
  <p>{{ left }} left to do</p>
  <button @click="clearDone">Clear done</button>
</div>

<script src="vue.js"></script>
<script>
  const { createApp, ref, computed } = Vue;
  const app = createApp({
    setup() {
      const tasks = ref([
        { text: "Feed the cat", done: false },
        { text: "Pack my bag", done: true }
      ]);
      const newTask = ref("");
      const left = computed(() => {
        let count = 0;
        for (const t of tasks.value) {
          if (!t.done) {
            count++;
          }
        }
        return count;
      });
      function addTask() {
        if (newTask.value !== "") {
          tasks.value.push({ text: newTask.value, done: false });
          newTask.value = "";
        }
      }
      function clearDone() {
        const keep = [];
        for (const t of tasks.value) {
          if (!t.done) {
            keep.push(t);
          }
        }
        tasks.value = keep;
      }
      return { tasks, newTask, left, addTask, clearDone };
    }
  });
  app.component("todo-item", {
    props: ["task"],
    template: `<li><label><input type="checkbox" v-model="task.done"> {{ task.text }}</label></li>`
  });
  app.mount("#app");
</script>
