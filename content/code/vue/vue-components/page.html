<!-- region: run -->
<div id="app">
  <h1>Chess ladder</h1>
  <player-card v-for="p in players" :name="p.name" :wins="p.wins"></player-card>
</div>

<script src="vue.js"></script>
<script>
  const { createApp, ref } = Vue;
  const app = createApp({
    setup() {
      const players = ref([
        { name: "Ada", wins: 5 },
        { name: "Sam", wins: 4 },
        { name: "Lin", wins: 2 }
      ]);
      return { players };
    }
  });
  app.component("player-card", {
    props: ["name", "wins"],
    template: `
      <div style="border: 2px solid teal; padding: 8px; margin: 8px 0;">
        <h2>{{ name }}</h2>
        <p>Wins: {{ wins }}</p>
      </div>`
  });
  app.mount("#app");
</script>
<!-- endregion -->

<script src="vue.js"></script>
<script>
  const { createApp, ref } = Vue;
  const app = createApp({
    setup() {
      const pets = ref([
        { name: "Biscuit", kind: "guinea pig" },
        { name: "Nemo", kind: "goldfish" },
        { name: "Pepper", kind: "rabbit" }
      ]);
      return { pets };
    }

        <p>A {{ kind }}</p>
      </div>`
  });
