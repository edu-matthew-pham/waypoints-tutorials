  - { title: "React: Updating arrays in state", url: "https://react.dev/learn/updating-arrays-in-state", checked: 2026-10-12 }
  - { title: "Svelte: $state", url: "https://svelte.dev/docs/svelte/$state", checked: 2026-10-12 }
  - { title: "AngularJS: end of support", url: "https://docs.angularjs.org/misc/version-support-status", checked: 2026-10-12 }
