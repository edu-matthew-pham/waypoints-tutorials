<!-- region: predict -->
<div id="app">
  <p>Score: {{ score }}</p>
  <button @click="score++">Add a point</button>
</div>

<script src="vue.js"></script>
<script>
  const { createApp, ref } = Vue;
  createApp({
    setup() {
      const score = ref(0);
      return { score };
    }
  }).mount("#app");
</script>
<!-- endregion -->

<!-- region: sol-make -->
<div id="app">
  <h1>Space game</h1>
  <p>Lives: {{ lives }}</p>
  <p>Level: {{ level }}</p>
  <button @click="lives--">Lose a life</button>
  <button @click="level++">Next level</button>
</div>

<script src="vue.js"></script>
<script>
  const { createApp, ref } = Vue;
  createApp({
    setup() {
      const lives = ref(3);
      const level = ref(1);
      return { lives, level };
    }
  }).mount("#app");
</script>
<!-- endregion -->
