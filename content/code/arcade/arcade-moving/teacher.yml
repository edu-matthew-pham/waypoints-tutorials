summary: Students move sprites with the controller and with a velocity, and see that a velocity keeps a sprite moving every frame while a position moves it once.
time: 45
timing: "Predict and Run 8 min · Investigate 12 min · Modify 10 min · Make 10 min · Conveyor belt 5 min"
goals:
  - I can let the player steer a sprite with the arrow keys and keep it on the screen.
  - I can give a sprite a velocity so it moves by itself, and make it bounce off the walls.
  - I can explain the difference between setting a position and setting a velocity.
before: |
  A **position** (x, y) is where a sprite is **now**. Setting it moves the sprite once. A **velocity** (vx across, vy down) is a **speed in pixels per second**: the game engine moves the sprite a little every **frame** (each redraw of the screen, about 30 a second), and keeps doing it until something changes the velocity. So *set velocity to 50, 0* does not mean "move 50 pixels"; it means "keep moving right at 50 pixels a second", off the edge if nothing stops it. **move with buttons** (Controller) hands a sprite to the arrow keys; its optional two numbers are the speeds across and down. **on A button pressed** is an **event** block: it runs its blocks each time A is pressed (space or Z on the keyboard). Students must click the simulator before it hears keys. Try the Make task yourself: about six blocks.
running:
  - "Predict: most students choose 'moves 50 pixels and stops'. Let them commit; the ball sailing off the screen is the lesson's surprise."
  - "Run: ask 'what would make it stop?' Nothing in the program changes the speed, so nothing does."
  - "Investigate: the number task connects speed and distance (pixels per second). Leo's rocket is the same idea as the Predict, inside an event."
  - "Modify: the dash uses change x by 30 (a position), the correct version of Leo's idea. Ask what would happen with change vx by 30 instead."
  - "Make: the cloud needs its own variable name. A velocity with both numbers non-zero makes a slanting drift that bounces off every wall."
  - "Conveyor belt: twice as fast means doubling vx. Stopping the belt sets each vx to 0 inside the A event."
stuck:
  - see: "The arrow keys do nothing."
    ask: "Did you click the simulator? Is there a move with buttons block?"
    fix: "Click once on the game screen so it hears the keyboard, and check move with buttons names the right sprite."
  - see: "The sprite flies off the screen and is gone."
    ask: "What stops it at the edge?"
    fix: "Add set stay in screen (for the player) or set bounce on wall (for a drifting sprite)."
  - see: "A press of A sends the sprite sliding away for ever."
    ask: "Did you change its position or its velocity?"
    fix: "For a hop, change x (position). Changing vx changes its speed, which lasts until something sets it again."
  - see: "The cloud does not move at all."
    ask: "Which sprite does the set velocity block name?"
    fix: "Choose the cloud in the block's dropdown; it may still name the plane."
stretch: "Give the cloud a velocity that changes on A (faster) and B (stop), and add a second cloud drifting the other way."
support: "Give students the cloud sprite already made, and ask them to add only set velocity and set bounce on wall."
leads: "Next lesson sprites notice each other: an overlap event runs when the plane touches a cloud or a coin. Class ideas: a screensaver of bouncing logos; a 'slow lane, fast lane' scene of cars with different vx; measure a sprite's speed with a stopwatch."
exit:
  q: "A sprite has vx set to 20. Will it move 20 pixels, or keep moving? Why?"
  a: "It keeps moving. vx is a speed (20 pixels every second), and the engine moves the sprite every frame until something changes vx."
explain: |
  A sprite has a **position** and a **velocity**:

  1. **Position** (x, y) is **where it is now**. Setting it moves the sprite **once**.
  2. **Velocity** (vx, vy) is a **speed**, in pixels per second. The engine moves the sprite a little **every frame**, about 30 times a second.
  3. So a velocity keeps the sprite moving **until something changes it**: a new velocity, a wall it bounces off, or the edge with stay in screen.
solutions:
  step-4#t1: moving.ts#sol-across
  step-4#t2: moving.ts#sol-dash
  step-5: moving.ts#sol-make
