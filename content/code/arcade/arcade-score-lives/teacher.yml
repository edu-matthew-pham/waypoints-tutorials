summary: Students give the player lives and a countdown, spawn enemies with a timer event, and see that an overlap keeps running while two sprites still touch.
time: 50
timing: "Predict and Run 8 min · Investigate 12 min · Modify 10 min · Make 15 min · Rain dodger 5 min"
goals:
  - I can give the player lives and a countdown, and let the game end by itself.
  - I can use a timer event to make a new enemy every second.
  - I can explain why an enemy must be destroyed (or moved) when it hits the player.
before: |
  **Info** blocks keep a **score**, **lives** (hearts) and a **countdown** at the top of the screen. When the lives reach **0**, Arcade ends the game by itself; when the countdown reaches 0, it ends too. **on game update every 1000 ms** (Game) is a **timer event**: it runs its blocks again every so many milliseconds (1000 ms = 1 second). Here it makes a new enemy each time, at x 160 (the right edge) and a random height, with a **negative vx** so it flies left. One important fact: an **overlap event runs every frame** (about 30 times a second) **while the two sprites still touch**. If the enemy is not destroyed, one touch takes life after life, and the game ends at once. Try the Make task yourself: it is the biggest program so far (about 15 blocks).
running:
  - "Predict: many students expect lives to go below 0, or that a game over block is needed. The engine does it."
  - "Run: count the hearts aloud as they go. Ask: what made a new rock each second?"
  - "Investigate: the trace shows that only a touch changes the lives. Sam's dodger is the lesson's key bug: an overlap runs every frame while sprites touch."
  - "Modify: a smaller timer number means more often. The heart needs its own Player–Food event, revisiting lesson 3."
  - "Make: x 160 is the right edge, negative vx flies left. Students who forget destroy will lose all three lives at once: let them find it, then ask which lesson task it reminds them of."
  - "Rain dodger: the same game turned on its side (random x at the top, positive vy)."
stuck:
  - see: "One touch ends the game."
    ask: "What happens to the enemy after it touches the player?"
    fix: "Nothing, so the overlap runs again next frame. Add destroy otherSprite inside the overlap event."
  - see: "No enemies appear."
    ask: "Where does each enemy start, and which way does it move?"
    fix: "Start at x 160 and give a negative vx. With a positive vx it leaves the screen to the right at once."
  - see: "Only one enemy ever appears."
    ask: "Is the create block inside the timer, or in on start?"
    fix: "Move it into on game update every 1000 ms, so a new one is made each second."
  - see: "No hearts at the top of the screen."
    ask: "Is there a set life block in on start?"
    fix: "Add set life to 3 (Info). Lives appear only once they are set."
stretch: "Make the game a win if you survive: add on countdown end (Info) with game over (win). Then add a coin worth points so there is something to chase as well as dodge."
support: "Give students the timer block with the enemy already inside, and ask them to add lives, the countdown and the overlap event."
leads: "Next unit the game decides things every frame: if a sprite leaves the screen, wrap it round; if the player is in a safe zone, no harm. Class ideas: a road-crossing game; a 'catch the good, dodge the bad' rain of fruit and rocks; vote on the fairest number of lives and timer speed."
exit:
  q: "In a dodge game one touch takes all three lives. What one block is missing, and why does it matter?"
  a: "destroy otherSprite in the Player–Enemy overlap. The overlap runs every frame while the sprites touch, so without it the same enemy takes a life each frame."
explain: |
  The **Info** blocks and **timers** do a lot of work for you:

  1. **set life** shows hearts, and when the lives reach **0** the engine **ends the game** by itself.
  2. **on game update every 1000 ms** is a **timer**: it runs its blocks again every second, so it can make a new enemy each time.
  3. An **overlap** runs **every frame** while two sprites touch, so destroy the enemy (or move it) when it hits, or one touch takes every life.
solutions:
  step-4#t1: lives.ts#sol-faster
  step-4#t2: lives.ts#sol-heart
  step-5: lives.ts#sol-make
