playground: arcade
projects:
  - id: treasure-hunt
    title: Treasure hunt
    after: arcade-if
    goal: |
      Make a **collecting game**: the player moves around, treasure appears in random places, collecting it scores, and something changes when the score gets high enough (the background, the speed, a message). Your own player, treasure and setting.
    example: treasure-hunt.ts
    uses: [variable, random, if]
    milestones:
      - text: "My player moves with the controller and the treasure appears somewhere new each time."
        hints:
          - "Make a sprite for the player, and use the move block with the controller."
          - "Put the treasure at a random place: pick a random x and a random y inside the screen."
        way: |
          coin.setPosition(randint(10, 150), randint(10, 110))
      - text: "Touching the treasure scores a point."
        hints:
          - "Use the on overlap block with the player kind and the treasure kind."
          - "Inside it, change the score by 1, then move the treasure to a new random place."
        way: |
          sprites.onOverlap(SpriteKind.Player, SpriteKind.Food, function (sprite, otherSprite) {
              info.changeScoreBy(1)
      - text: "Something changes when the score passes a number I chose, decided by an if."
        hints:
          - "Put an if after the score changes, and ask whether the score is at least your number."
          - "Choose a change you can see, such as the background colour."
        way: |
          if (info.score() >= 10) {
                  scene.setBackgroundColor(9)
    reveal: true
    stretch:
      - "A countdown: score as much as you can in 30 seconds."
      - "Two kinds of treasure, worth different points."
      - "A hazard that costs a life."
    teacher: |
      All blocks from Arcade Foundations lessons 1 to 7. Students who want art can draw their own sprites in the image editor; set a time limit on drawing.

  - id: escape
    title: Escape
    after: arcade-chase
    goal: |
      Make a **chase game**: enemies follow the player around the screen, and the player has to survive, reach a goal or collect things to escape. How the enemies move, and how you win, are your choice.
    example: escape.ts
    uses: [if, else, random]
    milestones:
      - text: "At least one enemy follows the player (it turns towards them, using if and else)."
        hints:
          - "Do it on every update: compare the enemy x with the player x."
          - "If the enemy is left of the player, move right, else move left. Do y the same way."
        way: |
          if (ghost.x < hero.x) {
                  ghost.vx = 30
              } else {
                  ghost.vx = -30
              }
      - text: "Getting caught costs a life, once per catch."
        hints:
          - "Use the on overlap block with the player and the enemy."
          - "If it keeps taking lives, the enemy is still touching you. Move it away inside the same block."
        way: |
          info.changeLifeBy(-1)
              otherSprite.setPosition(randint(0, 160), 0)
      - text: "There is a way to win, and the game says so."
        hints:
          - "Pick a way to win: survive for a time, collect enough, or reach a place."
          - "Game over with true means a win."
        way: |
          info.startCountdown(30)
          info.onCountdownEnd(function () {
              game.over(true)
    reveal: true
    stretch:
      - "Enemies that speed up over time."
      - "A safe zone where enemies cannot go."
      - "An enemy that runs away instead."
    teacher: |
      The usual bug is losing all lives at once: the enemy must be destroyed or moved away in the overlap, as in Score and lives. Ask students to say how the enemy decides which way to go before they build it.
