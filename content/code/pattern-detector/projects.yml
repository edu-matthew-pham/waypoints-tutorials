      - { label: "Pattern Trainer", href: "https://tools.learningwaypoints.com/trainer/", note: "collect examples, train, check, and download your model file" }
      - { label: "The Pattern Trainer guide", href: "https://tools.learningwaypoints.com/trainer/guide.html", note: "collecting examples, training and checking, step by step" }
      - { label: "Set up the starters (once per computer)", href: "https://github.com/edu-matthew-pham/pattern-detector-starters#set-up-once", note: "Python 3, then one install" }
      - { label: "image_pattern_trainer.py", href: "https://github.com/edu-matthew-pham/pattern-detector-starters/blob/main/image_pattern_trainer.py", note: "the model part, for pictures" }
      - { label: "pose_pattern_trainer.py", href: "https://github.com/edu-matthew-pham/pattern-detector-starters/blob/main/pose_pattern_trainer.py", note: "the model part, for body poses" }
      - { label: "audio_pattern_trainer.py", href: "https://github.com/edu-matthew-pham/pattern-detector-starters/blob/main/audio_pattern_trainer.py", note: "the model part, for sounds" }
      - { label: "choice_rules.py", href: "https://github.com/edu-matthew-pham/pattern-detector-starters/blob/main/choice_rules.py", note: "a rules part: numbers and choices" }
