    example: combined-rock-paper-scissors.py
    benchmark:
      - { file: combined-finished-1.png, caption: "Rock paper scissors: the model reads your throw, and rules play the round, keep score and end the game. (A computer-made hand from the Rock Paper Scissors dataset, CC BY 4.0, Laurence Moroney.)" }
      - { file: combined-finished-2.png, caption: "A secret knock door: the model hears each sound, and rules check the last three sounds against the secret pattern." }
    reveal: true
    milestones:
      - text: "My problem and my user are clear, and my pipeline is drawn, with the reason each part is a model or rules."
        hints:
          - "Start with one sentence: who is it for, and what will it tell or do for them? Then say what the response needs that a model alone, or rules alone, could not give."
          - "Draw boxes for the input, the model, the label and how sure it is, your rules, and the response. Put an arrow wherever one part hands something to the next."
          - "Under each box, write why it is a model or rules. If you can describe it exactly, it is probably rules. If it is too messy to describe, it is probably the model."
        way: |
          # Pipeline:
          #   photo -> MODEL (Rock/Paper/Scissors + how sure) -> RULES (cut-off, who wins, score) -> result
          #   MODEL: telling a hand shape apart in a photo is too messy for rules.
          #   RULES: who beats whom, keeping score and when the game ends are exact.
      - text: "I built and tested each part on its own."
        hints:
          - "Get your model part working first, from the closest trainer starter, and check what it says on a few inputs it has not seen."
          - "Write your rules as a function that takes the model's answer as inputs, so you can test it with made-up labels and scores before the model is connected."
          - "Make up the awkward readings on purpose: unsure, nobody there, and the same answer many times in a row. Write what you expect before you run them."
        way: |
          assert run([("Rock", 0.95, "Scissors")]) == ({"you": 1, "computer": 0}, "You win the round")
          assert run([("Rock", 0.95, "Paper")]) == ({"you": 0, "computer": 1}, "I win the round")
          assert run([("Rock", 0.95, "Rock")]) == (NEW_GAME, "Draw")
          assert run([("Paper", 0.65, "Rock")]) == (NEW_GAME, "Show it again")              # unsure: not played
      - text: "I joined the parts, and my rules use how sure the model is."
        hints:
          - "Call the model first, then pass its label and its confidence to your rules function."
          - "Decide what your rules do below your cut-off: ignore the answer, ask again, or say so. Whichever you choose, the user should be able to tell."
          - "If your rules remember something between checks (a count, a score, a list), keep it in one place and change it in one place."
        way: |
          label, confidence = model.top(image)          # the MODEL part
          computer = random.choice(list(BEATS))
          score, headline, detail = play(score, label, confidence, computer, int(target))   # the RULES part
      - text: "I tested the joins, including when the model was unsure or wrong, and I can say who would be affected."
        hints:
          - "Test the whole app on a run of inputs, not one at a time, and include one the model is unsure about and one it gets wrong."
          - "Ask of each join: what does the rest of my app do with this answer? A confident wrong answer looks exactly like a confident right one, so what do your rules do with it?"
          - "Decide who is affected if the app is wrong, and whether they would know. Then change one thing so the app handles it better, and test again."
        way: |
          if label is None or confidence < CUTOFF:
              return score, "Show it again", f"I'm not sure that was {label} ({confidence:.0%}), so that throw doesn't count."
    stretch:
      - "Add a second setting your user can change, and test both settings across a whole run of inputs."
      - "Make your rules less trusting: act on an answer only after it has repeated, and show in your testing record that one wrong answer no longer changes the result."
      - "Swap the model part for a different mode (poses, pictures or sounds) and keep the rules, and note what you had to change."
      - "Use two models in a row: a ready-made object detector finds each thing in the photo (a banana, a cup, a dog), and your own model judges each cut-out (ripe or not). Test where the join fails: what does your model say about something the detector got wrong, or missed?"
      - "Optional: train your model on a public dataset (your teacher has links), then test the whole app on examples you collect yourself."
      - "Ideas to start from: a recipe helper, a singing or playing coach, a language revision game, a workout timer that counts only good form, or a local recycling guide."
    teacher: |
      **What this project is.** The joined-up half of the set. Project A used rules and project B used a trained model; here a model feeds rules. The learning is in the joins: what the rules do with the model's label and confidence, and what happens when the model is unsure or confidently wrong. A strong project cannot work with either part taken away.

      **Running it.** Same as project B: students train in the browser-based Pattern Trainer, download a model file, and run a starter on their own laptop, adding rules of their own. Run an unchanged starter with its sample model on a school laptop beforehand. The "Check before class" and "For your IT team" notes in project B apply here too.

      **When to offer it.** After students have built one app of each kind, since the pipeline diagram only makes sense when they have met both a rule and a trained model. If a class has done only A or only B, offer it as an extension.

      **What to change when you adapt it**

      - *Problem and user.* Students choose, or you set a shared context. Say which in the brief you hand out.
      - *The model part.* Offer pictures, poses and sounds, or narrow it. Students may reuse the model they trained for project B.
      - *The rules part.* The starters give simple examples to build from (`choice_rules.py`, `sound_rules.py`, `measure.py`); students may also write their own from scratch.
      - *State.* Many good ideas need the app to remember something between checks (a streak, a score, a list), which Gradio keeps with `gr.State` as in the example. Offer a worked example in class if students have not met it, or pick ideas that avoid it.
      - *Live video or sound.* The starters carry an optional live version. It runs the model on every frame, so test the speed on your laptops first.
      - *The skills list.* "You'll use" lights up from pasted code and is only a prompt: the unchanged starters already light some of it, or all (the page tells students so), so it shows which skills are in play, not that a student wrote them. Read the code for that. Change `uses:` in `projects.yml` if you want other skills.
      - *Check your app.* This is the success criteria. Reword a line, add your own, or remove one. The marking points below follow the same order.
      - *Hand-in.* Set your own. The Show your teacher card lists milestones ticked, the skills found in pasted code, help used and the student's own words on the hardest part.
      - *Help.* Hints are on offer to everyone. "Show one way" opens after the milestones before it are ticked or every hint for it has been used. Both are listed as **Help used** on the card. Set `reveal: false` (or remove `reveal:`) to turn "Show one way" off.

      **Marking points to look for** (replace with your own criteria):

      - *Clear result.* Words the named user would understand, not a label and a number.
      - *Honest about how sure it is.* Low confidence changes what the app does, and the user can tell. In the example, an unsure throw is not played and the app says so.
      - *Useful response that needs both parts.* Ask: "If I removed the model, what would the app do? If I removed the rules?" In the example, the model alone can only name a hand shape, and the rules alone have no throw to play.
      - *Fits the user.* A setting the user can change (rounds to win in the example), and the student can say why.
      - *Tested as a whole.* A record of runs of inputs through the whole app, not only one input at a time, with at least one unsure case and at least one wrong case, and what the student did about each.
      - *Pipeline diagram.* Shows both parts and the hand-off between them, and gives a reason for each part, not just labels.
      - *Reflection.* Names the part that caused the most trouble, a real input that broke a join, and who would be affected.

      **Usual mistakes, and a question to ask.**

      - *A model with a few rules stuck on the end.* The rules only rename the label. Ask: "What does the rules part know that the model does not?"
      - *Ignoring confidence.* The app takes the label at face value. Ask: "What happens when the model is 60% sure?"
      - *Testing the parts but not the joins.* Each part passes on its own, but the app fails together. Ask: "What is the first input that makes them disagree?"
      - *Trusting a confident wrong answer.* A rule acts on every label as if it were true. Ask: "What does your app do if the model is sure and wrong?"
      - *A pipeline diagram that is decoration.* It shows boxes but gives no reasons. Ask: "Why is this part not the other kind?"
      - *Forgetting what the app remembers.* A score that never resets, or resets at the wrong time. Ask: "When does this go back to zero?"

      **Two models in a row: detect, then judge** (a stretch idea, with a worked example). Several models make sense when each looks at something different or answers a separate question: two senses (a sound and a picture), separate questions (which sign and which hand: 4 + 2 classes, not 8 combinations), a gate before a specialist, or a closer look for the second step. Splitting one question about one photo into a chain rarely helps at this scale (both models read the same 1,280 numbers, and their mistakes multiply).

      The worked example, [`combined-banana-checker.py`](https://github.com/edu-matthew-pham/waypoints-tutorials/tree/main/experiments/pattern-detector-examples), is the strongest case: a **ready-made** model and the student's **own** model, each doing what the other can't. MediaPipe's Object Detector (EfficientDet-Lite0, Apache 2.0; it ships with the same MediaPipe the trainer and starters use, and knows COCO's 80 everyday things, banana, apple and orange among them) finds each banana and its box; the app cuts each one out; a ripeness model trained in the Pattern Trainer on BananaID (single bananas on a plain background; Mutrofin, Fatichah, Yuniarti and Setiawan, Mendeley Data, CC BY 4.0) judges it; rules apply two cut-offs (is it a banana: 0.30; how sure of the ripeness: 0.60), count and advise. Students cannot train a detector (it took thousands of photos with boxes drawn on them), but they can train the part that is theirs. **The point is knowing where it fails, not a perfect app.**

      *Testing record* (28 Oct 2026; 62 photos from COCO val2017 with an open per-photo licence, 27 of them with bananas; ripeness of the cut-outs judged by eye, as a student would):

      | Part | What I tried | What happened |
      |---|---|---|
      | Ripeness model alone | 120 BananaID photos of bananas it never saw (same plain background) | 82 right. Overripe 27 of 30, Ripe 27 of 30, Unripe 21 of 30, **Half ripe 7 of 30**: the in-between stage is hardest |
      | Detector alone, cut-off 0.30 | 27 photos with bananas, 35 without | found a banana in 15 of the 27; no false bananas |
      | Detector alone, cut-off 0.20 | the same | found one in 21 of the 27, but called 4 apples and oranges bananas |
      | The join at 0.20 | an apple in a bowl | the detector said banana (0.24), and **my model said "Unripe" at 0.97**: it judged an apple's ripeness as a banana's, sure of itself |
      | Missed bananas | bowls in kitchens, small or half hidden bananas | 6 photos with no detection at all, so my model never saw those bananas and the app said "no bananas" |
      | Counting | a bunch of 13 bananas | one box around the bunch: counted as 1 banana |
      | The whole app | 27 cut-outs it kept | green bananas: all Unripe or "not sure" (right). Yellow bananas alone on a table: mostly right. **Yellow bunches and close-ups: 10 called Overripe at 0.86 to 1.00**, wrong by eye |
      | Confidence | median confidence on BananaID test photos vs kitchen cut-outs | 0.95 vs 0.94: **the model was just as sure on photos unlike its training ones** |

      The last two rows are the lesson: the ripeness model learned from single bananas on a plain grey background, and a cut-out from a bunch or a kitchen photo looks nothing like that (shadows between bananas may read as the brown patches of an overripe one; we can't see inside the model to be sure). Confidence did not warn us, so only testing on the real photos showed it. Fixes a student might try and test: train on cut-outs from the app's own photos, a cut-off from this testing record, or telling the user "one box may be a whole bunch". Model, data and every result: [the examples folder](https://github.com/edu-matthew-pham/waypoints-tutorials/tree/main/experiments/pattern-detector-examples).

      **Ways it could look.** Students see two screenshots of finished apps where the model feeds the rules in different ways (rock paper scissors, where rules play the round and keep score, and a secret knock door that checks the last three sounds against a pattern): output only, never code. Replace them with your own screenshots if you like (a PNG in `content/code/pattern-detector/projects/`, listed under `benchmark:`).

      **The example below** is one complete combined app: rock paper scissors against the computer, first to 2. The model reads the throw; the rules skip a throw under the cut-off ("show it again"), decide the round, keep score with `gr.State`, end the game and start a new one, and are tested on their own with made-up readings before they are joined to the model. Its model was trained in the Pattern Trainer as a student would (Upload photos, Train model, Download) on 60 pictures per class from the Rock Paper Scissors dataset's training set, and tested on its separate test set (30 per class, different hands, never seen). To run it, take `my_rps_model.json` from [the examples folder](https://github.com/edu-matthew-pham/waypoints-tutorials/tree/main/experiments/pattern-detector-examples), put it in the starters folder beside `pattern_model.py`, and run the example like a starter. The dataset's hands are computer-generated, so try your own hand on the webcam too: expect it to do worse, which is "train on theirs, test on yours" first-hand. Students who unlock "Show one way" see only a short piece of it for the milestone they are on.

      **A filled-in testing record** (the example app on the dataset's test set, cut-off 0.70, first to 2; yours will look different):

      *Rules on their own (made-up readings)*

      | Throw (how sure) and the computer's | I expected | The rules said |
      |---|---|---|
      | Rock (0.95) v Scissors | you win the round, 1-0 | "You win the round", 1-0 |
      | Rock (0.95) v Paper | I win the round, 0-1 | "I win the round", 0-1 |
      | Rock (0.95) v Rock | draw, 0-0 | "Draw", 0-0 |
      | Paper (0.65) v Rock | not played | "Show it again", 0-0 |
      | Paper (0.70) v Rock | played, exactly on the cut-off | "You win the round", 1-0 |
      | two wins, first to 2 | game over, new game | "You win the game!", back to 0-0 |

      *Model on its own (90 test pictures it never saw)*

      | Class | Right | What went wrong | How sure |
      |---|---|---|---|
      | Rock | 30 of 30 | | 0.79 or more |
      | Scissors | 30 of 30 | | 0.87 or more |
      | Paper | 20 of 30 | 10 called Rock | wrong ones 0.54 to 0.97; right ones as low as 0.40 |

      *Choosing the cut-off.* From 0.70 up to 0.85, the cut-off catches the same 5 of the 10 wrong answers; 0.70 asks again least often (12 of the 80 right answers). Asking again costs little in a game, losing a round you won does not. 5 wrong answers were 0.85 or more sure: a cut-off can't catch those.

      *The whole app, in games*

      | Game | Throws (what the model read, how sure) v the computer | The app said | Notes |
      |---|---|---|---|
      | 1 | rock (Rock 1.00) v Scissors; scissors (Scissors 0.99) v Rock; scissors (Scissors 0.99) v Paper | win, loss, "You win the game!" | ok |
      | 2 | rock (Rock 1.00) v Scissors; **paper (Rock 0.59)** v Rock; paper (Paper 0.93) v Rock | win, "Show it again", "You win the game!" | the unsure throw was not played, so a shaky read cost nothing |
      | 3 | rock (Rock 1.00) v Paper; **paper (Rock 0.97)** v Rock; scissors (Scissors 0.99) v Paper | loss, **"Draw"**, win: 1-1 | **the player won that round, but the model was sure and wrong, so it was called a draw** |

      Game 3 is the point of the project: each part passes on its own, and the whole app still gets a round wrong, because the rules trust a confident wrong answer. Students may fix it in different ways (show what the model read and add a "That's not my throw" button that replays the round, or ask for the same throw twice), and a fix that lets the person catch the model's mistake is worth marking up.

      **A sample reflection** (strong): "The rules were the easy part and they passed every test. The trouble was the join. In one game my paper was read as rock with 97% confidence, so my round was called a draw when I had won. The cut-off only caught the shaky reads, not that one. I changed the app so it always says what it read ('I read your throw as Rock') and added a 'That's not my throw' button that replays the round, then tested the same game again and got my point back. The model was trained on computer-made hands, and on my own hand it was much less sure, especially for paper, so I would add photos of real hands next. If it is wrong, the player loses a round they won, which is unfair but not dangerous, so I let them overrule it."

      **What a weaker reflection looks like:** "It works well and the model and the rules work together." Ask: which input did you expect to break it, and what happened?
