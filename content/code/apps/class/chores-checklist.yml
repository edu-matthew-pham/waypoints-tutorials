inquiry:
  q: "A light switch, a mute button, a dark mode button: what do they all have in common, and how does each one know what to do when you press it?"
  prompts:
    - "What does the button need to check before it does anything?"
    - "What are the two things it could do?"
  notes: "Each is a toggle: one press, then one of two outcomes depending on what it is now. In App Builder that's one event with a sub-event and an Else. The tick boxes in Build 1 are App Builder's built-in toggle; the dark mode button is the same idea built by hand."
activities:
  - at: investigate
    kind: activity
    title: "Be the events"
    minutes: 5
    do: |
      Two students stand up as the two flat events, each with a card: "If light, go dark" and "If dark, go light". Turn the room lights on and say "click". They act in order: lights off, then straight back on. The class watches the room end where it started. Then redo it with one student as the event and two as the branches, where only one may act.
    notes: "Every matching event runs on one click, in order."
