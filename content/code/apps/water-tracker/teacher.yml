summary: "Students build a water tracker with two variables (Glasses, Goal), an Every tick event that keeps the display up to date, Add and Reset buttons, and a cap. The cap is first built the way beginners often write it (Add 1 left on the AddButton event, the check in a sub-event), so it fails at the goal; students find why and move the action into the sub-event. The Make step adds a goal message with Else and a progress bar."
time: 60
timing: "Predict 3 min · Build it 20 min · Investigate 12 min · Modify 5 min · Make 20 min"
goals:
  - I can use Every tick to keep what's on screen up to date.
  - I can say which actions a sub-event's condition controls.
  - I can make a progress bar from a number.
struggle: "The deliberate slip in step 5 can feel like a trick. Say up front that the build includes one mistake beginners often make, and the class will find it together."
before: |
  The cap in step 5 is wrong on purpose: Add 1 stays on the parent AddButton event, so it runs on every click and the sub-event's condition (Glasses < Goal) controls nothing. The Investigate step finds it; the Modify step fixes it by deleting the action and adding it again inside the sub-event (App Builder has no drag between events; the ⋯ menu and + Action do it).

  Every tick runs about 60 times a second. Setting text there is fine. Adding to a variable there is not (it would add 60 a second), which is why the exit question asks about it.

  The Build step's tick boxes accept the slip on purpose (they check the cap as built); the Modify step's tick only comes once Add 1 is inside the sub-event.

  Pick any goal and thing to track if water doesn't suit your class (pages read, laps, minutes outside). The app is about counting towards a goal, not health advice.
running:
  - "Predict: compare with lesson 1, where the screen didn't change without Set text. What's different now?"
  - "Build it: everyone clicks 12 times at step 7 before anyone explains."
  - "Investigate: draw the event and its sub-event on the board; circle which actions belong to which."
  - "Make: work out one bar width together before students build it."
stuck:
  - see: "The count shows the word Glasses or the & signs."
    ask: "Which parts are inside the quote marks?"
    fix: "Only the words to show go in quotes; the variables and & go outside."
  - see: "The bar doesn't move."
    ask: "Which event sets its width, and is it on BarFill?"
    fix: "The Set BarFill width action goes in the Every tick event."
  - see: "After the fix, Add does nothing."
    ask: "Where is the Add 1 action now?"
    fix: "It should be inside the sub-event, beside Glasses < Goal, not deleted."
stretch: "Let the user set their own goal with a text input and a Set goal button (int() from lesson 1)."
support: "Give the finished Every tick event as a table and have students check theirs row by row."
leads: "Next: Values journal, with three screens, a choice that carries between them, and a list."
exit:
  q: "What goes wrong if you put \"add 1 to Glasses\" in the Every tick event?"
  a: "It adds 1 about 60 times a second, so the count shoots up. Every tick is for keeping the display in step, not for changing the count."
explain: |
  **Every tick** runs about 60 times a second, so an Every tick event that sets the text keeps the screen in step with the variables, whatever changed them.

  A condition without a ⚡, such as **Variable Glasses = Goal**, is checked every tick too, and stays true while the comparison holds.

  A **sub-event's** condition only controls the actions inside the sub-event. An action on the event above it runs whenever that event runs.
solutions:
  step-6: app.json#sol-fix
  step-7#t2: app.json#sol-make
