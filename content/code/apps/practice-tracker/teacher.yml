summary: "Students build a practice tracker in App Builder: a text input, a Save button and a total. A variable holds the total, the button's On clicked event adds to it, and a Set text action shows it. The build adds Set text last, so students see the variable change while the screen doesn't, then fix it."
time: 60
timing: "Try 5 min · Build (three short steps) 35 min · Check 5 min · Make it yours 15 min"
goals:
  - I can lay out a screen in App Builder with text, a text box and a button.
  - I can make a button change a number the app remembers.
  - I can make the screen show the new number after it changes.
struggle: "Finding things the first time: Properties on the right, renaming from the ⋯ menu on the left, and + Condition and + Action on the Events tab. Expect the first 10 minutes to be slow. Naming objects (SaveButton, TotalText) pays off as soon as students open the Events tab."
before: |
  App Builder runs inside the lesson page: nothing to install, no sign-in, no event limit. Each step keeps its own work in the browser, so a student who comes back carries on; **Start again** (press it twice) resets that step. Work is per browser and device: on a shared computer, use **Save** to keep a copy as a file (**Open** brings it back), or **Share** for a link to the working app.

  The steps below have tick boxes that tick by themselves when the student's events match (the page reads the app as plain text). They say what to build, not how the screen looks, so layouts can differ.

  The one idea: a variable remembers a number, an event changes it, and the screen only shows the new number when an event sets the text. Build 2 is the reveal: the total changes, the screen doesn't.

  If students type words instead of a number, int() gives 0, so nothing is added. That's a good question for later (checking input), not this lesson.
running:
  - "Before the build (whole class, on the deck): does the total on screen change if the event only adds to Minutes? Most say yes. Leave it open until Build 2, where the screen doesn't change."
  - "Build 2: stop the class at the last step. Ask: is Minutes 45? How would we know? What did we never tell the screen to do?"
  - "Check: read the Set text expression aloud together, piece by piece."
  - "Make it yours: before they build Reset, ask what would go wrong with only one of the two actions."
stuck:
  - see: "Nothing happens when Save is clicked."
    ask: "Which object did you pick for the condition?"
    fix: "Check the condition says SaveButton is clicked, and that the button is the one named SaveButton."
  - see: "The text shows the words Minutes or & on the screen."
    ask: "Which parts are inside the quote marks?"
    fix: "Only the words to show go in quotes. Minutes and the & signs go outside them."
  - see: "Typing a number adds 0."
    ask: "What does the add action use?"
    fix: "It should be int(TextInput.text), with the text input's own name if it was called something else."
stretch: "Make the total read in hours and minutes once it's over 60 (hint: floor(Minutes / 60) and Minutes % 60)."
support: "Pairs: one reads the step, one clicks, then swap for the Events half."
leads: |
  Next: Chores checklist, which makes a tick that turns on and off with sub-events and Else.

  Students who go on to Construct games meet the same events and variables again, in a game.
exit:
  q: "A variable called Score goes from 3 to 4 when a button is clicked, but the screen still says 3. What's missing?"
  a: "A Set text action in the button's event, so the screen shows the new score."
explain: |
  A **variable** remembers a number for the whole app, such as Minutes.

  An **event** changes it: Save on clicked, add to Minutes.

  The screen doesn't change by itself. It shows whatever the last **Set text** said, so the same event needs a Set text action to show the new total. Words in quote marks are shown as they are; a variable outside the quotes is replaced by its value; **&** joins the pieces.
solutions:
  step-6#t1: app.json#sol-reset
  step-6#t2: app.json#sol-sessions
