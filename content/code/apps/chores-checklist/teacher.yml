summary: "Students build a checklist of jobs where each box is a Button whose text is ⬜ or ✅. They first build a tick that stays on, then try two separate click events (which cancel each other on one click), then fix it with one click event, a sub-event and an Else."
time: 60
timing: "Try 5 min · Build (four short steps) 30 min · Check 8 min · Make it yours 17 min"
goals:
  - I can make a button change its own text when it's clicked.
  - I can explain why two separate events with the same trigger undo each other.
  - I can use a sub-event and Else so that only one of two things happens.
struggle: "Building the version that doesn't work on purpose (Build 2) feels like wasted effort, and some students skip it. It's the point of the lesson: they need to see two flat events cancel before the sub-event makes sense."
before: |
  The box characters ⬜ and ✅ are emoji. On most laptops they paste fine; if a laptop shows empty squares, use [ ] and [x] instead, and change the conditions to match.

  Sub-events and Else are added from an event's ⋯ menu (Add a sub-event, Add an Else below). Select the event first by clicking it.

  App Builder has a Toggle object that switches by itself (Toggle is switched, Toggle is on). Mention it, but the lesson builds the toggle by hand so the logic is visible.

  The Build step's third tick needs every box done the same way and the two flat BedBox events deleted.

  The one idea: on one click, every event whose conditions are true runs, top to bottom. One trigger with two branches (a sub-event and an Else) means exactly one runs.
running:
  - "Before Build 2 (whole class, on the deck): two events, one click: what does the box show? Most choose ✅. Leave it open; Build 2 is the reveal."
  - "Build 2: ask a pair to explain what happened in order: first event, then second event."
  - "Check: draw the event on the board with the two branches as arrows. Only one arrow is taken per click."
  - "Make it yours: this is the review step. Ask which branch means 'just finished a job'."
stuck:
  - see: "The box doesn't tick at all."
    ask: "What does the text condition check for?"
    fix: "It must be exactly the same character as the button's text, in quote marks. Copy ⬜ from the button's text in Properties."
  - see: "There's no Add a sub-event in the menu."
    ask: "Which level is the app on?"
    fix: "Sub-events need level 2 or more. In a lesson the level is set for you; if the menu lacks it, tell your teacher."
  - see: "Done goes up when unticking."
    ask: "Which branch has the add 1?"
    fix: "Add 1 belongs in the ⬜ branch (it's becoming ticked); subtract 1 in the Else."
stretch: "Show \"All done!\" when Done equals the number of jobs. Which event checks it, and when?"
support: "Give pairs the finished event (the table at the end of Build it) to copy, then ask them to explain each row."
leads: "Next: Water tracker, which keeps a display up to date every tick and checks a goal."
exit:
  q: "A light switch app has two events: On clicked and light is off → turn on; clicked and light is on → turn off. What happens when you click, and how do you fix it?"
  a: "Both run on one click, so it turns on then straight off. Fix: one click event with a sub-event (light is off → turn on) and an Else (turn off)."
explain: |
  On one click, **every** event whose conditions are true runs, from top to bottom. Two separate click events both run: the first ticks the box, the second sees the tick and takes it away.

  The fix is **one** click event with two branches. A **sub-event** (⋯, Add a sub-event) runs only if its condition is true: the box shows ⬜, so tick it. An **Else** (⋯, Add an Else below) runs only when that condition was false: untick it. Exactly one branch runs per click.
solutions:
  step-7#t1: app.json#sol-done
