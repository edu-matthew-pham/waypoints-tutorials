summary: Students make a program choose between two paths with if and else, reading a condition that is true or false.
time: 35
timing: "Predict and Run 10 min · Investigate 10 min · Modify 5 min · Mix it up 3 min · Make 7 min"
goals:
  - I can write an if / else that chooses between two actions.
  - I can work out whether a condition is true for a given value.
  - I can say that only one of the two paths runs on each pass.
before: |
  Run the red and blue hexagon, then change `i < 3` to `i < 4`. Notice that only the number in the condition changed. `<` means "less than".
running:
  - "Predict: show the loop and take a vote before anyone runs it. The wrong options are three slips: both paths run on every pass, the sides take turns, and the else covers everything."
  - "Run: run it live, then students run it. Read the if line aloud as a question: is i less than 3? Yes runs the lines under if; no runs the lines under else."
  - "Investigate: students fill in the trace table before running anything. The bug task is the classic slip: = stores, == asks. The last question shows that a condition works out to True or False, like a sum works out to a number."
  - "Modify: one number changes. Ask: which passes are true now?"
  - "Mix it up: students work the number out on paper. It joins a growing value to a decision, so the condition reads size, not i."
  - "Make: the colour depends on the line length. Check that the if / else is inside the loop, so it is asked again on every pass."
stuck:
  - see: "A SyntaxError on the if line."
    ask: Does the condition ask a question (==, <) or store a value (=)? Is there a colon at the end?
    fix: "Use == or < to compare, and end the line with a colon: if i < 3:"
  - see: Every side is the same colour.
    ask: Is the if / else inside the loop, so it is asked again every pass?
    fix: Indent the if / else under the for line so it runs once per pass.
  - see: The spiral is all red or all blue.
    ask: What is size on the first pass and on the last? Is the cut-off between them?
    fix: The cut-off must be a number size passes through, for example 60.
stretch: Colour the first half of the lines red and the second half blue without typing the number 6 anywhere in the condition.
support: Give the trace table with the first two rows done and ask the student to say each condition aloud before filling in the colour.
leads: "Next lesson uses the remainder, %, to make a pattern that repeats every second or third pass, and adds a third choice with elif. Decisions return later inside functions and in the game's hit test."
exit:
  q: "A loop colours pass i red if i < 2, else blue. For range(5), how many passes are blue?"
  a: "Three. The red passes are i = 0 and 1, so 2, 3 and 4 are blue."
explain: |
  An **if** lets your program choose. `if i < 3:` asks a question. If the answer is yes (True), the indented lines under it run. If not (False), the lines under **else** run instead. Only one of the two paths runs on each pass.

  `<` means "less than". Careful: one `=` stores a value, two `==` ask whether two things are equal.
solutions:
  step-4: decisions.py#sol-four
  step-6: decisions.py#sol-make
struggle: "Writing a condition: the comparison sign, the colon, and the idea that only one path runs. Ask them to work out the condition for i = 0, 1, 2 before running."
