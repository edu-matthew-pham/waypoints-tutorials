summary: Students give numbers names (variables) and let the program calculate the turn, so one change at the top updates the whole shape.
time: 40
timing: "Predict and Run 10 min · Investigate 12 min · Modify 6 min · Make 8 min · Room plan 4 min"
goals:
  - I can store a value in a variable and use its name instead of the number.
  - I can work out a value with a calculation, such as angle = 360 / sides.
  - I can change a whole drawing by changing one variable.
before: |
  Run the first program, then make the shape generator from the Make step. Notice how little you change to get a different shape: that is the point of the lesson.
running:
  - "Predict: ask how many sides the shape will have and why the turtle turns 72 degrees. The answer is in the line angle = 360 / sides."
  - "Read = aloud as 'store'. sides = 5 means 'store 5 in sides', not 'sides equals 5'. This one habit prevents most confusion later."
  - "Investigate: students work the angle for 6 sides, find the multiply-for-divide bug, decide what a later store does to a line already drawn (it does nothing to it), and find the unindented turn in a loop they met last lesson."
  - "Modify: students should only ever change the top numbers. If someone edits inside the loop, ask them to find the one variable that does the job."
  - "Make: three names and a loop. Let students choose their own values; the check only needs a variable-coloured pen and a loop."
stuck:
  - see: The shape does not close, or the turtle spins in place.
    ask: What is stored in angle when sides is 5? Work it out on paper.
    fix: angle must be 360 / sides (divide, not multiply).
  - see: A NameError says a name is not defined.
    ask: Is the name spelt exactly the same everywhere, including capitals?
    fix: Variable names must match exactly. Size and size are different names.
  - see: A student changes a variable after the loop and expects the shape to change.
    ask: Which lines already ran before you changed it?
    fix: Lines use the value a name holds when they run. Put the change above the loop.
stretch: Change sides to 3, 4, 5 and up to 20, and record which values still look like the shape and which look like a circle.
support: Give students a table with two columns (sides, angle) and ask them to fill in angle for 3, 4, 5 and 6 before running anything.
leads: "Next lesson uses the loop counter, so a value can change each pass without being typed. After that, a value that grows. Scores, game settings and the scale on maps and plans all use variables. Class ideas: a spiral gallery; scale drawings of the classroom."
exit:
  q: "A program has sides = 8 and angle = 360 / sides. How far does the turtle turn at each corner?"
  a: "45 degrees (360 divided by 8)."
explain: |
  A **variable** is a name for a value. `sides = 5` means "store 5 in a box called sides". After that, every time the program sees `sides`, it uses 5.

  Variables can hold the result of a calculation: `angle = 360 / sides` works out the turn for you. Change `sides` and the turn updates by itself.

  A line uses the value a name holds at the moment it runs. Storing a new value changes the lines that come after it, not the ones already run.
solutions:
  step-4: variables.py#sol-sides
  step-5: variables.py#sol-colour
  step-6: variables.py#sol-plan
struggle: "Seeing that a name holds a value the program can reuse. Ask them to say, for each line, which stored value it uses."
