activities:
  - at: start
    kind: info
    title: "By the end of this lesson"
    do: |
      Here is the finished program running. By the end of the lesson you will write one like it.
    notes: "Run the finished example on the projector before anything else."
  - at: investigate
    title: "Trace size"
    minutes: 5
    do: |
      The class calls out size after each pass while one student updates a number on the board.
    notes: "Make the idea physical before it goes back to the screen."
self-regulation:
  card: code-trace-it
  mode: show
  at: investigate
  say: "size starts at 10, so I write 10 in my table. Go round once: forward 10, then size becomes 15. Round again: forward 15, size becomes 20. I stop when I get to the line where my table disagrees with the picture. That's where I look."
  notes: "Draw the table on the board as you speak. Students listen and watch only; the Make step is where they trace for themselves."
