summary: Students line boxes up in a row with display flex on the parent, space and centre the row, and make a gallery that wraps.
time: 50
timing: "Predict and Run 10 min · Investigate 15 min · Modify 15 min · Make 10 min"
goals:
  - I can put a box's children in a row with display flex on the parent.
  - I can space items with gap and centre them with justify-content.
  - I can make a gallery that wraps onto new lines.
  - I can explain why display flex on the items does nothing.
before: |
  Read the unit primer "Layout and components in 5 minutes", then do the Make task yourself.

  The one idea of the lesson: `display: flex;` goes on the **parent** (the box that holds the items), and its **children** line up in a row. Everything else in Flexbox (`gap`, `justify-content`, `flex-wrap`) also goes on the parent. `list-style: none;` is not Flexbox: it removes a list's bullets, which every real menu does.
running:
  - "Predict: most students do not expect one line on the `ul` to rearrange its items. It does, because the items are its children."
  - "Run: delete and restore `display: flex;` to see the switch. Change `gap` to see the spacing."
  - "Investigate: ask which box is the parent before every rule. The menu that will not line up has `display: flex` on each `li`: each item lines up its own insides, so nothing visible changes and there is no error."
  - "Rows of anything: a menu and a row of cards are the same idea. A card can hold a picture and text and still be one item in the row."
  - "Modify: menu first (row, gap, centre), then the gallery (a new rule, with `flex-wrap`)."
  - "Club menu: a real menu bar. `margin: 0;` and `padding: 0;` remove the list's own spacing so the bar looks tidy."
stuck:
  - see: The items still stack after adding display flex.
    ask: Which box did you put display flex on? Is it the box that holds the items?
    fix: Move display flex to the parent's rule (the ul, or the div that holds the pictures).
  - see: The gallery stays on one very long line, or squashes the pictures.
    ask: Does the gallery have flex-wrap wrap and a width?
    fix: Add flex-wrap wrap; and a width so the row has an edge to wrap at.
  - see: Bullets sit oddly between the menu items.
    ask: What removes a list's bullets?
    fix: Add list-style none; to the menu's rule.
stretch: "Try justify-content: space-between on the menu, then flex-direction: column on the gallery and explain what changed. Make the gallery pictures the same size with a width on each img."
support: "Give students the Modify starter and do the first task together, saying out loud: the menu is the parent, so display flex goes in .menu."
leads: "Next lesson builds whole pages from named sections and components: a header with a Flexbox menu, a hero, and a row of cards. Flexbox is one of two layout tools; the optional Grid lesson in the final challenge shows the other, for whole-page layouts. Class idea: find three websites and sketch which parts are Flexbox rows (menus, toolbars, galleries)."
exit:
  q: "A student wants three cards side by side. They write .card { display: flex; } but the cards still stack. What is wrong, and what should they write?"
  a: "display flex is on the items. It goes on the box that holds the cards, for example .cards { display: flex; } with the cards inside a div class cards."
explain: |
  The video and the picture show the same steps:

  1. A list stacks its items, one under another.
  2. `display: flex;` goes on the box that **holds** the items: here the `ul` (the **parent**).
  3. Its children, the `li` items, now sit side by side in a row.
  4. `gap` puts space between them.

  The rule to remember: Flexbox goes on the parent, and the children line up. `flex-wrap: wrap;` lets a row continue on the next line, which is how galleries work.
solutions:
  step-4#t1: page.html#sol-row
  step-4#t2: page.html#sol-gap
  step-4#t3: page.html#sol-centre
  step-4#t4: page.html#sol-gallery
  step-5: page.html#sol-make
