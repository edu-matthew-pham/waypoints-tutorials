summary: Students make bulleted and numbered lists, and links whose address sits inside the opening tag, meeting their first attribute.
time: 50
timing: "Predict and Run 10 min · Investigate 15 min · Modify 10 min · Make 10 min · Club notice 5 min"
goals:
  - I can make a bulleted list with <ul> and a numbered list with <ol>, with each item in <li>.
  - I can make a link with <a href="...">, and say which part people see and which part says where it goes.
  - I can explain what an attribute is.
  - I can keep every <li> inside its list.
before: |
  Read the unit primer "HTML structure in 5 minutes" (the attributes paragraph), then do the Make task yourself.

  New word: an **attribute** is extra information inside an opening tag, written as `name="value"`. In `<a href="https://example.com">`, the attribute `href` holds the address. Students will meet more attributes next lesson (`src` and `alt` on images).
running:
  - "Predict: many students expect the web address to show on the page. It does not: only the words between `<a>` and `</a>` show, and the address hides in `href`."
  - "Run: change `<ul>` to `<ol>` together. The browser does the numbering, so adding an item renumbers the list by itself."
  - "Investigate: the match task separates the parts of a link. The parsons task builds a list; one spare line (`</ul>`) is a distractor that closes the wrong kind of list."
  - "The lost item: the list was closed too early, so the last `<li>` is outside it. Ask: which tag ends the list, and is Long jump above or below it?"
  - "Modify and Make: one change at a time. Links in the preview open in a new tab, so the page stays where it is."
  - "Club notice: a real page. Students change a list type and a link address without breaking the nesting."
stuck:
  - see: An item has a dot, or a different number from the others, and sits further left.
    ask: Is this <li> between the list's opening and closing tags?
    fix: Move the closing </ul> or </ol> below the last item.
  - see: The address shows on the page, or the link goes nowhere.
    ask: Where is the address, and does it have quotes around it?
    fix: Put the address inside the opening tag in quotes, href="https://...", and the words people click between <a> and </a>.
  - see: The rest of the page turned into a link.
    ask: Where does the link end?
    fix: Add </a> straight after the words that should be the link.
stretch: "Make a list inside a list: under one item, a smaller list of details (a <ul> inside an <li>). Then add a link that jumps to a heading on the same page with href=\"#name\" and id=\"name\"."
support: "Give students the Modify starter and do the first task together. For the link task, write the opening tag on the board and ask them only to place it."
leads: "Next lesson adds images, with two more attributes: `src` (which picture) and `alt` (words for people who cannot see it). Links are what make the web a web: every page is joined to others. Class idea: list five websites students use, and turn each into a link."
exit:
  q: "In <a href=\"https://example.com\">Join now</a>, what will people see on the page, and what does href do?"
  a: "They see the words Join now as a link. href holds the address the link goes to; it is an attribute inside the opening tag."
explain: |
  The video and the picture show the same steps:

  1. `<ul>` opens a box for a list (`<ol>` for a numbered one).
  2. Each `<li>` is one item, inside the list. The browser adds the bullets or numbers.
  3. `</ul>` closes the list.
  4. A link: `<a href="...">`. `href` says where it goes. It is an **attribute**: extra information inside the opening tag.
  5. The words between `<a>` and `</a>` are what people click. The address does not show.

  An item is a box too, so a link (or even a whole list) can go inside an `<li>`.
