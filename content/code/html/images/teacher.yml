summary: Students show pictures with <img>, learn that src must name the file exactly, and write alt text that describes the picture for people who cannot see it.
time: 45
timing: "Predict and Run 10 min · Investigate 10 min · Modify 10 min · Make 10 min · Newsletter 5 min"
goals:
  - I can show a picture with <img src="..." alt="...">.
  - I can explain why <img> has no closing tag.
  - I can write alt text that says what a picture shows.
  - I can find why a picture does not show by checking the file name.
before: |
  Do the Make task yourself (about 5 minutes). The playground has four pictures students can use: `trophy.svg`, `medal.svg`, `book.svg` and `ball.svg`. They are drawn for this course, so there are no copyright questions; if you add your own photos later, use ones you are allowed to share.

  **alt text** is the description a screen reader reads aloud, and what everyone sees if the picture cannot load. It matters for accessibility, and it is a quick, real way to talk about designing for all users.
running:
  - "Predict: most students expect an error or nothing. The page shows the alt words, because the file name is spelt wrong. That reveals what alt is for."
  - "Run: fixing one letter makes the picture appear. The name must match exactly: spelling, the ending after the dot, and capitals."
  - "Investigate: the match task names each attribute's job. For alt, ask: how would you describe this picture to someone on the phone?"
  - "The missing medal: `medal.png` instead of `medal.svg`. A common real mistake when a file is saved in a different format."
  - "Modify and Make: `width` changes the size; leave out `height` so the picture keeps its shape."
stuck:
  - see: A small broken-picture icon, or only the alt words, where the picture should be.
    ask: Is the file name in src exactly the same as the picture's name, including the ending after the dot?
    fix: Copy the file name exactly, such as src="trophy.svg".
  - see: The picture is stretched or squashed.
    ask: Did you set both width and height?
    fix: Set only width; the browser keeps the picture's shape.
  - see: The words alt= or src= show on the page.
    ask: Are the attributes inside the angle brackets of the img tag?
    fix: "Every attribute goes inside the tag, before the >: <img src=\"...\" alt=\"...\">."
stretch: "Make a small gallery: three pictures in a row, each with alt and a caption paragraph underneath. (Later, Flexbox will line them up properly.)"
support: "Give students the Modify starter and ask them only to add width and then copy the img line for the medal."
leads: "Next lesson is tables, for data in rows and columns. Images come back in the Components unit (cards and a gallery). Accessibility: alt text is required by web accessibility guidelines (WCAG), and good alt text is part of being a good web designer. Class idea: close your eyes while a partner reads only the alt text of a page aloud."
exit:
  q: "A picture shows only its alt words and a broken icon. Give one likely reason."
  a: "The file name in src does not match the picture file exactly (spelling, ending or capitals), so the browser cannot find it."
explain: |
  The video and the picture show the same steps:

  1. `<img>` shows a picture. It has no closing tag: the picture comes from a file.
  2. `src` names the picture file.
  3. `alt` says what the picture shows, for people who cannot see it (a screen reader reads it aloud).
  4. If the file name is spelt wrong, people see the alt words instead, as in the top half of the picture.
  5. Fix the name, and the picture appears.

  A picture can also go inside other tags: inside `<a>` it becomes a link, inside `<li>` it sits in a list.
solutions:
  step-4#t1: page.html#sol-size
  step-4#t2: page.html#sol-medal
  step-4#t3: page.html#sol-link
  step-5: page.html#sol-make
  step-6: page.html#sol-newsletter
