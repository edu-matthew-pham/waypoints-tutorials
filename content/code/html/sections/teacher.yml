summary: Students name the parts of a page with header, nav, main, section and footer, and build components (a hero and a row of cards) from tags and rules they already know.
time: 50
timing: "Predict and Run 10 min · Investigate 15 min · Modify 15 min · Make 10 min"
goals:
  - I can name the parts of a page with header, nav, main, section and footer.
  - I can explain why section tags change nothing you can see, and why they still matter.
  - I can build a hero section and a row of cards.
  - I can find why cards stack when they should sit in a row.
before: |
  Read the unit primer "Layout and components in 5 minutes", then do the Make task yourself.

  **Section tags** (`<header>`, `<nav>`, `<main>`, `<section>`, `<footer>`) behave exactly like `<div>`. Their value is meaning: screen readers let people jump straight to the menu or the main content, and search engines know which part is which. A **component** is a reusable pattern, such as a **hero** (a big opening section) or a **card** (a box with padding and a border). Nothing new is needed to build them.
running:
  - "Predict: most students expect `<header>` to look different. It does not: compare the two files, then run it with **Boxes** on to see the named parts."
  - "Investigate: the match task names each part. For why it matters, ask a student to imagine using a page only by listening to it."
  - "A hero and cards: point out that every rule in the picture is one they already know (padding, background, text-align, display flex)."
  - "Cards that will not line up: the Flexbox misconception from last lesson, in a new place. Ask: which box holds the cards?"
  - "Modify: rename the parts one at a time with Boxes on, then lay out the cards."
  - "Club homepage: a real rebuild. Several answers are fine as long as the parts are named sensibly."
stuck:
  - see: The page looks the same after adding header or footer.
    ask: Should it look different?
    fix: No. Section tags name parts; use CSS to change how they look.
  - see: The cards stack instead of sitting in a row.
    ask: Which box holds the cards, and does it have display flex?
    fix: Give the box that holds the cards (for example .cards) display flex and a gap.
  - see: A closing tag such as </header> does not match its opening tag.
    ask: When you renamed the div, did you rename its closing tag too?
    fix: Change both the opening and the closing tag.
stretch: "Make the nav a Flexbox row with a gap, and give the header and footer background colours. Add a second section with a table of results inside main."
support: "Give students the Modify starter with Boxes on and do the first task together: find the opening and the closing tag, rename both."
leads: "Next lesson is forms: the sign-up part of a page. The final challenge then builds a whole club page from these components. Accessibility: section tags are called landmarks, and they are part of web accessibility guidelines. Class idea: with a screen reader or the browser's accessibility view, compare a page built from divs with one built from section tags."
exit:
  q: "A student swaps <div> for <nav> around a menu, and nothing changes on screen. Did it work? Why?"
  a: "Yes. nav looks like div, but it tells browsers and screen readers that the part is the main menu, so people can jump to it."
explain: |
  The video and the picture show the same steps (Boxes is on, so each named part shows as a box):

  1. `<header>` is the top of the page: the title, and often the menu (`<nav>`).
  2. `<main>` holds the page's main content. `<section>` is one part of it, with its own heading.
  3. `<footer>` is the bottom: contact details and small print.
  4. They look like plain boxes. Their names tell browsers and screen readers what each part is.

  Components such as a **hero** (a big opening section) and **cards** (boxes in a Flexbox row) are built from tags and rules you already know.
solutions:
  step-4#t1: page.html#sol-header
  step-4#t2: page.html#sol-nav
  step-4#t3: page.html#sol-main
  step-4#t4: page.html#sol-cards
  step-5: page.html#sol-make
  step-6: page.html#sol-club
