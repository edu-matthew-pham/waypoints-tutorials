summary: Students build tables row by row with <table>, <tr>, <th> and <td>, and learn that every row needs the same number of cells.
time: 50
timing: "Predict and Run 10 min · Investigate 15 min · Modify 10 min · Make 10 min · Canteen 5 min"
goals:
  - I can build a table from rows (<tr>) of cells (<th> and <td>).
  - I can add a row and a column to a table.
  - I can explain why every row needs the same number of cells.
  - I can say when a table is the right choice (data in rows and columns).
before: |
  Do the Make task yourself (about 5 minutes).

  A table is built **row by row**: `<tr>` is a table row, `<th>` a heading cell and `<td>` an ordinary cell ("table data"). Columns are not written anywhere: they appear because every row has its cells in the same order. Tables are for data. Old websites used them for page layout; today that is done with CSS (Flexbox, in Unit 3).
running:
  - "Predict: most students expect grid lines like a spreadsheet. A plain table has none; lines and colours come with CSS in the next unit."
  - "Run: switch on **Boxes** to see each row and cell as a box. It makes \"rows hold cells\" visible."
  - "Investigate: the count task (2 rows × 2 cells) prepares for adding a column, where every row needs one more cell."
  - "The short row: a row with a missing cell. The browser shows it without complaint, so careful reading (or Boxes) is how you find it."
  - "Modify: adding a column is the hard part. It needs a `<th>` in the heading row and a `<td>` in every other row."
  - "Canteen: the same short-row fault in a real page, plus turning the first row into headings."
stuck:
  - see: One row is shorter than the others, or a value sits in the wrong column.
    ask: Does every row have the same number of cells, in the same order?
    fix: Add the missing <td> so each row has a cell for every column.
  - see: Text appears above the table instead of inside it.
    ask: Is that text inside a <td> or <th>?
    fix: All text in a table goes inside cells; a title goes above the <table> in an <h2>.
  - see: The new column only has a heading.
    ask: Which rows have a cell for the new column?
    fix: Add one <td> to every data row, in the same position.
stretch: "Add a caption with <caption>House points</caption> just after <table>, and a totals row at the bottom."
support: "Give students the Modify starter and ask them only to copy the Hawks row and change it to the Kestrels."
leads: "Next unit is Style: CSS adds borders, colours and spacing, so this table will get its grid lines. Tables also lead to data work: the same rows and columns are a spreadsheet, a CSV file, and later a list of lists in Python. Class idea: collect class data (favourite sport, pets) and publish it as a table."
exit:
  q: "A table has 3 columns and 4 rows of data under the heading row. How many <td> cells does it need, and why?"
  a: "12 cells: every one of the 4 rows needs a cell for each of the 3 columns (4 × 3)."
explain: |
  The video and the picture show the same steps:

  1. `<table>` opens the whole table.
  2. `<tr>` is one row. In the first row, each `<th>` is a heading cell.
  3. The next row holds ordinary cells: `<td>`.
  4. `</table>` closes the table.
  5. Rows go down and cells go across. Every row needs the same number of cells, or the grid breaks.

  In the picture, Boxes is on: the table holds two rows (orange), and each row holds cells. A cell can hold a link, a picture or a `<strong>` word too.
solutions:
  step-4#t1: page.html#sol-row
  step-4#t2: page.html#sol-col
  step-4#t3: page.html#sol-cell-link
  step-5: page.html#sol-make
  step-6: page.html#sol-canteen
