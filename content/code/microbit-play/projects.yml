playground: microbit
projects:
  - id: quiz-buzzer
    title: Quiz buzzer
    after: microbit-duel
    goal: |
      Make **buzzers for a class quiz**: each team has a micro:bit, the first team to press its button wins the turn, and every other buzzer knows it lost. A quizmaster micro:bit can reset the round.
    example: quiz-buzzer.ts
    uses: [radio-number, if, bool-value]
    milestones:
      - text: "Pressing a buzzer sends its team's number by radio."
        hints:
          - "Every buzzer needs the same radio group, set at the start."
          - "Give each micro:bit a team number in a variable, and send it when button A is pressed."
        way: |
          radio.sendNumber(team)
      - text: "Only the first press counts: later presses are ignored until the round is reset."
        hints:
          - "You need a true or false variable that says whether the round is open."
          - "Check it before you send anything, and set it to false as soon as someone has buzzed."
        way: |
          if (open) {
                  open = false
      - text: "Every buzzer shows who won, and a reset starts a new round."
        hints:
          - "When a number arrives from another buzzer, show it and close the round too."
          - "Pick a number that no team uses, such as 0, as the reset message that opens the round again."
        way: |
          if (receivedNumber == 0) {
                  open = true
                  basic.clearScreen()
    reveal: true
    stretch:
      - "A different sound for each team."
      - "The quizmaster's micro:bit keeps the score."
      - "A time limit: no buzz in 10 seconds shows a clock."
    teacher: |
      Needs two or more micro:bits on the same radio group (or two simulators in the editor). The "only the first press" milestone is a true or false variable, as in the Reaction lesson; pairs who skip it get two winners.

  - id: my-microbit-game
    title: Your own micro:bit game
    after: microbit-duel
    goal: |
      Make a small **game** for one or two players that is not one from the lessons: catch a falling dot, keep a balance, a memory game, a race. It keeps score, gets harder, and has a way to win or lose.
    example: my-game.ts
    uses: [function, variable-update, random, if]
    milestones:
      - text: "It runs, and the player does something with buttons, tilt or shake."
        hints:
          - "Start with one thing that moves and one button that moves it."
          - "Keep it on the screen: check the edge with if before you change the position."
        way: |
          input.onButtonPressed(Button.A, function () {
              if (x > 0) {
                  x = x - 1
              }
          })
      - text: "It keeps a score and shows it at the end."
        hints:
          - "A variable that starts at 0 and changes by 1 each time the player does well."
          - "Show it with show number when the game ends, then set it back to 0."
        way: |
          basic.showString("SCORE")
                      basic.showNumber(score)
      - text: "It gets harder or ends, checked with if."
        hints:
          - "Use the score in a calculation, such as a pause that gets shorter as the score goes up."
          - "Or end the game when something goes wrong, with an if that checks for it."
        way: |
          basic.pause(400 - score * 20)
      - text: "Someone else played it and I changed one thing because of what they did."
        hints:
          - "Watch without helping. Where did they get stuck or bored?"
          - "Change one thing only, then ask them to try again."
    reveal: true
    stretch:
      - "Levels from a list, as in Fake-outs and levels."
      - "A two-player version over radio."
      - "A high score that the micro:bit remembers until it is switched off."
    teacher: |
      Ask for a one-sentence pitch before coding. A function for "new round" or "show score" keeps forever short; students who skip functions usually end up with a forever block too long to read.
