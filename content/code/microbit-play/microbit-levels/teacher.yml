summary: An optional, harder extension of the Reaction timer. Students add decoy signals, levels with target times kept in a list, and lives, managing several pieces of state at once.
time: 60
timing: "Predict, Run, Investigate 10 min · Milestone 1 10 min · Milestone 2 15 min · Milestone 3 20 min · Make it yours 5 min"
goals:
  - I can use two true/false variables to tell different moments apart.
  - I can use a variable as the place in a list, so a rule gets harder.
  - I can manage lives, levels and an end to the game.
before: |
  This lesson is **optional**: it is for students who finished the Reaction timer and Radio duel and want a harder challenge. It needs nothing new, only more of the same ideas at once. A **decoy** (a cross instead of the heart) appears about one round in three (*pick random 0 to 2 = 0*); a second true/false variable, `decoy`, remembers that moment. **Levels** use a list of target times, `targets`: the current level is the place in the list, so *reaction < targets[level]* gets harder as the level rises. When the level reaches the length of the list, the player has won. **Lives** count mistakes.
running:
  - "Predict: about one in three. Ask why 0 to 2 gives a third."
  - "Investigate: the list holds the rules of the game. The last question previews Milestone 3's win condition."
  - "Milestone 1: else if decoy. Read A aloud: 'if waiting, time it; else if a cross is showing, caught out; else too early'."
  - "Milestone 2: targets[level] is the key idea: a variable chooses the place in the list."
  - "Milestone 3: goals only. Encourage students to plan on paper first: when do lives go down, when does the game end?"
  - "Make it yours: let students swap games and play each other's."
stuck:
  - see: "Pressing on a cross shows the too-early cross, not the skull."
    ask: "Which is checked first in A: waiting, decoy, or else?"
    fix: "Order: if waiting … else if decoy … else."
  - see: "The level goes up even when slow."
    ask: "Which way round is the comparison?"
    fix: "Use reaction < targets[level]: faster than the target."
  - see: "Something goes wrong after the last level."
    ask: "Which places exist in targets?"
    fix: "When level equals the length of targets, the player has won: show Champion and start again."
stretch: "Make the decoy chance grow with the level: pick random 0 to (4 − level), so higher levels trick you more often."
support: "Students who find this heavy can stop after Milestone 2; the levels alone make a good game."
leads: "The other optional lesson, Tournament, takes the Radio duel further with a scoreboard list. Class ideas: a class high-level board; students design a sixth level and argue what its target should be."
exit:
  q: "level is 2 and targets is 800, 600, 450, 350, 300. What time must you beat, and why?"
  a: "450 ms: level 2 is the place in the list, counted from 0."
explain: |
  **decoy** is a true/false variable: true while the cross is showing, so a press then can be caught.

  **targets** is a list of times, one per level. The level is the **place** in the list, so *reaction < targets[level]* gets harder as you go up.

  When the level reaches the **length** of the list, there are no targets left: you have won.
solutions:
  step-4: levels.ts#sol-m1
  step-5: levels.ts#sol-m2
  step-6: levels.ts#sol-m3
struggle: "Which check comes first in the A button, and a list of targets by level. Ask them to say the order of the questions before testing."
