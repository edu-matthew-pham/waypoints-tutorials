playground: turtle
projects:
  - id: race
    title: A turtle race
    after: objects-lists
    goal: |
      Hold a **turtle race**: line up some turtles, move each one a random amount every turn, and stop when one crosses the finish line. Then say who won.
    example: race.py
    uses: [object, list, for-of, random]
    milestones:
      - text: "At least four turtles line up, each a different colour."
        hints:
          - "Make each racer with Turtle(), and keep them all in a list."
          - "Use a loop with a counter to place each one a bit lower than the last, and pick its colour from a list."
        way: |
          for i in range(4):
              t = Turtle()
              t.shape("turtle")
              t.color(colours[i])
              t.penup()
              t.goto(-200, 90 - i * 60)
              t.pendown()
              t.pensize(4)
              racers.append(t)
      - text: "Every turtle moves a random amount each turn, from one loop over the list."
        hints:
          - "A loop over the racers moves each one once. Wrap it in another loop for the turns."
          - "Use random.randint(a, b) for how far each one moves."
        way: |
              for r in racers:
                  r.forward(random.randint(5, 20))
      - text: "The race stops when one crosses the line, and the page says which."
        hints:
          - "Check each racer's xcor() against the finish line inside the loop."
          - "Remember who crossed first in a variable, and stop the outer loop when it is set."
          - "Say who won with write() on another turtle placed beside the winner."
        way: |
          winner = None
          while winner == None:
              for r in racers:
                  r.forward(random.randint(5, 20))
                  if r.xcor() > 180 and winner == None:
                      winner = r
    reveal: true
    stretch:
      - "Let the player bet on a colour before the race, with textinput."
      - "Race again without running the program again: a click starts a new race."
      - "Give each turtle a speed of its own, kept in a second list."
    teacher: |
      Builds on Many turtles (a turtle each) and Lists of stars (one loop over them all). The stopping rule is the hard part: students who check for a winner after the whole loop finish one turn late, which is a good conversation about where a check goes. `winner == None` is a recipe here; `None` comes properly in Deeper Python. The turtle shape always draws in the same green, so the example gives each racer a coloured trail; circles take a colour if students want coloured racers.

  - id: aquarium
    title: An aquarium
    after: objects-methods
    goal: |
      Fill an **aquarium** with fish that swim by themselves. Each fish is an object made from a class you write, with its own colour and speed and a method that moves it.
    example: aquarium.py
    uses: [class, method, attribute, object]
    milestones:
      - text: "My Fish class makes a fish with its own colour and speed."
        hints:
          - "Start with class Fish: and an __init__ that takes the colour."
          - "Store what each fish keeps with self., such as self.speed, and make its turtle in __init__."
        way: |
          class Fish:
              def __init__(self, colour, y):
                  self.turtle = Turtle()
                  self.turtle.shape("circle")
                  self.turtle.color(colour)
                  self.turtle.penup()
                  self.turtle.goto(random.randint(-200, 200), y)
                  self.speed = random.randint(2, 6)
      - text: "A swim method moves a fish and turns it at the walls."
        hints:
          - "A method is a def inside the class, with self as the first name."
          - "Move forward by self.speed, then check xcor() against each wall and turn if it is past."
        way: |
              def swim(self):
                  self.turtle.forward(self.speed)
                  if self.turtle.xcor() > 230 or self.turtle.xcor() < -230:
                      self.turtle.left(180)
      - text: "A timer swims every fish in the tank, again and again."
        hints:
          - "Keep the fish in a list, such as tank."
          - "Write a tick function that loops over the tank calling swim, then asks ontimer to run it again."
        way: |
          def tick():
              for f in tank:
                  f.swim()
              ontimer(tick, 50)
    reveal: true
    stretch:
      - "A second kind of thing in the tank (bubbles, a crab) with its own class."
      - "Click to drop food, and the nearest fish swims towards it."
      - "Fish that speed up for a moment when you click them."
    teacher: |
      The same shape as Stars that move themselves: a class with `__init__` and one method, a list of objects, and a timer that calls the method on each. Ask students where they'd change how every fish swims (the method) and where they'd add one more fish (the list).
