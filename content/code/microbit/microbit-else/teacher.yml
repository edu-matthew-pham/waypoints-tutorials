summary: Students choose between two or more options with if, else if and else, and find that the first true question wins, so the order sets the ranges.
time: 50
timing: "Predict and Run 8 min · Investigate 15 min · Modify 12 min · Make 10 min · Spirit level 5 min"
goals:
  - I can use if … else so exactly one of two things happens.
  - I can use else if to choose between three or more options.
  - I can put questions in the right order so each range works.
before: |
  Click the **+** at the bottom of an if block to add **else** (otherwise) and **else if** (another question). The micro:bit asks the questions **from the top**; the **first true one** runs and the rest are **skipped**. **else** runs only when every question above it is false. That makes ranges simple: *temperature < 15*, then *else if temperature < 25* means 15 to 24, because anything under 15 was already caught. It also makes order matter: ask *> 0* before *> 500* and the second can never run. Tilt in the simulator: move the mouse over the micro:bit.
running:
  - "Predict: -100 is the trap. It is negative, so many students pick the left arrow. Read the question aloud: is -100 less than -300?"
  - "Run: small tilts show the square. That middle zone is the else."
  - "Investigate: the trace pins down the edges (300 is not more than 300). Leo's tilt is the order mistake: the bigger question must be asked first."
  - "Modify: rebuilding the night light shows what else replaces: the opposite question, with no gap."
  - "Make: two questions make three ranges. Ask students to explain why the middle needs no 'and'."
  - "Spirit level: fussier means smaller numbers, such as -50 and 50."
stuck:
  - see: "The else if or else part never runs."
    ask: "Is an earlier question true for those values too?"
    fix: "Ask the narrower question first, or change the order of the parts."
  - see: "There is no place for else."
    ask: "Have you found the + at the bottom of the if block?"
    fix: "Click + to add else, and again to add else if."
  - see: "Left and right look the wrong way round."
    ask: "Which way does x go when you tilt left?"
    fix: "Left is below 0 and right is above 0. Check each arrow against its question."
stretch: "Make a five-zone tilt meter: big left, small left, level, small right, big right, in one if block. Order the questions so every zone works."
support: "Give students the comfort meter's if … else if … else block with the questions filled in, and ask them to add the pictures and test the edges (14, 15, 24, 25)."
leads: "Next unit: lists hold many values, such as the choices in rock paper scissors. Class ideas: a real spirit level on a classroom shelf; a comfort meter by the window with a real micro:bit for a week."
exit:
  q: "The questions are 'temperature < 15', then 'else if temperature < 25', then else. What shows at 20, and why?"
  a: "The just-right picture. 20 is not less than 15, so the first part is skipped; it is less than 25, so the second part runs."
explain: |
  **if … else** chooses between two things: if the question is true, the first part runs; **else** (otherwise), the second.

  **else if** adds more questions. The micro:bit asks them **from the top**, runs the **first true one**, and skips the rest. **else** runs only when none are true.

  So the order matters: *temperature < 15* then *else if temperature < 25* means "from 15 to 24".
solutions:
  step-4#t1: else.ts#sol-nightlight
  step-4#t2: else.ts#sol-forward
  step-5: else.ts#sol-make
