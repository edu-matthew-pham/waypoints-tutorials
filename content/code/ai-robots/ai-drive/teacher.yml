summary: Students drive a robot with hand gestures recognised by their own Teachable Machine model; each label becomes a mode the robot acts on until the next label.
time: 50
timing: "Predict and Run 8 min · Drive with your model 15 min (typical) · Investigate 8 min · Modify 10 min · Make 10 min"
goals:
  - I can turn labels from a model into moves on a robot.
  - I can explain why the robot keeps doing the last thing it was told.
  - I can make the robot do something safe with a word it doesn't know.
before: |
  **The idea:** the model only names a gesture (Forward, Left…). The board sends that word to a **bridge** micro:bit on the computer, which passes it on by radio to the robot. The robot's **on radio received string** remembers the word as its **mode**, and **forever** acts on the mode until a new word arrives. So when the hand leaves the camera, the robot keeps going: the problem the next lesson fixes.

  **Prerequisites:** Robotics challenges (modes, radio remote) and micro:bit and the computer (training in Teachable Machine, serial, the radio bridge). The bridge program is printed in the lesson.

  **Without robots:** the simulator's buttons stand in for the model (A Left, B Right, A+B Forward, logo Stop), and with radio it shows two robots, each driven by the other micro:bit. The model step is typical.

  **With robots:** per pair, a robot with its micro:bit, a second micro:bit as the bridge on a data cable, Chrome or Edge, and a webcam. Give each pair its own radio group. Gestures are hands only; photos stay in the browser, and Upload my model shares the model, not the photos.
running:
  - "Predict: many say it stops. Ask: what does forever do when no new message arrives?"
  - "Run: watch the other robot, as in Remote control."
  - "Drive with your model: insist on class names that match exactly; Mia's robot is the reason."
  - "Investigate: the else as a safe default is the seed of the next lesson."
stuck:
  - see: "The robot doesn't move when the webcam shows a gesture."
    ask: "Does the board show the label being sent? Are the bridge and robot in the same group?"
    fix: "Connect the bridge on the board; match the radio groups."
  - see: "The robot stops whatever gesture is shown."
    ask: "Do your class names match the words in the robot's ifs exactly?"
    fix: "Rename the classes (Forward, Left, Right, Stop), export and paste the new link."
  - see: "The robot jerks between moves."
    ask: "Does the model flicker between two gestures?"
    fix: "Add more varied photos of the confused gestures, or hold each gesture still."
stretch: "Add a gesture that plays a horn (robot play tone) without changing the mode."
support: "Run the lesson with the simulator buttons only; demonstrate the model drive at the front."
leads: "Next: the same robot driven by a model on a wrist micro:bit (CreateAI), with no camera or computer. Real world: gesture-controlled wheelchairs and drones."
exit:
  q: "The model sends Left, then nothing. What does the robot do, and why?"
  a: "It keeps turning left: the radio handler set the mode to Left, and forever keeps acting on the mode until a new label arrives."
explain: |
  The model sends a **word**; the robot remembers it as its **mode**.

  - **on radio received string** sets the mode.
  - **forever** acts on the mode, again and again, until a new word arrives.
  - An **else** that stops is a safe default for words the robot doesn't know.
solutions:
  step-5#t1: robot.ts#sol-back
  step-5#t2: robot.ts#sol-show
  step-6: robot.ts#sol-make
