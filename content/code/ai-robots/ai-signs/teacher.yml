summary: Students drive a robot with printed signs read by their own model, and make it more careful where a mistake costs more (a higher threshold for Go, and Go twice in a row).
time: 50
timing: "Predict and Run 6 min · Read the signs 15 min (typical) · Investigate 8 min · Modify 10 min · Make 10 min"
goals:
  - I can explain why some mistakes by a model cost more than others.
  - I can explain how a higher threshold trades speed for safety.
  - I can make a robot act on a costly label only when it is sure.
before: |
  **The idea:** a model is sometimes wrong, and not all mistakes are equal. Mistaking **Stop** for **Go** can send a robot off a table; mistaking Left for Right only wastes time. So the board here needs **95%** confidence before it sends Go and **70%** for the others (anything less is **Unsure**), and the robot adds its own caution: it drives only after hearing Go **twice in a row** (about a second, since the board repeats the label every second), while Stop acts at once.

  The cost of caution: a higher threshold means more Unsures, so the robot stops more often. Put the caution where mistakes are costly, not everywhere.

  **Materials:** the printable signs (linked in the lesson; two to an A4 page, colour if possible). Training tip: hold each sign at different distances and angles, in different light, and add a **Nothing** class (no sign) if the model guesses a sign for an empty frame.

  **Without robots:** the simulator's buttons stand in for the model; the board step is typical.
running:
  - "Predict: ask for a reason with each answer: what breaks?"
  - "Read the signs: the moment Go turns into Unsure while Left still counts is the lesson."
  - "Investigate: the sort generalises; ask for one more example from each group."
  - "Modify: goCount is the robot's own threshold; link it back to the board's 95%."
stuck:
  - see: "Go never gets sent."
    ask: "What confidence does the board show for Go?"
    fix: "Retrain Go with more photos (closer, steadier, better light) until it passes 95%."
  - see: "The robot turns the wrong way."
    ask: "Which way did the arrow point when you trained?"
    fix: "Check the class names; retrain if Left and Right photos were swapped."
  - see: "The robot never drives even with a clear Go."
    ask: "Does goCount reset only for words other than Go?"
    fix: "Add 1 for Go, set 0 for anything else, and drive when goCount ≥ 2."
stretch: "Add a Slow sign that drives at half speed, and decide what threshold it needs."
support: "Give the goCount blocks; students only add the and in forever."
leads: "Next: the delivery robot challenge, where the robot's own sensor can overrule the model. Real world: thresholds in self-driving cars, medical screening and spam filters."
exit:
  q: "Why does Go need a higher threshold than Left?"
  a: "Mistaking Stop for Go can cause a crash; mistaking Left for Right only wastes time. Costly actions need more confidence."
explain: |
  Some mistakes cost more than others.

  - The board needs **95%** for **Go** and **70%** for the rest; anything less is **Unsure**.
  - The robot drives only after **Go twice in a row**, but **Stop** acts at once.
  - More caution means more stops: put it where mistakes are costly.
solutions:
  step-5#t1: robot.ts#sol-stop
  step-5#t2: robot.ts#sol-twice
  step-6: robot.ts#sol-make
struggle: "Accepting that some mistakes matter more, so the thresholds differ. Ask which wrong answer would be worst, and set that label's threshold first."
