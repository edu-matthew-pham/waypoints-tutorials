summary: "Students build a practice tracker in Construct 3: a text input, a Save button and a total. A global variable holds the total, the button's On clicked event adds to it, and a Set text action shows it. The first build leaves out Set text on purpose, so students see the variable change while the screen doesn't."
time: 60
timing: "Predict 3 min · Build it 30 min · Investigate 10 min · Modify 7 min · Make 10 min"
goals:
  - I can lay out a screen in Construct with text, a text box and a button.
  - I can make a button change a number the app remembers.
  - I can make the screen show the new number after it changes.
struggle: "Finding things in Construct the first time: the Properties panel, the Project panel, and where Add event and Add action are. Expect the first 10 minutes to be slow. Naming objects (SaveButton, TotalText) pays off as soon as students open the event sheet."
before: |
  Try it first on a student laptop: open editor.construct.net and start a new project. Construct needs WebGL (graphics support in the browser); without it, the layout won't open.

  The free edition is enough: no sign-in, no seats. This app uses 1 to 3 events; the free edition allows 50. Construct keeps nothing for students unless they sign in, so they should save a copy to their device (or the school's storage) before closing the tab. If your school uses cloud storage, Construct's Settings can save to it.

  These steps were written fresh for this site and have not yet been checked click by click in the current editor. Run through them once before class; Construct updates itself, so a menu name may differ slightly.

  The one idea: a variable remembers a number, an event changes it, and the screen only shows the new number when an event sets the text. Step 10 is the reveal: the total changes, the screen doesn't.

  If students type words instead of a number, int() gives 0, so nothing is added. That's a good question for later (checking input), not this lesson.
running:
  - "Predict: most say 45. Leave it open until step 10."
  - "Build it: stop the class at step 10. Ask: is Minutes 45? How would we know? What did we never tell the screen to do?"
  - "Investigate: read the Set text expression aloud together, piece by piece."
  - "Modify: before they build Reset, ask what would go wrong with only one of the two actions."
stuck:
  - see: "Nothing happens when Save is clicked."
    ask: "Which object did you pick in Add event?"
    fix: "Check it's the button's On clicked, and that the button is the one named SaveButton. Also check the layout's Event sheet property says Event sheet 1."
  - see: "The text shows the words Minutes or & on the screen."
    ask: "Which parts are inside the quote marks?"
    fix: "Only the words to show go in quotes. Minutes and the & signs go outside them."
  - see: "Typing a number adds 0."
    ask: "What does the add action use?"
    fix: "It should be int(TextInput.Text), with the Text Input's name if it was renamed."
stretch: "Make the total read in hours and minutes once it's over 60 (hint: floor(Minutes / 60) and Minutes % 60)."
support: "Pairs: one reads the step, one clicks, then swap for the event sheet half."
leads: |
  Next: Chores checklist, which makes a tick that turns on and off with sub-events and Else.

  Students who go on to the games course meet events and variables again, in a game.
exit:
  q: "A variable called Score goes from 3 to 4 when a button is clicked, but the screen still says 3. What's missing?"
  a: "A Set text action in the button's event, so the screen shows the new score."
explain: |
  A **global variable** remembers a number for the whole app, such as Minutes.

  An **event** changes it: Save on clicked, add to Minutes.

  The screen doesn't change by itself. It shows whatever the last **Set text** said, so the same event needs a Set text action to show the new total. Words in quote marks are shown as they are; a variable outside the quotes is replaced by its value; **&** joins the pieces.
