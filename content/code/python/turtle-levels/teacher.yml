summary: An optional lesson in the games direction. Students add screens (title, play, game over), levels that speed up and a turtle that walks between spots, the way game engines move sprites.
time: 45
timing: "Predict, Run and Investigate 15 min · Levels 10 min · Moving turtle 10 min · Your own rule 10 min"
goals:
  - I can use a state variable to switch between screens.
  - I can make a game harder as the score rises.
  - I can make something move smoothly with small steps on a timer.
before: |
  `state` holds one of three words: "title", "play" or "over". It replaces True and False because a game has three screens, and two values cannot tell them apart. The moving turtle takes 10 small steps, one every 50 milliseconds, instead of jumping. (An animated move with speed() would make the program ignore clicks until the move finished.)
running:
  - "Predict: when time runs out, tick sets state to 'over' and draw_scene draws the game-over screen."
  - "Investigate: find every line that changes state and say which event causes it."
  - "Levels: every 5 points, the level goes up and delay drops by 150, but never below 400. Ask why a minimum matters."
  - "Moving turtle: move() takes one step and asks the timer to run it again in 50 ms, until steps reaches 0. This is how game loops move things."
  - "Make: a high score or a boss turtle that needs three clicks. Both need one new variable."
stuck:
  - see: A screen never appears.
    ask: Is the state name spelt the same everywhere, including capitals?
    fix: '"Play" and "play" are different. Use the same lowercase words everywhere.'
  - see: The game becomes impossibly fast.
    ask: What stops delay getting smaller and smaller?
    fix: Only take 150 off while delay > 400.
  - see: A new game starts at the level the last one ended on.
    ask: What does start() set back to the beginning?
    fix: Reset level and delay in start(), with score and time.
stretch: Add a boss turtle every tenth spot that needs three clicks, with its own hit counter.
support: Do Levels together; leave Moving turtle as an extra for those who finish.
leads: "MakeCode Arcade and microStudio give you sprites that move by themselves and screens to switch between. Underneath they run the same loop: update the data, check for hits, redraw."
exit:
  q: "Why does this game use state = \"title\", \"play\" or \"over\" instead of playing = True or False?"
  a: "There are three screens, and True or False can only tell two situations apart."
explain: |
  Real games have **screens**: a title, the game itself, and game over. A variable called `state` remembers which screen you are on. Each event checks it, and some events change it (pressing Play, the time running out).

  Games get harder as you play. Here, every 5 points the level goes up and the turtle hops a little faster.

  Moving smoothly means many tiny moves: every 50 milliseconds the turtle takes one small step towards its next spot. Game engines move every sprite this way.
solutions:
  step-4#t1: levels.py#sol-levels
  step-4#t2: levels.py#solution
  step-5: levels.py#sol-best
