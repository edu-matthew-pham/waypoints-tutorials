summary: Students make the program choose with if and else, using the remainder (%) to colour every other square, then add a third choice with elif.
time: 50
timing: "Predict and Run 10 min · Investigate 15 min · Modify 10 min · Make 10 min · Traffic light 5 min"
goals:
  - I can write an if / else that chooses between two actions.
  - I can work out whether a condition is true for a given value.
  - I can add another choice with elif.
before: |
  The new symbol is `%`, the **remainder** after dividing, not "percent". 7 % 2 is 1 (7 ÷ 2 is 3, remainder 1). Even numbers have remainder 0 when divided by 2. Run the checkerboard and try `print(7 % 2)` and `print(8 % 2)` before class.
running:
  - "Predict: ask what colour the third square is. Walk through it together: the third square has i = 2, 2 % 2 is 0, so the if is true and it is black."
  - "Say the if line out loud as a question: 'Is the remainder of i divided by 2 equal to 0?' Yes runs the indented lines under if; no runs the lines under else."
  - "Investigate: students fill in the trace table before running. The bug task is the classic mistake: = stores, == asks."
  - "Modify: elif is a second question, asked only if the first answer was no. The order matters, so ask students what happens if they put the elif check last."
  - "Make: let students choose their two shapes. Check that both paths still move the turtle forward."
stuck:
  - see: "A SyntaxError on the if line."
    ask: Does the condition ask a question (==) or store a value (=)? Is there a colon at the end?
    fix: "Use == to compare and end the line with a colon: if i % 2 == 0:"
  - see: Every square is the same colour.
    ask: What does i % 2 give for i = 0, 1, 2, 3? Print it.
    fix: The if must be inside the loop (indented), so it is asked again for every square.
  - see: The third colour never appears, or appears in the wrong places.
    ask: Which question does Python ask first?
    fix: Put the i % 3 == 0 check first. Python stops at the first true answer.
stretch: Make a pattern that repeats every 4 squares with four colours, using % 4.
support: Give students the trace table with the first two rows done and ask them to say each condition aloud before filling the colour.
leads: "Next lesson runs a decision on every item in a list. Decisions return later inside functions and in the game's hit test. Class ideas: a traffic light that runs through its states; predict the colour of tile 7 as a whole-class game."
exit:
  q: "In the checkerboard, is square i = 5 black or white? Explain using the remainder."
  a: "White. 5 % 2 is 1, so the condition i % 2 == 0 is false and the else path runs."
explain: |
  An **if** lets your program choose. `if i % 2 == 0:` asks a question. If the answer is yes, the indented lines under it run. If not, the lines under **else** run instead.

  `%` gives the **remainder** after dividing. Even numbers divided by 2 leave nothing over (remainder 0), so `i % 2 == 0` is true for 0, 2, 4, 6.

  Careful: one `=` stores a value, two `==` ask whether two things are equal. **elif** adds another question, asked only when the earlier ones were no.
solutions:
  step-4#t1: decisions.py#sol-colours
  step-4#t2: decisions.py#sol-third
  step-5: decisions.py#sol-make
  step-6: decisions.py#sol-light
