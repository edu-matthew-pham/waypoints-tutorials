summary: "Students sort a made-up student's Saturday online into things that are fine and things worth a second thought, then name three questions to ask before adding to their trail: can I take it back, does it say where I am, and is it about someone else. Typical width (Years 7 and 8): bigger audiences and longer trails."
time: 35
timing: "Engage and Explore 10 min · Explain 10 min · Elaborate 8 min · Evaluate 7 min"
goals:
  - I can say why something I delete may not be gone.
  - I can name three questions to ask before I post.
  - I can tell an ordinary trail from something worth a second thought.
struggle: "Students swing to fear (everything is dangerous) or shrug (nothing matters). Keep coming back to the sort: most of Kai's day was fine, and three questions find the rest."
before: |
  **⚑ Wellbeing review:** this course is a draft. Share this lesson and these notes with the school's wellbeing lead before teaching, and agree the support pathway and any local wording.

  **If a student discloses something:** follow the school's child-protection procedure. Listen, don't probe, don't promise to keep it secret, and pass it on as the procedure says. Thank them and steer the class back to Kai.

  **Ground rules:** Kai and Mia are made up. Don't ask students what they post, which apps they use or what has happened to them. The closing think is private: not written, collected or shared.

  The one idea: a trail is normal; three questions find the parts worth a second thought. No laws or age rules are stated; for current rules point to the eSafety Commissioner (esafety.gov.au).

  Years 5 and 6: give the link with `?width=minimum` to hide the Year 8 sort. How computers work › Your digital footprint (Years 7 and 8) goes deeper on what apps collect.
running:
  - "Engage: take a show of hands on the prediction; don't settle it yet."
  - "Explore: ask why the street sign and the friend's photo were different from the recipe search."
  - "Explain: read Mia's lines aloud; ask where she could have stopped."
  - "Elaborate (Years 7 and 8): ask which question was hardest to pick."
  - "Evaluate: give a quiet minute for the private think; collect nothing."
stuck:
  - see: "A student marks everything as worth a second thought."
    ask: "What could go wrong with a pancake search?"
    fix: "Most of a trail is fine. Look for the three things: hard to take back, where you are, someone else."
  - see: "A student says deleting fixes it."
    ask: "Who saw it before it was deleted?"
    fix: "Delete takes it off your screen, not out of everyone's memory or phone."
  - see: "A student starts telling a story about something that happened to them or a friend."
    ask: "(Don't probe.) Thank them, and bring it back to Kai."
    fix: "Follow up privately if needed, and through the wellbeing team or the child-protection procedure if it is a disclosure."
stretch: "Write a fourth question you would add to the three, and an example where it matters."
support: "Three cards on the desk: Take back? Where? Someone else? Hold one up for each item in the sort."
leads: |
  Next: who can see this? The same post reaches different people depending on where it goes and the settings.

  Links: How computers work › Your digital footprint (what apps collect without being told).
exit:
  q: "Name one of the three questions to ask before you post."
  a: "Can I take it back? Does it say where I am? Is it about someone else?"
explain: |
  Almost everything you do online leaves a **trail**. Most of it is fine.

  Before you add something, ask three questions: **Can I take it back?** **Does it say where I am?** **Is it about someone else?**

  Deleting something takes it off your screen. People who already saw it may have saved it.
