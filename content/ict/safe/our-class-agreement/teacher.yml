summary: "A short, teacher-led lesson that closes the course. Students sort draft lines into good lines and lines that need work, read a made-up class's five-line agreement, then the class writes and agrees its own. The site holds only ticks; the agreement itself is the class's, kept wherever the teacher chooses."
time: 40
timing: "Engage and Explore 8 min · Explain 5 min · Make (class writing) 20 min · Evaluate 7 min"
goals:
  - I can say what makes a good line for an agreement.
  - I can help write our class's agreement.
  - I can say one line from it and who to tell if something goes wrong.
struggle: "Groups write rules for other people ('people shouldn't...') or long lists. Ask: what will we do? Can you say it in under ten words?"
before: |
  **⚑ Wellbeing review:** this course is a draft. Share this lesson and these notes with the school's wellbeing lead before teaching. Check the agreement fits the school's own policies on devices, bullying and reporting, and doesn't promise anything the school can't do.

  **If a student discloses something:** follow the school's child-protection procedure. Listen, don't probe, don't promise to keep it secret, and pass it on as the procedure says. Thank them, and keep the class talk on the agreement, not on events.

  **Ground rules:** Room 12 is made up. Don't let lines name or point at real people or real events in the class. Keep the agreement positive (what we do) rather than a list of bans. The closing think is private.

  **Why this is a lesson, not only a class plan:** it sits in the course order, so students and the course page see the course end here; it gets a teacher guide and slides like the others; and students can come back to the made-up example. The real work, writing the agreement, happens in the room. The site stores nothing the class writes.

  Run it: groups of three write one or two lines on paper (10 min); the class reads them out, groups similar ones and chooses about five (10 min); write the final version on a poster or a shared page the school approves. Revisit it after a few weeks.
running:
  - "Engage: ask who remembers any of the school's rules word for word."
  - "Explore: ask what the 'needs work' lines have in common."
  - "Explain: ask which line of Room 12's agreement they'd keep, and which they'd change."
  - "Make: groups first, then the whole class. Read lines aloud without saying which group wrote them."
  - "Evaluate: say where the agreement will be kept and when you'll look at it again."
stuck:
  - see: "A group writes a list of don'ts."
    ask: "What would we do instead?"
    fix: "Turn each don't into a do: 'Don't be mean' becomes 'We choose the kinder version'."
  - see: "A line points at a real person or event."
    ask: "Could anyone in any class keep this line?"
    fix: "Make it general, and follow up privately if it hints at something real."
  - see: "The class can't agree on a line."
    ask: "Can everyone keep it?"
    fix: "Leave it out or reword it; five lines everyone keeps beats ten that some don't."
stretch: "Write the agreement for a younger class, using words they would understand."
support: "Sentence starters on the board: We pause... We ask... We tell... We help..."
leads: |
  End of the course. Revisit the agreement after a few weeks: which line is working, and which needs changing?

  Links: How computers work › Cyber safety and privacy (Years 7 and 8; passwords, second factors and phishing in more depth).
exit:
  q: "Say one line from our class agreement."
  a: "Any line the class agreed."
explain: |
  A good agreement is **short**, **positive** (what we do), and **something everyone can keep**.

  The class writes it **together**, from the habits in this course: pause before you post, ask before sharing someone else, keep details for people you know, tell a trusted adult, and don't add to it when someone is having a hard time.
