summary: "Students sort made-up screen times by how they left someone feeling, sort app features into keeps you going and helps you stop, and choose their own small habit privately. No targets, no hours, no diagnosis. Typical width (Years 7 and 8): switch features on a made-up app to fit a planned session."
time: 35
timing: "Engage and Explore 10 min · Explain 10 min · Elaborate 8 min · Evaluate 7 min"
goals:
  - I can notice how screen time feels during and after.
  - I can name features designed to keep me going, and ones that help me stop.
  - I can choose a small habit that fits me.
struggle: "Students expect to be told off or given a number. Say early that there is no right number and nobody will ask theirs."
before: |
  **⚑ Wellbeing review:** this lesson is about screen use and how it feels. Read it with the school's wellbeing lead before teaching and agree any local wording. Some students may be worried about their own use, or use screens to cope with something hard; the lesson must not shame them.

  **If a student discloses something:** follow the school's child-protection procedure. Listen, don't probe, don't promise to keep it secret, and pass it on as the procedure says. Worry or low mood: point to the wellbeing team; Kids Helpline is 1800 55 1800, kidshelpline.com.au (checked 26 Oct 2026; check it is current).

  **Ground rules:** Noah, Priya and Sam are made up. Never ask how long students spend on screens, which apps they use, or what time they go to sleep, and don't run a class survey of hours. No targets and no diagnosis: "addiction" is not used. The private plan is not written, collected or shared.

  The one idea: notice how it feels, then choose a habit. No age rules or official guidelines on hours are stated; if asked, point families to the eSafety Commissioner (esafety.gov.au).

  The board (Years 7 and 8) is the `feed` widget's design mode from AI in your life; its minutes are a made-up model, labelled on the board. Years 5 and 6: give the link with `?width=minimum`.
running:
  - "Engage: ask whether adults lose track of time too (they do)."
  - "Explore: ask what the 'feeling good' screen times have in common (people, making, chosen)."
  - "Explain: ask which keep-you feature is easiest to switch off."
  - "Elaborate (Years 7 and 8): ask who decided which features start switched on."
  - "Evaluate: a quiet minute. Collect nothing."
stuck:
  - see: "A student asks how many hours is too many."
    ask: "How does it feel during and after?"
    fix: "There's no single right number. Noticing how it feels, and sleep, are better guides."
  - see: "A student says screens are bad, or their parents say so."
    ask: "Which of Priya's screen times left her feeling good?"
    fix: "Screens can be great. The question is how they fit your day."
  - see: "A student seems worried or low about their own use."
    ask: "(Privately.) Would it help to talk to someone?"
    fix: "Point to the wellbeing team; follow up as the school's process says."
stretch: "Design one feature for an app that helps people stop when they want to. What might the app lose?"
support: "Two words on a card: Notice. Choose."
leads: |
  Next: pressure and tricks. Hurry, prizes and "everyone has it" are designed to push.

  Links: AI in your life › Designed to keep you (Years 7 and up; the same board, with what the evidence says).
exit:
  q: "Name one feature that keeps you going and one that helps you stop."
  a: "For example, autoplay or an endless feed keeps you going; 'all caught up' or a reminder at a time you chose helps you stop."
explain: |
  Screens can be fun, useful and a way to stay close to people. **Notice** how you feel during and after, then **choose** a small habit that fits you.

  Some features (autoplay, endless feeds, streaks) are designed to keep you going. Others ("all caught up", a reminder you set) help you stop.

  There is no right number. If screens ever feel like they're taking over, or you feel worried or low, talk to a trusted adult or Kids Helpline (1800 55 1800).
