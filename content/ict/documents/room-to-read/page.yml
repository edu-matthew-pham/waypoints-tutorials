block title: Bean growth report
block h1: Aim
block body: We wanted to find out if beans grow better in light or in the dark. We planted six beans in pots.
block h1: Method
block body: We put three beans in a dark cupboard and three on a sunny windowsill. We watered them every day.
block h1: Results
block body: After four days the beans in the light were taller than the beans in the dark.
tools: layout
