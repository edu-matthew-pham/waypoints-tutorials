block title: Where the rain goes
block h1: Rain
block body: Rain falls on roofs, roads and the ground. Some of it soaks into the soil and some of it runs away.
block h1: Drains
block body: Drains carry the water that runs off roads away to creeks. This stops the road from flooding.
block h1: Creeks
block body: Creeks carry the water to the sea, picking up whatever is on the ground on the way.
tools: layout
