block title: Where the rain goes
block body: Rain falls on roofs, roads and the ground and some of it soaks into the soil while the rest runs away along gutters and drains to creeks that carry it to the sea picking up whatever is on the ground on the way.
block body: Drains carry the water that runs off roads away to creeks which stops the road from flooding, but the water that runs into drains is not cleaned before it reaches the creek.
