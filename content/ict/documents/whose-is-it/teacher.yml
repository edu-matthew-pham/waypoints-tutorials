summary: "Students learn that pictures and words found online were made by someone, that a licence says what may be done with them, and that a credit gives who made it, where it was found and the licence. They learn what needs a credit (other people's pictures, copied words and ideas) and what does not (their own work and common knowledge), and write credits on a slide."
time: 45
timing: "Predict and Try 8 min · Worked example 10 min · Vary 7 min · Practise 8 min · Make and own app 12 min"
goals:
  - I can say why something I find online still has an owner.
  - I can write a credit with who, where and the licence.
  - I can tell what needs a credit and what does not.
struggle: "Students treat 'on the internet' as 'free'. Show a picture's page with its licence, and ask what the maker said you may do."
before: |
  Do the Try board yourself: write the credit from the pretend card.

  The one idea: someone made it. A licence says what you may do. A credit says who, where and the licence.

  The makers and sites on the cards are made up (the .example addresses cannot be real sites), and the pictures on the boards are drawn for the lessons. This lesson is general ICT practice. It is not legal advice, and your school will have its own rules about what students may use and how to cite it. Check them first and fit the lesson to them. For Years 6–8 the aim is the habit: find the maker, look at the licence, credit it, or use your own.
running:
  - "Predict: students who say yes are thinking 'if I can see it, I can use it'. Ask who made it."
  - "Try: ask what a reader could do with the three parts."
  - "Worked example: ask Omar what he should have looked for on the page."
  - "Practise: ask where a reader would look for the credit in a talk."
  - "Own app: students may take a credit from a search result. Ask whether it says who, where and the licence."
stuck:
  - see: "A student says it is fine because they changed it."
    ask: "Whose work is it underneath?"
    fix: "Changing a picture does not make it yours. Credit the original, if the licence allows it."
  - see: "A student cannot find a maker or licence."
    ask: "How would you check it?"
    fix: "Choose a picture that shows them, or draw your own."
  - see: "A student copies a sentence without quote marks."
    ask: "How does the reader know these are not your words?"
    fix: "Quote marks and a credit, or put it in your own words and say where it came from."
stretch: "Find a picture with a licence that allows use. Write its credit. Then find one that does not allow use. How do you tell the difference on the page?"
support: "A card: Who made it? Where is it from? What is the licence? Say all three."
leads: |
  Next in Documents and slides: the challenge, a report and three slides on one investigation.

  Years 6–8: check what your school's rules say about sources, and teach to those.
exit:
  q: "Name the three things in a good credit."
  a: "Who made it, where you found it, and the licence."
explain: |
  Someone made everything you find online. A **licence** says what you may do with it. A good **credit** says **who** made it, **where** you found it and **the licence**.

  Your own work and common knowledge need no credit. Copied words need quote marks and a credit. Ideas in your own words still need to say where they came from.
