block body: Do beans need light?
block body: Aim
block body: We wanted to find out if beans grow taller in the light or in the dark.
block body: Method
block body: Plant five beans in each of three places: the dark, the shade and the sun.
block body: Water them every day for four days.
block body: Measure each bean and find the average for each place.
block body: Results
block table: Place|Average height (cm); Dark|4.6; Shade|9.6; Sun|13
block body: Conclusion
block body: On average, the beans in the sun were taller (about 13 cm) than those in the dark (about 5 cm), for these plants.
