summary: "The challenge: students answer a small question (do bean seeds sprout faster in warm soil?) from three made-up sources, rate how far they trust each, separate what the trusted sources agree on from a sales claim, credit all three and write a short answer that says no more than the sources show."
time: 40
timing: "Engage and Explore 8 min · Explain 8 min · Elaborate 5 min · Make 12 min · sharing and reflection 7 min"
goals:
  - I can answer a question from more than one source and say how far I trust each.
  - I can write an answer that says no more than my sources show.
  - I can credit my sources with who, where and when.
struggle: "Students pick the most exciting number, or write an answer with no hedging. Ask: which source did that come from, and would you trust it?"
before: |
  The challenge joins the course: strong sources, purpose, reading sideways, fact or advert, small samples, and credits (Documents and slides › Whose is it?). The three sources are made up. Source 1's numbers are typical gardening guidance for beans (they like warm soil and sprout slowly when it is cold), written loosely on purpose; the lesson is not a horticulture claim, and the model answers say the agriculture guide should be checked.

  Marking: the write-up is unmarked on the page (students compare with two model answers and self-check). For assessment, use the criteria in the step: an answer, a trust rating with a reason for each source, no claim beyond the trusted sources, and what could not be checked.

  Contested topics: if you swap in your own question, keep it small, checkable and not argued about in the news. The skill transfers; the heat of a contested topic swamps it.

  If your class is growing beans, students can add their own results as a fourth source (the typical step).
running:
  - "Engage: take a quick vote, then ask what the sources would need to show."
  - "Explore: ask for one reason for each rating."
  - "Explain: ask where Tom's 24 hours came from."
  - "Elaborate: ask why 'no date' still goes in the credit."
  - "Make: read two answers aloud; the class checks each sentence against the sources."
stuck:
  - see: "A student trusts the shop because all three agree."
    ask: "Does the shop's 24 hours agree with the others?"
    fix: "They agree warmth helps, not on the number. Use what the sources you trust say."
  - see: "A student's answer has no hedging."
    ask: "How many beans did the class test? What could you not check?"
    fix: "Add one sentence on what is still unknown."
  - see: "A student leaves out the shop entirely."
    ask: "Why did you leave it out?"
    fix: "That is fine. Saying why you did not use it shows your judgement."
stretch: "Find a fourth source you would like to have (who would know?) and write what it would need to show to change your answer."
support: "A frame: The answer is ... Source 1 says ... I trust it because ... Source 3 says ... but ... I did not use Source 2 because ..."
leads: |
  This is the last workshop. Students could use the same frame for any small research question in another subject.
exit:
  q: "Why should an answer say what you could not check?"
  a: "So readers know how far to trust it, and where more checking is needed."
explain: |
  To answer from several sources: find **who, why and when** for each, see what the sources you trust **agree** on, say how far you trust each, write no more than they show, and **credit** them.
