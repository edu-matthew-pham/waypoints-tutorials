<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>p5.js playground</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="pg">
  <section class="pane editor-pane" aria-label="Code">
    <div class="bar">
      <span class="title">p5.js</span>
      <button id="run" class="btn primary" type="button" title="Run the sketch (Ctrl+Enter)">Run ▶</button>
      <button id="stop" class="btn" type="button" disabled>Stop</button>
      <button id="reset" class="btn ghost" type="button">Reset</button>
    </div>
    <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="JavaScript code" wrap="off"></textarea>
    <div id="status" role="status" data-state="ready">Ready: press Run</div>
  </section>
  <section class="pane preview-pane" aria-label="Sketch">
    <div class="stage"><iframe id="preview" title="Sketch" sandbox="allow-scripts"></iframe></div>
    <div id="problem" role="alert" hidden></div>
    <pre id="output" aria-label="Output" aria-live="polite"></pre>
  </section>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
