name: Fetch example data (manual)

# Runs only when started by hand: Actions tab > Fetch example data (manual) > Run workflow. No other trigger.
# Downloads two public datasets from their official homes and commits a small, seeded subset to the orphan branch
# `example-data` (never main, never gh-pages), so a Claude sandbox (which cannot reach these hosts) can train the
# Pattern Detector brief B and C example models from them. Re-running replaces the branch's contents.
#   - Rock Paper Scissors (Laurence Moroney; computer-generated hands; CC BY 4.0)
#   - Speech Commands v0.02 (Pete Warden, Google; CC BY 4.0)
# With part = fruit (28 Oct 2026) it instead adds a `fruit/` folder to the branch, keeping what is there:
#   - MediaPipe's EfficientDet-Lite0 object detector (Apache 2.0; trained on COCO's 80 everyday things) and its labels
#   - BananaID ripeness photos (Mendeley Data h6n5srjjyw, CC BY 4.0): the original (not augmented) ripeness set
#   - COCO val2017 photos that contain bananas, apples or oranges, only those whose own licence is CC BY or CC BY-SA
#     (or no known copyright / US government work), with each photo's licence and Flickr link kept beside it
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Random seed for the subset"
        default: "1"
      part:
        description: "What to fetch"
        type: choice
        options: [rps-speech, fruit]
        default: rps-speech

permissions:
  contents: write

jobs:
  fetch:
    if: inputs.part != 'fruit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download the official files
        run: |
          set -e
          mkdir -p raw && cd raw
          curl -fsSL -o rps.zip https://storage.googleapis.com/download.tensorflow.org/data/rps.zip
          curl -fsSL -o rps-test-set.zip https://storage.googleapis.com/download.tensorflow.org/data/rps-test-set.zip
          curl -fsSL -o sc.tar.gz http://download.tensorflow.org/data/speech_commands_v0.02.tar.gz
          sha256sum rps.zip rps-test-set.zip sc.tar.gz | tee ../sha256.txt
          unzip -q rps.zip && unzip -q rps-test-set.zip
          mkdir sc && tar -xzf sc.tar.gz -C sc

      - name: Take a seeded subset
        env:
          SEED: ${{ inputs.seed }}
        run: |
          python3 - <<'EOF'
          import json, os, random, shutil, wave
          seed = int(os.environ.get("SEED") or 1)
          R = "raw"; OUT = "out"
          shutil.rmtree(OUT, ignore_errors=True)
          picked = {"seed": seed}

          def take(src_dir, n, rng):
              files = sorted(f for f in os.listdir(src_dir) if not f.startswith("."))
              return rng.sample(files, min(n, len(files)))

          # Rock Paper Scissors: 60 training pictures per class from the training set, 30 test pictures from the
          # separate test set (different hands, made separately).
          rng = random.Random(seed)
          for split, src, n in (("train", f"{R}/rps", 60), ("test", f"{R}/rps-test-set", 30)):
              for cls in ("rock", "paper", "scissors"):
                  os.makedirs(f"{OUT}/rps/{split}/{cls}", exist_ok=True)
                  for f in take(f"{src}/{cls}", n, rng):
                      shutil.copy(f"{src}/{cls}/{f}", f"{OUT}/rps/{split}/{cls}/{f}")
                      picked.setdefault(f"rps/{split}/{cls}", []).append(f)

          # Speech Commands: four command words. Training clips come from the official training speakers and test
          # clips from the official testing list, so no speaker is in both. One clip per speaker per word.
          sc = f"{R}/sc"
          testing = set(open(f"{sc}/testing_list.txt").read().split())
          validation = set(open(f"{sc}/validation_list.txt").read().split())
          def speaker(f): return f.split("_nohash_")[0]
          def clips(word, want_test):
              out, seen = [], set()
              for f in sorted(os.listdir(f"{sc}/{word}")):
                  rel = f"{word}/{f}"
                  if (rel in testing) != want_test or rel in validation or speaker(f) in seen:
                      continue
                  seen.add(speaker(f)); out.append(f)
              return out
          rng = random.Random(seed)
          for word in ("go", "stop", "up", "down"):
              for split, n in (("train", 50), ("test", 25)):
                  os.makedirs(f"{OUT}/speech/{split}/{word}", exist_ok=True)
                  for f in rng.sample(clips(word, split == "test"), n):
                      shutil.copy(f"{sc}/{word}/{f}", f"{OUT}/speech/{split}/{word}/{f}")
                      picked.setdefault(f"speech/{split}/{word}", []).append(f)
          # Words the app was not trained on, test only: 25 from the testing list across six other words.
          others = []
          for word in ("yes", "no", "left", "right", "on", "off"):
              others += [(word, f) for f in clips(word, True)]
          os.makedirs(f"{OUT}/speech/test/other-words", exist_ok=True)
          for word, f in rng.sample(others, 25):
              shutil.copy(f"{sc}/{word}/{f}", f"{OUT}/speech/test/other-words/{word}_{f}")
              picked.setdefault("speech/test/other-words", []).append(f"{word}/{f}")
          # Background noise: one-second slices. Training from five of the six recordings, test from the sixth.
          def slices(name, n, split):
              w = wave.open(f"{sc}/_background_noise_/{name}")
              rate, frames = w.getframerate(), w.getnframes()
              data = w.readframes(frames); width = w.getsampwidth(); ch = w.getnchannels()
              os.makedirs(f"{OUT}/speech/{split}/background", exist_ok=True)
              for k in range(n):
                  start = rng.randrange(0, frames - rate)
                  chunk = data[start * width * ch:(start + rate) * width * ch]
                  out = wave.open(f"{OUT}/speech/{split}/background/{name[:-4]}_{start}.wav", "wb")
                  out.setnchannels(ch); out.setsampwidth(width); out.setframerate(rate); out.writeframes(chunk); out.close()
                  picked.setdefault(f"speech/{split}/background", []).append(f"{name}@{start}")
          for name in ("doing_the_dishes.wav", "dude_miaowing.wav", "exercise_bike.wav", "pink_noise.wav", "white_noise.wav"):
              slices(name, 10, "train")
          slices("running_tap.wav", 25, "test")
          json.dump(picked, open(f"{OUT}/selection.json", "w"), indent=1)
          EOF
          cp sha256.txt out/
          cat > out/README.md <<'EOF'
          # Example data for Pattern Detector briefs B and C

          Made by the manual workflow `.github/workflows/fetch-example-data.yml` on `main`: a small, seeded subset
          (`selection.json`) of two public datasets, downloaded from their official homes (`sha256.txt`). Not served by
          the site. Used to train the brief B and C example models in the Pattern Trainer.

          - `rps/`: **Rock Paper Scissors** by Laurence Moroney, CC BY 4.0
            (https://laurencemoroney.com/datasets.html; files from download.tensorflow.org/data/rps.zip and
            rps-test-set.zip). Computer-generated hands. `train/`: 60 per class from the training set. `test/`: 30 per
            class from the separate test set.
          - `speech/`: **Speech Commands v0.02** by Pete Warden (Google), CC BY 4.0
            (https://arxiv.org/abs/1804.03209; file from download.tensorflow.org/data/speech_commands_v0.02.tar.gz).
            `train/`: 50 clips each of go, stop, up and down from the training speakers (one clip per speaker), and
            50 one-second slices of five background-noise recordings. `test/`: 25 clips per word from the official
            testing speakers, 25 clips of six other words (`other-words/`), and 25 slices of a sixth noise recording.
          EOF
          du -sh out; find out -type f | wc -l

      - name: Commit to the example-data branch
        run: |
          cd out
          git init -q -b example-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Example data subset (seed ${{ inputs.seed }}) from rps and Speech Commands v0.02"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" example-data

  fruit:
    if: inputs.part == 'fruit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Detector model and labels
        run: |
          set -e
          mkdir -p out/fruit/detector raw
          curl -fsSL -o out/fruit/detector/efficientdet_lite0.tflite https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/latest/efficientdet_lite0.tflite
          curl -fsSL -o out/fruit/detector/labelmap.txt https://storage.googleapis.com/mediapipe-tasks/object_detector/labelmap.txt
          ls -la out/fruit/detector; grep -n -i -E "banana|apple|orange" out/fruit/detector/labelmap.txt

      - name: BananaID ripeness photos (Mendeley Data, CC BY 4.0)
        continue-on-error: true
        run: |
          mkdir -p out/fruit
          python3 - 2>&1 <<'EOF' | tee out/fruit/bananaid-log.txt
          # Try Mendeley Data's public API, then its "download all" zip, logging every answer (the log is kept in the
          # branch because the Actions log may not be readable where it is needed).
          import json, os, subprocess, urllib.request, urllib.error
          ID = "h6n5srjjyw"
          H = {"User-Agent": "Mozilla/5.0 (waypoints-fetch)", "Accept": "application/json, */*"}
          def req(url, accept=None):
              h = dict(H)
              if accept: h["Accept"] = accept
              return urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=120)
          def tryjson(url, accept=None):
              try:
                  r = req(url, accept); body = r.read()
                  print("OK", url, r.status, r.headers.get("content-type"), body[:300])
                  return json.loads(body)
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code, url, e.read()[:300])
              except Exception as e:
                  print("ERR", url, repr(e)[:300])
          meta = None
          for acc in (None, "application/vnd.mendeley-public-dataset.1+json"):
              meta = tryjson(f"https://data.mendeley.com/public-api/datasets/{ID}", acc)
              if meta: break
          versions = [meta.get("version")] if meta and meta.get("version") else [1, 2, 3, 4]
          if meta: json.dump(meta, open("out/fruit/bananaid-meta.json", "w"), indent=1)
          files = []
          for v in versions:
              for acc in (None, "application/vnd.mendeley-public-dataset-file.1+json"):
                  got = tryjson(f"https://data.mendeley.com/public-api/datasets/{ID}/files?folder_id=root&version={v}", acc)
                  if isinstance(got, list) and got:
                      files += got; break
              folders = tryjson(f"https://data.mendeley.com/public-api/datasets/{ID}/folders/{v}")
              for d in folders or []:
                  got = tryjson(f"https://data.mendeley.com/public-api/datasets/{ID}/files?folder_id={d['id']}&version={v}")
                  if isinstance(got, list): files += got
              if files: break
          for f in files:
              print("FILE", f.get("filename"), f.get("size"), json.dumps(f.get("content_details") or {})[:200])
          pick = [f for f in files if "ripe" in f.get("filename", "").lower() and "aug" not in f["filename"].lower()]
          os.makedirs("raw", exist_ok=True)
          target = None
          if pick:
              f = pick[0]; cd = f.get("content_details") or {}
              url = cd.get("download_url") or f"https://data.mendeley.com/public-files/datasets/{ID}/files/{f['id']}/file_downloaded"
              print("DOWNLOAD", f["filename"], url)
              target = "raw/" + f["filename"]
              open(target, "wb").write(req(url).read())
          else:
              for v in versions:
                  url = f"https://data.mendeley.com/public-api/zip/{ID}/download/{v}"
                  try:
                      body = req(url).read(); print("ZIP", url, len(body))
                      if body[:2] == b"PK":
                          target = "raw/all.zip"; open(target, "wb").write(body); break
                  except Exception as e:
                      print("ERR", url, repr(e)[:300])
          if not target:
              raise SystemExit("no BananaID file downloaded")
          subprocess.run(["7z", "x", "-y", "-oraw/bananaid", target], check=True, stdout=subprocess.DEVNULL)
          for root, dirs, fs in os.walk("raw/bananaid"):
              if fs: print("DIR", root, len(fs))
          EOF
          mkdir -p out/fruit/bananaid
          cp -r raw/bananaid/. out/fruit/bananaid/ 2>/dev/null || true
          # Nested archives (an original-ripeness zip inside the all-files zip): unpack them in place.
          find out/fruit/bananaid -iname "*.zip" -o -iname "*.rar" | while read z; do 7z x -y -o"${z%.*}" "$z" > /dev/null && rm "$z"; done
          find out/fruit/bananaid -type f | wc -l; du -sh out/fruit/bananaid || true

      - name: COCO photos with fruit (per-photo CC BY or CC BY-SA)
        env:
          SEED: ${{ inputs.seed }}
        run: |
          set -e
          curl -fsSL -o raw/ann.zip http://images.cocodataset.org/annotations/annotations_trainval2017.zip
          unzip -q -o raw/ann.zip annotations/instances_val2017.json -d raw
          python3 - <<'EOF'
          import csv, json, os, random, urllib.request
          rng = random.Random(int(os.environ.get("SEED") or 1))
          d = json.load(open("raw/annotations/instances_val2017.json"))
          lic = {l["id"]: l for l in d["licenses"]}
          ok = {4, 5, 7, 8}   # CC BY, CC BY-SA, no known copyright, US government work
          cats = {c["id"]: c["name"] for c in d["categories"]}
          fruit = {k for k, n in cats.items() if n in ("banana", "apple", "orange")}
          has = {}
          for a in d["annotations"]:
              has.setdefault(a["image_id"], []).append(cats[a["category_id"]])
          imgs = {i["id"]: i for i in d["images"]}
          def names(i): return sorted(set(has.get(i, [])))
          withfruit = [i for i in imgs if imgs[i]["license"] in ok and set(names(i)) & {"banana", "apple", "orange"}]
          nofruit = [i for i in imgs if imgs[i]["license"] in ok and has.get(i) and not set(names(i)) & {"banana", "apple", "orange"} and set(names(i)) & {"dining table", "bowl", "cup", "pizza", "donut", "sandwich", "cake", "broccoli", "carrot"}]
          bananas = [i for i in withfruit if "banana" in names(i)]
          other = [i for i in withfruit if "banana" not in names(i)]
          pick = rng.sample(bananas, min(40, len(bananas))) + rng.sample(other, min(20, len(other))) + rng.sample(nofruit, min(15, len(nofruit)))
          os.makedirs("out/fruit/coco", exist_ok=True)
          rows = []
          for i in pick:
              im = imgs[i]
              urllib.request.urlretrieve(im["coco_url"], "out/fruit/coco/" + im["file_name"])
              boxes = [[cats[a["category_id"]]] + [round(x) for x in a["bbox"]] for a in d["annotations"] if a["image_id"] == i and a["category_id"] in fruit]
              rows.append({"file": im["file_name"], "objects": " ".join(names(i)), "fruit_boxes": json.dumps(boxes),
                           "licence": lic[im["license"]]["name"], "licence_url": lic[im["license"]]["url"], "flickr_url": im.get("flickr_url", ""), "coco_url": im["coco_url"]})
          with open("out/fruit/coco/photos.csv", "w", newline="") as f:
              w = csv.DictWriter(f, fieldnames=list(rows[0])); w.writeheader(); w.writerows(rows)
          print(len(bananas), "banana photos with an open licence;", len(other), "apple/orange;", len(nofruit), "food without fruit; took", len(rows))
          EOF
          du -sh out/fruit/coco
          cat > out/fruit/README.md <<'EOF'
          # fruit/: data for the detect-then-judge example (Pattern Detector brief C)

          - `detector/`: MediaPipe's EfficientDet-Lite0 (float16) object detector and `labelmap.txt` (COCO's 80 things),
            from storage.googleapis.com/mediapipe-models (Apache 2.0).
          - `bananaid/`: **BananaID** ripeness photos (Mendeley Data, doi 10.17632/h6n5srjjyw, CC BY 4.0): the original,
            not augmented, ripeness set as published (`bananaid-meta.json` is the dataset record).
          - `coco/`: photos from COCO val2017 (cocodataset.org) that contain bananas, apples or oranges, plus some food
            photos without them, kept only where the photo's own licence is CC BY, CC BY-SA, no known copyright or a US
            government work. `photos.csv` lists each photo's licence, Flickr page and COCO's fruit boxes. Credit each
            photo by its Flickr page if it is ever shown.
          EOF

      - name: Add to the example-data branch
        run: |
          git clone -q --depth 1 --single-branch --branch example-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" branch
          rm -rf branch/fruit && cp -r out/fruit branch/fruit
          cd branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Fruit data: EfficientDet-Lite0, BananaID ripeness, COCO fruit photos (seed ${{ inputs.seed }})"
          git push -q origin example-data
