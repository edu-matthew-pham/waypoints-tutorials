name: Build and publish (manual)

# Runs only when started by hand: Actions tab > Build and publish (manual) > Run workflow.
# No push, schedule or other trigger on purpose. It builds main, reusing every clip and picture already
# on the live site, records and draws only what is new (real Emma voice, MakeCode pictures), and publishes
# the finished site to the gh-pages branch, which Pages serves.
#
# Three stages:
#   plan     reuse what is live, draw new pictures, and share the clips to record out between parallel jobs
#   record   one job per share (up to "jobs", default 4), each recording its lessons' clips at real speed
#   publish  lay the recorded clips over the live ones, keep the live version of anything a job missed, build, push
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: Parallel recording jobs (1 to 8)
        default: "4"
      method:
        description: "rebuild = the old way (download every clip, force-push a rebuilt site). overlay = take the live branch and add only what changed (faster, new, test it on a spare branch first)"
        type: choice
        options: [rebuild, overlay]
        default: rebuild
      branch:
        description: "Branch to publish to. Use gh-pages-test to try overlay without touching the live site."
        default: gh-pages

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

env:
  SITE: https://cggs-matthew-pham.github.io/tutorials

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    outputs:
      stale: ${{ steps.plan.outputs.stale }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install site tools
        run: npm ci --omit=optional   # skip the sandbox-only bundled Chromium

      - name: Validate lessons
        run: npm run validate

      # Pictures whose hash matches the published one are downloaded from the live site.
      - name: Fetch unchanged pictures
        id: pics
        run: |
          node tools/build-playground.mjs
          node tools/render-pictures.mjs --seed "$SITE" --check

      # Pictures come first: MakeCode explain clips show them, so they are part of those clips' hashes.
      # After 70 minutes nothing new is drawn; what is left keeps its old entry and is drawn by the next run.
      - name: Cache the browser
        if: steps.pics.outputs.pictures_stale != '0'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - name: Draw new pictures
        if: steps.pics.outputs.pictures_stale != '0'
        run: |
          npx playwright-core install --with-deps chromium
          WP_DEADLINE=$(( $(date +%s) + 70 * 60 )) node tools/render-pictures.mjs --seed "$SITE"

      - name: Share out the clips to record
        id: plan
        run: node tools/render-shards.mjs plan --seed "$SITE" --shards "${{ inputs.jobs }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pictures
          path: dist/_pictures
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.json
          retention-days: 3

  record:
    needs: plan
    if: needs.plan.outputs.stale != '0'
    runs-on: ubuntu-latest
    # A share of a full re-record is about 15 to 30 minutes; past this something is stuck.
    timeout-minutes: 150
    strategy:
      fail-fast: false   # one job's failure leaves the others recording
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: content/**/requirements.txt
      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install site tools, browser and ffmpeg
        run: |
          npm ci --omit=optional
          npx playwright-core install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y ffmpeg
          node tools/build-playground.mjs

      - uses: actions/download-artifact@v4
        with:
          name: pictures
          path: dist/_pictures
      - uses: actions/download-artifact@v4
        with:
          name: plan

      - name: Install lesson dependencies
        run: |
          for f in $(find content -name requirements.txt); do
            [ -f "$f" ] && pip install -r "$f"
          done
          for f in $(find content -name package.json -not -path '*/node_modules/*'); do
            (cd "$(dirname "$f")" && npm ci)
          done
          # Voiceover (lessons with voice:): Kokoro runs in Node; not a site dependency, so install it only here.
          if grep -rlq '^voice:' content --include=lesson.md; then npm install --no-save --no-audit --no-fund kokoro-js@1.2.1; fi

      # Restored after kokoro-js is installed (installing it would clear the folder). The key changes only with the model
      # (MODEL_ID and dtype in tools/voice.mjs), so the 90 MB download from Hugging Face happens once.
      - name: Cache the voice model
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: kokoro-${{ hashFiles('tools/voice.mjs') }}
      # Spoken lines (.voice-cache, one WAV per line, named by its text and voice): a clip re-recorded with the same
      # words reuses them instead of running Kokoro again. The publish job merges every job's lines and saves them.
      - name: Restore spoken lines
        uses: actions/cache/restore@v4
        with:
          path: .voice-cache
          key: voice-${{ github.run_id }}
          restore-keys: voice-

      # After 125 minutes nothing new is started; clips left over keep their live version and the next run records them.
      - name: Record this job's clips
        run: |
          export WP_DEADLINE=$(( $(date +%s) + 125 * 60 )) WP_LIVE_SITE="$SITE"
          node tools/render-shards.mjs run --shard ${{ matrix.shard }} --seed "$SITE" --copy-to recorded

      # Uploaded even after a failure, so the clips that did record are published.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clips-${{ matrix.shard }}
          path: recorded
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-${{ matrix.shard }}
          path: .voice-cache
          retention-days: 1
          if-no-files-found: ignore
          include-hidden-files: true

  publish:
    needs: [plan, record]
    # Runs when nothing needed recording (record skipped) and when a recording job failed (its clips that did
    # record are used; anything missing keeps its live version). Not after a cancel.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install site tools
        run: |
          npm ci --omit=optional
          node tools/build-playground.mjs

      - uses: actions/download-artifact@v4
        with:
          name: pictures
          path: dist/_pictures
      - uses: actions/download-artifact@v4
        with:
          pattern: clips-*
          merge-multiple: true
          path: dist

      # Recorded clips now match their hash and are kept; unchanged ones are downloaded from the live site.
      # WP_DEADLINE in the past records nothing: a clip no job delivered keeps its live version (and the next run
      # records it). No browser is needed.
      - name: Fill in unchanged and missing clips from the live site
        if: inputs.method != 'overlay'
        run: WP_DEADLINE=1 WP_LIVE_SITE="$SITE" node tools/render.mjs --seed "$SITE"

      # Spoken lines: the last saved set plus every recording job's, saved for the next run.
      - name: Restore spoken lines
        if: needs.record.result != 'skipped'
        uses: actions/cache/restore@v4
        with:
          path: .voice-cache
          key: voice-${{ github.run_id }}
          restore-keys: voice-
      - name: Merge spoken lines from the recording jobs
        if: needs.record.result != 'skipped'
        uses: actions/download-artifact@v4
        with:
          pattern: voice-*
          merge-multiple: true
          path: .voice-cache
      - name: Save spoken lines
        if: needs.record.result != 'skipped' && hashFiles('.voice-cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: .voice-cache
          key: voice-${{ github.run_id }}

      - name: Note failed recording jobs
        if: needs.record.result == 'failure'
        run: echo "::warning::A recording job failed (see its log). Its missing clips keep their live version; run this workflow again to record them."

      # overlay: the live branch already holds every unchanged clip, so copy its clips folders in (nothing already in
      # dist, i.e. just recorded, is replaced) instead of downloading each file over the web.
      - name: Take the live branch (overlay)
        if: inputs.method == 'overlay'
        run: |
          URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" "${{ inputs.branch }}" >/dev/null; then SRC="${{ inputs.branch }}"; else SRC=gh-pages; fi
          git clone -q --depth 1 --branch "$SRC" "$URL" live
          rsync -a --ignore-existing --include='*/' --include='clips/***' --exclude='*' live/ dist/
          echo "Took $SRC: $(find live -path '*/clips/*' -type f | wc -l) clip files."

      - name: Build site
        run: npm run build

      # overlay: make the live checkout match the new build, then commit only the difference (a normal commit, so a bad
      # publish can be undone by reverting it). A summary of files removed is printed so a missing folder is easy to spot.
      - name: Publish (overlay)
        if: inputs.method == 'overlay'
        run: |
          touch dist/.nojekyll
          rsync -a --delete --exclude='.git' dist/ live/
          cd live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          { echo "### Overlay publish to ${{ inputs.branch }}"; echo "Added: $(git diff --cached --diff-filter=A --name-only | wc -l), changed: $(git diff --cached --diff-filter=M --name-only | wc -l), removed: $(git diff --cached --diff-filter=D --name-only | wc -l)"; echo; echo "Removed files (first 40):"; git diff --cached --diff-filter=D --name-only | head -40; } | tee -a "$GITHUB_STEP_SUMMARY"
          git diff --cached --quiet && { echo "Nothing changed."; exit 0; }
          git commit -q -m "Site build from ${GITHUB_SHA::7}"
          git push origin HEAD:refs/heads/${{ inputs.branch }}

      - name: Publish to gh-pages (rebuild)
        if: inputs.method != 'overlay'
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site build from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:${{ inputs.branch }}
