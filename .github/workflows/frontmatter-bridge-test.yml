name: Frontmatter browser clip bridge
on:
  push:
    branches: [main, experiment/frontmatter-browser-bridge, feature/shareable-lesson-videos, feature/authoring-prompts-playground-adapters]
    paths:
      - 'tools/export-browser-clip.mjs'
      - 'tools/lesson-validation.mjs'
      - 'tools/validate-lesson.mjs'
      - 'tools/build-validator.mjs'
      - 'tools/validator-readme.md'
      - 'experiments/**'
      - 'create/**'
      - 'tools/build-create.mjs'
      - 'tools/playground-registry.mjs'
      - 'tools/board-catalogue.mjs'
      - 'AUTHORING.md'
      - 'BUILDING.md'
      - '.github/workflows/frontmatter-bridge-test.yml'
  pull_request:
    paths: ['tools/lesson-validation.mjs', 'tools/validate-lesson.mjs', 'tools/build-validator.mjs', 'tools/validator-readme.md', 'create/**', 'experiments/**', 'tools/export-browser-clip.mjs', 'tools/build-create.mjs', 'tools/playground-registry.mjs', 'tools/board-catalogue.mjs', 'AUTHORING.md', 'BUILDING.md', '.github/workflows/frontmatter-bridge-test.yml']
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node experiments/frontmatter-bridge-test.mjs
      - run: node experiments/lesson-package-test.mjs
      - run: node experiments/authoring-test.mjs
      - run: node experiments/board-catalogue-test.mjs
      - run: node experiments/create-examples-test.mjs
      - run: node experiments/validator-test.mjs
      - run: npm run build
      - run: node -e "const fs=require('fs'); const a=JSON.parse(fs.readFileSync('dist/code/create/lesson-clips.json')); if(!a.length)process.exit(1); console.log(a.length,'frontmatter clips exported')"
      - name: Install Chrome for browser smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Browser editor smoke test
        run: node experiments/browser-smoke.mjs
      - name: Create entry routes
        run: node experiments/entry-smoke.mjs
      - name: Standalone browser validator
        run: node experiments/validator-browser-smoke.mjs
      - name: Lesson and course package workflow
        run: node experiments/course-smoke.mjs
      - name: Authoring and subject playground workflows
        run: node experiments/authoring-smoke.mjs
      - name: Board catalogue and picker workflows
        run: node experiments/board-picker-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontmatter-browser-smoke
          path: browser-recorder-results/
