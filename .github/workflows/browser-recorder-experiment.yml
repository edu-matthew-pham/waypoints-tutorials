name: Browser recorder experiment
on:
  workflow_dispatch:
  push:
    branches: [experiment/browser-webm-recorder]
    paths:
      - 'experiments/**'
      - '.github/workflows/browser-recorder-experiment.yml'
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Add isolated recorder page to built site
        run: mkdir -p dist/experiments && cp experiments/browser-recorder.html dist/experiments/browser-recorder.html
      - name: Run real playground smoke test and attempt tab capture
        run: node experiments/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-recorder-results
          path: browser-recorder-results/
