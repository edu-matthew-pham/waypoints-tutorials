name: Build lessons and deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Repo docs are not part of the site: a commit that only changes them does not deploy.
    paths-ignore: ['*.md', '.github/workflows/probe.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          npm ci --omit=optional   # skip the sandbox-only bundled Chromium
          npx playwright-core install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Validate lessons
        run: npm run validate

      # Pictures for the cheat sheets are cached between runs (render-pictures compares hashes).
      - uses: actions/cache@v4
        with:
          path: dist/_pictures
          key: pictures-${{ hashFiles('snippets/**', 'playground*/**', 'media/**', 'tools/render-pictures.mjs') }}
          restore-keys: pictures-

      # Clips whose hash matches the published one are downloaded from the live site instead of re-recorded
      # (same inputs, same clip). Only the rest need the lesson apps and a recording.
      - name: Fetch unchanged clips
        id: clips
        run: node tools/build-playground.mjs && node tools/render.mjs --seed https://tutorials.learningwaypoints.com --check

      - name: Install lesson dependencies
        if: steps.clips.outputs.stale != '0'
        run: |
          for f in $(find content -name requirements.txt); do
            [ -f "$f" ] && pip install -r "$f"
          done
          for f in $(find content -name package.json -not -path '*/node_modules/*'); do
            (cd "$(dirname "$f")" && npm ci)
          done

      - name: Render clips
        run: npm run render

      - name: Build site
        run: npm run build

      - run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
