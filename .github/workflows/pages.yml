name: Build lessons and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          npm ci --omit=optional   # skip the sandbox-only bundled Chromium
          npx playwright-core install --with-deps chromium
          sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install lesson dependencies
        run: |
          for f in $(find content -name requirements.txt); do
            [ -f "$f" ] && pip install -r "$f"
          done
          for f in $(find content -name package.json -not -path '*/node_modules/*'); do
            (cd "$(dirname "$f")" && npm ci)
          done

      - name: Validate lessons
        run: npm run validate

      # Recorded clips are reused when nothing that affects them changed (the renderer compares
      # a per-clip hash). restore-keys lets a run start from the previous run's clips.
      - uses: actions/cache@v4
        with:
          path: |
            dist/**/clips
            dist/_pictures
          key: clips-${{ hashFiles('content/**', 'tools/**', 'playground*/**', 'snippets/**', 'media/**') }}
          restore-keys: clips-

      - name: Render clips
        run: npm run render

      - name: Build site
        run: npm run build

      - run: touch dist/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
