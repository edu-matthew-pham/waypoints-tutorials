name: Quick publish, no recording (manual)

# Runs only when started by hand: Actions tab > Quick publish, no recording (manual) > Run workflow.
# No push, schedule or other trigger on purpose. For checking decks, teacher guides, lesson text and checks:
# it builds main, reuses every clip and picture already on the live site, records and draws nothing, and
# publishes to gh-pages. A clip whose lesson changed keeps its old live version (a new clip shows no video)
# until the full "Build and publish (manual)" run records it. About 5 minutes instead of 20 or more.
#
# With "paths" (for example code/python-foundations) it is faster still: it builds main, takes the live gh-pages branch as it is
# (every clip and picture already there) and copies over only those folders and their teach/ pages, leaving
# the rest of the live site untouched. Shared pages outside the folders (pathway trails, the curriculum map)
# and the playgrounds update only on a whole-site run.
on:
  workflow_dispatch:
    inputs:
      paths:
        description: "Folders to publish, space or comma separated, e.g. code/python-foundations (blank = the whole site)"
        default: ""

permissions:
  contents: write

# Same group as the full publish, so the two never push to gh-pages at once.
concurrency:
  group: publish
  cancel-in-progress: false

env:
  SITE: https://cggs-matthew-pham.github.io/tutorials

jobs:
  quick:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install site tools
        run: |
          npm ci --omit=optional   # skip the sandbox-only bundled Chromium
          node tools/build-playground.mjs

      - name: Validate lessons
        run: npm run validate

      # Pictures whose hash matches the live site are downloaded; changed ones are left for the full run.
      - name: Fetch unchanged pictures
        if: inputs.paths == ''
        run: node tools/render-pictures.mjs --seed "$SITE" --check

      # WP_DEADLINE in the past records nothing: every clip keeps its live version where its hash matches.
      - name: Fill in unchanged clips from the live site
        if: inputs.paths == ''
        run: WP_DEADLINE=1 WP_LIVE_SITE="$SITE" node tools/render.mjs --seed "$SITE"

      - name: Build site
        run: npm run build

      # Only the named folders (and teach/<folder>) are copied onto the live branch; clips already there are kept.
      - name: Publish the named folders to gh-pages
        if: inputs.paths != ''
        run: |
          git clone -q --depth 1 --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" live
          for p in $(echo "${{ inputs.paths }}" | tr ',' ' '); do
            p="${p#/}"; p="${p%/}"
            for d in "$p" "teach/$p"; do
              test -d "dist/$d" || { echo "::error::dist/$d does not exist (check the folder name)"; exit 1; }
              mkdir -p "live/$d"
              rsync -a --exclude 'clips/' "dist/$d/" "live/$d/"
            done
          done
          cd live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Nothing changed in those folders."; exit 0; }
          git commit -q -m "Quick publish of ${{ inputs.paths }} from ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages

      - name: Publish to gh-pages
        if: inputs.paths == ''
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Quick site build (no recording) from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
