name: Publish navigation or Create only
on:
  workflow_dispatch:
    inputs:
      component:
        type: choice
        options: [navigation, create]
        default: navigation
        description: Interface to publish without recording videos
  push:
    branches: [publish-navigation, publish-create]
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require reviewed source on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=optional
      - run: npm run build
      - name: Take the existing published site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch gh-pages "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live
      - name: Update navigation in published pages
        if: github.ref_name != 'publish-create' && inputs.component != 'create'
        run: |
          node --input-type=module <<'JS'
          import {readdirSync, readFileSync, writeFileSync, existsSync} from 'node:fs';
          import {join} from 'node:path';
          const nav = /<nav class="sitenav"[^>]*>.*?<\/nav>/s;
          let count = 0;
          function walk(dir, rel = '') {
            for (const entry of readdirSync(dir, {withFileTypes: true})) {
              if (entry.name === '.git') continue;
              const file = join(dir, entry.name), path = join(rel, entry.name);
              if (entry.isDirectory()) { walk(file, path); continue; }
              if (!entry.name.endsWith('.html')) continue;
              const old = readFileSync(file, 'utf8');
              if (!nav.test(old)) continue;
              const built = join('dist', path);
              if (!existsSync(built)) throw Error('No built counterpart: ' + path);
              const replacement = readFileSync(built, 'utf8').match(nav)?.[0];
              if (!replacement) throw Error('No built navigation: ' + path);
              const updated = old.replace(nav, () => replacement);
              if (updated !== old) { writeFileSync(file, updated); count++; }
            }
          }
          walk('live'); console.log('Updated navigation on', count, 'pages');
          JS
      - name: Update Create editor only
        if: github.ref_name == 'publish-create' || inputs.component == 'create'
        run: rsync -a --delete dist/code/create/ live/code/create/
      - name: Publish interface changes
        run: |
          cd live
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Publish interface from ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
